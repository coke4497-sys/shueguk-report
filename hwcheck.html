<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>숙제 검사 · 이수경국어</title>
<meta name="description" content="이수경국어 정규 수업 숙제 검사 — 항목별 별점 · 주차별 점수 기록" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#C6D5D2; --surface:#FFFFFF;
    --ink:#2A332F; --ink-soft:#65726B;
    --accent:#4C6E66; --btn:#628C83; --icon-bg:#EBF0ED;
    --line:#D7E3DD; --line-soft:#E5EDE8; --radius:16px;
    --star:#E8B93E; --star-empty:#D8E2DD;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,system-ui,sans-serif;
    font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;padding:0 0 60px;}
  .wrap{max-width:640px;margin:0 auto;padding:0 14px;}

  header{padding:22px 4px 8px;text-align:center;}
  .brand{font-family:"Gowun Batang",serif;font-size:1.35rem;font-weight:700;color:var(--accent);margin:0;}
  .sub{color:var(--ink-soft);font-size:.85rem;margin:4px 0 0;}

  /* 비밀번호 게이트 */
  .hubback{display:inline-flex;align-items:center;gap:6px;margin:18px 0 0;color:var(--ink-soft);text-decoration:none;font-size:.86rem;}
  .hubback:hover{color:var(--accent);}
  .gate{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:26px 22px;margin:26px auto;max-width:380px;text-align:center;}
  .gate input{width:100%;font:inherit;font-size:1.05rem;text-align:center;letter-spacing:.2em;
    padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:14px 0 10px;}
  .gate button{width:100%;font:inherit;font-size:1rem;color:#fff;background:var(--btn);
    border:none;border-radius:12px;padding:13px;cursor:pointer;}
  .gate .err{color:#B4574E;font-size:.85rem;min-height:1.2em;margin:8px 0 0;}

  /* 상단 컨트롤 */
  .bar{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:12px 14px;margin:10px 0;display:none;}
  .weeknav{display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .weeknav button{font:inherit;font-size:.9rem;background:var(--icon-bg);color:var(--ink);
    border:1px solid var(--line-soft);border-radius:10px;padding:7px 12px;cursor:pointer;}
  .weeknav .wk{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.02rem;color:var(--accent);text-align:center;}
  .weeknav .wk small{display:block;font-family:"Gowun Dodum",sans-serif;font-weight:400;color:var(--ink-soft);font-size:.75rem;}
  .filters{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .filters select{flex:1;min-width:120px;font:inherit;font-size:.92rem;padding:8px 10px;
    border:1.5px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);}
  .addstu{margin-top:8px;}
  .addstu input{width:100%;font:inherit;font-size:.9rem;padding:8px 10px;border:1.5px solid var(--line);border-radius:10px;}
  #stu-results{display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;}
  #stu-results button{font:inherit;font-size:.85rem;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:5px 12px;cursor:pointer;}
  #stu-results button small{color:var(--ink-soft);font-size:.74rem;}
  .extra-badge{display:inline-block;font-size:.68rem;color:#fff;background:var(--btn);border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle;}
  .extra-rm{border:none;background:none;color:#B4574E;font-size:.95rem;cursor:pointer;padding:0 0 0 6px;vertical-align:middle;}
  .meta-row{display:flex;justify-content:space-between;align-items:center;margin-top:10px;font-size:.82rem;color:var(--ink-soft);}
  .meta-row .items-btn{font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);
    border-radius:9px;padding:4px 10px;color:var(--ink-soft);cursor:pointer;}
  .status{font-size:.8rem;color:var(--ink-soft);min-height:1.2em;text-align:center;margin:6px 0 0;}

  /* 항목 관리 */
  .items-panel{display:none;background:#F4F8F5;border:1px solid var(--line-soft);border-radius:12px;padding:12px;margin-top:10px;}
  .chip{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:4px 12px;margin:0 6px 6px 0;font-size:.88rem;}
  .chip b{font-weight:400;}
  .chip button{border:none;background:none;color:#B4574E;font-size:1rem;cursor:pointer;padding:0;line-height:1;}
  .items-panel .addrow{display:flex;gap:8px;margin-top:8px;}
  .items-panel input{flex:1;font:inherit;font-size:.9rem;padding:7px 10px;border:1.5px solid var(--line);border-radius:9px;}
  .items-panel .addrow button{font:inherit;font-size:.85rem;background:var(--btn);color:#fff;border:none;border-radius:9px;padding:7px 14px;cursor:pointer;}
  .items-panel .hint{font-size:.75rem;color:var(--ink-soft);margin:8px 0 0;}
  .cid-note{margin-top:8px;font-size:.85rem;color:var(--ink);background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:10px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;}
  .cid-note button{font:inherit;font-size:.8rem;padding:4px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer;}
  .crit-note{font-size:.78rem;color:var(--ink-soft);background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:10px;padding:7px 11px;margin-top:8px;}
  .crit-note b{color:var(--ink);font-weight:700;}

  /* 시간표 연동 배지 (그 주 출석·1회 이동) */
  .ttinfo{display:flex;flex-wrap:wrap;gap:4px;margin:6px 0 2px;}
  .tt-chip{font-size:.7rem;border-radius:999px;padding:2px 8px;border:1px solid transparent;}
  .tt-chip.ok{background:#E3EFE7;color:#2F5D51;border-color:#BAD6C6;}
  .tt-chip.late{background:#F5E7C6;color:#6B5423;border-color:#DFC98F;}
  .tt-chip.abs{background:#F0DBD8;color:#8A3B33;border-color:#DEB6B0;}
  .tt-chip.once{background:#EFE9F7;color:#5E4A78;border-color:#D4C5E8;}

  /* 학생 카드 */
  .list{display:flex;flex-direction:column;gap:10px;margin-top:8px;}
  .stu{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:14px 16px;}
  .stu .top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .stu .nm{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.05rem;}
  .stu .nm small{font-family:"Gowun Dodum",sans-serif;font-weight:400;color:var(--ink-soft);font-size:.78rem;margin-left:6px;}
  .stu .pct{font-size:.95rem;color:var(--ink-soft);white-space:nowrap;}
  .stu .pct b{font-family:"Gowun Batang",serif;font-size:1.1rem;color:var(--accent);}
  .stu .pct .full{color:var(--star);}
  .itemrow{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:8px;}
  .itemrow .lb{font-size:.88rem;color:var(--ink-soft);flex:none;min-width:4.4em;}
  .stars{display:flex;gap:2px;}
  .stars button{border:none;background:none;font-size:1.55rem;line-height:1;padding:2px;cursor:pointer;color:var(--star-empty);}
  .stars button.on{color:var(--star);}
  .memo-btns{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;}
  .memo-btns button{font:inherit;font-size:.78rem;background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:9px;padding:5px 10px;color:var(--ink-soft);cursor:pointer;}
  .memo-btns button.has{color:var(--accent);border-color:var(--line);font-weight:700;}
  .memo-btns button.missbtn.on{color:#fff;background:#B4574E;border-color:#B4574E;font-weight:700;}
  .stu.missing .stars button{opacity:.35;pointer-events:none;}
  .miss-lb{color:#B4574E;font-weight:700;font-size:.9rem;}
  .plan-area{display:none;margin-top:8px;}
  .plan-area label{display:block;font-size:.75rem;color:#B4574E;margin-bottom:4px;}
  .plan-area input{width:100%;font:inherit;font-size:.9rem;border:1.5px solid #E3C2BE;border-radius:10px;padding:8px 10px;}
  .qp-row{display:flex;align-items:center;gap:6px;margin:0 0 6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  .qp-row .qp-lb{flex:none;font-size:.72rem;color:var(--ink-soft);min-width:4em;white-space:nowrap;}
  .qp-row button{flex:none;font:inherit;font-size:.8rem;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:4px 11px;color:var(--ink);cursor:pointer;white-space:nowrap;}
  .qp-row button.on{background:var(--btn);border-color:var(--btn);color:#fff;}
  .qp-hint{font-size:.72rem;color:var(--ink-soft);margin:-2px 0 6px 4.7em;}
  .qp-same{font:inherit;font-size:.78rem;background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:9px;padding:4px 10px;color:var(--accent);cursor:pointer;margin-bottom:6px;}
  .memo-area{display:none;margin-top:8px;}
  .memo-area label{display:block;font-size:.75rem;color:var(--ink-soft);margin-bottom:4px;}
  .memo-area textarea{width:100%;font:inherit;font-size:.9rem;border:1.5px solid var(--line);border-radius:10px;
    padding:8px 10px;min-height:56px;resize:vertical;}
  .save-dot{font-size:.72rem;color:var(--ink-soft);margin-left:8px;}
  .save-dot.ok{color:#4C8A5C;}
  .save-dot.err{color:#B4574E;}
  .empty{text-align:center;color:var(--ink-soft);font-size:.9rem;padding:30px 0;}

  /* 미제출 대책 목록 */
  .plans-btn{font:inherit;font-size:.8rem;background:none;border:1px solid var(--line);
    border-radius:9px;padding:4px 10px;color:var(--ink-soft);cursor:pointer;}
  .plans-btn .cnt{display:inline-block;min-width:18px;text-align:center;background:#B4574E;color:#fff;
    border-radius:999px;font-size:.72rem;padding:1px 5px;margin-left:4px;}
  .plans-btn.back{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:700;}
  .plans-back{font:inherit;font-size:.95rem;background:var(--btn);color:#fff;border:none;border-radius:12px;
    padding:12px 16px;cursor:pointer;margin-top:6px;}
  .plans-wrap{display:none;flex-direction:column;gap:10px;margin-top:8px;}
  .pw-week{font-family:"Gowun Batang",serif;font-weight:700;color:var(--accent);margin:10px 4px 0;font-size:.95rem;}
  .pw-week small{font-family:"Gowun Dodum",sans-serif;font-weight:400;color:var(--ink-soft);}
  .plan-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:12px 14px;
    display:flex;align-items:center;gap:12px;}
  .plan-card.done{opacity:.55;}
  .plan-card .pb{flex:1;min-width:0;}
  .plan-card .pn{font-family:"Gowun Batang",serif;font-weight:700;}
  .plan-card .pn small{font-family:"Gowun Dodum",sans-serif;font-weight:400;color:var(--ink-soft);font-size:.76rem;margin-left:6px;}
  .plan-card .pt{font-size:.86rem;color:var(--ink);margin:3px 0 0;}
  .plan-card .pt.none{color:#B4574E;}
  .plan-card .okbtn{font:inherit;font-size:.8rem;border:1px solid var(--line);border-radius:9px;
    padding:6px 12px;background:var(--icon-bg);color:var(--ink-soft);cursor:pointer;flex:none;}
  .plan-card .okbtn.on{background:#4C8A5C;border-color:#4C8A5C;color:#fff;}
  footer{text-align:center;margin-top:34px;color:var(--ink-soft);font-size:.8rem;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  .tip{text-align:center; font-size:12px; color:#65726B; background:#EBF0ED;
    border:1px solid #E5EDE8; border-radius:10px; padding:7px 12px; margin:22px auto 8px; max-width:560px; line-height:1.55;}
  .tip b{color:#4C6E66;}
</style>
</head>
<body>
<main class="wrap">
  <a class="hubback" href="https://coke4497-sys.github.io/shueguk-hub/study.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    학습 관리로 가기
  </a>
  <header>
    <p class="brand">숙제 검사</p>
    <p class="sub">Shueguk · 정규 수업 과제 검사 (교사·조교용)</p>
  </header>

  <!-- 비밀번호 게이트 -->
  <div class="gate" id="gate">
    <div style="font-family:'Gowun Batang',serif;font-weight:700;">교사 확인</div>
    <input id="pw" type="password" inputmode="text" placeholder="비밀번호" autocomplete="off" />
    <button onclick="tryLogin()">확인</button>
    <p class="err" id="gate-err"></p>
  </div>

  <!-- 상단 컨트롤 -->
  <div class="bar" id="bar">
    <div class="weeknav">
      <button onclick="moveWeek(-1)">◀ 지난주</button>
      <div class="wk"><span id="wk-label">…</span><small id="wk-range"></small></div>
      <button onclick="moveWeek(1)">다음주 ▶</button>
    </div>
    <div class="filters">
      <select id="f-grade" onchange="filterChanged()"></select>
      <select id="f-school" onchange="filterChanged()"></select>
    </div>
    <div class="filters">
      <select id="f-teacher" onchange="filterChanged()"></select>
      <select id="f-slot" onchange="filterChanged()"></select>
    </div>
    <div class="cid-note" id="cid-note" style="display:none;"></div>
    <div class="addstu">
      <input id="stu-search" placeholder="이동해 온 학생 추가 — 이름 검색" oninput="searchStu()" autocomplete="off" />
      <div id="stu-results"></div>
    </div>
    <div class="meta-row">
      <span id="count-note"></span>
      <span>
        <button class="plans-btn" id="plans-btn" onclick="togglePlans()"><span id="plans-lb">미제출 확인</span><span class="cnt" id="plans-cnt" style="display:none;">0</span></button>
        <button class="items-btn" onclick="toggleItems()">검사 항목 관리</button>
      </span>
    </div>
    <p class="crit-note">평가 기준 (조교 참고) — <b>모두 수행: 별 5개</b> · <b>완벽한 수행: 별 6개</b></p>
    <div class="items-panel" id="items-panel">
      <div id="chips"></div>
      <div class="addrow">
        <input id="new-item" placeholder="새 항목 이름 (예: 단어 암기)" maxlength="20" />
        <button onclick="addItem()">추가</button>
      </div>
      <p class="hint">항목마다 별 0~6개로 검사해요. 항목을 바꿔도 이미 저장된 주차 기록은 그대로 남아요.</p>
    </div>
  </div>
  <p class="status" id="status"></p>

  <div class="list" id="list"></div>
  <div class="plans-wrap" id="plans"></div>

  <footer>이수경국어 Shueguk · 숙제 검사</footer>
</main>

<script>
/* ══ 수파베이스 연결부 (2026-08-22 DB 이전 2단계) ═══════════════════════
 * 숙제 검사: 검사 기록 읽기·쓰기와 대책 목록을 수파베이스로.
 *  · hwcheckBoot: 명단·항목은 기존 백엔드에서 그대로 받고(학생정보·설정 탭 미이전),
 *    검사 기록·시간표·주간 출석·1회 이동은 수파베이스 값으로 교체(1단계 원본).
 *  · 저장·대책 완료는 수파베이스 먼저 + 시트 이중 기록(슈퍼스타 별 집계·학생 페이지 유지)
 *  · 검사 항목 변경(hwcheckItems)은 설정 탭이라 기존 백엔드 그대로.
 * 수파베이스 실패 시 기존 백엔드로 자동 폴백. */
(function(){
  if (window.__sbAdapter) return; window.__sbAdapter = true;
  var SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var STARS_MAX = 6;
  var rawFetch = window.fetch.bind(window);
  var PAGE = 1000;

  function hdr(extra){
    var h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  function sbGet(path, _from, _acc){
    var from = _from || 0, acc = _acc || [];
    return rawFetch(SB + path, { headers: hdr({ 'Range-Unit': 'items', 'Range': from + '-' + (from + PAGE - 1) }) })
      .then(function(r){ if (!r.ok) throw new Error('sb ' + r.status); return r.json(); })
      .then(function(rows){
        acc = acc.concat(rows);
        return rows.length < PAGE ? acc : sbGet(path, from + PAGE, acc);
      });
  }
  function sbWrite(method, path, body, extra){
    return rawFetch(SB + path, { method: method, headers: hdr(extra), body: body == null ? undefined : JSON.stringify(body) })
      .then(function(r){
        if (!r.ok) return r.text().then(function(t){ throw new Error('sb ' + r.status + ' ' + t.slice(0,120)); });
        return (extra && /representation/.test(extra['Prefer'] || '')) ? r.json() : null;
      });
  }
  function q(v){ return encodeURIComponent(String(v == null ? '' : v)); }
  function pad2(n){ return String(n).padStart(2, '0'); }
  function nowIso(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + 'T' +
           pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + '+09:00';
  }
  function ymdShift(ymd, days){
    var d = new Date(Date.parse(ymd) + days * 86400000);
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate());
  }
  function ok(o){ o.result = 'success'; return o; }
  function fake(d){ return { ok: true, status: 200, json: function(){ return Promise.resolve(d); } }; }
  function legacyBg(body){
    function go(){ return rawFetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) }); }
    go().catch(function(){ setTimeout(function(){ go().catch(function(e){ console.warn('시트 이중 기록 실패', body.action, e); }); }, 3000); });
  }
  function applyYmdOf(g){ return (g.apply_date && /^\d{4}-\d{2}-\d{2}$/.test(g.apply_date)) ? g.apply_date : String(g.at || '').slice(0,10); }

  var GETS = {
    hwcheckBoot: function(p, url, opts){
      var week = (p.get('week') || '').trim();
      // 명단·항목(기존 백엔드)과 수파베이스 조회를 동시에
      var pLegacy = rawFetch(url, opts).then(function(r){ return r.json(); });
      var pSb = null;
      if (/^\d{4}-\d{2}-\d{2}$/.test(week)){
        var to = ymdShift(week, 4);
        pSb = Promise.all([
          sbGet('/hwcheck_records?week=eq.' + q(week)),
          sbGet('/tt_classes?book=eq.' + q('정규') + '&order=id&select=class_id,day,start_time,end_time,location,teacher,name,roster'),
          sbGet('/attendance?date=gte.' + q(week) + '&date=lte.' + q(to) + '&book=eq.' + q('정규') + '&order=date'),
          sbGet('/tt_log?kind=eq.' + q('1회') + '&book=eq.' + q('정규') + '&at=gte.' + q(new Date(Date.parse(week) - 68 * 86400000).toISOString()))
        ]).catch(function(e){ console.warn('수파베이스 부팅 조회 실패 — 시트 값 사용', e); return null; });
      }
      return Promise.all([pLegacy, pSb || Promise.resolve(null)]).then(function(rs){
        var L = rs[0], S = rs[1];
        if (!L || L.result !== 'success' || !S) return L;
        var records = {};
        S[0].forEach(function(r){
          records[r.token] = { scores: r.scores || {}, pct: r.pct || 0, pub: r.pub, priv: r.priv,
                               missing: !!r.missing, plan: r.plan };
        });
        L.records = records;
        L.classes = S[1].map(function(r){
          return { id: r.class_id, day: r.day, start: r.start_time, end: r.end_time,
                   loc: r.location, teacher: r.teacher, cls: r.name,
                   students: String(r.roster || '').trim().split(/\s+/).filter(String) };
        });
        L.weekAttend = S[2].map(function(a){
          return { date: a.date, classId: a.class_id, student: a.student, status: a.status, memo: a.memo };
        });
        var to2 = ymdShift(week, 4);
        L.weekOnce = S[3].filter(function(g){
          var a = applyYmdOf(g); return a >= week && a <= to2;
        }).map(function(g){
          return { row: g.id, date: applyYmdOf(g), student: g.student,
                   fromId: g.from_class_id, toId: g.to_class_id, reason: g.reason };
        });
        return L;
      });
    },
    hwcheckPlans: function(){
      return sbGet('/hwcheck_records?or=(missing.is.true,plan.neq.%22%22)&select=week,token,name,school,grade,plan,missing,plan_done')
        .then(function(rows){
          var out = rows.map(function(r){
            return { week: r.week, token: r.token, name: r.name, school: r.school, grade: r.grade,
                     plan: String(r.plan || '').trim(), missing: !!r.missing, done: !!r.plan_done };
          }).filter(function(x){ return x.missing || x.plan; });
          out.sort(function(a, b){ return a.week < b.week ? 1 : (a.week > b.week ? -1 : a.name.localeCompare(b.name, 'ko')); });
          return ok({ plans: out });
        });
    }
  };

  var POSTS = {
    hwcheckSave: function(b){
      var week = String(b.week || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(week)) return Promise.resolve({ result:'error', message:'주차가 올바르지 않습니다.' });
      var token = String(b.token || '').trim();
      if (!token) return Promise.resolve({ result:'error', message:'학생 식별 정보(접근코드)가 없습니다.' });
      var scores = {}, sum = 0, n = 0;
      var raw = (b.scores && typeof b.scores === 'object') ? b.scores : {};
      Object.keys(raw).forEach(function(k){
        var name = String(k).trim(); if (!name) return;
        var s = parseInt(raw[k], 10); if (isNaN(s)) s = 0;
        s = Math.max(0, Math.min(STARS_MAX, s));
        scores[name] = s; sum += s; n++;
      });
      if (!n) return Promise.resolve({ result:'error', message:'검사 항목 점수가 없습니다.' });
      var missing = (b.missing === true || b.missing === '1');
      var full = n * STARS_MAX;
      var pct = missing ? 0 : Math.round(sum / full * 100);
      // plan_done은 보내지 않는다 — 저장 시 기존 완료 표시 유지(기존 백엔드와 동일)
      return sbWrite('POST', '/hwcheck_records?on_conflict=week,token',
                     [{ week: week, token: token, name: String(b.name || '').trim(), school: String(b.school || '').trim(),
                        grade: String(b.grade || '').trim(), scores: scores, max: full, pct: pct,
                        pub: String(b.pub || ''), priv: String(b.priv || ''),
                        missing: missing, plan: String(b.plan || ''), at: nowIso() }],
                     { 'Prefer': 'resolution=merge-duplicates,return=minimal' })
        .then(function(){
          legacyBg(b);
          return ok({ week: week, pct: pct });
        });
    },
    hwcheckPlanDone: function(b){
      var week = String(b.week || '').trim(), token = String(b.token || '').trim();
      if (!week || !token) return Promise.resolve({ result:'error', message:'기록 식별 정보가 없습니다.' });
      return sbWrite('PATCH', '/hwcheck_records?week=eq.' + q(week) + '&token=eq.' + q(token),
                     { plan_done: String(b.done || '') === '1' }, { 'Prefer': 'return=representation' })
        .then(function(rows){
          if (!rows || !rows.length) return { result:'error', message:'기록을 찾을 수 없습니다. 새로고침 후 다시 시도해 주세요.' };
          legacyBg(b);
          return ok({});
        });
    }
  };

  window.fetch = function(url, opts){
    try {
      if (typeof ENDPOINT === 'undefined' || typeof url !== 'string' || url.indexOf(ENDPOINT) !== 0)
        return rawFetch(url, opts);
      if (opts && String(opts.method || '').toUpperCase() === 'POST'){
        var body;
        try { body = JSON.parse(opts.body); } catch (e) { return rawFetch(url, opts); }
        var ph = body && POSTS[body.action];
        if (!ph) return rawFetch(url, opts);
        return ph(body).then(fake, function(err){
          console.warn('수파베이스 쓰기 실패 — 기존 백엔드로 폴백', body.action, err);
          return rawFetch(url, opts);
        });
      }
      var qs = new URLSearchParams(url.slice(url.indexOf('?') + 1));
      var gh = GETS[qs.get('action')];
      if (!gh) return rawFetch(url, opts);
      return gh(qs, url, opts).then(fake, function(err){
        console.warn('수파베이스 조회 실패 — 기존 백엔드로 폴백', qs.get('action'), err);
        return rawFetch(url, opts);
      });
    } catch (e) {
      return rawFetch(url, opts);
    }
  };
})();
</script>

<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzhCncBwn-JlqXARC3wfrWUCuNHzlNK2df0bdhx-w78Xr8mzYUcIYZOJdRi9N4bHtsb/exec";
var STARS_MAX = 6;

var pw = 'sh';   // 티쳐스 페이지 비밀번호 제거(접속 간소화, 2026-08-14) — 백엔드 TEACHER_PW 내장
var roster = [];         // studentLinks: {name, school, grade, teacher, classA, classB, code}
var items = [];          // 검사 항목 이름들
var records = {};        // token -> {scores, pct, pub, priv}
var week = weekStartOf(new Date());
var saveTimers = {};     // token -> debounce timer

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }

/* ── 주차 계산 — 정규 수업 주는 수요일 시작(수목금토일 단위).
 * 주차 키 = 그 주 수요일 yyyy-MM-dd. 월·화에는 직전 수~일 주가 '이번 주'로 보인다. ── */
function weekStartOf(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 4) % 7));   // 수요일(3)로부터 지난 날 수
  return ymd(x);
}
function ymd(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function parseYmd(s){ var p = s.split('-'); return new Date(+p[0], +p[1]-1, +p[2]); }
function moveWeek(dir){
  var d = parseYmd(week); d.setDate(d.getDate() + dir*7);
  week = ymd(d);
  loadWeek();
}
function weekLabel(){
  var wed = parseYmd(week), sun = parseYmd(week); sun.setDate(sun.getDate()+4);   // 수 + 4일 = 일
  $('wk-label').textContent = (wed.getMonth()+1)+'/'+wed.getDate()+' ~ '+(sun.getMonth()+1)+'/'+sun.getDate()+' 주차';
  $('wk-range').textContent = '수 ~ 일';
}

/* ── 서버 통신 (리포트 서버는 s.html과 같은 fetch 방식) ──
 * 접속이 몰리는 시간대의 일시 지연에 대비해 15초 제한 + 자동 2회 재시도 */
function getJSON(url, tries){
  tries = tries == null ? 3 : tries;
  var ctrl = (typeof AbortController !== 'undefined') ? new AbortController() : null;
  var timer = ctrl ? setTimeout(function(){ ctrl.abort(); }, 15000) : null;
  return fetch(url, { cache:'no-store', signal: ctrl ? ctrl.signal : undefined })
    .then(function(r){ if (timer) clearTimeout(timer); return r.json(); })
    .catch(function(err){
      if (timer) clearTimeout(timer);
      if (tries > 1) return new Promise(function(res){ setTimeout(res, 1200); }).then(function(){ return getJSON(url, tries - 1); });
      throw err;
    });
}
function postJSON(payload){
  return fetch(ENDPOINT, { method:'POST', body: JSON.stringify(payload) }).then(function(r){ return r.json(); });
}

/* ── 로그인 ── */
function tryLogin(){
  var v = $('pw').value.trim();
  if (!v){ $('gate-err').textContent = '비밀번호를 입력하세요.'; return; }
  pw = v;
  $('gate-err').textContent = '';
  boot();
}
$('pw').addEventListener('keydown', function(e){ if (e.key === 'Enter') tryLogin(); });

function setStatus(msg, isErr){
  var el = $('status'); el.textContent = msg || '';
  el.style.color = isErr ? '#B4574E' : '';
}

/* ── 브라우저 캐시: 이전 데이터를 즉시 띄우고, 뒤에서 최신으로 조용히 갱신 ── */
function cacheGet(k){ try { var v = JSON.parse(localStorage.getItem('hwc:' + k) || 'null'); return v && v.d; } catch(e){ return null; } }
function cacheSet(k, d){ try { localStorage.setItem('hwc:' + k, JSON.stringify({ t: Date.now(), d: d })); } catch(e){} }

/* 시간표에서 [숙제 검사] 버튼으로 넘어온 경우 — 주소의 시간대를 자동 선택 */
function applyUrlSlot(){
  var p = new URLSearchParams(location.search).get('slot');
  if (!p) return;
  var v = slotNorm(p), sel = $('f-slot');
  for (var i = 0; i < sel.options.length; i++){
    if (sel.options[i].value === v){ sel.value = v; rebuildFilters(); break; }
  }
}
/* 시간표에서 반 단위로 넘어온 경우(cid) — 같은 시간대의 다른 반(다른 학년) 학생이 섞이지 않게
 * 그 반 명단에 있는 학생만 표시. '전체 보기'를 누르면 시간대 전체로 풀린다. */
var urlCid = new URLSearchParams(location.search).get('cid') || '';
function cidMembers_(){
  if (!urlCid || !ttClasses || !ttClasses[urlCid] || !ttClasses[urlCid].students) return null;
  var m = {};
  ttClasses[urlCid].students.forEach(function(nm){ m[String(nm).replace(/\(.*\)$/,'')] = true; });
  // 이번 주 1회 이동으로 이 반에 온 학생도 포함
  (wkOnce || []).forEach(function(o){ if (o.toId === urlCid) m[String(o.student || '').replace(/\(.*\)$/,'')] = true; });
  return m;
}
function updateCidNote(){
  var el = $('cid-note'); if (!el) return;
  var info = urlCid && ttClasses && ttClasses[urlCid];
  if (info){
    el.style.display = 'flex';
    el.innerHTML = '<span>「' + esc(info.label) + '」 반 학생만 보고 있어요</span>' +
                   '<button type="button" onclick="clearCid()">이 시간대 전체 보기</button>';
  } else el.style.display = 'none';
}
function clearCid(){
  urlCid = '';
  updateCidNote();
  rebuildFilters();
  render();
}
function boot(){
  // 캐시된 명단이 있으면 즉시 화면부터 (최신 데이터는 loadWeek의 통합 요청 한 번으로)
  var cr = cacheGet('roster');
  if (cr && cr.length){
    roster = cr;
    $('gate').style.display = 'none';
    $('bar').style.display = 'block';
    buildTypeValues();
    applyUrlSlot();
    bootPainted = true;
  }
  loadWeek();
}

var bootPainted = false;   // 캐시로 화면을 먼저 그렸는지
var slotApplied = false;   // 주소의 slot 자동 선택을 이미 했는지
function loadWeek(){
  weekLabel();
  // 캐시된 주차 기록이 있으면 즉시 표시
  var chw = cacheGet('hw:' + week);
  var painted = false;
  if (bootPainted && chw){
    items = chw.items || [];
    records = chw.records || {};
    if (ttClasses === null){ var ctm = cacheGet('ttmap'); if (ctm) ttClasses = ctm; }
    var cwk = cacheGet('hwwk:' + week);
    if (cwk){ wkAtt = cwk.a || []; wkOnce = cwk.o || []; }
    renderChips();
    render();
    painted = true;
  }
  setStatus(painted ? '최신 기록 확인 중…' : '검사 기록을 불러오는 중…');
  // 통합 부팅 조회 — 명단·검사 기록·시간표·주간 출석을 한 번에 (접속 지연 대책, 2026-08-19)
  getJSON(ENDPOINT + '?action=hwcheckBoot&pw=' + encodeURIComponent(pw) + '&week=' + encodeURIComponent(week))
    .then(function(r){
      if (!r || r.result !== 'success'){
        if (painted){ setStatus(''); return; }   // 캐시 화면 유지
        if (r && /unauthor/i.test(r.message||'')){
          pw = ''; sessionStorage.removeItem('hwcheck_pw');
          $('gate').style.display = ''; $('bar').style.display = 'none';
          $('gate-err').textContent = '비밀번호가 올바르지 않습니다.';
          setStatus('');
        } else setStatus('기록을 불러오지 못했어요. 새로고침 해주세요.', true);
        return;
      }
      sessionStorage.setItem('hwcheck_pw', pw);
      // ① 명단
      roster = (r.students || []).filter(function(s){ return s.code; });
      roster.sort(function(a,b){ return a.name.localeCompare(b.name, 'ko'); });
      cacheSet('roster', roster);
      $('gate').style.display = 'none';
      $('bar').style.display = 'block';   // CSS 기본값이 display:none이라 ''로는 안 보임
      buildTypeValues();
      // ② 시간표 (반ID→시간대)
      ttClasses = {};
      (r.classes || []).forEach(function(c){
        ttClasses[c.id] = { slot: slotNorm(c.day + c.start), label: c.cls, students: (c.students || []) };
      });
      cacheSet('ttmap', ttClasses);
      if (urlCid){ updateCidNote(); rebuildFilters(); }   // 반 명단이 준비되면 반 필터 적용
      // ③ 주간 출석·1회 이동
      wkAtt = r.weekAttend || [];
      wkOnce = r.weekOnce || [];
      cacheSet('hwwk:' + week, { a: wkAtt, o: wkOnce });
      // ④ 검사 기록
      items = r.items || [];
      records = r.records || {};
      cacheSet('hw:' + week, { items: items, records: records });
      if (!slotApplied){ slotApplied = true; if (!bootPainted) applyUrlSlot(); }
      setStatus('');
      renderChips();
      render();
      if (!plansTimerSet){ plansTimerSet = true; setTimeout(refreshPlansBadge, 4000); }   // 대책 뱃지는 잠시 뒤에
    })
    .catch(function(){ if (painted) setStatus(''); else setStatus('서버 연결에 실패했어요. 잠시 후 다시 시도해 주세요.', true); });
}
var plansTimerSet = false;

/* ── 시간표 연동: 그 주의 출석·1회 이동을 학생 카드에 표시 ── */
var ttClasses = null;   // 반ID -> {slot('금5:30'), label}
var wkAtt = [], wkOnce = [];
function plainNm(n){ return String(n || '').replace(/\(.*\)$/, '').trim(); }
function ttInfoHtml(s){
  if (!ttClasses) return '';
  var pn = plainNm(s.name);
  var mySlots = {};
  if (s.classA) mySlots[slotNorm(s.classA)] = 1;
  if (s.classB) mySlots[slotNorm(s.classB)] = 1;
  var parts = [];
  wkAtt.forEach(function(a){
    if (plainNm(a.student) !== pn) return;
    var c = ttClasses[a.classId];
    if (!c || !mySlots[c.slot]) return;   // 이 학생의 가/나 수업 기록만
    var md = String(a.date).slice(5).replace('-', '/');
    var k = a.status === '출석' ? 'ok' : (a.status === '지각' ? 'late' : 'abs');
    parts.push('<span class="tt-chip ' + k + '">' + md + ' ' + esc(c.slot) + ' ' + esc(a.status) +
               (a.memo ? ' · ' + esc(a.memo) : '') + '</span>');
  });
  wkOnce.forEach(function(o){
    if (plainNm(o.student) !== pn) return;
    var f = ttClasses[o.fromId], t = ttClasses[o.toId];
    var md = String(o.date).slice(5).replace('-', '/');
    parts.push('<span class="tt-chip once">' + md + ' 1회 이동 ' + esc(f ? f.slot : '?') + '→' + esc(t ? t.slot : '?') +
               (o.reason ? ' · ' + esc(o.reason) : '') + '</span>');
  });
  return parts.length ? '<div class="ttinfo">' + parts.join('') + '</div>' : '';
}

/* ── 그룹 필터 — 학년 → 학교 → 담당 강사 → 시간대.
 * 앞 단계 선택에 맞는 값만 다음 선택지에 나온다.
 * 시간대는 정규 가/나 어느 쪽이든 그 시간("토6:00")에 수업이 있는 학생을 찾는다.
 * (가·나 구분이 없는 중2·중3·고3도, 가/나로 나뉜 학년도 같은 방식으로 동작) ── */
function uniq(a){ return Array.from(new Set(a.filter(Boolean))); }
function slotNorm(v){ return String(v||'').replace(/\s+/g,''); }   // '토 6:00' ↔ '토6:00' 표기 차이 흡수
// 시간대 정렬 — 요일 순서(수목금토일, 정규 수업 주 기준) 먼저, 같은 요일은 이른 시간부터
// (1~8시는 오후 수업으로 보고 13~20시로 계산)
function slotSortKey(v){
  var d = '수목금토일월화'.indexOf(String(v||'').charAt(0));
  if (d < 0) d = 9;
  var m = String(v||'').match(/(\d{1,2}):?(\d{2})?/);
  var h = m ? +m[1] : 0, mm = (m && m[2]) ? +m[2] : 0;
  if (h >= 1 && h <= 8) h += 12;
  return d * 10000 + h * 100 + mm;
}
var extras = [];   // 그룹에 수동으로 추가한 학생(접근코드) — 이동해 온 친구 검사용
function pickVal(id){ return $(id) ? $(id).value : ''; }
function matchBase_(s, upTo){
  // upTo 단계 '직전'까지의 선택으로 학생을 거른다 (선택지 목록 생성을 위해)
  var mem = cidMembers_();   // 시간표에서 반 단위로 넘어온 경우 — 그 반 명단만
  if (mem && !mem[String(s.name || '').replace(/\(.*\)$/,'')]) return false;
  var g = pickVal('f-grade'), sc = pickVal('f-school'), tc = pickVal('f-teacher'), sl = pickVal('f-slot');
  if (upTo !== 'grade'   && g  && s.grade !== g) return false;
  if (upTo === 'grade') return true;
  if (upTo !== 'school'  && sc && s.school !== sc) return false;
  if (upTo === 'school') return true;
  if (upTo !== 'teacher' && tc && String(s.teacher||'').trim() !== tc) return false;
  if (upTo === 'teacher') return true;
  if (upTo !== 'slot' && sl && slotNorm(s.classA) !== sl && slotNorm(s.classB) !== sl && !onceToSlots_(s)[sl]) return false;
  return true;
}
/* 이번 주 1회 이동으로 '이동해 간' 시간대들 — 그 시간대 목록에도 학생이 나타나게 */
function onceToSlots_(s){
  if (!ttClasses || !wkOnce.length) return {};
  var pn = plainNm(s.name), out = {};
  wkOnce.forEach(function(o){
    if (plainNm(o.student) !== pn) return;
    var t = ttClasses[o.toId];
    if (t) out[t.slot] = 1;
  });
  return out;
}
function fillSelect_(id, label, vals){
  var sel = $(id), cur = sel.value;
  sel.innerHTML = '<option value="">' + label + '</option>' +
    vals.map(function(v){ return '<option value="' + esc(v) + '">' + esc(v) + '</option>'; }).join('');
  if (cur && vals.indexOf(cur) >= 0) sel.value = cur;   // 가능한 선택은 유지
}
function rebuildFilters(){
  fillSelect_('f-grade',   '학년 전체',      uniq(roster.filter(function(s){ return matchBase_(s, 'grade'); }).map(function(s){ return s.grade; })).sort());
  fillSelect_('f-school',  '학교 전체',      uniq(roster.filter(function(s){ return matchBase_(s, 'school'); }).map(function(s){ return s.school; })).sort());
  fillSelect_('f-teacher', '담당 강사 전체', uniq(roster.filter(function(s){ return matchBase_(s, 'teacher'); }).map(function(s){ return String(s.teacher||'').trim(); })).sort());
  var slotStus = roster.filter(function(s){ return matchBase_(s, 'slot'); });
  fillSelect_('f-slot', '시간대 전체',
    uniq(slotStus.map(function(s){ return slotNorm(s.classA); }).concat(slotStus.map(function(s){ return slotNorm(s.classB); })))
      .sort(function(a, b){ return slotSortKey(a) - slotSortKey(b); }));
}
function buildTypeValues(){ rebuildFilters(); }
function filterChanged(){
  extras = [];
  rebuildFilters();   // 뒷 단계 선택지를 앞 단계에 맞게 갱신
  render();
}
function baseStudents(){
  return roster.filter(function(s){ return matchBase_(s, ''); });
}
function currentStudents(){
  var base = baseStudents();
  var have = {};
  base.forEach(function(s){ have[s.code] = true; });
  var added = [];
  extras.forEach(function(tok){
    if (have[tok]) return;
    var s = roster.find(function(x){ return x.code === tok; });
    if (s){ added.push(s); have[tok] = true; }
  });
  return added.concat(base);   // 추가한 학생을 맨 위에
}
function isExtra(token){
  return extras.indexOf(token) >= 0 && !baseStudents().some(function(s){ return s.code === token; });
}
/* 이동해 온 학생 검색·추가 */
function searchStu(){
  var q = $('stu-search').value.trim();
  var box = $('stu-results');
  if (q.length < 1){ box.innerHTML = ''; return; }
  var shown = {};
  currentStudents().forEach(function(s){ shown[s.code] = true; });
  var found = roster.filter(function(s){ return !shown[s.code] && s.name.indexOf(q) >= 0; }).slice(0, 8);
  box.innerHTML = found.map(function(s){
    return '<button onclick="addExtra(\'' + esc(s.code) + '\')">' + esc(s.name) + ' <small>' + esc(s.school) + ' · ' + esc(s.grade) + '</small></button>';
  }).join('') || '<span style="font-size:.8rem;color:var(--ink-soft);">일치하는 학생이 없어요</span>';
}
function addExtra(token){
  if (extras.indexOf(token) < 0) extras.push(token);
  $('stu-search').value = '';
  $('stu-results').innerHTML = '';
  render();
}
function removeExtra(token){
  extras = extras.filter(function(t){ return t !== token; });
  render();
}

/* ── 항목 관리 ── */
function toggleItems(){
  var p = $('items-panel');
  p.style.display = (p.style.display === 'block') ? 'none' : 'block';
}
function renderChips(){
  $('chips').innerHTML = items.map(function(it, i){
    return '<span class="chip"><b>' + esc(it) + '</b>' +
      (items.length > 1 ? '<button onclick="removeItem(' + i + ')" title="삭제">×</button>' : '') + '</span>';
  }).join('');
}
function saveItems(next){
  postJSON({ action:'hwcheckItems', pw: pw, items: next })
    .then(function(r){
      if (r && r.result === 'success'){ items = r.items; renderChips(); render(); }
      else alert('항목을 저장하지 못했어요: ' + ((r && r.message) || '알 수 없음'));
    })
    .catch(function(){ alert('항목 저장 중 연결에 실패했어요.'); });
}
function addItem(){
  var v = $('new-item').value.replace(/,/g, ' ').trim();
  if (!v) return;
  if (items.indexOf(v) >= 0){ alert('이미 있는 항목이에요.'); return; }
  $('new-item').value = '';
  saveItems(items.concat([v]));
}
function removeItem(i){
  var it = items[i];
  if (!confirm('"' + it + '" 항목을 뺄까요?\n(이미 저장된 주차 기록은 그대로 남아요)')) return;
  saveItems(items.filter(function(_, j){ return j !== i; }));
}

/* ── 학생 목록 렌더 ── */
function recOf(token){
  if (!records[token]) records[token] = { scores: {}, pct: 0, pub: '', priv: '', missing: false, plan: '' };
  return records[token];
}
function isChecked(rec){ return !!(rec && (hasAnyScore(rec) || rec.missing)); }
function pctOf(rec){
  var sum = 0;
  items.forEach(function(it){ sum += (parseInt(rec.scores[it], 10) || 0); });
  var full = items.length * STARS_MAX;
  return full ? Math.round(sum / full * 100) : 0;
}
function hasAnyScore(rec){
  return items.some(function(it){ return rec.scores[it] != null; });
}
function render(){
  updateCidNote();
  var stus = currentStudents();
  var baseSet = {};
  baseStudents().forEach(function(s){ baseSet[s.code] = true; });
  var checked = 0;
  var html = stus.map(function(s){
    var rec = records[s.code];
    var extra = !baseSet[s.code];
    if (isChecked(rec)) checked++;
    var pct = rec ? pctOf(rec) : null;
    var starsHtml = items.map(function(it, ii){
      var sc = rec ? (parseInt(rec.scores[it], 10) || 0) : 0;
      var btns = '';
      for (var k = 1; k <= STARS_MAX; k++){
        btns += '<button class="' + (k <= sc ? 'on' : '') + '" onclick="tapStar(\'' + esc(s.code) + '\',' + ii + ',' + k + ')">★</button>';
      }
      return '<div class="itemrow"><span class="lb">' + esc(it) + '</span><span class="stars" id="stars-' + esc(s.code) + '-' + ii + '">' + btns + '</span></div>';
    }).join('');
    var showPct = (rec && hasAnyScore(rec)) ? pct : null;
    var pctHtml = (rec && rec.missing) ? '<span class="miss-lb">미제출</span>'
      : (showPct == null ? '<span style="font-size:.8rem;">미검사</span>'
        : '<b class="' + (showPct >= 100 ? 'full' : '') + '">' + showPct + '%</b>' + (showPct >= 100 ? ' 🏆' : ''));
    return '<div class="stu' + (rec && rec.missing ? ' missing' : '') + '" id="stu-' + esc(s.code) + '">' +
      '<div class="top"><span class="nm">' + esc(s.name) + '<small>' + esc(s.school) + ' · ' + esc(s.grade) + '</small>' +
      (extra ? '<span class="extra-badge">추가됨</span><button class="extra-rm" onclick="removeExtra(\'' + esc(s.code) + '\')" title="목록에서 빼기">×</button>' : '') + '</span>' +
      '<span class="pct"><span id="pct-' + esc(s.code) + '">' + pctHtml + '</span>' +
      '<span class="save-dot" id="dot-' + esc(s.code) + '"></span></span></div>' +
      ttInfoHtml(s) +
      starsHtml +
      '<div class="memo-btns">' +
        '<button class="missbtn ' + (rec && rec.missing ? 'on' : '') + '" onclick="toggleMissing(\'' + esc(s.code) + '\')">미제출</button>' +
        '<button id="pubbtn-' + esc(s.code) + '" class="' + (rec && rec.pub ? 'has' : '') + '" onclick="toggleMemo(\'' + esc(s.code) + '\',\'pub\')">공개 메모</button>' +
        '<button id="privbtn-' + esc(s.code) + '" class="' + (rec && rec.priv ? 'has' : '') + '" onclick="toggleMemo(\'' + esc(s.code) + '\',\'priv\')">비공개 메모</button>' +
      '</div>' +
      '<div class="plan-area" id="plan-' + esc(s.code) + '" style="' + (rec && rec.missing ? 'display:block;' : '') + '">' +
        '<label>이후 대책 — 버튼을 누르면 문장이 자동으로 만들어져요</label>' +
        planPickerHtml(s.code) +
        '<input onblur="planChanged(\'' + esc(s.code) + '\')" id="ta-plan-' + esc(s.code) + '" placeholder="예: 8/13 목 5:30에 재검사 약속" value="' + esc(rec ? rec.plan : '') + '" /></div>' +
      '<div class="memo-area" id="memo-pub-' + esc(s.code) + '"><label>공개 메모 — 학생 개별 페이지에 보여요</label>' +
        '<textarea onblur="memoChanged(\'' + esc(s.code) + '\')" id="ta-pub-' + esc(s.code) + '">' + esc(rec ? rec.pub : '') + '</textarea></div>' +
      '<div class="memo-area" id="memo-priv-' + esc(s.code) + '"><label>비공개 메모 — 교사·조교만 봐요</label>' +
        '<textarea onblur="memoChanged(\'' + esc(s.code) + '\')" id="ta-priv-' + esc(s.code) + '">' + esc(rec ? rec.priv : '') + '</textarea></div>' +
    '</div>';
  }).join('');
  $('list').innerHTML = html || '<p class="empty">해당하는 학생이 없어요.</p>';
  $('count-note').textContent = '검사 ' + checked + '명 / 전체 ' + stus.length + '명';
}

/* ── 입력 → 자동 저장 ── */
function tapStar(token, itemIdx, k){
  var it = items[itemIdx];
  var rec = recOf(token);
  var cur = parseInt(rec.scores[it], 10) || 0;
  rec.scores[it] = (cur === k) ? k - 1 : k;   // 같은 별을 다시 누르면 1개 줄이기 (1→0 포함)
  items.forEach(function(name){ if (rec.scores[name] == null) rec.scores[name] = 0; });
  updateCard(token);
  queueSave(token);
}
/* 그 학생 카드의 별·%만 갱신 — 화면 전체를 다시 그리지 않아 열린 메모창이 닫히지 않는다 */
function updateCard(token){
  var rec = recOf(token);
  items.forEach(function(it, ii){
    var box = $('stars-' + token + '-' + ii);
    if (!box) return;
    var sc = parseInt(rec.scores[it], 10) || 0;
    var btns = box.querySelectorAll('button');
    for (var k = 0; k < btns.length; k++) btns[k].classList.toggle('on', k < sc);
  });
  var pctEl = $('pct-' + token);
  if (pctEl){
    var pct = pctOf(rec);
    pctEl.innerHTML = rec.missing ? '<span class="miss-lb">미제출</span>'
      : '<b class="' + (pct >= 100 ? 'full' : '') + '">' + pct + '%</b>' + (pct >= 100 ? ' 🏆' : '');
  }
  var card = $('stu-' + token);
  if (card) card.classList.toggle('missing', !!rec.missing);
  var plan = $('plan-' + token);
  if (plan) plan.style.display = rec.missing ? 'block' : 'none';
  var stus = currentStudents(), checked = 0;
  stus.forEach(function(s){ if (isChecked(records[s.code])) checked++; });
  $('count-note').textContent = '검사 ' + checked + '명 / 전체 ' + stus.length + '명';
}
function toggleMissing(token){
  var rec = recOf(token);
  rec.missing = !rec.missing;
  items.forEach(function(name){ if (rec.scores[name] == null) rec.scores[name] = 0; });
  var btn = document.querySelector('#stu-' + CSS.escape(token) + ' .missbtn');
  if (btn) btn.classList.toggle('on', rec.missing);
  updateCard(token);
  queueSave(token);
}
function planChanged(token){
  var rec = recOf(token);
  rec.plan = $('ta-plan-' + token).value;
  if (rec.plan.trim()) lastPlan = rec.plan.trim();
  items.forEach(function(name){ if (rec.scores[name] == null) rec.scores[name] = 0; });
  queueSave(token);
}

/* ── 대책 간편 입력: 무엇을 → 언제 → 몇 시, 세 번 탭이면 문장 완성 ── */
var PLAN_TYPES = [['재검사', '재검사 약속'], ['남아서 검사', '남아서 검사'], ['보충', '보충 수업'], ['전화 상담', '전화 상담']];
var PLAN_TIMES = ['11:00', '12:30', '2:00', '3:30', '5:30', '7:00', '8:30'];
var DOW_KO = '일월화수목금토';
var planPick = {};   // token -> {type(문구), date, time}
var lastPlan = '';   // 직전에 기록한 대책 — '이전과 동일' 버튼용
function planDates(from, count){
  var out = [];
  for (var i = 0; i < count; i++){
    var d = new Date(); d.setDate(d.getDate() + from + i);
    out.push((d.getMonth()+1) + '/' + d.getDate() + ' ' + DOW_KO.charAt(d.getDay()));
  }
  return out;
}
function planPickerHtml(token){
  function chips(kind, list){
    return list.map(function(v){
      var label = Array.isArray(v) ? v[0] : v, val = Array.isArray(v) ? v[1] : v;
      return '<button data-k="' + kind + '" onclick="pickPlan(\'' + esc(token) + '\',\'' + kind + '\',\'' + esc(val) + '\',this)">' + esc(label) + '</button>';
    }).join('');
  }
  return (lastPlan ? '<button class="qp-same" onclick="samePlan(\'' + esc(token) + '\')">이전과 동일: ' + esc(lastPlan.length > 18 ? lastPlan.slice(0,18) + '…' : lastPlan) + '</button>' : '') +
    '<div class="qp-row"><span class="qp-lb">무엇을</span>' + chips('type', PLAN_TYPES) + '</div>' +
    '<div class="qp-row"><span class="qp-lb">언제</span>' + chips('date', planDates(0, 7)) + '</div>' +
    '<div class="qp-row"><span class="qp-lb">다음 주</span>' + chips('date', planDates(7, 7)) + '</div>' +
    '<div class="qp-row"><span class="qp-lb">몇 시</span>' + chips('time', PLAN_TIMES) + '</div>' +
    '<p class="qp-hint">가까운 시간대를 선택해주세요.</p>';
}
function pickPlan(token, kind, val, btn){
  var p = planPick[token] = planPick[token] || {};
  var wasOn = p[kind] === val;
  p[kind] = wasOn ? '' : val;
  // 같은 종류 버튼 표시 갱신 (누른 것만 켜기, 다시 누르면 끄기) — 날짜는 두 줄(이번 주/다음 주)에 걸쳐 있어 함께 끈다
  var box = btn.closest ? btn.closest('.plan-area') : null;
  var sib = (box || btn.parentNode).querySelectorAll('button[data-k="' + kind + '"]');
  for (var i = 0; i < sib.length; i++) sib[i].classList.remove('on');
  if (!wasOn) btn.classList.add('on');
  composePlan(token);
}
function composePlan(token){
  var p = planPick[token] || {};
  if (!p.type && !p.date && !p.time) return;
  var when = [p.date, p.time].filter(Boolean).join(' ');
  var text = when
    ? when + (p.type ? '에 ' + p.type : '')
    : (p.type || '');
  var input = $('ta-plan-' + token);
  input.value = text;
  var rec = recOf(token);
  rec.plan = text;
  if (text.trim()) lastPlan = text.trim();
  items.forEach(function(name){ if (rec.scores[name] == null) rec.scores[name] = 0; });
  queueSave(token);
}
function samePlan(token){
  if (!lastPlan) return;
  var input = $('ta-plan-' + token);
  input.value = lastPlan;
  var rec = recOf(token);
  rec.plan = lastPlan;
  items.forEach(function(name){ if (rec.scores[name] == null) rec.scores[name] = 0; });
  queueSave(token);
}
function toggleMemo(token, kind){
  var el = $('memo-' + kind + '-' + token);
  el.style.display = (el.style.display === 'block') ? 'none' : 'block';
  if (el.style.display === 'block') $('ta-' + kind + '-' + token).focus();
}
function memoChanged(token){
  var rec = recOf(token);
  rec.pub = $('ta-pub-' + token).value;
  rec.priv = $('ta-priv-' + token).value;
  $('pubbtn-' + token).classList.toggle('has', !!rec.pub.trim());
  $('privbtn-' + token).classList.toggle('has', !!rec.priv.trim());
  if (!isChecked(rec) && !rec.pub.trim() && !rec.priv.trim() && !(rec.plan||'').trim()) return;   // 아무것도 없으면 저장 안 함
  items.forEach(function(name){ if (rec.scores[name] == null) rec.scores[name] = 0; });
  queueSave(token);
}
function queueSave(token){
  var dot = $('dot-' + token);
  if (dot){ dot.textContent = '저장 중…'; dot.className = 'save-dot'; }
  clearTimeout(saveTimers[token]);
  saveTimers[token] = setTimeout(function(){ doSave(token); }, 900);
}
function doSave(token){
  var s = roster.find(function(x){ return x.code === token; });
  var rec = recOf(token);
  var scores = {};
  items.forEach(function(it){ scores[it] = parseInt(rec.scores[it], 10) || 0; });
  postJSON({ action:'hwcheckSave', pw: pw, week: week, token: token,
             name: s ? s.name : '', school: s ? s.school : '', grade: s ? s.grade : '',
             scores: scores, pub: rec.pub || '', priv: rec.priv || '',
             missing: rec.missing ? '1' : '', plan: rec.plan || '' })
    .then(function(r){
      var dot = $('dot-' + token);
      if (r && r.result === 'success'){ rec.pct = r.pct; if (dot){ dot.textContent = '저장됨 ✓'; dot.className = 'save-dot ok'; setTimeout(function(){ if (dot.textContent === '저장됨 ✓') dot.textContent = ''; }, 2500); } }
      else if (dot){ dot.textContent = '저장 실패 — 다시 눌러주세요'; dot.className = 'save-dot err'; }
    })
    .catch(function(){
      var dot = $('dot-' + token);
      if (dot){ dot.textContent = '저장 실패 — 다시 눌러주세요'; dot.className = 'save-dot err'; }
    });
}

/* ── 미제출 대책 목록 (전 주차) ── */
var plans = [];          // {week, token, name, school, grade, plan, missing, done}
var plansOpen = false;
function refreshPlansBadge(){
  getJSON(ENDPOINT + '?action=hwcheckPlans&pw=' + encodeURIComponent(pw))
    .then(function(r){
      if (!r || r.result !== 'success') return;
      plans = r.plans || [];
      updatePlansBtn();
    })
    .catch(function(){});
}
/* 상단 버튼: 목록 화면에선 "미제출 확인", 미제출 화면에선 "검사하러 가기"로 바뀐다 */
function updatePlansBtn(){
  var pending = plans.filter(function(p){ return !p.done; }).length;
  $('plans-lb').textContent = plansOpen ? '검사하러 가기' : '미제출 확인';
  $('plans-btn').classList.toggle('back', plansOpen);
  var cnt = $('plans-cnt');
  cnt.textContent = pending;
  cnt.style.display = (pending && !plansOpen) ? '' : 'none';
}
function togglePlans(){
  plansOpen = !plansOpen;
  $('list').style.display = plansOpen ? 'none' : '';
  $('plans').style.display = plansOpen ? 'flex' : 'none';
  updatePlansBtn();
  if (plansOpen) loadPlans();
}
function loadPlans(){
  $('plans').innerHTML = '<p class="empty">대책 목록을 불러오는 중…</p>';
  getJSON(ENDPOINT + '?action=hwcheckPlans&pw=' + encodeURIComponent(pw))
    .then(function(r){
      if (!r || r.result !== 'success'){ $('plans').innerHTML = '<p class="empty">목록을 불러오지 못했어요.</p>'; return; }
      plans = r.plans || [];
      renderPlans();
    })
    .catch(function(){ $('plans').innerHTML = '<p class="empty">서버 연결에 실패했어요.</p>'; });
}
function weekLabelOf(wk){
  var p = wk.split('-'); if (p.length !== 3) return wk;
  var wed = new Date(+p[0], +p[1]-1, +p[2]), sun = new Date(+p[0], +p[1]-1, +p[2]+4);   // 수~일
  return (wed.getMonth()+1)+'/'+wed.getDate()+' ~ '+(sun.getMonth()+1)+'/'+sun.getDate()+' 주차';
}
function renderPlans(){
  updatePlansBtn();
  var backBtn = '<button class="plans-back" onclick="togglePlans()">검사하러 가기</button>';
  if (!plans.length){ $('plans').innerHTML = '<p class="empty">미제출·대책 기록이 없어요.</p>' + backBtn; return; }
  var html = '', curWeek = null;
  plans.forEach(function(p, i){
    if (p.week !== curWeek){ curWeek = p.week; html += '<p class="pw-week">' + weekLabelOf(p.week) + '</p>'; }
    html += '<div class="plan-card' + (p.done ? ' done' : '') + '">' +
      '<div class="pb"><div class="pn">' + esc(p.name) + '<small>' + esc(p.school) + ' · ' + esc(p.grade) + (p.missing ? ' · 미제출' : '') + '</small></div>' +
      '<p class="pt' + (p.plan ? '' : ' none') + '">' + (p.plan ? esc(p.plan) : '대책 미기록 — 검사 화면에서 적어주세요') + '</p></div>' +
      '<button class="okbtn' + (p.done ? ' on' : '') + '" onclick="togglePlanDone(' + i + ')">' + (p.done ? '완료 ✓' : '확인') + '</button>' +
    '</div>';
  });
  $('plans').innerHTML = html + backBtn;
}
function togglePlanDone(i){
  var p = plans[i];
  var next = !p.done;
  p.done = next;   // 화면 먼저 반영
  renderPlans();
  postJSON({ action:'hwcheckPlanDone', pw: pw, week: p.week, token: p.token, done: next ? '1' : '0' })
    .then(function(r){
      if (!r || r.result !== 'success'){ p.done = !next; renderPlans(); alert('표시를 저장하지 못했어요: ' + ((r && r.message) || '연결 오류')); }
    })
    .catch(function(){ p.done = !next; renderPlans(); alert('표시를 저장하지 못했어요. 연결을 확인해 주세요.'); });
}

/* ── 시작 ── */
$('gate').style.display = 'none';
boot();   // 게이트 없이 바로 시작
</script>
