<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>퇴원 정리 · 슈국 티쳐스</title>
<meta name="description" content="퇴원 학생의 기록을 전 시트에서 찾아 한 번에 삭제합니다 (교사용)" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#E4EFEA; --surface:#FFFFFF; --ink:#2A332F; --ink-soft:#65726B;
    --accent:#3A6B5E; --line:#D7E3DD; --line-soft:#E5EDE8; --radius:18px;
    --bad:#c0463e; --bad-bg:#FBEAE8; --ok:#1b8a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased; padding:0 0 80px;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 20px;}
  .back{display:inline-flex;align-items:center;gap:6px;margin:24px 0 0;color:var(--ink-soft);text-decoration:none;font-size:14px;}
  .back svg{width:16px;height:16px;}
  .back:hover{color:var(--accent);}
  header{padding:16px 4px 22px;text-align:center;}
  .tagline{font-family:"Gowun Batang",serif;font-size:1.5rem;font-weight:700;color:var(--accent);margin:0;}
  .intro{color:var(--ink-soft);font-size:.92rem;margin:9px auto 0;max-width:27em;}

  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;}
  .card h2{font-family:"Gowun Batang",serif;font-size:1.12rem;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;}
  .card .sub{color:var(--ink-soft);font-size:.84rem;margin:0 0 16px;}
  label{display:block;font-size:13px;color:var(--ink-soft);margin:14px 0 7px;font-weight:700;}
  input[type=text]{
    width:100%;padding:12px 13px;border:1.5px solid var(--line);border-radius:10px;
    font:inherit;font-size:15px;background:#fafbfa;color:var(--ink);
  }
  input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .find{width:100%;margin-top:16px;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;
    font-family:"Gowun Batang",serif;font-size:16px;font-weight:700;cursor:pointer;}
  .find:disabled{background:#9fb3aa;cursor:default;}

  /* 결과 목록 */
  .grp{margin-bottom:14px;}
  .grp .gt{font-size:13px;font-weight:700;color:var(--accent);margin:0 0 6px;display:flex;align-items:center;gap:7px;}
  .grp .gt .cnt{font-weight:400;color:var(--ink-soft);}
  .it{display:flex;align-items:flex-start;gap:9px;border:1px solid var(--line-soft);border-radius:11px;
    padding:10px 12px;margin-bottom:7px;background:#fcfdfc;font-size:13.5px;cursor:pointer;}
  .it input{margin-top:3px;flex:0 0 auto;width:16px;height:16px;accent-color:var(--accent);}
  .it .bd{flex:1;min-width:0;}
  .it .nm{font-weight:700;}
  .it .idv{font-size:12px;color:var(--ink-soft);margin-left:6px;}
  .it .idv.bad{color:var(--bad);font-weight:700;}
  .it .ds{font-size:12px;color:var(--ink-soft);word-break:break-all;line-height:1.5;}
  .warn{background:#FBF6E7;border:1px solid #EFE3BE;border-radius:11px;padding:11px 14px;
    font-size:12.5px;color:#6B5E37;margin:12px 0;line-height:1.7;}
  .del{width:100%;margin-top:8px;padding:14px;border:none;border-radius:12px;background:var(--bad);color:#fff;
    font-family:"Gowun Batang",serif;font-size:16px;font-weight:700;cursor:pointer;}
  .del:disabled{background:#d9a09b;cursor:default;}
  .status{font-size:13px;margin-top:12px;min-height:1.2em;color:var(--ink-soft);text-align:center;}
  .status.ok{color:var(--ok);} .status.err{color:var(--bad);}
  .empty{text-align:center;color:#9aa6a0;font-size:13.5px;padding:16px;}

  /* 잠금 */
  .lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lock-card{background:#fff;border:1px solid var(--line-soft);border-radius:18px;padding:34px 28px;text-align:center;max-width:330px;width:100%;}
  .lock-card .t{font-family:"Gowun Batang",serif;font-weight:700;font-size:20px;color:var(--accent);}
  .lock-card .d{font-size:13px;color:var(--ink-soft);margin:10px 0 18px;}
  .lock-card input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;text-align:center;}
  .lock-card button{width:100%;margin-top:11px;padding:13px;border:none;border-radius:11px;background:var(--accent);color:#fff;font-family:"Gowun Batang",serif;font-weight:700;font-size:16px;cursor:pointer;}
  .lock-err{color:var(--bad);font-size:12.5px;min-height:1.1em;margin-top:10px;}
  body.locked{overflow:hidden;}
  body:not(.locked) .lock{display:none;}
</style>
</head>
<body class="locked">

<div class="lock" id="lockScreen">
  <div class="lock-card">
    <div class="t">퇴원 정리</div>
    <div class="d">선생님 전용 페이지입니다.<br>비밀번호를 입력해 주세요.</div>
    <input type="password" id="lockInput" placeholder="비밀번호" autocomplete="off" />
    <button type="button" onclick="checkLock()">확인</button>
    <div class="lock-err" id="lockErr"></div>
  </div>
</div>

<main class="wrap">
  <a class="back" href="https://coke4497-sys.github.io/shueguk-hub/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    티쳐스 메인 페이지로 가기
  </a>

  <header>
    <p class="tagline">퇴원 정리</p>
    <p class="intro">퇴원 학생의 기록을 명단·성적·신청 등 모든 시트에서 찾아 한 번에 삭제합니다. 학생정보 행이 지워지면 개인 페이지 링크도 즉시 무효화돼요.</p>
  </header>

  <section class="card">
    <h2><span class="dot"></span>학생 찾기</h2>
    <p class="sub">이름은 필수, 부모님 8자리는 선택이에요. 8자리를 넣으면 동명이인 기록을 자동으로 구분해 드립니다.</p>
    <label>이름</label>
    <input type="text" id="nm" placeholder="예) 이승준 (접미사 없이 실명으로 검색해도 함께 찾아요)" autocomplete="off" />
    <label>부모님 연락처 8자리 <span style="font-weight:400;color:#9aa6a0">(선택)</span></label>
    <input type="text" id="sid" inputmode="numeric" maxlength="8" placeholder="숫자 8자리" autocomplete="off" />
    <button type="button" class="find" id="findBtn" onclick="scan()">기록 찾기</button>
    <div class="status" id="scanStatus"></div>
  </section>

  <section class="card" id="resultCard" style="display:none;">
    <h2><span class="dot"></span>찾은 기록</h2>
    <p class="sub" id="resultSub"></p>
    <div id="list"></div>
    <div class="warn">⚠️ 삭제는 되돌릴 수 없어요. <b>번호가 다른 행</b>은 동명이인의 기록일 수 있어 자동으로 체크를 풀어두었습니다 — 삭제 전에 학교·학년을 꼭 확인해 주세요.</div>
    <button type="button" class="del" id="delBtn" onclick="removeChecked()">선택한 기록 삭제</button>
    <div class="status" id="delStatus"></div>
  </section>
</main>

<script>
  var ENDPOINT  = "https://script.google.com/macros/s/AKfycbzhCncBwn-JlqXARC3wfrWUCuNHzlNK2df0bdhx-w78Xr8mzYUcIYZOJdRi9N4bHtsb/exec";
  var SERVER_PW = "sh";
  var PASS_ENC  = "c2g=";
  var LOCK_KEY  = "shueguk_teacher_unlocked";

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
  function $(id){ return document.getElementById(id); }

  (function(){ try{ if(localStorage.getItem(LOCK_KEY)==='1'){ document.body.classList.remove('locked'); } }catch(e){} })();
  function checkLock(){
    var v=$('lockInput').value, ok=false;
    try{ ok=(btoa(v)===PASS_ENC); }catch(e){ ok=false; }
    if(ok){ try{ localStorage.setItem(LOCK_KEY,'1'); }catch(e){} document.body.classList.remove('locked'); }
    else { $('lockErr').textContent='비밀번호가 올바르지 않습니다.'; $('lockInput').value=''; }
  }
  $('lockInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkLock(); });

  var ITEMS = [];
  function setStatus(id,m,k){ var s=$(id); s.textContent=m||''; s.className='status'+(k?' '+k:''); }

  function scan(){
    var nm = $('nm').value.trim(), sid = $('sid').value.trim();
    if(!nm){ setStatus('scanStatus','이름을 입력해 주세요.','err'); return; }
    if(sid && !/^\d{8}$/.test(sid)){ setStatus('scanStatus','8자리는 숫자 8개여야 해요.','err'); return; }
    var btn=$('findBtn'); btn.disabled=true; setStatus('scanStatus','전체 시트에서 찾는 중… (10초 정도 걸릴 수 있어요)');
    $('resultCard').style.display='none';
    fetch(ENDPOINT+'?action=exitScan&pw='+encodeURIComponent(SERVER_PW)+'&name='+encodeURIComponent(nm)+'&sid='+encodeURIComponent(sid)+'&t='+Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        btn.disabled=false;
        if(!d || d.result!=='success'){ setStatus('scanStatus','검색 실패: '+((d&&d.message)||'오류'),'err'); return; }
        ITEMS = d.items||[];
        setStatus('scanStatus','');
        renderList(nm, sid);
      })
      .catch(function(){ btn.disabled=false; setStatus('scanStatus','연결 실패 — 인터넷을 확인해 주세요. (재배포 전이면 아직 사용할 수 없어요)','err'); });
  }

  function renderList(nm, sid){
    var card=$('resultCard'); card.style.display='block';
    if(!ITEMS.length){
      $('resultSub').textContent = '"'+nm+'" 이름으로 남아 있는 기록이 없어요.';
      $('list').innerHTML=''; $('delBtn').style.display='none';
      document.querySelector('#resultCard .warn').style.display='none';
      return;
    }
    $('delBtn').style.display='block';
    document.querySelector('#resultCard .warn').style.display='block';
    $('resultSub').textContent = '총 '+ITEMS.length+'건 — 삭제할 기록만 체크하세요.';
    var groups = {};
    ITEMS.forEach(function(it,i){ (groups[it.label]=groups[it.label]||[]).push(i); });
    var html='';
    Object.keys(groups).forEach(function(lb){
      var idxs=groups[lb];
      html+='<div class="grp"><p class="gt">'+esc(lb)+' <span class="cnt">'+idxs.length+'건</span></p>';
      idxs.forEach(function(i){
        var it=ITEMS[i];
        var checked = it.idMatch !== false;   // 번호가 명백히 다른 행만 체크 해제
        var idHtml = it.id ? '<span class="idv'+(it.idMatch===false?' bad':'')+'">'+esc(it.id)+(it.idMatch===false?' · 번호 다름':'')+'</span>' : '';
        html+='<label class="it"><input type="checkbox" data-i="'+i+'"'+(checked?' checked':'')+' />'+
          '<span class="bd"><span class="nm">'+esc(it.name)+'</span>'+idHtml+
          '<div class="ds">'+esc(it.desc||'')+'</div></span></label>';
      });
      html+='</div>';
    });
    $('list').innerHTML=html;
    setStatus('delStatus','');
  }

  function removeChecked(){
    var sel=[];
    document.querySelectorAll('#list input[type=checkbox]:checked').forEach(function(c){
      var it=ITEMS[+c.getAttribute('data-i')];
      if(it) sel.push({ src:it.src, tab:it.tab, row:it.row, name:it.name });
    });
    if(!sel.length){ setStatus('delStatus','체크된 기록이 없어요.','err'); return; }
    var hasRoster = sel.some(function(s){ return ITEMS.some(function(it){ return it.src==='report' && it.label==='학생정보(명단)' && it.row===s.row && it.tab===s.tab; }); });
    var msg = '선택한 '+sel.length+'건을 영구 삭제합니다.\n되돌릴 수 없어요. 계속할까요?'+(hasRoster?'\n\n(학생정보 행 포함 — 개인 페이지 링크도 즉시 무효화됩니다)':'');
    if(!confirm(msg)) return;
    var btn=$('delBtn'); btn.disabled=true; setStatus('delStatus','삭제하는 중…');
    fetch(ENDPOINT, {
      method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
      body: JSON.stringify({ action:'exitDelete', pw:SERVER_PW, items:sel })
    })
    .then(function(r){ return r.json(); })
    .then(function(d){
      btn.disabled=false;
      if(!d || d.result!=='success'){ setStatus('delStatus','삭제 실패: '+((d&&d.message)||'오류'),'err'); return; }
      var m='✓ '+d.deleted+'건 삭제 완료'+(d.skipped?' · '+d.skipped+'건은 목록이 낡아 건너뜀':'');
      setStatus('delStatus',m,'ok');
      scan();   // 최신 상태로 재검색
    })
    .catch(function(){ btn.disabled=false; setStatus('delStatus','연결 실패 — 다시 시도해 주세요.','err'); });
  }
  $('nm').addEventListener('keydown', function(e){ if(e.key==='Enter') scan(); });
  $('sid').addEventListener('keydown', function(e){ if(e.key==='Enter') scan(); });
</script>
</body>
</html>
