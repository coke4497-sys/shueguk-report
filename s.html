<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title>슈국 학생 페이지</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&family=Sacramento&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E" />
<meta name="theme-color" content="#E4EFEA" />
<style>
  :root{
    --bg:#E4EFEA; --surface:#FFFFFF;
    --ink:#2A332F; --ink-soft:#65726B;
    --accent:#3A6B5E; --icon:#3F4541; --icon-bg:#EBF0ED;
    --line:#D7E3DD; --line-soft:#E5EDE8; --radius:18px;
    --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    --serif:"Gowun Batang",serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:var(--sans); font-size:16px; line-height:1.75;
    -webkit-font-smoothing:antialiased; padding:0 0 40px;
  }
  .wrap{max-width:560px;margin:0 auto;padding:0 20px;}

  /* 로딩 / 에러 */
  #loadBox,#errBox{display:none;}
  .load-inner,.err-inner{padding:80px 30px;text-align:center;}
  .load-inner p{color:var(--ink-soft);font-family:var(--serif);font-size:.95rem;margin-top:20px;}
  .spinner{width:38px;height:38px;border:3px solid var(--line-soft);border-top-color:var(--accent);border-radius:50%;margin:0 auto;animation:spin .8s linear infinite;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .err-inner .e-t{font-family:var(--serif);font-weight:700;font-size:1.15rem;color:var(--ink);margin:0 0 10px;}
  .err-inner .e-s{font-family:var(--serif);font-size:.92rem;color:var(--ink-soft);line-height:1.8;margin:0;}

  /* 헤더 */
  header{padding:58px 22px 30px;text-align:center;}
  .brand .script{font-family:"Sacramento",cursive;font-size:3.4rem;line-height:1;color:var(--ink);font-weight:400;}
  .tagline{font-family:var(--serif);font-size:1.32rem;font-weight:700;color:var(--accent);margin:10px 0 0;letter-spacing:.01em;}
  .intro{color:var(--ink-soft);font-size:.92rem;margin:8px 0 0;}
  .badge{display:inline-block;margin-top:14px;font-size:.78rem;color:var(--accent);background:#DCE6E0;border-radius:20px;padding:3px 13px;}

  .sec-h{font-family:var(--serif);font-weight:700;font-size:1rem;color:var(--ink);margin:30px 2px 13px;}
  .sec-h .n{font-family:var(--sans);font-weight:400;font-size:.78rem;color:var(--ink-soft);margin-left:6px;}

  /* 내 수업 정보 카드 */
  .info-card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:16px 18px;}
  .info-teacher{display:flex;justify-content:space-between;gap:14px;padding:2px 2px 13px;margin-bottom:13px;border-bottom:1px solid var(--line-soft);font-size:.92rem;}
  .info-teacher .k{color:var(--ink-soft);}
  .info-teacher .v{color:var(--ink);font-family:var(--serif);font-weight:700;}
  .sched-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
  .sched-h{font-family:var(--serif);font-weight:700;font-size:.9rem;color:var(--ink);margin:0 0 9px;}
  .sched-tb{width:100%;border-collapse:collapse;font-size:.84rem;}
  .sched-tb th{font-weight:400;font-size:.7rem;color:var(--ink-soft);text-align:left;padding:0 0 7px;border-bottom:1px solid var(--line-soft);}
  .sched-tb th:last-child{text-align:right;}
  .sched-tb td{padding:9px 0;border-bottom:1px solid var(--line-soft);color:var(--ink);}
  .sched-tb tr:last-child td{border-bottom:none;}
  .sched-tb td:last-child{text-align:right;}
  .time{display:inline-block;background:var(--icon-bg);color:var(--accent);border-radius:7px;padding:2px 9px;font-size:.8rem;}

  /* 메뉴 그리드 */
  .grid{display:grid;gap:13px;grid-template-columns:repeat(2,1fr);}
  .card{
    display:flex;flex-direction:column;align-items:flex-start;text-align:left;
    background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:20px 18px 18px;text-decoration:none;color:inherit;min-height:150px;width:100%;
    font-family:var(--sans);cursor:pointer;
    transition:transform .16s ease, box-shadow .16s ease, border-color .16s ease;
  }
  a.card:hover,button.card:hover{transform:translateY(-3px);border-color:var(--line);box-shadow:0 12px 28px rgba(42,51,47,.08);}
  .card:active{transform:translateY(-1px);}
  .icon{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;background:var(--icon-bg);color:var(--icon);margin-bottom:15px;}
  .icon svg{width:23px;height:23px;}
  .card h3{font-family:var(--serif);font-size:1.06rem;font-weight:700;margin:0;letter-spacing:-.01em;line-height:1.35;}
  .card .desc{margin:6px 0 0;color:var(--ink-soft);font-size:.82rem;line-height:1.55;flex:1;}
  .go{margin-top:13px;display:inline-flex;align-items:center;gap:5px;font-size:.8rem;color:var(--accent);}
  .go svg{width:15px;height:15px;transition:transform .16s ease;}
  a.card:hover .go svg,button.card:hover .go svg{transform:translateX(4px);}
  .card.pending{opacity:.55;cursor:default;}
  .card.pending:hover{transform:none;box-shadow:none;border-color:var(--line-soft);}
  .tag{margin-top:13px;display:inline-block;font-size:.74rem;color:var(--ink-soft);background:#DCE6E0;border-radius:20px;padding:3px 11px;}
  .card.lock .icon{background:#DCE6E0;color:#5E7A6F;}

  footer{text-align:center;margin-top:46px;color:var(--ink-soft);font-size:.82rem;line-height:2;}

  /* 성적 데이터 뷰 */
  #gradeView{display:none;}
  .gv-bar{position:sticky;top:0;z-index:5;background:var(--bg);padding:16px 0 12px;display:flex;align-items:center;gap:12px;}
  .gv-back{border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:11px;padding:9px 14px;font-size:.85rem;font-family:var(--sans);cursor:pointer;display:inline-flex;align-items:center;gap:5px;}
  .gv-back svg{width:15px;height:15px;}
  .gv-ttl{font-family:var(--serif);font-weight:700;font-size:1rem;color:var(--ink);}
  .exam-tabs{display:flex;gap:8px;overflow-x:auto;padding:2px 0 14px;-webkit-overflow-scrolling:touch;}
  .exam-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);color:var(--ink-soft);border-radius:11px;padding:9px 15px;font-size:.84rem;font-family:var(--sans);cursor:pointer;white-space:nowrap;}
  .exam-tab.active{background:#CFE0D8;color:var(--accent);border-color:#9DBDB0;font-weight:700;}
  .exam-tab:active{opacity:.85;}
  .exam{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);overflow:hidden;margin-bottom:15px;}
  .x-head{padding:16px 18px;border-bottom:1px solid var(--line-soft);}
  .x-title{font-family:var(--serif);font-weight:700;font-size:1.04rem;color:var(--ink);margin:0;line-height:1.4;}
  .x-date{font-size:.78rem;color:var(--ink-soft);margin:5px 0 0;}
  .x-stats{display:flex;gap:11px;padding:15px 18px 6px;}
  .stat{flex:1;background:var(--icon-bg);border-radius:13px;padding:12px;text-align:center;}
  .stat .s-n{font-family:var(--serif);font-weight:700;font-size:1.3rem;color:var(--accent);}
  .stat .s-l{font-size:.74rem;color:var(--ink-soft);margin-top:2px;}
  .block{padding:8px 18px 0;}
  .block:last-child{padding-bottom:18px;}
  .b-h{font-weight:400;font-size:.8rem;color:var(--ink-soft);margin:14px 0 7px;}
  .b-text{font-family:var(--serif);font-size:.92rem;line-height:1.85;white-space:pre-wrap;color:var(--ink);background:var(--bg);border-radius:13px;padding:14px 15px;}
  .b-text.empty{color:var(--ink-soft);}
  .b-note{background:var(--accent);color:#fff;}
  .empty-state{background:var(--surface);border:1px dashed var(--line);border-radius:var(--radius);padding:38px 24px;text-align:center;}
  .empty-state p{font-family:var(--serif);font-size:.92rem;color:var(--ink-soft);margin:0;line-height:1.8;}

  /* 리포트 상세(시험범위·총평·그래프·반성) */
  .x-sec{padding:0 18px;}
  .x-sec:last-child{padding-bottom:18px;}
  .x-sec-h{font-family:var(--serif);font-weight:700;font-size:.92rem;color:var(--accent);margin:18px 0 9px;}
  .scope-box{font-family:var(--serif);font-size:.9rem;line-height:1.85;color:var(--ink);background:var(--bg);border-radius:13px;padding:13px 15px;white-space:pre-wrap;}
  .review-box{font-family:var(--serif);font-size:.9rem;line-height:1.9;color:var(--ink);background:var(--bg);border-radius:13px;padding:13px 15px;}
  .review-box p{margin:0 0 11px;} .review-box p:last-child{margin:0;}
  .charts{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;}
  .chart-col{background:var(--bg);border-radius:13px;padding:11px 6px 9px;}
  .chart-title{font-size:.72rem;color:var(--ink);text-align:center;margin:0 0 8px;font-weight:700;font-family:var(--sans);}
  .chart-title .basis{display:block;font-size:.62rem;color:var(--ink-soft);font-weight:400;margin-top:1px;}
  .vchart{display:flex;align-items:flex-end;justify-content:center;gap:6px;height:120px;}
  .vbar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;flex:1;height:100%;}
  .vb-val{font-size:.56rem;color:var(--ink-soft);margin-bottom:4px;text-align:center;line-height:1.25;}
  .vb-val b{display:block;color:var(--accent);font-size:.7rem;}
  .vb-col{width:64%;max-width:24px;border-radius:5px 5px 0 0;min-height:3px;}
  .vb-label{font-size:.64rem;color:var(--ink-soft);margin-top:5px;}
  .wrong-item{background:var(--bg);border-radius:13px;padding:12px 14px;margin-bottom:9px;}
  .wrong-item:last-child{margin-bottom:0;}
  .wrong-item .wn{font-family:var(--serif);font-weight:700;font-size:.82rem;color:var(--accent);margin:0 0 4px;}
  .wrong-item .wt{font-size:.82rem;color:var(--ink-soft);margin:0 0 8px;line-height:1.55;}
  .wrong-item .wr{font-family:var(--serif);font-size:.88rem;color:var(--ink);line-height:1.75;background:var(--surface);border-radius:9px;padding:10px 12px;}
  .wrong-item .wr .empty{color:var(--ink-soft);}

  /* 비밀번호 모달 */
  .modal{position:fixed;inset:0;background:rgba(42,51,47,.45);display:none;align-items:center;justify-content:center;padding:24px;z-index:50;}
  .modal.show{display:flex;}
  .modal-card{background:var(--surface);border-radius:22px;padding:28px 24px 22px;width:100%;max-width:340px;box-shadow:0 16px 48px rgba(42,51,47,.22);text-align:center;}
  .mc-ic{width:52px;height:52px;border-radius:15px;background:var(--icon-bg);color:var(--accent);display:flex;align-items:center;justify-content:center;margin:0 auto;}
  .mc-ic svg{width:26px;height:26px;}
  .mc-t{font-family:var(--serif);font-weight:700;font-size:1.12rem;margin:14px 0 6px;color:var(--ink);}
  .mc-s{font-family:var(--serif);font-size:.86rem;color:var(--ink-soft);margin:0 0 18px;line-height:1.7;}
  .modal-card input{width:100%;border:1.5px solid var(--line);border-radius:13px;padding:14px;font-size:1.1rem;text-align:center;letter-spacing:.18em;font-family:var(--sans);color:var(--ink);background:#FBFCFB;-webkit-appearance:none;}
  .modal-card input:focus{outline:none;border-color:var(--accent);background:#fff;}
  .mc-err{color:#B4544A;font-size:.82rem;min-height:18px;margin:9px 0 0;}
  .mc-btns{display:flex;gap:10px;margin-top:14px;}
  .mc-btns button{flex:1;border:none;border-radius:13px;padding:14px;font-size:.95rem;font-weight:700;font-family:var(--sans);cursor:pointer;}
  .mc-cancel{background:var(--icon-bg);color:var(--ink-soft);}
  .mc-ok{background:var(--accent);color:#fff;}
  .mc-btns button:active{opacity:.85;}

  @media (max-width:380px){
    header{padding:46px 22px 24px;}
    .brand .script{font-size:2.9rem;}
    .grid{grid-template-columns:1fr;}
    .card{min-height:0;}
  }
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
</style>
</head>
<body>

<div id="loadBox"><div class="load-inner"><div class="spinner"></div><p>불러오는 중...</p></div></div>

<div id="errBox"><div class="err-inner">
  <p class="e-t" id="errTitle">불러올 수 없습니다</p>
  <p class="e-s" id="errMsg"></p>
</div></div>

<!-- 허브 -->
<div id="hubView" style="display:none;">
  <header>
    <div class="brand"><span class="script">Shueguk</span></div>
    <p class="tagline" id="s_name"></p>
    <p class="intro" id="s_meta"></p>
    <span class="badge" id="s_badge" style="display:none;"></span>
  </header>

  <main class="wrap">
    <h2 class="sec-h" id="infoSecH" style="display:none;">내 수업 정보</h2>
    <div class="info-card" id="infoCard" style="display:none;"></div>

    <h2 class="sec-h">메뉴</h2>
    <div class="grid" id="menu"></div>

    <footer>
      <p>이수경국어 Shueguk · 학생용</p>
    </footer>
  </main>
</div>

<!-- 성적 데이터 -->
<div id="gradeView"><main class="wrap">
  <div class="gv-bar">
    <button class="gv-back" onclick="closeGrades()" id="gvBack"></button>
    <span class="gv-ttl">성적 데이터 · 시험 복기</span>
  </div>
  <div class="exam-tabs" id="examTabs" style="display:none;"></div>
  <div id="examList"></div>
  <footer><p>이수경국어 Shueguk · 학생용</p></footer>
</main></div>

<!-- 비밀번호 모달 -->
<div class="modal" id="pwModal">
  <div class="modal-card">
    <div class="mc-ic" id="pwIcon"></div>
    <p class="mc-t">성적 데이터 잠금</p>
    <p class="mc-s">본인 확인을 위해<br><b>부모님 연락처 8자리</b>(010 제외)를 입력해주세요.</p>
    <input id="pwInput" type="tel" inputmode="numeric" maxlength="8" placeholder="● ● ● ● ● ● ● ●" autocomplete="off" />
    <p class="mc-err" id="pwErr"></p>
    <div class="mc-btns">
      <button class="mc-cancel" onclick="closePw()">취소</button>
      <button class="mc-ok" id="pwOk" onclick="submitPw()">확인</button>
    </div>
  </div>
</div>

<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzhCncBwn-JlqXARC3wfrWUCuNHzlNK2df0bdhx-w78Xr8mzYUcIYZOJdRi9N4bHtsb/exec";

/* 슈국 티쳐스 페이지와 동일한 라인 아이콘 세트 */
var ICON = {
  book:'<path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/>',
  pencil:'<path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4 12.5-12.5z"/>',
  pulse:'<path d="M22 12h-4l-3 8L9 4l-3 8H2"/>',
  paper:'<path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h6"/>',
  chart:'<line x1="6" y1="21" x2="6" y2="15"/><line x1="12" y1="21" x2="12" y2="9"/><line x1="18" y1="21" x2="18" y2="4"/>',
  lock:'<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>',
  arrow:'<path d="M5 12h14M13 6l6 6-6 6"/>',
  back:'<path d="M19 12H5M11 18l-6-6 6-6"/>'
};
function svg(inner){ return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">'+inner+'</svg>'; }

/* 나중에 연결할 기능들 — url을 채우면 자동 활성화(토큰 KEY가 ?key=로 붙음) */
var FEATURES = [
  { id:'voca',    icon:'book',   title:'어휘 테스트',   desc:'단어 시험 보기',       url:'' },
  { id:'clinic',  icon:'pulse',  title:'H-work 클리닉', desc:'숙제 클리닉 신청·확인', url:'' },
  { id:'mock',    icon:'paper',  title:'모의고사 신청', desc:'모의고사 응시 신청',    url:'' },
  { id:'grammar', icon:'pencil', title:'문법 테스트',   desc:'문법 시험 보기',       url:'' }
];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function show(id){ $(id).style.display='block'; }
function hide(id){ $(id).style.display='none'; }

var KEY = '';        // 접근코드(토큰) — 없으면 테스트용 id
var IS_ID = false;
var STATE = { info:null, authed:false, exams:null, examCount:0 };

function showError(title, msg){
  hide('loadBox'); hide('hubView'); $('gradeView').style.display='none';
  $('errTitle').textContent = title || '불러올 수 없습니다';
  $('errMsg').textContent = msg || '';
  show('errBox');
}

function api(extra){
  var q = (IS_ID ? '?student=' : '?key=') + encodeURIComponent(KEY) + (extra||'');
  return fetch(ENDPOINT + q).then(function(r){ return r.json(); });
}

function schedTable(title, rows){
  var trs = rows.filter(function(r){ return r[1] && String(r[1]).trim()!==''; });
  if(!trs.length) return '';
  return '<div class="sched"><p class="sched-h">'+esc(title)+'</p>' +
    '<table class="sched-tb"><tr><th>구분</th><th>시간</th></tr>' +
    trs.map(function(r){ return '<tr><td>'+esc(r[0])+'</td><td><span class="time">'+esc(r[1])+'</span></td></tr>'; }).join('') +
    '</table></div>';
}

/* ---- 허브 렌더 ---- */
function renderHub(){
  var info = STATE.info;
  $('s_name').textContent = (info.name || '학생') + ' 학생 페이지';
  var mp = []; if(info.school) mp.push(info.school); if(info.grade) mp.push(info.grade);
  $('s_meta').textContent = mp.join(' · ');
  document.title = (info.name||'학생') + ' · 슈국';
  if(info.enrolled){ var b=$('s_badge'); b.textContent=info.enrolled; b.style.display='inline-block'; }

  // 내 수업 정보 (담당 교사 + 정규/내신 시간표 가로 배치)
  var teacherRow = (info.teacher && String(info.teacher).trim()!=='')
    ? '<div class="info-teacher"><span class="k">담당 교사</span><span class="v">'+esc(info.teacher)+'</span></div>' : '';
  var reg = schedTable('정규 기간 시간표', [['가 수업', info.classA], ['나 수업', info.classB]]);
  var nae = schedTable('내신 기간 시간표', [['진도 수업', info.progress], ['확인 수업', info.checkup]]);
  if(teacherRow || reg || nae){
    $('infoCard').innerHTML = teacherRow + ((reg||nae) ? '<div class="sched-grid">'+reg+nae+'</div>' : '');
    $('infoCard').style.display='block'; $('infoSecH').style.display='block';
  }

  // 메뉴
  var html = '';
  FEATURES.forEach(function(f){
    var ic = '<span class="icon">'+svg(ICON[f.icon]||ICON.book)+'</span>';
    var body = ic + '<h3>'+esc(f.title)+'</h3><p class="desc">'+esc(f.desc)+'</p>';
    var ready = f.url && f.url.indexOf('http')===0;
    if(ready){
      var href = f.url + (f.url.indexOf('?')>=0?'&':'?') + 'key=' + encodeURIComponent(KEY);
      html += '<a class="card" href="'+esc(href)+'">'+body+'<span class="go">열기 '+svg(ICON.arrow)+'</span></a>';
    } else {
      html += '<div class="card pending">'+body+'<span class="tag">준비 중</span></div>';
    }
  });
  // 성적 데이터 (잠금)
  var cntTxt = STATE.examCount>0 ? ('시험 복기 '+STATE.examCount+'건') : '시험 복기 리포트';
  html += '<button class="card lock" onclick="openGrades()">' +
            '<span class="icon">'+svg(ICON.chart)+'</span>' +
            '<h3>성적 데이터</h3><p class="desc">'+esc(cntTxt)+'</p>' +
            '<span class="go">'+svg(ICON.lock)+' 비밀번호 필요</span></button>';
  $('menu').innerHTML = html;

  hide('loadBox'); hide('errBox'); $('gradeView').style.display='none'; show('hubView');
}

/* ---- 성적 ---- */
function openGrades(){ if(STATE.authed && STATE.exams){ renderGrades(); return; } openPw(); }
function closeGrades(){ $('gradeView').style.display='none'; show('hubView'); window.scrollTo(0,0); }

/* 그래프 집계 (강사 페이지와 동일 기준) */
var AREA_ORDER=['문학','독서','화법','작문','문법'];
var LV_ORDER=['중','중상','상','최상'];
var LV_COLOR={'중':'#E5EDE8','중상':'#C7DAD0','상':'#9DBDB0','최상':'#3A6B5E'};
function countBy(arr,key,order){
  var m={}; arr.forEach(function(q){ var v=String(q[key]||'').trim()||'기타'; m[v]=(m[v]||0)+1; });
  return Object.keys(m).sort(function(a,b){ var ia=order.indexOf(a),ib=order.indexOf(b); return (ia<0?999:ia)-(ib<0?999:ib); })
    .map(function(k){ return {key:k,count:m[k]}; });
}
function barsHtml(entries,total,colorFn){
  var max=entries.reduce(function(a,e){return Math.max(a,e.count);},0)||1;
  return '<div class="vchart">'+entries.map(function(e){
    var h=Math.max(Math.round(e.count/max*96),3);
    var color=colorFn?colorFn(e.key):'#9DBDB0';
    var pctv=total?Math.round(e.count/total*100):0;
    return '<div class="vbar"><span class="vb-val"><b>'+pctv+'%</b>'+e.count+'문항</span>'+
      '<span class="vb-col" style="height:'+h+'px;background:'+color+';"></span>'+
      '<span class="vb-label">'+esc(e.key)+'</span></div>';
  }).join('')+'</div>';
}
function chartCol(title,basis,inner){ return '<div class="chart-col"><p class="chart-title">'+esc(title)+'<span class="basis">'+esc(basis)+'</span></p>'+inner+'</div>'; }
function wrongByArea(questions, wrongText){
  var qmap={}; questions.forEach(function(q){ qmap[String(q.no).trim()]=q; });
  var blocks=String(wrongText||'').split(/\n\s*\n/).map(function(b){return b.trim();}).filter(Boolean);
  var list=[];
  blocks.forEach(function(bk){
    var area='';
    var m=bk.match(/^\[\s*([^·\]\s]+)\s*번/);
    var q=m?qmap[m[1].trim()]:null;
    if(q&&q.area){ area=q.area; }
    else { var inside=(bk.match(/^\[([^\]]*)\]/)||[])[1]||''; var segs=inside.split(' · '); if(segs[1]) area=segs[1].split('·')[0].trim(); }
    if(area) list.push({area:area});
  });
  return list;
}
function wrongItemsHtml(wrongText){
  var blocks=String(wrongText||'').split(/\n\s*\n/).map(function(b){return b.trim();}).filter(Boolean);
  if(!blocks.length){ return '<div class="b-text empty">표시한 틀린 문항이 없습니다.</div>'; }
  return blocks.map(function(b){
    var parts=b.split(/\n\s*→\s*/);
    var head=parts[0]||'', reason=parts[1]||'';
    var hm=head.match(/^\[([^\]]+)\]\s*(.*)$/);
    var label=hm?hm[1]:'', qtxt=hm?hm[2]:head;
    return '<div class="wrong-item">'+(label?'<p class="wn">'+esc(label)+'</p>':'')+
      '<p class="wt">'+esc(qtxt)+'</p>'+
      '<div class="wr">'+(reason?esc(reason):'<span class="empty">반성 미작성</span>')+'</div></div>';
  }).join('');
}
function sec(title, inner){ return '<div class="x-sec"><p class="x-sec-h">'+esc(title)+'</p>'+inner+'</div>'; }
function boxText(t){ var has=t&&String(t).trim()!==''; return '<div class="b-text'+(has?'':' empty')+'">'+(has?esc(t):'작성하지 않음')+'</div>'; }

function examCardHtml(x){
  var html = '<div class="exam">';
  var sub=[];
  if(x.school||x.grade) sub.push(((x.school||'')+' '+(x.grade||'')).trim());
  if(x.submittedAt) sub.push(x.submittedAt+' 제출');
  html += '<div class="x-head"><p class="x-title">'+esc(x.title||'시험')+'</p>'+
          (sub.length?'<p class="x-date">'+esc(sub.join(' · '))+'</p>':'')+'</div>';
  html += '<div class="x-stats">'+
    '<div class="stat"><div class="s-n">'+(x.score!==''?esc(x.score):'–')+'</div><div class="s-l">예상 점수</div></div>'+
    '<div class="stat"><div class="s-n">'+esc(x.wrongCount||0)+'</div><div class="s-l">틀린 문항</div></div></div>';

  if(x.scope && String(x.scope).trim()){ html += sec('시험 범위', '<div class="scope-box">'+esc(x.scope)+'</div>'); }
  if(x.review && x.review.length){ html += sec('시험 총평', '<div class="review-box">'+x.review.map(function(p){return '<p>'+esc(p)+'</p>';}).join('')+'</div>'); }

  if(x.questions && x.questions.length){
    var total=x.questions.length;
    var wl=wrongByArea(x.questions, x.wrongText);
    var charts='<div class="charts">'+
      chartCol('과목 비율','시험 전체', barsHtml(countBy(x.questions,'area',AREA_ORDER), total, null))+
      chartCol('난도 비율','시험 전체', barsHtml(countBy(x.questions,'lv',LV_ORDER), total, function(k){return LV_COLOR[k]||'#9DBDB0';}))+
      (wl.length? chartCol('틀린 문항','이 학생', barsHtml(countBy(wl,'area',AREA_ORDER), wl.length, null)) : '')+
      '</div>';
    html += sec('문항 분석', charts);
  }

  html += sec('틀린 문항 · 반성', wrongItemsHtml(x.wrongText));
  html += sec('다음 시험을 위한 다짐', boxText(x.vow));
  if(x.teacherNote && String(x.teacherNote).trim()!==''){ html += sec('선생님의 한 마디', '<div class="b-text b-note">'+esc(x.teacherNote)+'</div>'); }

  html += '</div>';
  return html;
}

var GRADE_SEL = 0;   // 선택한 시험 인덱스

function renderGrades(){
  var exams = STATE.exams || [];
  var tabs = $('examTabs'), list = $('examList');
  if(exams.length===0){
    tabs.style.display='none';
    list.innerHTML = '<div class="empty-state"><p>아직 제출된 시험 복기가 없습니다.<br>복기 입력을 제출하면 이곳에 기록이 쌓입니다.</p></div>';
  } else {
    if(GRADE_SEL >= exams.length) GRADE_SEL = 0;
    if(exams.length > 1){
      tabs.style.display='flex';
      tabs.innerHTML = exams.map(function(x,i){
        return '<button class="exam-tab'+(i===GRADE_SEL?' active':'')+'" onclick="pickExam('+i+')">'+esc(x.title||('시험 '+(i+1)))+'</button>';
      }).join('');
    } else {
      tabs.style.display='none';
    }
    list.innerHTML = examCardHtml(exams[GRADE_SEL]);
  }
  hide('hubView'); $('gradeView').style.display='block'; window.scrollTo(0,0);
}

function pickExam(i){
  var exams = STATE.exams || [];
  GRADE_SEL = i;
  var tabs = $('examTabs').children;
  for(var k=0;k<tabs.length;k++){ tabs[k].className = 'exam-tab' + (k===i?' active':''); }
  $('examList').innerHTML = examCardHtml(exams[i]);
  window.scrollTo(0,0);
}

/* ---- 비밀번호 모달 ---- */
function openPw(){ $('pwErr').textContent=''; $('pwInput').value=''; $('pwModal').classList.add('show'); setTimeout(function(){ $('pwInput').focus(); },50); }
function closePw(){ $('pwModal').classList.remove('show'); }
function submitPw(){
  var pw = $('pwInput').value.replace(/\D/g,'');
  if(!/^\d{8}$/.test(pw)){ $('pwErr').textContent='8자리 숫자를 입력해주세요.'; return; }
  var btn=$('pwOk'); btn.disabled=true; btn.textContent='확인 중...'; $('pwErr').textContent='';
  api('&pw='+encodeURIComponent(pw))
    .then(function(d){
      btn.disabled=false; btn.textContent='확인';
      if(d.result!=='success'){ $('pwErr').textContent=d.message||'오류가 발생했습니다.'; return; }
      if(!d.authed){ $('pwErr').textContent='비밀번호가 일치하지 않습니다.'; return; }
      STATE.authed=true; STATE.exams=d.exams||[];
      closePw(); renderGrades();
    })
    .catch(function(){ btn.disabled=false; btn.textContent='확인'; $('pwErr').textContent='연결 실패 — 다시 시도해주세요.'; });
}

/* ---- 시작 ---- */
function boot(){
  $('gvBack').innerHTML = svg(ICON.back) + ' 메뉴';
  $('pwIcon').innerHTML = svg(ICON.lock);
  $('pwInput').addEventListener('keydown', function(e){ if(e.key==='Enter') submitPw(); });

  show('loadBox');
  if(ENDPOINT.indexOf('http')!==0){ showError('설정 오류','전송 주소(ENDPOINT)가 설정되지 않았습니다.'); return; }
  var qs = new URLSearchParams(location.search);
  var key = (qs.get('key')||'').trim();
  var id  = (qs.get('id')||qs.get('student')||'').trim();
  if(key){ KEY=key; IS_ID=false; }
  else if(id){ KEY=id; IS_ID=true; }
  else { showError('잘못된 접근','개인 링크로 접속해주세요. 링크를 분실하셨다면 선생님께 문의해주세요.'); return; }

  api('')
    .then(function(d){
      if(d.result!=='success'){ showError('열 수 없습니다', d.message||''); return; }
      STATE.info=d.info; STATE.authed=!!d.authed; STATE.examCount=d.examCount||0;
      if(d.exams){ STATE.exams=d.exams; }
      renderHub();
    })
    .catch(function(){ showError('연결 실패','인터넷 상태를 확인한 뒤 새로고침해 주세요.'); });
}
boot();
</script>
