<style>
  :root{
    --bg:#E4EFEA; --surface:#FFFFFF; --ink:#2A332F; --ink-soft:#65726B;
    --accent:#3A6B5E; --line:#D7E3DD; --line-soft:#E5EDE8; --radius:18px;
    --bad:#c0463e; --ok:#1b8a3a;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--bg); color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,BlinkMacSystemFont,system-ui,sans-serif;
    font-size:16px; line-height:1.7; -webkit-font-smoothing:antialiased; padding:0 0 80px;
  }
  .wrap{max-width:600px;margin:0 auto;padding:0 20px;}

  .back{display:inline-flex;align-items:center;gap:6px;margin:24px 0 0;color:var(--ink-soft);text-decoration:none;font-size:14px;}
  .back svg{width:16px;height:16px;}
  .back:hover{color:var(--accent);}

  header{padding:16px 4px 22px;text-align:center;}
  .tagline{font-family:"Gowun Batang",serif;font-size:1.5rem;font-weight:700;color:var(--accent);margin:0;}
  .intro{color:var(--ink-soft);font-size:.92rem;margin:9px auto 0;max-width:27em;}

  .card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);padding:22px 20px;margin-bottom:16px;}
  .card h2{font-family:"Gowun Batang",serif;font-size:1.12rem;font-weight:700;margin:0 0 4px;display:flex;align-items:center;gap:8px;}
  .card h2 .dot{width:8px;height:8px;border-radius:50%;background:var(--accent);display:inline-block;}
  .card .sub{color:var(--ink-soft);font-size:.84rem;margin:0 0 16px;}

  .mgr-bar{display:flex;gap:8px;align-items:center;margin-bottom:10px;}
  .mgr-bar .reload{margin-left:auto;}
  .refresh{border:1.5px solid var(--line);background:#fff;color:var(--accent);font:inherit;font-size:13px;font-weight:700;padding:8px 14px;border-radius:9px;cursor:pointer;}
  .refresh:hover{border-color:var(--accent);}

  .a-item{border:1px solid var(--line-soft);border-radius:12px;padding:14px 15px;margin-bottom:11px;background:#fcfdfc;}
  .a-title{font-weight:700;font-size:15px;margin:0 0 3px;line-height:1.4;}
  .a-id{font-size:11px;color:#9aa6a0;margin:0 0 7px;word-break:break-all;}
  .a-assign{display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
  .a-tag{font-size:11.5px;font-weight:700;padding:2px 10px;border-radius:20px;background:#E1EDE7;color:var(--accent);}
  .a-tag.none{background:#f0e7dd;color:#9a6b3e;}
  .a-tag.t전체{background:#dceae3;} .a-tag.t학년{background:#e3eadd;color:#5d7a4e;}
  .a-tag.t개인{background:#e8e3f0;color:#7a6e9a;} .a-tag.t일부{background:#f0e7dd;color:#9a7a4e;}
  .a-target{font-size:12.5px;color:var(--ink-soft);flex:1;min-width:0;}
  .a-actions{display:flex;gap:8px;margin-top:11px;flex-wrap:wrap;align-items:center;}
  /* 지필 리포트 포인트 = 연핑크 (2026-08-22) */
  .a-edit{border:1.5px solid #F0CFC7;background:#F0CFC7;color:#8E5147;font:inherit;font-size:13px;font-weight:700;padding:9px 16px;border-radius:9px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:6px;}
  .a-edit:hover{opacity:.9;}
  .a-edit svg{width:14px;height:14px;}
  .a-clear{border:none;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--ink-soft);cursor:pointer;padding:8px 6px;text-decoration:underline;}
  .a-clear:hover{color:var(--bad);}
  .a-del{border:none;background:none;font:inherit;font-size:12.5px;font-weight:700;color:var(--bad);cursor:pointer;padding:8px 6px;text-decoration:underline;margin-left:auto;}
  .a-del:hover{opacity:.8;}
  /* 복기 안내 알림톡 (2026-10-02) — 연보라 */
  .a-alim{border:none;background:#EDE4F4;color:#5A4A6A;font:inherit;font-size:13px;font-weight:700;padding:9px 14px;border-radius:9px;cursor:pointer;}
  .a-alim:hover{background:#E3D7EE;}
  .a-alim{margin-left:auto;} .a-alim + .a-del{margin-left:0;}   /* 원장님이 표시한 자리 — [리포트 삭제] 바로 왼쪽 */
  .al-bg{position:fixed;inset:0;background:rgba(40,50,45,.35);z-index:90;display:none;align-items:flex-start;justify-content:center;padding:28px 14px;overflow:auto;}
  .al-bg.on{display:flex;}
  .al-box{background:#fff;border-radius:16px;max-width:520px;width:100%;padding:20px 20px 18px;}
  .al-box h3{font-family:"Gowun Batang",serif;font-size:17px;margin:0 0 4px;color:var(--ink);}
  .al-box .al-sub{font-size:12.5px;color:var(--ink-soft);margin:0 0 14px;}
  .al-row{margin:0 0 12px;font-size:13.5px;}
  .al-row > b{display:block;font-size:12.5px;color:var(--ink-soft);margin-bottom:5px;}
  .al-row input[type=text]{width:100%;box-sizing:border-box;padding:10px 11px;border:1.5px solid var(--line);border-radius:9px;font:inherit;font-size:14px;}
  .al-whos label{margin-right:12px;white-space:nowrap;}
  .al-skip{background:#FBF6E6;border-radius:10px;padding:10px 12px;}
  .al-skip > b{color:#7A6230 !important;font-size:13px !important;}
  .al-skipq{font-size:13.5px;color:var(--ink);margin-bottom:4px;}
  .al-skipn{font-size:12.5px;color:var(--ink-soft);margin-bottom:6px;line-height:1.6;}
  .al-kinds{display:flex;gap:8px;flex-wrap:wrap;}
  .al-kind{flex:1 1 160px;border:none;background:#F2F5F3;color:var(--ink-soft);border-radius:10px;padding:9px 12px;font:inherit;text-align:left;cursor:pointer;}
  .al-kind span{display:block;font-size:13.5px;font-weight:700;}
  .al-kind small{display:block;font-size:12px;margin-top:2px;}
  .al-kind.on{background:#EDE4F4;color:#5A4A6A;}
  .al-tnote{font-size:12px;color:var(--ink-soft);margin-top:6px;}
  .al-skip label{margin-right:14px;font-size:13.5px;white-space:nowrap;cursor:pointer;}
  .al-sum{background:#F4F7F5;border-radius:10px;padding:10px 12px;font-size:13.5px;line-height:1.6;}
  .al-warn{color:#9A5A52;font-size:12.5px;margin-top:6px;line-height:1.6;}
  .al-prev{white-space:pre-wrap;background:#FBFAF6;border-radius:10px;padding:12px;font-size:13px;line-height:1.65;}
  .al-prev .al-pbtn{margin-top:8px;text-align:center;background:#F2F5F3;border-radius:8px;padding:7px;font-size:12.5px;color:#4F5C56;}
  .al-btns{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;}
  .al-btns button{font:inherit;font-size:14px;font-weight:700;border:none;border-radius:10px;padding:10px 16px;cursor:pointer;background:#F2F5F3;color:#4F5C56;}
  .al-btns .go{background:#EDE4F4;color:#5A4A6A;}
  .al-btns button:disabled{opacity:.45;cursor:default;}
  .al-res{margin-top:10px;font-size:13px;}
  .al-res.ok{color:#3F6159;} .al-res.err{color:#9A5A52;}
  .mgr-empty{text-align:center;color:#9aa6a0;font-size:13.5px;padding:24px;}

  /* 잠금 */
  .lock{position:fixed;inset:0;background:var(--bg);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px;}
  .lock-card{background:#fff;border:1px solid var(--line-soft);border-radius:18px;padding:34px 28px;text-align:center;max-width:330px;width:100%;}
  .lock-card .t{font-family:"Gowun Batang",serif;font-weight:700;font-size:20px;color:var(--accent);}
  .lock-card .d{font-size:13px;color:var(--ink-soft);margin:10px 0 18px;}
  .lock-card input{width:100%;padding:13px;border:1.5px solid var(--line);border-radius:10px;font:inherit;font-size:16px;text-align:center;}
  .lock-card input:focus{outline:none;border-color:var(--accent);}
  .lock-card button{width:100%;margin-top:11px;padding:13px;border:none;border-radius:11px;background:#F0CFC7;color:#8E5147;font-family:"Gowun Batang",serif;font-weight:700;font-size:16px;cursor:pointer;}
  .lock-err{color:var(--bad);font-size:12.5px;min-height:1.1em;margin-top:10px;}
  body.locked{overflow:hidden;}
  body:not(.locked) .lock{display:none;}
  @media (prefers-reduced-motion:reduce){*{transition:none !important;}}
  .tip{text-align:center; font-size:12px; color:#65726B; background:#EBF0ED;
    border:1px solid #E5EDE8; border-radius:10px; padding:7px 12px; margin:22px auto 8px; max-width:560px; line-height:1.55;}
  .tip b{color:#4C6E66;}
</style>

<script>
/* ══ 교사 페이지 조용한 인증 (2026-08-25, 3단계) ═══════════════════════
 * 이 아래 연결부들이 수파베이스에 보내는 요청에 '교사 신분'을 붙인다.
 * 화면에 로그인 창은 없다 — 페이지가 열릴 때 알아서 받아 온다.
 *
 * 왜 필요한가:
 *   공개 키(sb_publishable_…)는 학생이 여는 페이지에도 들어 있어서, 그 키로 표를
 *   직접 읽을 수 있으면 전교생 명단(학생ID=비밀번호·접근코드)이 새어 나간다.
 *   그래서 공개 키에서는 표 접근을 없애고(anon), 표는 이 신분(authenticated)만
 *   읽고 쓰도록 나눴다. 학생 화면은 표 대신 함수(student_bundle 등)를 쓴다.
 *
 * 주의:
 *   · 이 조각은 **교사용 페이지에만** 넣는다. 학생이 여는 페이지(s·r·클리닉 신청·
 *     모의고사 신청·H WORK 제출)에는 절대 넣지 말 것 — 넣는 순간 위 보호가 무의미해진다.
 *   · 아래 연결부들이 시작할 때 window.fetch 를 붙잡아 두므로, 이 조각은 **그것들보다
 *     먼저** 실행돼야 한다. 페이지의 첫 스크립트 자리를 지킬 것.
 *   · 인증이 실패하면 예전처럼 공개 키로 보낸다(권한을 회수하기 전까지는 그래도 동작). */
(function(){
  var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var T_ID = 'teachers@shueguk.internal';
  var T_PW = 'shg_FCePWvnawH44SV8kYB9BHRKi6aag';
  var tok = null, until = 0, pending = null;
  var raw = window.fetch.bind(window);
  var TOK_LS = 'sb_teacher_tok_v1';   // 받아 둔 신분증은 브라우저에 남겨 다음 페이지에서 다시 받지 않는다(1시간짜리)

  function cachedTok(){
    try {
      var c = JSON.parse(localStorage.getItem(TOK_LS) || 'null');
      if (c && c.t && c.u > Date.now()){ tok = c.t; until = c.u; return true; }
    } catch(e){}
    return false;
  }
  function auth(){
    if (tok && Date.now() < until) return Promise.resolve(tok);
    if (cachedTok()) return Promise.resolve(tok);
    if (pending) return pending;
    var req = raw(SB_URL + '/auth/v1/token?grant_type=password', {
      method: 'POST',
      headers: { 'apikey': SB_KEY, 'Content-Type': 'application/json' },
      body: JSON.stringify({ email: T_ID, password: T_PW })
    }).then(function(r){ return r.json(); }).then(function(d){
      if (!d || !d.access_token) throw new Error('teacher auth');
      tok = d.access_token;
      until = Date.now() + Math.max(60, (d.expires_in || 3600) - 300) * 1000;   // 만료 5분 전에 다시 받는다
      try { localStorage.setItem(TOK_LS, JSON.stringify({ t: tok, u: until })); } catch(e){}
      return tok;
    });
    /* 로그인이 멈춰 있으면 이 아래 모든 조회가 함께 멈춘다 — 10초를 넘기면 실패로 보고
     * 그 조회는 예전 방식(공개 키)으로 내보낸다. 다음 호출 때 다시 받는다. */
    var late = new Promise(function(_, rej){ setTimeout(function(){ rej(new Error('teacher auth timeout')); }, 10000); });
    pending = Promise.race([req, late]).then(function(t){ pending = null; return t; },
                                            function(e){ pending = null; throw e; });
    return pending;
  }
  function withAuth(url, opts, t){
    var src = (opts && opts.headers) || {}, h = {};
    if (src.forEach && !src.hasOwnProperty) src.forEach(function(v, k){ h[k] = v; });
    else for (var k in src) h[k] = src[k];
    h['apikey'] = SB_KEY;
    h['Authorization'] = 'Bearer ' + t;
    var o = {}; for (var k2 in (opts || {})) o[k2] = opts[k2];
    o.headers = h;
    return o;
  }
  window.fetch = function(url, opts){
    var u = (typeof url === 'string') ? url : ((url && url.url) || '');
    if (u.indexOf(SB_URL + '/rest/v1') !== 0) return raw(url, opts);
    return auth().then(function(t){
      return raw(url, withAuth(url, opts, t)).then(function(r){
        if (r.status !== 401) return r;
        tok = null; until = 0;                       // 만료가 겹쳤으면 한 번만 다시 받아 재시도
        try { localStorage.removeItem(TOK_LS); } catch(e){}
        return auth().then(function(t2){ return raw(url, withAuth(url, opts, t2)); });
      });
    }, function(){ return raw(url, opts); });
  };
})();
</script>
<script>
/* ══ 수파베이스 연결부 (2026-08-22 DB 이전 3단계 — 지필 리포트·성적) ═══════
 * m.html(시험 등록)·t.html(제출 결과)·r.html(학생 리포트)·analyses.html·stats.html 공용.
 *  · 읽기: 시험 목록(?list)·시험 정의(?id)·제출 결과(?results)·시간표·내신기록 → 수파베이스
 *    (제출 결과의 학생 매칭은 students 미러 사용 — 학생정보 시트가 원본)
 *  · 학생 제출·시험 등록/삭제: 기존 백엔드 먼저(학생 페이지·별 집계가 시트를 읽음) + 수파베이스 미러
 *  · 선생님 한마디: 수파베이스 id 기반 저장 + 시트에 같은 행을 찾아 최선 미러
 *  · 분석지 배정(배정 탭)·roster·학생 페이지(getStudent)는 기존 백엔드 그대로
 * 수파베이스 실패 시 자동으로 기존 백엔드 폴백. */
(function(){
  if (window.__sbAdapter) return; window.__sbAdapter = true;
  var SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var LEGACY_SIG = 'script.google.com/macros/s/AKfycbzhCncBwn-';   // 리포트 백엔드 exec 주소
  var rawFetch = window.fetch.bind(window);
  var PAGE = 1000;

  function hdr(extra){
    var h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  function sbGet(path, _from, _acc){
    var from = _from || 0, acc = _acc || [];
    return rawFetch(SB + path, { headers: hdr({ 'Range-Unit': 'items', 'Range': from + '-' + (from + PAGE - 1) }) })
      .then(function(r){ if (!r.ok) throw new Error('sb ' + r.status); return r.json(); })
      .then(function(rows){
        acc = acc.concat(rows);
        return rows.length < PAGE ? acc : sbGet(path, from + PAGE, acc);
      });
  }
  function sbWrite(method, path, body, extra){
    return rawFetch(SB + path, { method: method, headers: hdr(extra), body: body == null ? undefined : JSON.stringify(body) })
      .then(function(r){
        if (!r.ok) return r.text().then(function(t){ throw new Error('sb ' + r.status + ' ' + t.slice(0,120)); });
        return (extra && /representation/.test(extra['Prefer'] || '')) ? r.json() : null;
      });
  }
  function q(v){ return encodeURIComponent(String(v == null ? '' : v)); }
  function pad2(n){ return String(n).padStart(2, '0'); }
  function nowIso(){
    var d = new Date();
    return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()) + 'T' +
           pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + '+09:00';
  }
  function fmtAt(iso){
    // 한국 시간(+9) 고정 표기 — 기기 시간대와 무관하게 기존 백엔드(GMT+9)와 동일
    if (!iso) return '';
    var t = Date.parse(iso);
    if (isNaN(t)) return String(iso);
    var d = new Date(t + 9 * 3600000);
    return d.getUTCFullYear() + '-' + pad2(d.getUTCMonth()+1) + '-' + pad2(d.getUTCDate()) + ' ' +
           pad2(d.getUTCHours()) + ':' + pad2(d.getUTCMinutes());
  }
  function ok(o){ o.result = 'success'; return o; }
  /* 가짜 응답 — 페이지가 r.json()으로 읽는 곳과 r.text()로 읽는 곳이 섞여 있어 둘 다 준다.
   * 2026-08-25: json()만 있던 탓에 text()로 읽는 화면(복기 제출·시험 등록)에서 저장이
   * 실제로 성공해도 예외가 나 '전송 실패'가 뜨는 상태였다. 아직 겪은 사람은 없었지만
   * (어댑터 도입 8/22 이후 그 두 경로를 쓴 사람이 없었다) 2학기 시험 때 터질 자리였다. */
  function fake(d){
    var body = JSON.stringify(d);
    return { ok: true, status: 200,
             json: function(){ return Promise.resolve(d); },
             text: function(){ return Promise.resolve(body); } };
  }
  function legacyPost(url, body){
    return rawFetch(url, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
      .then(function(r){ return r.json(); });
  }

  /* ── 읽기 ── */
  function loadExam(rid){
    return Promise.all([
      sbGet('/exams?report_id=eq.' + q(rid)),
      sbGet('/exam_questions?report_id=eq.' + q(rid) + '&order=seq')
    ]).then(function(rs){
      var e = rs[0][0];
      if (!e) return { result:'error', message: "'" + rid + "' 보고서를 찾을 수 없습니다." };
      return ok({ title: e.title, scope: e.scope,
        review: String(e.review || '').split(/\n\s*\n/).map(function(s){ return s.trim(); }).filter(Boolean),
        questions: rs[1].map(function(x){
          return { no: x.no, area: x.area, type: x.qtype, lv: x.lv, txt: x.txt,
                   detail: x.detail, group: x.grp, multi: !!x.multi };
        }) });
    });
  }
  function baseName(s){ return String(s == null ? '' : s).trim().replace(/[A-Za-z]$/, ''); }
  function basePick(cands, phone){
    if (!cands || !cands.length) return null;
    if (cands.length === 1) return cands[0];
    for (var i = 0; i < cands.length; i++){ if (phone && cands[i].id === phone) return cands[i]; }
    return null;
  }
  function loadResults(rid){
    var jobs = [
      sbGet('/submissions?order=id' + (rid && rid !== 'ALL' ? '' : '')),
      sbGet('/students?select=student_id,name,code&order=seq'),
      (rid && rid !== 'ALL') ? sbGet('/exams?report_id=eq.' + q(rid) + '&select=title') : Promise.resolve([])
    ];
    return Promise.all(jobs).then(function(rs){
      var matchTitle = rs[2][0] ? String(rs[2][0].title || '').trim() : '';
      // 학생 매칭(기존 백엔드 getResults와 동일 규칙): 번호+이름 → 이름 → 접미사 제거 → 번호(1명일 때)
      var byPhone = {}, byName = {}, byPhoneName = {}, phoneCount = {}, byBase = {};
      rs[1].forEach(function(s){
        var sId = String(s.student_id || '').trim(), sNm = String(s.name || '').trim();
        var code = String(s.code || '').trim();
        if (sId){
          phoneCount[sId] = (phoneCount[sId] || 0) + 1;
          byPhone[sId] = { code: code, id: sId };
          if (sNm) byPhoneName[sId + '|' + sNm] = { code: code, id: sId };
        }
        if (sNm && !byName[sNm]) byName[sNm] = { code: code, id: sId };
        var bn = baseName(sNm);
        if (bn && bn !== sNm){ (byBase[bn] = byBase[bn] || []).push({ code: code, id: sId }); }
      });
      var students = [];
      rs[0].forEach(function(row){
        var examVal = String(row.exam || '').trim();
        if (rid && rid !== 'ALL' && examVal !== rid && examVal !== matchTitle) return;
        var nm = String(row.name || '').trim();
        if (!nm) return;
        var phone = String(row.parent_phone || '').trim();
        var roster = (phone && byPhoneName[phone + '|' + nm]) || byName[nm] ||
                     basePick(byBase[nm], phone) ||
                     ((phone && phoneCount[phone] === 1) ? byPhone[phone] : null);
        students.push({
          rowIndex: row.id,
          submittedAt: fmtAt(row.submitted_at),
          title: row.exam, school: row.school, grade: row.grade, name: nm,
          wrongCount: Number(row.wrong_count) || 0,
          wrongText: row.wrong_text, vow: row.vow, teacherNote: row.teacher_note,
          score: row.score, parentPhone: phone,
          studentId: roster ? roster.id : phone,
          accessCode: roster ? roster.code : ''
        });
      });
      return ok({ students: students });
    });
  }
  var GETS = {
    timetableList: function(p){
      var book = (String(p.get('book') || '').trim() === '내신') ? '내신' : '정규';
      return sbGet('/tt_classes?book=eq.' + q(book) + '&order=id&select=class_id,day,start_time,end_time,location,teacher,name,roster')
        .then(function(rows){
          return ok({ classes: rows.map(function(r){
            return { id: r.class_id, day: r.day, start: r.start_time, end: r.end_time,
                     loc: r.location, teacher: r.teacher, cls: r.name,
                     students: String(r.roster || '').trim().split(/\s+/).filter(String) };
          }), onceMoves: [] });
        });
    },
    naeshinGet: function(p){
      var period = (p.get('period') || '').trim(), classId = (p.get('classId') || '').trim();
      var scopeKey = (p.get('scopeKey') || '').trim();
      if (!period || !classId) return Promise.resolve({ result:'error', message:'기간과 반이 필요합니다.' });
      var keys = 'in.(' + q('"' + classId + '"' + (scopeKey ? ',"' + scopeKey + '"' : '')) + ')';
      return sbGet('/naeshin_records?period=eq.' + q(period) + '&class_key=' + keys).then(function(rows){
        var scopeShared = null, scopeLegacy = null, weeks = {}, notes = {}, cleared = {}, hwdone = {};
        rows.forEach(function(r){
          if (r.kind === '범위'){
            var sv = { f: r.text1, g: r.text2 };
            if (scopeKey && r.class_key === scopeKey) scopeShared = sv;
            else if (r.class_key === classId) scopeLegacy = sv;
            return;
          }
          if (r.class_key !== classId) return;
          if (r.kind === '주차') weeks[r.week] = { prog: r.text1, hw: r.text2 };
          else if (r.kind === '학생'){
            (notes[r.week] = notes[r.week] || {})[r.student] = r.text1;
            var hj = String(r.text2 || '').trim();
            if (hj){ try { (hwdone[r.week] = hwdone[r.week] || {})[r.student] = JSON.parse(hj) || []; } catch (e) {} }
          }
          else if (r.kind === '클리어'){ try { cleared = JSON.parse(String(r.text1 || '{}')) || {}; } catch (e) {} }
        });
        var scope = scopeShared || scopeLegacy || '';
        var scopeText = '', scopeParts = null;
        if (scope){
          if (/^\s*\{/.test(scope.f)){ try { scopeParts = JSON.parse(scope.f); } catch (e) {} }
          scopeText = scope.g || (scopeParts ? '' : scope.f);
          if (!scopeText && scopeParts){
            scopeText = [['교과서', scopeParts.book], ['교과서 내 범위', scopeParts.inRange],
                         ['추가 자료', scopeParts.extra], ['교과서 외 범위', scopeParts.outRange]]
              .filter(function(x){ return x[1]; }).map(function(x){ return x[0] + ': ' + x[1]; }).join('\n');
          }
        }
        return ok({ period: period, classId: classId, scope: scopeText, scopeParts: scopeParts,
                    weeks: weeks, notes: notes, cleared: cleared, hwdone: hwdone });
      });
    }
  };

  /* ── 쓰기 미러 ── */
  function mirrorExam(b){
    var id = String(b.id || '').trim();
    var review = Array.isArray(b.review) ? b.review.join('\n\n') : String(b.review || '');
    return sbWrite('POST', '/exams?on_conflict=report_id',
      [{ report_id: id, title: String(b.title || ''), review: review, scope: String(b.scope || ''),
         school: String(b.school || ''), grade: String(b.grade || ''), at: nowIso() }],
      { 'Prefer': 'resolution=merge-duplicates,return=minimal' })
      .then(function(){ return sbWrite('DELETE', '/exam_questions?report_id=eq.' + q(id)); })
      .then(function(){
        var qs = (b.questions || []).map(function(x, i){
          return { report_id: id, seq: i + 1, no: String(x.no || ''), area: String(x.area || ''),
                   qtype: String(x.type || ''), lv: String(x.lv || ''), txt: String(x.txt || ''),
                   detail: String(x.detail || ''), grp: String(x.group || ''),
                   multi: (x.multi === true || x.multi === 'Y' || x.multi === 1) };
        });
        return qs.length ? sbWrite('POST', '/exam_questions', qs) : null;
      });
  }
  function mirrorNoteToSheet(url, b, row){
    // 시트 '제출결과'에서 같은 제출(시험·이름·제출일시)을 찾아 한마디를 함께 기록 (실패해도 무방)
    rawFetch(url.slice(0, url.indexOf('/exec') + 5) + '?results=' + q(row.exam) + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || d.result !== 'success') return;
        var at = fmtAt(row.submitted_at);
        var hit = (d.students || []).filter(function(s){
          return s.name === row.name && s.submittedAt === at;
        })[0];
        if (hit) legacyPost(url.slice(0, url.indexOf('/exec') + 5),
                            { action:'saveTeacherNote', rowIndex: hit.rowIndex, name: b.name, note: b.note })
                   .catch(function(){});
      })
      .catch(function(){});
  }
  var POSTS = {
    /* 시험 등록·삭제 — 수파베이스가 원본 (2026-08-26 전환, m.html과 동일 규칙):
     * exams·exam_questions에 먼저 쓰고 시트 사본은 뒤에서. 배정 미러는 이 페이지가
     * 배정 목록을 다시 읽을 때(sbResyncAssign) 함께 맞는다. */
    createReport: function(b, url){
      var id = String(b.id || '').trim();
      if (!id) return Promise.resolve({ result:'error', message:'시험 ID가 비어 있습니다.' });
      return mirrorExam(b).then(function(){
        legacyPost(url, b).catch(function(e){ console.warn('시트 사본 실패(시험 등록)', e); });
        return ok({ id: id, count: (b.questions || []).length });
      });
    },
    deleteReport: function(b, url){
      var id = String(b.id || '').trim();
      if (!id) return Promise.resolve({ result:'error', message:'시험 ID가 비어 있습니다.' });
      return sbWrite('DELETE', '/exams?report_id=eq.' + q(id))
        .then(function(){ return sbWrite('DELETE', '/exam_questions?report_id=eq.' + q(id)); })
        .then(function(){
          legacyPost(url, b).catch(function(e){ console.warn('시트 사본 실패(시험 삭제)', e); });
          return ok({});
        });
    },
    saveTeacherNote: function(b, url){
      var id = parseInt(b.rowIndex, 10) || 0;
      return sbWrite('PATCH', '/submissions?id=eq.' + id + '&name=eq.' + q(String(b.name || '').trim()),
                     { teacher_note: String(b.note || '') }, { 'Prefer': 'return=representation' })
        .then(function(rows){
          if (!rows || !rows.length) return { result:'error', message:'기록을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.' };
          mirrorNoteToSheet(url, b, rows[0]);
          return ok({});
        });
    },
    __submit: function(b, url){
      // 학생 제출 — 기존 백엔드 먼저(학생 페이지 성적·별 집계가 시트를 읽음), 성공 시 수파베이스 미러
      return legacyPost(url, b).then(function(res){
        if (!res || res.result !== 'success') return res;
        var rec = { submitted_at: nowIso(), exam: String(b.title || ''), school: String(b.school || ''),
                    grade: String(b.grade || ''), name: String(b.name || ''),
                    wrong_count: String(b.wrongCount == null ? 0 : b.wrongCount),
                    wrong_text: String(b.wrongText || ''), vow: String(b.vow || ''),
                    score: String(b.score || ''), parent_phone: String(b.parentPhone || '') };
        function put(){ return sbWrite('POST', '/submissions', rec); }
        put().catch(function(){ setTimeout(function(){ put().catch(function(e){ console.warn('제출 미러 실패', e); }); }, 3000); });
        return res;
      });
    }
  };

  window.fetch = function(url, opts){
    try {
      if (typeof url !== 'string' || url.indexOf(LEGACY_SIG) < 0) return rawFetch(url, opts);
      if (opts && String(opts.method || '').toUpperCase() === 'POST'){
        var body;
        try { body = JSON.parse(opts.body); } catch (e) { return rawFetch(url, opts); }
        var ph = body && body.action ? POSTS[body.action] : POSTS.__submit;
        if (!ph) return rawFetch(url, opts);
        return ph(body, url).then(fake, function(err){
          console.warn('수파베이스 쓰기 실패 — 기존 백엔드로 폴백', body.action || '제출', err);
          return rawFetch(url, opts);
        });
      }
      var qs = new URLSearchParams(url.slice(url.indexOf('?') + 1));
      var job = null;
      if (qs.get('action')){
        var gh = GETS[qs.get('action')];
        if (gh) job = gh(qs);
      }
      else if (qs.get('list')) job = sbGet('/exams?order=at,report_id&select=report_id,title,school,grade')
        .then(function(rows){
          return ok({ reports: rows.map(function(r){
            return { id: r.report_id, title: r.title, school: r.school, grade: r.grade };
          }) });
        });
      else if (qs.get('results')) job = loadResults(String(qs.get('results')).trim());
      else if (qs.get('id')) job = loadExam(String(qs.get('id')).trim());
      if (!job) return rawFetch(url, opts);
      return job.then(fake, function(err){
        console.warn('수파베이스 조회 실패 — 기존 백엔드로 폴백', err);
        return rawFetch(url, opts);
      });
    } catch (e) {
      return rawFetch(url, opts);
    }
  };
})();
</script>

<script>
  /* ===== 설정 ===== */
  var ENDPOINT  = "https://script.google.com/macros/s/AKfycbzhCncBwn-JlqXARC3wfrWUCuNHzlNK2df0bdhx-w78Xr8mzYUcIYZOJdRi9N4bHtsb/exec";
  var SERVER_PW = "sh";
  var PASS_ENC  = "c2g=";
  var LOCK_KEY  = "shueguk_teacher_unlocked";

  function esc(s){ return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

  /* ===== 잠금 ===== */
  (function(){ unlock(); })();   // 티쳐스 페이지 비밀번호 제거(접속 간소화, 2026-08-14)
  function unlock(){ document.body.classList.remove('locked'); init(); }
  function checkLock(){
    var v=document.getElementById('lockInput').value, ok=false;
    try{ ok=(btoa(v)===PASS_ENC); }catch(e){ ok=false; }
    if(ok){ try{ localStorage.setItem(LOCK_KEY,'1'); }catch(e){} unlock(); }
    else { document.getElementById('lockErr').textContent='비밀번호가 올바르지 않습니다.'; document.getElementById('lockInput').value=''; }
  }
  document.getElementById('lockInput').addEventListener('keydown', function(e){ if(e.key==='Enter') checkLock(); });

  /* ===== 초기화 ===== */
  var inited=false, REPORTS=[], ASSIGN={};
  function init(){ if(inited) return; inited=true; loadAll(); }

  /* 시험 기간 접두어 (26-1-중간 등) */
  function periodOf(title){ var m=String(title||'').match(/^(\d{2}-[12]-(?:중간|기말))/); return m?m[1]:''; }

  /* 배정 미러 재동기화 (2026-08-23 DB 이전) — assignList(tool 전체) 응답으로 그 도구의
   * 미러(assignments)를 통째 교체. 실패 무해(일일 점검이 복구). */
  function sbResyncAssign(tool, list){
    try {
      function ymdN(v){
        var s = String(v == null ? '' : v).trim();
        if (!s || /^\d{4}-\d{2}-\d{2}$/.test(s)) return s;
        var tm = Date.parse(s);
        if (isNaN(tm)) return s;
        var d = new Date(tm + 9 * 3600000);
        return d.getUTCFullYear()+'-'+pad2(d.getUTCMonth()+1)+'-'+pad2(d.getUTCDate());
      }
      var body = (list||[]).map(function(a){
        return { seq: a.rowIndex||0, date: ymdN(a.date), tool: String(a.tool||tool), item: String(a.item||''),
                 type: String(a.type||''), target: String(a.target||''), due: ymdN(a.due), memo: String(a.memo||'') };
      });
      sbWrite('DELETE', '/assignments?tool=eq.' + q(tool))
        .then(function(){ return body.length ? sbWrite('POST', '/assignments', body, { 'Prefer': 'return=minimal' }) : null; })
        .catch(function(e){ console.warn('배정 미러 재동기화 실패 — 일일 점검이 복구', e); });
    } catch (e) {}
  }

  /* 기본은 가장 최근 시험 기간 하나만 보여 준다(2026-09-23 원장님 요청 "26-2-중간 리스트만").
   * [지난 목록 보기]로 그 앞 기간과 '기간 없음'(접두어 없는 옛 시험)을 펼친다.
   * 기간이 하나뿐이면 버튼을 감춘다. 펼침 상태는 그 탭에서만 기억(sessionStorage). */
  var GROUPS={}, ORDER=[], SHOW_PAST=false;
  try { SHOW_PAST = sessionStorage.getItem('an_past')==='1'; } catch(e){}
  function togglePast(){
    SHOW_PAST=!SHOW_PAST;
    try { sessionStorage.setItem('an_past', SHOW_PAST?'1':'0'); } catch(e){}
    renderList();
  }
  function renderList(){
    var box=document.getElementById('list'), btn=document.getElementById('pastBtn');
    if(!ORDER.length){
      box.innerHTML='<div class="mgr-empty">등록된 리포트가 없어요.<br>먼저 \u2018지필고사 리포트 제작\u2019에서 만들어 주세요.</div>';
      if(btn) btn.hidden=true; return;
    }
    var cur=null;
    for(var i=0;i<ORDER.length;i++){ if(ORDER[i]!=='기간 없음'){ cur=ORDER[i]; break; } }
    if(cur===null) cur=ORDER[0];
    var shown = SHOW_PAST ? ORDER : [cur];
    box.innerHTML = shown.map(function(p){
      return '<h3 style="font-family:\'Gowun Batang\',serif;font-size:14.5px;color:#4C6E66;margin:16px 2px 8px;padding-bottom:5px;border-bottom:1.5px solid #D7E3DD;">'+esc(p)+' <span style="font-weight:400;color:#8B928C;font-size:12.5px;">'+GROUPS[p].length+'개</span></h3>'+
             GROUPS[p].map(renderItem).join('');
    }).join('');
    if(btn){
      var hidG=0, hidN=0;
      ORDER.forEach(function(p){ if(shown.indexOf(p)<0){ hidG++; hidN+=GROUPS[p].length; } });
      if(!SHOW_PAST && !hidG){ btn.hidden=true; }
      else { btn.hidden=false; btn.textContent = SHOW_PAST ? '지난 목록 숨기기' : '지난 목록 보기 ('+hidN+'개)'; }
    }
  }

  /* ===== 목록 로드: 리포트 목록 + 현재 배정 ===== */
  function loadAll(){
    var box=document.getElementById('list');
    box.innerHTML='<div class="mgr-empty">불러오는 중…</div>';
    Promise.all([
      fetch(ENDPOINT + '?list=1&t=' + Date.now()).then(function(r){ return r.json(); }),
      fetch(ENDPOINT + '?action=assignList&tool=' + encodeURIComponent('지필고사 분석지') + '&pw=' + encodeURIComponent(SERVER_PW) + '&t=' + Date.now()).then(function(r){ return r.json(); })
    ]).then(function(res){
      var lst=res[0], asg=res[1];
      if(!lst || lst.result!=='success'){ box.innerHTML='<div class="mgr-empty">리포트 목록을 불러오지 못했어요.</div>'; return; }
      REPORTS = lst.reports || [];
      ASSIGN = {};
      if(asg && asg.result==='success' && asg.assignments){
        asg.assignments.forEach(function(a){ if(a.item){ ASSIGN[a.item] = { type:a.type||'', target:a.target||'' }; } });
        sbResyncAssign('지필고사 분석지', asg.assignments);   // 배정 미러 재동기화 (s.html이 읽음)
      }
      if(!REPORTS.length){ box.innerHTML='<div class="mgr-empty">등록된 리포트가 없어요.<br>먼저 ‘지필고사 리포트 제작’에서 만들어 주세요.</div>'; return; }
      // 시험 기간(26-1-중간 등)별로 묶어 최근 기간부터 표시
      GROUPS={}; ORDER=[];
      REPORTS.forEach(function(rep){
        var p=periodOf(rep.title||rep.id)||'기간 없음';
        if(!GROUPS[p]){ GROUPS[p]=[]; ORDER.push(p); }
        GROUPS[p].push(rep);
      });
      ORDER.sort(function(a,b){
        if(a==='기간 없음') return 1;
        if(b==='기간 없음') return -1;
        return a<b?1:(a>b?-1:0);
      });
      renderList();
    }).catch(function(){ box.innerHTML='<div class="mgr-empty">불러오지 못했어요. 인터넷을 확인해 주세요.</div>'; });
  }

  // 동명이인 토큰 '이름|학교|학년' → '이름(학교 학년)' 로 읽기 좋게
  function prettyTarget(t){

        (hasAssign ? '<button type="button" class="a-clear" onclick="clearAssign(\''+esc(rep.id).replace(/'/g,"\\'")+'\',this)">배정 해제</button>' : '') +
        (hasAssign ? '<button type="button" class="a-alim" onclick="alimOpen(\''+esc(rep.id).replace(/'/g,"\\'")+'\')">알림톡 보내기</button>' : '') +
        '<button type="button" class="a-del" onclick="deleteReport(\''+esc(rep.id).replace(/'/g,"\\'")+'\',this)">리포트 삭제</button>' +

  /* 배정 해제 (아무에게도 안 보이게) */
  function clearAssign(id, btn){

    .catch(function(){ btn.disabled=false; alert('해제 실패 — 인터넷을 확인해 주세요.'); });

  /* 리포트 완전 삭제 (보고서목록·문항·배정에서 제거. 학생이 이미 낸 복기 기록은 보존) */
  function deleteReport(id, btn){

    btn.disabled=true; btn.textContent='삭제 중…';
    fetch(ENDPOINT, {

      body: JSON.stringify({ action:'deleteReport', pw:SERVER_PW, id:id })

  }

<script>

 * 발송은 백엔드 alimSend(50건씩), 중복 키는 공지 화면과 같은 'N:날짜|제목' — 같은 날 같은 제목은 두 번 가지 않는다. 확인 창을 거쳐야 보낸다. */
/* 2026-10-02 원장님 "리포트 제작 안내 알림톡과 선생님의 피드백이 완성된 뒤 확인하도록 안내하는 알림톡을 선택해 보낼 수 있도록" →

 *   make = 리포트 제작 안내(notice_report) — 아직 복기를 내지 않은 학생(이미 낸 학생은 '빼고 보낼까요?' 질문)
 *   up   = 피드백 확인 안내(notice_reportup '지필고사 리포트 업데이트 안내') — 복기를 냈고 선생님이 [리포트 보내기]까지 마친(sent_at) 학생만.
 *          복기는 냈지만 아직 보내지 않은 학생이 있으면 '피드백이 완성되지 않은 친구가 있어요. 빼고 보낼까요?'(이름 목록, 라디오 alWait 기본 = 빼고)를 묻는다
 *          (학생 페이지에 리포트가 아직 안 보이므로 기본은 빼기). */
var AL = { cfg: null, stus: null, rep: null, plan: null, busy: false, mode: 'make', done: null };
var AL_KINDS = {
  make: { kind: 'notice_report',   label: '지필고사 리포트 제작 안내',   pill: '리포트 제작 안내', sub: '복기를 아직 내지 않은 친구에게' },
  up:   { kind: 'notice_reportup', label: '지필고사 리포트 업데이트 안내', pill: '피드백 확인 안내', sub: '선생님 피드백을 보낸 친구에게' }
};
var AL_BATCH = 50;
/* 피드백 확인 안내 — 제목의 '담당 선생님'을 학생마다 그 학생 담당 선생님 이름으로 바꾼다(2026-10-02 원장님 "선생님 이름도 넣어주세요").
 * students.teacher('이은지') → '이은지 선생님', 비어 있으면 '담당 선생님' 그대로. */
function alTeacherName(t){ t = alTr(t).replace(/\s*(선생님|쌤|T)$/, ''); return t ? t + ' 선생님' : ''; }
function alItemTitle(title, stu){
  if (AL.mode !== 'up') return title;
  var t = alTeacherName(stu && stu.r && stu.r.teacher);
  return t ? title.replace('담당 선생님', t) : title;
}
function alKind(){ return AL_KINDS[AL.mode] || AL_KINDS.make; }
var AL_PHONE = { '학생': 'phone_student', '학부모1': 'phone_parent1', '학부모2': 'phone_parent2' };
var AL_LEFT = /^(퇴원|n|no|off|x|중단|비재원)$/i;
var AL_REST = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
function alWho(w){ return String(w || '').replace(/학부모(?!님)/g, '학부모님'); }
function alTr(v){ return String(v == null ? '' : v).trim(); }
function alYmd(){ var d = new Date(Date.now() + 9 * 3600e3); return d.getUTCFullYear() + '-' + ('0' + (d.getUTCMonth() + 1)).slice(-2) + '-' + ('0' + d.getUTCDate()).slice(-2); }
/* 학생에게 보일 제목 — '26-2-중간-화정고1-공통국어2' → '2학기 중간고사 화정고1 공통국어2' (창에서 고칠 수 있다) */
function alNiceTitle(t){
  var m = String(t || '').match(/^\d{2}-([12])-(중간|기말)-(.+)$/);
  return m ? m[1] + '학기 ' + m[2] + '고사 ' + m[3].replace(/-/g, ' ') : String(t || '');
}
/* s.html noticeMatches 와 같은 규칙 */
function alGradeDigit(s){ s = String(s || '').replace(/\s+/g, ''); var m = s.match(/([1-3])학년/) || s.match(/고([1-3])/); if (m) return m[1]; var a = s.match(/[1-3]/g); return a ? a[a.length - 1] : ''; }
function alNormGrade(s){ s = alTr(s); if (!s) return ''; var lv = /고/.test(s) ? '고' : (/중/.test(s) ? '중' : (/초/.test(s) ? '초' : '')); if (!lv) return ''; var m = s.match(/([1-6])\s*학년/) || s.match(/(?:고|중|초)\s*([1-6])/); return m ? lv + m[1] : ''; }
function alSchool(a, b){
  a = String(a || '').replace(/\s+/g, ''); b = String(b || '').replace(/\s+/g, '');
  if (!a || !b) return false; if (a === b) return true;
  var na = a.replace(/(등학교|고등학교|중학교|학교|고|중)$/, ''), nb = b.replace(/(등학교|고등학교|중학교|학교|고|중)$/, '');
  if (na && nb && na === nb) return true;
  return a.indexOf(b) >= 0 || b.indexOf(a) >= 0;
}
function alMatches(type, target, stu){
  type = alTr(type); target = alTr(target);
  if (type.indexOf('전체') >= 0) return true;
  if (type === '' && target === '') return false;   // 배정 없음 = 아무에게도 안 보냄(학생 페이지와 달리 안전 쪽)
  var tokens = target.split(/[,\n;\/·\s]+/).map(alTr).filter(Boolean);
  if (!tokens.length) return false;
  if (type.indexOf('학년') >= 0){
    var g = stu.grade.replace(/\s+/g, ''), sg = (stu.school + stu.grade).replace(/\s+/g, '');
    var gd = alGradeDigit(stu.grade), ng = alNormGrade(stu.grade), lvS = /중/.test(g) ? '중' : (/고/.test(g) ? '고' : '');
    return target.split(/[,\n;\/·]+/).map(alTr).filter(Boolean).some(function(t){
      var tt = t.replace(/\s+/g, ''); if (!tt) return false;
      var td = alGradeDigit(tt); if (td && gd && td !== gd) return false;
      var lvT = /중/.test(tt) ? '중' : (/고/.test(tt) ? '고' : ''); if (lvT && lvS && lvT !== lvS) return false;
      if (ng && alNormGrade(tt) === ng) return true;
      return tt === g || sg.indexOf(tt) >= 0 || g.indexOf(tt) >= 0;
    });
  }
  return tokens.some(function(t){
    if (t.indexOf('|') >= 0){
      var p = t.split('|'), tn = alTr(p[0]), ts = alTr(p[1]), tg = alTr(p[2]);
      if (!tn || tn !== stu.name) return false;
      if (ts && stu.school && !alSchool(ts, stu.school)) return false;
      if (tg && stu.grade && tg.replace(/\s+/g, '') !== stu.grade.replace(/\s+/g, '')) return false;
      return true;
    }
    return t === stu.name || t === stu.sid || t === stu.code;
  });
}
function alSbAll(path){
  var out = [], LIM = 1000;
  function step(off){
    return fetch(AL_REST + path + '&limit=' + LIM + '&offset=' + off, { headers: { apikey: 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT' }, cache: 'no-store' })
      .then(function(r){ if (!r.ok) throw new Error('조회 ' + r.status); return r.json(); })
      .then(function(rows){ out = out.concat(rows); return rows.length < LIM ? out : step(off + LIM); });
  }

}
function alimClose(){ if (AL.busy) return; document.getElementById('alBg').classList.remove('on'); AL.rep = null; AL.plan = null; AL.done = null; }
function alimMode(m){ if (AL.busy || !AL_KINDS[m] || AL.mode === m) return; AL.mode = m; if (AL.done) alimDraw(AL.done); }
function alimOpen(id){

  if (!rep) return;

  var title = String(rep.title || rep.id || '');
  var jobs = [
    AL.cfg ? Promise.resolve(AL.cfg) : fetch(ENDPOINT + '?action=alimConfig&pw=' + encodeURIComponent(SERVER_PW) + '&t=' + Date.now()).then(function(r){ return r.json(); }),
    AL.stus ? Promise.resolve(AL.stus) : alSbAll('/students?select=name,school,grade,student_id,code,enrolled,teacher,phone_student,phone_parent1,phone_parent2&order=seq,id'),
    (function(){
      var ex = '&exam=in.(' + [title, String(rep.id)].map(function(x){ return '"' + x.replace(/"/g, '') + '"'; }).join(',') + ')';
      // sent_at(043)이 없는 DB면 옛 열만 다시 읽는다 — 그때는 선생님 한 마디가 있으면 보낸 것으로 본다(s.html examSent 와 같은 규칙)
      return alSbAll('/submissions?select=exam,name,parent_phone,sent_at,teacher_note' + ex)
        .catch(function(){ return alSbAll('/submissions?select=exam,name,parent_phone,teacher_note' + ex); });
    })()
  ];
  Promise.all(jobs).then(function(rs){
    if (AL.rep !== rep) return;
    AL.cfg = (rs[0] && rs[0].result === 'success') ? rs[0] : null;
    AL.stus = rs[1];

    rs[2].forEach(function(r){

      [p ? 'p:' + p : '', n ? 'n:' + n : '', n ? 'n:' + n.replace(/[A-Za-z]$/, '') : ''].forEach(function(k){

function alimDraw(done){

  var keepTitle = (document.getElementById('alTitle') || {}).value;
  if (keepTitle === AL.autoTitle) keepTitle = '';   // 고치지 않은 기본 제목이면 종류에 맞는 기본 제목으로 바꾼다
  AL.autoTitle = title;
  box.innerHTML = '<h3>알림톡 보내기</h3><p class="al-sub">' + esc(rep.title || rep.id) + ' · 배정: ' + esc(assignSummary(a).tag) + '</p>' +

    }).join('') + '</div></div>' +
    (ready ? '' : '<div class="al-warn" style="margin-bottom:10px">‘' + esc(K.label) + '’ 알림톡 템플릿이 아직 준비되지 않았습니다(솔라피 승인 전이거나 설정 전). 슈국 운영 → 알림톡 설정에서 확인해 주세요.</div>') +
    '<div class="al-row"><b>알림톡에 들어갈 제목</b><input type="text" id="alTitle" maxlength="80" value="' + esc(keepTitle || title) + '" oninput="alimRefresh()"></div>' +
    '<div class="al-row al-whos"><b>받는 분</b>' + ['학생', '학부모1', '학부모2'].map(function(w){ return '<label><input type="checkbox" class="alW" value="' + w + '" checked onchange="alimRefresh()"> ' + esc(alWho(w)) + '</label>'; }).join('') + '</div>' +
    (doneN.length ? '<div class="al-row al-skip"><b>이미 제출한 친구가 있어요</b>' +
      '<div class="al-skipq">' + doneN.length + '명이 이미 복기를 제출했어요. 빼고 보낼까요?</div>' +
      '<div class="al-skipn">' + doneN.map(function(x){ return esc(x.name); }).join(', ') + '</div>' +
      '<label><input type="radio" name="alSkip" value="1" checked onchange="alimRefresh()"> 네, 빼고 보낼게요</label>' +
      '<label><input type="radio" name="alSkip" value="0" onchange="alimRefresh()"> 아니요, 함께 보낼게요</label></div>' : '') +
    (waitN.length ? '<div class="al-row al-skip al-wait"><b>피드백이 완성되지 않은 친구가 있어요</b>' +
      '<div class="al-skipq">' + waitN.length + '명은 복기를 냈지만 선생님이 아직 [리포트 보내기]를 누르지 않았습니다. 빼고 보낼까요?</div>' +
      '<div class="al-skipn">' + waitN.map(function(x){ return esc(x.name); }).join(', ') + '</div>' +
      '<label><input type="radio" name="alWait" value="1" checked onchange="alimRefresh()"> 네, 빼고 보낼게요</label>' +
      '<label><input type="radio" name="alWait" value="0" onchange="alimRefresh()"> 아니요, 함께 보낼게요</label></div>' : '') +
    '<div class="al-row"><div class="al-sum" id="alSum"></div></div>' +
    '<div class="al-row"><b>미리보기</b><div class="al-prev" id="alPrev"></div></div>' +
    '<div class="al-btns"><button type="button" onclick="alimClose()">닫기</button><button type="button" class="go" id="alGo" onclick="alimSend()" disabled>알림톡 보내기</button></div>' +
    '<div class="al-res" id="alRes"></div>';
  AL.ready = ready; AL.tpl = tpl;
  alimRefresh();
}
function alimRefresh(){
  if (!AL.rep || !AL.list) return;
  var whos = Array.prototype.slice.call(document.querySelectorAll('.alW:checked')).map(function(x){ return x.value; });
  var title = alTr((document.getElementById('alTitle') || {}).value);
  var items = [], nophone = [], nocode = [], people = 0;
  var skipEl = document.querySelector('input[name="alSkip"]:checked'), skip = !skipEl || skipEl.value === '1';   // 이미 제출한 친구 빼기(기본)
  var waitEl = document.querySelector('input[name="alWait"]:checked'), skipWait = !waitEl || waitEl.value === '1';   // 피드백 전 친구 빼기(기본)
  AL.list.concat(skip ? [] : AL.doneN, (AL.mode === 'up' && !skipWait) ? (AL.waitN || []) : []).forEach(function(stu){
    var tos = whos.map(function(w){ return { who: w, to: String(stu.r[AL_PHONE[w]] || '').replace(/\D/g, '') }; }).filter(function(t){ return /^01\d{8,9}$/.test(t.to); });
    if (!tos.length) nophone.push(stu.name);
    else if (!stu.code) nocode.push(stu.name);
    else { people++; tos.forEach(function(t){ items.push({ student: stu.name, to: t.to, who: t.who, code: stu.code, title: alItemTitle(title, stu) }); }); }
  });
  var h = (AL.mode === 'up' ? (skipWait ? '선생님 피드백을 보낸 학생 <b>' : '복기를 낸 학생 <b>') : skip ? '배정된 학생 중 아직 복기를 내지 않은 <b>' : '배정된 학생 <b>') + people + '명</b>' + (whos.length ? '의 ' + esc(alWho(whos.join('·'))) + '에게 <b>' + items.length + '건</b> 보냅니다.' : '') +
    (items.length > AL_BATCH ? ' <span style="color:#8B928C">(' + AL_BATCH + '건씩 나눠 보내요)</span>' : '');
  var w = [];
  if (AL.doneN.length && skip) w.push('이미 제출한 ' + AL.doneN.length + '명은 빼고 보냅니다');
  if (AL.mode === 'up' && (AL.waitN || []).length && skipWait) w.push('피드백이 완성되지 않은 ' + AL.waitN.length + '명은 빼고 보냅니다');
  if (AL.mode === 'up' && AL.notN) w.push('아직 복기를 내지 않은 ' + AL.notN + '명은 받지 않습니다');
  if (nophone.length) w.push('고른 분의 연락처가 없는 학생 ' + nophone.length + '명: ' + nophone.map(esc).join(', '));
  if (nocode.length) w.push('학생 페이지 링크(접근코드)가 없는 학생 ' + nocode.length + '명: ' + nocode.map(esc).join(', '));
  if (w.length) h += '<div class="al-warn">' + w.join('<br>') + '</div>';
  document.getElementById('alSum').innerHTML = h;
  var tpl = AL.tpl;
  document.getElementById('alPrev').innerHTML = tpl ? esc(String(tpl.text || '').replace(/#\{([^}]+)\}/g, function(_, k){ return k === '학생명' ? (items[0] ? items[0].student : '○○○') : k === '제목' ? ((items[0] && items[0].title) || title || '(제목)') : ''; })) +
    (tpl.buttons || []).map(function(b){ return '<div class="al-pbtn">' + esc(b.name) + '</div>'; }).join('') +
    (AL.mode === 'up' && /담당 선생님/.test(title) ? '<div class="al-tnote">제목의 ‘담당 선생님’ 자리에는 학생마다 담당 선생님 이름이 들어갑니다(담당이 비어 있으면 ‘담당 선생님’ 그대로).</div>' : '') : '<span style="color:#8B928C">템플릿을 불러오지 못했습니다.</span>';
  var go = document.getElementById('alGo');
  go.disabled = !AL.ready || !title || !items.length || AL.busy;
  go.textContent = '알림톡 보내기' + (items.length ? ' (' + items.length + '건)' : '');
  AL.plan = (AL.ready && title && items.length) ? { title: title, items: items, people: people } : null;
}
function alimSend(){
  var p = AL.plan; if (!p || AL.busy) return;
  var K = alKind();
  if (!confirm('‘' + K.label + '’ 알림톡을 학생 ' + p.people + '명에게 ' + p.items.length + '건 보낼까요?\n\n▶ ' + ((p.items[0] && p.items[0].title) || p.title))) return;
  AL.busy = true;
  var go = document.getElementById('alGo'); go.disabled = true; go.textContent = '보내는 중…';
  var ref = 'N:' + alYmd() + '|' + p.title;
  var chunks = []; for (var i = 0; i < p.items.length; i += AL_BATCH) chunks.push(p.items.slice(i, i + AL_BATCH));
  var okN = 0, dup = [], bad = [], err = '';
  chunks.reduce(function(prev, ch){
    return prev.then(function(){
      if (err) return;
      return fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify({ action: 'alimSend', pw: SERVER_PW, kind: K.kind,
          items: ch.map(function(it){ return { student: it.student, to: it.to, who: it.who, cls: '공지', date: ref, vars: { '학생명': it.student, '제목': it.title || p.title, '접근코드': it.code } }; }) }) })
        .then(function(r){ return r.json(); })
        .then(function(res){
          if (!res || res.result !== 'success'){ err = (res && res.message) || '오류'; return; }
          okN += res.okCount || 0;
          (res.sent || []).forEach(function(x){ var n = x.student + (x.who ? ' ' + alWho(x.who) : ''); if (x.dup) dup.push(n); else if (!x.ok) bad.push(n + ' (' + x.message + ')'); });
        }).catch(function(){ err = '인터넷 연결을 확인해 주세요.'; });
    });
  }, Promise.resolve()).then(function(){
    AL.busy = false;
    var r = document.getElementById('alRes'); if (!r) return;
    if (err){ r.className = 'al-res err'; r.textContent = '알림톡을 보내지 못했습니다: ' + err + (okN ? ' (그전 ' + okN + '건은 보냈어요)' : ''); }
    else {
      r.className = 'al-res ' + (bad.length ? 'err' : 'ok');
      r.textContent = '알림톡 ' + okN + '건을 보냈습니다.' + (dup.length ? ' 오늘 같은 제목으로 이미 받은 ' + dup.length + '건은 건너뛰었어요.' : '') + (bad.length ? ' 실패: ' + bad.join(', ') : '');
    }
    go.textContent = '보냈습니다'; go.disabled = true;
  });
}
document.addEventListener('keydown', function(e){ if (e.key === 'Escape' && document.getElementById('alBg').classList.contains('on')) alimClose(); });
</script>

<p class="tip">화면이 예전 그대로거나 방금 바꾼 내용이 안 보이면 <b>Ctrl+Shift+R</b> 로 새로고침해 주세요.</p>
