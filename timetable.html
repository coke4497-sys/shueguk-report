/* ── 출석 현황 — 전체·학년별·학교별·개인별 주차별 출석 (2026-08-23 사용자 요청)
 * 옛 [학생 이력]·[결석/지각 확인] 두 모달을 이 한 화면으로 합쳤다.
 * 데이터: timetableWeek(정규+내신) + roster(학년·학교) + attendAbsentList(결석 보충 상태).
 * 백엔드 변경 없음 — 지금 출석기록이 1,000건 안팎이라 화면에서 집계해도 가볍다.
 * ※ 기록이 쌓여 무거워지면 서버에서 학생별·주차별로 집계해 주는 액션을 따로 만들 것. */
var asS = { weeks:4, view:'all', sort:'issue', q:'', sub:'', sub2:'', limit:40, open:{}, gclosed:{}, person:'' };
var asData = null, asRoster = null, asSeq = 0, asBusy = false, asErr = '';

/* 일요일 논술 특강은 출석 집계에서 뺀다 (2026-08-23 사용자 확정) */
function asIsNonsul(c){ return !!c && c.day === '일' && String(c.cls || '').indexOf('논술') >= 0; }

function asWeeks(){
  var out = [];
  for (var i = asS.weeks - 1; i >= 0; i--){
    var wed = new Date(weekStart); wed.setDate(wed.getDate() - 7 * i);
    var mon = new Date(wed); mon.setDate(mon.getDate() - 2);
    var sun = new Date(wed); sun.setDate(sun.getDate() + 4);
    out.push({ k: ymdOf(wed), mon: ymdOf(mon), sun: ymdOf(sun), l: mdOf(mon),
               r: mdOf(mon) + '~' + mdOf(sun) });
  }
  return out;
}
function asWeekIndex(weeks, ymd){
  for (var i = weeks.length - 1; i >= 0; i--) if (ymd >= weeks[i].mon) return (ymd <= weeks[i].sun ? i : -1);
  return -1;
}

function openAttStatus(nm){
  if (nm){ asS.view = 'person'; asS.person = asKey(nm); asS.q = ''; }
  setMode('att');
}

/* ── 불러오기 ── */
function asFetch(u){ return fetch(u).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
function asLoad(force){
  bootKicked.att = true;
  var host = $('sheet'); if (!host) return;
  if (asBusy) return;
  if (asData && asData.weeks === asS.weeks && !force){ asRender(); return; }
  asBusy = true; asErr = '';
  var seq = ++asSeq;
  var weeks = asWeeks();
  var from = weeks[0].mon, to = weeks[weeks.length - 1].sun;
  var qs = '&pw=' + encodeURIComponent(pw) + '&t=' + Date.now();
  host.innerHTML = '<p class="as-none">출석 기록을 불러오는 중…</p>';
  Promise.all([
    asFetch(ENDPOINT + '?action=timetableWeek&book=' + encodeURIComponent('정규') + '&from=' + from + '&to=' + to + qs),
    asFetch(ENDPOINT + '?action=timetableWeek&book=' + encodeURIComponent('내신') + '&from=' + from + '&to=' + to + qs),
    asRoster ? Promise.resolve(null) : asFetch(ENDPOINT + '?action=roster&t=' + Date.now()),
    asFetch(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent('정규') + qs),
    asFetch(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent('내신') + qs),
    cacheGet('list:정규') ? Promise.resolve(null) : asFetch(ENDPOINT + '?action=timetableList&book=' + encodeURIComponent('정규') + qs),
    cacheGet('list:내신') ? Promise.resolve(null) : asFetch(ENDPOINT + '?action=timetableList&book=' + encodeURIComponent('내신') + qs)
  ]).then(function(rs){
    asBusy = false;
    if (seq !== asSeq || mode !== 'att') return;
    ['정규','내신'].forEach(function(bk, i){
      var d = rs[5 + i];
      if (d && d.result === 'success') cacheSet('list:' + bk, { classes: d.classes || [], onceMoves: d.onceMoves || [] });
    });
    if (rs[2] && rs[2].students){
      asRoster = {};
      rs[2].students.forEach(function(r){ asRoster[plainName(r.name).trim()] = r; });
    }
    if ((!rs[0] || rs[0].result !== 'success') && (!rs[1] || rs[1].result !== 'success')){
      asErr = '출석 기록을 불러오지 못했어요. 잠시 후 [다시 불러오기]를 눌러 주세요.';
      asRender(); return;
    }
    asData = asBuild(weeks, rs[0], rs[1], [rs[3], rs[4]]);
    asRender();
  });
}

/* 반 정보 — 정규·내신 양쪽에서 찾는다 */
function asClassList(bk){
  if (bk === book && classes && classes.length) return classes;
  var c = (cacheGet('list:' + bk) || {}).classes;
  return (c && c.length) ? c : (classes || []);
}
function asClassOf(bk, cid){
  var list = asClassList(bk);
  var hit = null;
  (list || []).forEach(function(c){ if (c.id === cid) hit = c; });
  return hit;
}

/* 학생이 그 시간표에서 듣는 두 수업을 진도/확인 칸으로 가른다.
 * 내신 = 진도반 / 확인반, 정규 = 가 / 나. 단일 수업(정리정독·고3 등)은 진도 칸. */
function asSlotOf(bk, c){
  var n = String(c.cls || '').replace(/\s+$/, '');
  if (bk === '내신') return (n.indexOf('확인') >= 0) ? 1 : 0;
  if (/나$/.test(n)) return 1;
  if (/가$/.test(n)) return 0;
  return 0;
}
function asSlotLabel(bk){ return (bk === '내신') ? ['진도', '확인'] : ['정규 가', '정규 나']; }
/* 반 시간 표기 — 시트와 같은 '일2:00' 형태 */
function asSlotTime(c){ return c ? (c.day + c.start) : ''; }
/* 시험 직전 주에는 기존 수업이 사라지고 직전보강으로 바뀐다 (2026-08-23 사용자 설명).
 * 아직 그런 반이 시간표에 없어서, 반이름에 '직보'·'직전'·'보강'이 들어오면 자동으로 잡힌다. */
function asIsJikbo(c){ return !!c && (isJb(c) || /직보|직전|보강/.test(String(c.cls || ''))); }
/* 그 주에서 그 요일의 날짜 */
var AS_DOW = ['월','화','수','목','금','토','일'];
function asDateOf(wk, day){
  var i = AS_DOW.indexOf(day); if (i < 0) return '';
  var d = new Date(+wk.mon.slice(0,4), +wk.mon.slice(5,7) - 1, +wk.mon.slice(8,10) + i);
  return ymdOf(d);
}

/* 이름을 명단 기준 하나로 모은다.
 * 동명이인 표기가 어긋나 시간표는 첫 사람도 '양지우A', 명단은 '양지우'로 적혀 있어서
 * 그대로 두면 한 사람이 두 줄로 갈라지고 대상 학생 수도 부풀려진다
 * (2026-08-23 사용자 질문 "496명이라고 되어있었는데 왜 500명이에요?").
 * B·C는 명단에도 그대로 있으므로 끝의 A만 뗀다. */
function asKey(nm){
  var n = plainName(nm).trim();
  if (!n || !asRoster) return n;
  if (asRoster[n]) return n;
  if (/A$/.test(n) && asRoster[n.slice(0, -1)]) return n.slice(0, -1);
  return n;
}
function asBuild(weeks, reg, nae, absLists){
  var att = {}, once = {}, mk = {};
  [[absLists[0], '정규'], [absLists[1], '내신']].forEach(function(pr){
    if (!pr[0] || pr[0].result !== 'success') return;
    (pr[0].list || []).forEach(function(x){
      mk[pr[1] + '|' + x.date + '|' + x.classId + '|' + asKey(x.student)] = x;
    });
  });
  [[reg, '정규'], [nae, '내신']].forEach(function(pr){
    var d = pr[0], bk = pr[1];
    if (!d || d.result !== 'success') return;
    (d.attend || []).forEach(function(a){
      att[bk + '|' + a.date + '|' + a.classId + '|' + asKey(a.student)] = a;
    });
    (d.onceMoves || []).forEach(function(o){
      var nm = asKey(o.student);
      (once[bk + '|' + nm] = once[bk + '|' + nm] || []).push(o);
    });
  });
  // 학생별 소속 반 (시간표별로 진도/확인 두 칸)
  var belong = {};
  ['정규', '내신'].forEach(function(bk){
    var list = asClassList(bk);
    (list || []).forEach(function(c){
      if (asIsNonsul(c)) return;                      // 일요일 논술 특강은 집계에서 뺀다
      (c.students || []).forEach(function(s){
        var nm = asKey(s); if (!nm) return;
        var key = bk + '|' + nm;
        belong[key] = belong[key] || [[], []];
        belong[key][asSlotOf(bk, c)].push(c);   // 확인반이 없는 중3·고3은 확인 칸이 빈 채로 남는다
      });
    });
  });

  var names = {};
  Object.keys(belong).forEach(function(k){ names[k.split('|')[1]] = 1; });
  Object.keys(att).forEach(function(k){ names[k.split('|')[3]] = 1; });
  if (asRoster) Object.keys(asRoster).forEach(function(n){ names[n] = 1; });

  var list = Object.keys(names).map(function(nm){
    var r = (asRoster && asRoster[nm]) || null;
    var inTT = !!(belong['정규|' + nm] || belong['내신|' + nm]);
    var st = { n: nm, s: r ? r.school : '', g: r ? asGrade(r.grade) : '', tc: r ? r.teacher : '',
               known: !!r, inTT: inTT, left: (!r && !inTT), wk: [], i: [], ex: 0,
               t2: { att:0, late:0, abs:0, move:0, done:0 } };
    weeks.forEach(function(wk){
      var bk = periods[wk.k] || '정규';
      var cs = belong[bk + '|' + nm] || [[], []];
      var cell = { bk: bk, slots: [[], []], extra: [] };
      var wkMoves = (once[bk + '|' + nm] || []).filter(function(o){ return o.date >= wk.mon && o.date <= wk.sun; });
      cs.forEach(function(group, gi){ group.forEach(function(c){
        var ds = asDateOf(wk, c.day);
        var a = att[bk + '|' + ds + '|' + c.id + '|' + nm] || null;
        var s = { c: c, date: ds, time: asSlotTime(c), status: a ? a.status : '', memo: a ? a.memo : '' };
        // 이 반에서 다른 반으로 1회 이동했으면 그 칸에 옮겨 간 시간을 보여준다
        wkMoves.forEach(function(o){
          if (o.fromId !== c.id) return;
          var t = asClassOf(bk, o.toId);
          s.moved = { to: t, time: asSlotTime(t), date: o.date, reason: o.reason || '' };
          o._shown = true;   // 그 칸에 표시했으니 보충란에서는 뺀다
          var ta = att[bk + '|' + o.date + '|' + o.toId + '|' + nm];
          if (ta){ s.status = ta.status; s.memo = ta.memo || ''; }
        });
        if (a && a.status === '결석'){
          var m = mk[bk + '|' + ds + '|' + c.id + '|' + nm];
          if (m){ s.plan = m.plan || ''; s.done = !!m.done; }
        }
        if (a){
          if (a.status === '출석') st.t2.att++;
          else if (a.status === '지각'){ st.t2.late++; st.i.push({ d: ds, k:'지각', bk:bk, c: labelOf(c), m: a.memo || '' }); }
          else if (a.status === '결석'){
            st.t2.abs++;
            if (s.done) st.t2.done++;
            st.i.push({ d: ds, k:'결석', bk:bk, c: labelOf(c), m: a.memo || '', plan: s.plan, done: s.done });
          }
        }
        cell.slots[gi].push(s);
      }); });
      // 그 주의 1회 이동 — 보충 및 이동 칸
      wkMoves.forEach(function(o){
        var f = asClassOf(bk, o.fromId), t = asClassOf(bk, o.toId);
        if (!o._shown) cell.extra.push({ kind:'이동', date:o.date, from:f, to:t, reason:o.reason || '' });
        st.t2.move++;
        st.i.push({ d:o.date, k:'이동', bk:bk,
                    c:(f?labelOf(f):o.fromId) + ' → ' + (t?labelOf(t):o.toId), m:o.reason || '' });
      });
      st.wk.push(cell);
    });
    st.i.sort(function(a,b){ return a.d.localeCompare(b.d); });
    var t = st.t2;
    t.base = t.att + t.late + t.abs;
    t.rate = t.base ? Math.round(t.att / t.base * 1000) / 10 : null;
    t.issue = t.late + t.abs * 2 + t.move * 0.5;
    st.t = t;
    st.w = st.wk.map(function(cell){
      var a=0,l=0,ab=0,mv=cell.extra.length;
      cell.slots.forEach(function(g){ g.forEach(function(s){
        if (!s.status) return;
        if (s.status === '출석') a++; else if (s.status === '지각') l++; else if (s.status === '결석') ab++;
      }); });
      return [a,l,ab,mv];
    });
    return st;
  });
  // 퇴원생(시간표·명단 어디에도 없음)은 그 기간에 기록이 남아 있을 때만 보여준다
  list = list.filter(function(st){ return !st.left || st.t.base > 0 || st.t.move > 0; });
  return { weeks: weeks, list: list };
}

/* ── 결석·지각 목록 — 옛 [결석/지각 확인] 모달과 같은 확인을 그대로 (2026-08-23 사용자 요청)
 * 기간 안에 지각·결석·1회 이동이 있는 학생만 잦은 순으로 세운다. 줄을 누르면 날짜별 내역. */
function asWarnSorted(list){

  };
  return list.filter(function(x){ return (x.t.late + x.t.abs + x.t.move) > 0; })
    .sort(function(a, b){ return pick(b.t) - pick(a.t) || (b.t.abs - a.t.abs) || a.n.localeCompare(b.n, 'ko'); });
}
function asWarnBadge(n, cls, lab){

}
function asWarnHtml(list){

    '<div class="as-ctrls" style="margin-bottom:8px"><span class="as-grp"><span class="as-lab">기준</span>' +
    sorts.map(function(o){
      return '<button type="button" class="as-pill' + (o.v === (asS.wsort || 'total') ? ' on' : '') +
             '" onclick="asSet(\'wsort\',\'' + o.v + '\')">' + o.t + '</button>';
    }).join('') + '</span></div>';
  if (!rows.length)
    return head + '<p class="as-none">이 기간에 지각·결석·1회 이동이 있는 학생이 없어요.</p>';
  var body = rows.map(function(st, i){
    var t = st.t, sum = t.late + t.abs + t.move;
    var open = asS.open[st.n];
    return '<div class="as-wrow' + (sum >= 3 ? ' hot' : '') + (open ? ' on' : '') + '">' +
      '<button class="as-wbtn" type="button" onclick="asToggle(\'' + esc(st.n) + '\')">' +

        asWarnBadge(t.late, 'a-late', '지각') +
        asWarnBadge(t.abs, 'a-abs', '결석') +
        (t.abs ? '<span class="ah-badge a-mk' + (t.done >= t.abs ? ' done' : ' todo') + '">보충 ' + t.done + '/' + t.abs + '</span>' : '') +
        asWarnBadge(t.move, 'a-move', '이동') +
        '<span class="as-watt">출석 ' + t.att + '회</span>' +
        '<span class="as-wsum">' + sum + '건</span>' +
      '</button>' +

  }).join('');
  return head + '<div class="as-wlist">' + body + '</div>';

/* ── 기록부 표 (구글시트 「주차별 기록부」 형식) ── */

function asSlotOne(s){

/* 확인반이 없는 중3·고3은 이 칸이 그냥 빈칸으로 남는다 (2026-08-23 사용자 확정) */
function asSlotCell(group, once1){
  if (!group || !group.length) return '<td class="as-sc"></td>';
  // 주2회 수업인데 그 주에 한 번만 등원한 경우 — 기록이 아예 없는 쪽에 표시

  return '<td class="as-sc">' + group.map(function(s){ return '<div class="as-line">' + asSlotOne(s) + '</div>'; }).join('') + '</td>';
}
function asExtraCell(cell){
  var out = [];
  cell.extra.forEach(function(x){
    out.push('<div class="as-line"><b class="as-mv2">' + esc(asSlotTime(x.to)) + '</b>' +
      '<span class="as-sub2">' + esc(exsMdN(x.date)) + ' ' + esc(x.from ? x.from.cls : '') + ' → 이동' +
      (x.reason ? ' · ' + esc(x.reason) : '') + '</span></div>');
  });

}
function asBookRow(st, no){
  var open = asS.open[st.n];
  var today = todayStr();
  var cells = st.wk.map(function(cell, i){
    var wk = asData.weeks[i];
    var passed = wk.sun < today;                       // 지나간 주에서만 판정
    var h0 = cell.slots[0].some(function(s){ return !!s.status; });
    var h1 = cell.slots[1].some(function(s){ return !!s.status; });
    var both = cell.slots[0].length && cell.slots[1].length;
    return asSlotCell(cell.slots[0], passed && both && h1 && !h0) +
           asSlotCell(cell.slots[1], passed && both && h0 && !h1) +
           asExtraCell(cell);
  }).join('');
  return '<tr class="' + (open ? 'sel' : '') + '">' +
    '<td class="as-no">' + no + '</td>' +
    '<td class="as-cn"><button class="as-row" type="button" onclick="asToggle(\'' + esc(st.n) + '\')">' +
      '<span class="as-nm">' + esc(st.n) + '</span><div class="as-meta">' +
      esc(st.known ? (st.s + ' ' + st.g) : (st.left ? '퇴원' : '미등록생')) + '</div></button></td>' + cells + '</tr>' +
    (open ? '<tr><td class="as-det" colspan="' + (asS.weeks * 3 + 2) + '">' + asDetail(st) + '</td></tr>' : '');
}

function asGrade(g){
  var s = String(g || '').replace(/20\d{2}/, '');
  var lv = s.indexOf('중') >= 0 ? '중' : (s.indexOf('고') >= 0 ? '고' : '');
  var m = s.match(/[1-3]/);
  return (lv && m) ? (lv + m[0]) : '';
}

/* ── 그리기 ── */
function asPool(){
  if (!asData) return [];
  var q = asS.q.trim();
  return asData.list.filter(function(st){
    if (q && st.n.indexOf(q) < 0) return false;
    if (asS.view === 'grade' && asS.sub){
      if (st.g !== asS.sub) return false;
      if (asS.sub2 && st.s !== asS.sub2) return false;   // 학교+학년 조합(2026-09-27 수정 요청함 김상우)
    }
    if (asS.view === 'school' && asS.sub){
      if (st.s !== asS.sub) return false;
      if (asS.sub2 && st.g !== asS.sub2) return false;
    }
    return true;
  });
}
function asSort(list){
  var k = asS.sort;
  return list.slice().sort(function(a, b){
    if (k === 'issue') return b.t.issue - a.t.issue || a.n.localeCompare(b.n, 'ko');
    if (k === 'rate'){
      var ra = (a.t.rate == null ? 101 : a.t.rate), rb = (b.t.rate == null ? 101 : b.t.rate);
      return ra - rb || a.n.localeCompare(b.n, 'ko');
    }
    return a.n.localeCompare(b.n, 'ko');
  });
}
function asSet(k, v){
  asS[k] = v;
  if (k === 'weeks'){ asS.limit = 40; asLoad(); return; }
  if (k === 'view'){ asS.sub = ''; asS.sub2 = ''; asS.gclosed = {}; }
  if (k === 'sub') asS.sub2 = '';
  if (k !== 'sort') asS.limit = 40;
  asRender();
}
function asPills(opts, cur, key){
  return opts.map(function(o){
    return '<button type="button" class="as-pill' + (String(o.v) === String(cur) ? ' on' : '') +
      '" onclick="asSet(\'' + key + '\',' + (typeof o.v === 'number' ? o.v : '\'' + esc(o.v) + '\'') + ')">' +
      esc(o.t) + '</button>';
  }).join('');
}
/* 두 번째 필터 알약 줄 — 학년을 골랐으면 그 학년 학생들의 학교, 학교를 골랐으면 그 학교의 학년.
 * 학년·학교를 함께 좁혀 '화수중 중2' 같은 조합 명단을 본다 (2026-09-27 수정 요청함 김상우). */
function asSub2Pills(){
  if (!asS.sub || !asData) return '';
  var grade = (asS.view === 'grade'), cnt = {};
  asData.list.forEach(function(x){
    if (!x.known) return;
    if (grade){ if (x.g === asS.sub && x.s) cnt[x.s] = (cnt[x.s] || 0) + 1; }
    else { if (x.s === asS.sub && x.g) cnt[x.g] = (cnt[x.g] || 0) + 1; }
  });
  var keys = Object.keys(cnt);
  if (keys.length < 2) return '';   // 한 갈래뿐이면 좁힐 것이 없다
  if (grade) keys.sort(function(a, b){ return cnt[b] - cnt[a]; });
  else {
    var ord = ['고1','고2','고3','중1','중2','중3'];
    keys.sort(function(a, b){ return (ord.indexOf(a) + 1 || 99) - (ord.indexOf(b) + 1 || 99); });
  }
  return '<span class="as-grp"><span class="as-lab">' + (grade ? '학교' : '학년') + '</span>' +
    asPills([{v:'',t:'전체'}].concat(keys.slice(0, 12).map(function(k){ return {v:k,t:k + ' ' + cnt[k]}; })), asS.sub2, 'sub2') +
    '</span>';
}
function asScope(){
  if (asS.q) return '"' + asS.q + '" 검색';
  if (asS.view === 'grade') return asS.sub ? ((asS.sub2 ? asS.sub2 + ' ' : '') + asS.sub) : '전 학년';
  if (asS.view === 'school') return asS.sub ? (asS.sub + (asS.sub2 ? ' ' + asS.sub2 : '')) : '전 학교';
  if (asS.view === 'person') return '개인 보기';
  return '전체';
}

/* 요약 타일·주차 표·명단 — 검색어가 바뀔 때 이 부분만 다시 그린다.
 * (검색창까지 통째로 다시 그리면 한글 조합(IME)이 끊겨 'ㅂㅏㄱ…'처럼 풀린다 —

function asBodyHtml(){

      asPills([{v:'issue',t:'문제 많은 순'},{v:'rate',t:'출석률 낮은 순'},{v:'name',t:'이름순'}], asS.sort, 'sort') + '</span>') +
    '<span class="as-grp"><span class="as-lab">검색</span>' +
      '<input class="as-q" id="as-q" type="search" placeholder="학생 이름" value="' + esc(asS.q) + '" autocomplete="off">' +
    '</span></div>';
  // 학년·학교 고르기 — 하나를 고르면 반대쪽 두 번째 필터가 열린다
  // (학교+학년 조합 명단 — 2026-09-27 수정 요청함 김상우 "화수중2 친구들만 보고 싶어요")
  if (asS.view === 'grade'){
    h += '<div class="as-ctrls"><span class="as-grp"><span class="as-lab">학년</span>' +
      asPills([{v:'',t:'전체'}].concat(['고1','고2','고3','중2','중3'].map(function(g){ return {v:g,t:g}; })), asS.sub, 'sub') +
      '</span>' + asSub2Pills() + '</div>';
  } else if (asS.view === 'school'){
    var cnt = {};
    asData.list.forEach(function(x){ if (x.s) cnt[x.s] = (cnt[x.s] || 0) + 1; });
    var ss = Object.keys(cnt).sort(function(a, b){ return cnt[b] - cnt[a]; }).slice(0, 12);
    h += '<div class="as-ctrls"><span class="as-grp"><span class="as-lab">학교</span>' +
      asPills([{v:'',t:'전체'}].concat(ss.map(function(x){ return {v:x,t:x + ' ' + cnt[x]}; })), asS.sub, 'sub') +
      '</span>' + asSub2Pills() + '</div>';
  }
  h += '<div id="as-body">' + asBodyHtml() + '</div>';
  h += '</div>';

    asS.q = this.value; asS.limit = 40; asS.person = '';
    // 검색창은 그대로 두고 결과만 다시 그린다 — 입력창을 다시 만들면 한글 조합이 끊긴다
    var bd = $('as-body');
    if (bd) bd.innerHTML = asBodyHtml();

}

function asTile(k, v, sub, cls){
  return '<div class="as-tile ' + (cls || '') + '"><div class="k">' + esc(k) + '</div>' +
         '<div class="v">' + esc(v) + '</div>' + (sub ? '<div class="s">' + esc(sub) + '</div>' : '') + '</div>';
}
/* 재원 명단(예: 496명)보다 수가 큰 이유를 타일에 적어 준다 —
 * 아직 등록 전인 미등록생과, 명단에서 빠졌지만 그 기간에 기록이 남은 퇴원생이 함께 세어진다
 * (2026-08-23 사용자 질문 "496명이라고 되어있었는데 왜 500명이에요?") */
function asCntNote(list){
  var nu = 0, lf = 0;
  list.forEach(function(x){ if (x.known) return; if (x.left) lf++; else nu++; });
  if (!nu && !lf) return '';
  var b = ['재원 ' + (list.length - nu - lf)];
  if (nu) b.push('미등록 ' + nu);
  if (lf) b.push('퇴원 ' + lf);
  return ' · ' + b.join(' · ');
}
function asTiles(list, only){
  var T = { att:0, late:0, abs:0, move:0, done:0, ex:0 };
  list.forEach(function(x){ T.att += x.t.att; T.late += x.t.late; T.abs += x.t.abs; T.move += x.t.move; T.done += x.t.done; T.ex += x.ex; });
  var base = T.att + T.late + T.abs;
  var risk = list.filter(function(x){ return x.t.abs >= 2 || x.t.late >= 3; }).length;
  var h = '<div class="as-tiles">' +
    (only ? asTile('학생', only.n, (only.s ? only.s + ' ' : '') + only.g + (only.tc ? ' · ' + only.tc + 'T' : ''), 'hero')
          : asTile('대상 학생', list.length + '명', asScope() + asCntNote(list), 'hero')) +
    asTile('출석률', base ? (T.att / base * 100).toFixed(1) + '%' : '—', base ? '출석 ' + T.att + '회' : '기록 없음', 'hero') +
    asTile('지각', T.late + '회', '') +
    asTile('결석', T.abs + '회', T.abs ? '보충 완료 ' + T.done + ' · 미완 ' + (T.abs - T.done) : '') +
    asTile('1회 이동', T.move + '회', '') +
    (only ? asTile('보충 미완', (only.t.abs - only.t.done) + '건', only.t.abs ? '결석 ' + only.t.abs + '건 중' : '결석 없음')
          : asTile('주의 학생', risk + '명', '결석 2회 · 지각 3회 이상')) +
    '</div>';
  if (T.ex) h += '<div class="as-warn">일요일 논술 특강 ' + T.ex + '건은 집계에서 뺐어요.</div>';
  return h;
}
function asTrend(list){
  var w = asData.weeks, n = w.length, agg = [];
  for (var i = 0; i < n; i++) agg.push({ l:0, a:0, m:0 });
  list.forEach(function(x){ x.w.forEach(function(v, i){ agg[i].l += v[1]; agg[i].a += v[2]; agg[i].m += v[3]; }); });
  var tot = { l:0, a:0, m:0 };
  agg.forEach(function(g){ tot.l += g.l; tot.a += g.a; tot.m += g.m; });
  var num = function(v, cls){ return '<td class="as-tn' + (v ? ' ' + cls : ' zero') + '">' + (v || '·') + '</td>'; };
  var rows = [['지각','l','as-tl'], ['결석','a','as-ta'], ['1회 이동','m','as-tm']].map(function(r){
    return '<tr><th class="as-tk">' + r[0] + '</th>' +
      agg.map(function(g){ return num(g[r[1]], r[2]); }).join('') +
      '<td class="as-tt">' + (tot[r[1]] || '·') + '</td></tr>';
  }).join('');
  var sums = agg.map(function(g){ return g.l + g.a + g.m; });
  var head = '<tr><th class="as-tk"></th>' + w.map(function(x, i){
      return '<th class="as-th' + (i === n - 1 ? ' now' : '') + '" title="' + esc(x.r) + '">' + esc(x.l) + '</th>';
    }).join('') + '<th class="as-th as-tt">합계</th></tr>';
  var foot = '<tr class="as-tsum"><th class="as-tk">합</th>' +
    sums.map(function(v){ return '<td class="as-tn' + (v ? '' : ' zero') + '">' + (v || '·') + '</td>'; }).join('') +
    '<td class="as-tt">' + (tot.l + tot.a + tot.m) + '</td></tr>';
  return '<p class="as-h">주차별 지각 · 결석 · 1회 이동 <small>' +
    (list.length === 1 ? '이 학생이 어느 주에 흔들렸는지 봐요' : '숫자가 큰 주 = 그 주에 문제가 몰린 주') + '</small></p>' +
    '<div class="as-twrap"><table class="as-tbl"><thead>' + head + '</thead><tbody>' + rows + foot + '</tbody></table></div>';
}

function asGroupRow(key, list, worst){
  var T = { att:0, late:0, abs:0, move:0 };
  list.forEach(function(x){ T.att += x.t.att; T.late += x.t.late; T.abs += x.t.abs; T.move += x.t.move; });
  var base = T.att + T.late + T.abs, rate = base ? T.att / base * 100 : 0;
  var per = base ? (T.late + T.abs) / base * 100 : 0;
  var bw = worst ? Math.max(3, per / worst * 100) : 0;
  var lw = (T.late + T.abs) ? T.late / (T.late + T.abs) * 100 : 0;
  var closed = asS.gclosed[key];
  return '<tr class="as-g' + (closed ? ' closed' : '') + '"><td class="as-no"></td><th class="as-cn" style="text-align:left">' +
    '<button class="as-gbtn" type="button" onclick="asGToggle(\'' + esc(key) + '\')">' +
    '<svg class="as-car" width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>' +
    esc(key) + '<span class="as-gcnt">' + list.length + '명</span></button></th>' +
    '<td colspan="' + (asS.weeks * 3) + '" style="padding:7px 10px"><div style="display:flex;align-items:center;gap:9px;flex-wrap:wrap">' +
    '<span class="as-gbar" title="' + esc('수업 100회당 지각·결석 ' + per.toFixed(1) + '건') + '">' +
    '<i style="width:' + (bw * lw / 100) + '%;background:#D18F1E"></i>' +
    '<i style="width:' + (bw * (100 - lw) / 100) + '%;background:#BC4438"></i></span>' +
    '<span class="as-sub">100회당 ' + per.toFixed(1) + '건 · 지각 ' + T.late + ' · 결석 ' + T.abs + ' · 이동 ' + T.move + '</span>' +
    '</div></td>' +
    '<td class="as-cs"><div class="as-rate' + (base && rate < 90 ? ' warn' : '') + '">' + (base ? rate.toFixed(1) + '%' : '—') + '</div></td></tr>';
}

function asMatrix(list){
  if (!list.length) return '<p class="as-none">조건에 맞는 학생이 없어요.</p>';
  var body = '', tail = '';
  if ((asS.view === 'grade' || asS.view === 'school') && !asS.sub){
    // 재원 명단에 없는 학생은 아직 등록 전인 미등록생 — 학년·학교를 알 수 없어 따로 묶는다
    var keyf = (asS.view === 'grade')
      ? function(x){ return x.known ? (x.g || '(학년 미상)') : (x.left ? '(퇴원)' : '(미등록생)'); }
      : function(x){ return x.known ? (x.s || '(학교 미상)') : (x.left ? '(퇴원)' : '(미등록생)'); };
    var groups = {};
    list.forEach(function(x){ (groups[keyf(x)] = groups[keyf(x)] || []).push(x); });
    var keys = Object.keys(groups);
    if (asS.view === 'grade'){
      var ord = ['고1','고2','고3','중2','중3'];
      keys.sort(function(a, b){ return (ord.indexOf(a) + 1 || 99) - (ord.indexOf(b) + 1 || 99); });
    } else keys.sort(function(a, b){ return groups[b].length - groups[a].length; });
    var tailG = { '(미등록생)':1, '(퇴원)':2 };
    keys.sort(function(a, b){ return (tailG[a] || 0) - (tailG[b] || 0); });
    var worst = 0;
    keys.forEach(function(k){
      var T = { att:0, late:0, abs:0 };
      groups[k].forEach(function(x){ T.att += x.t.att; T.late += x.t.late; T.abs += x.t.abs; });
      var base = T.att + T.late + T.abs;
      if (base) worst = Math.max(worst, (T.late + T.abs) / base * 100);
    });
    keys.forEach(function(k){
      body += asGroupRow(k, groups[k], worst);
      if (asS.gclosed[k]) return;
      asSort(groups[k]).slice(0, 6).forEach(function(x, i){ body += asBookRow(x, i + 1); });
      if (groups[k].length > 6)
        body += '<tr><td class="as-cn" style="padding:5px 9px !important"><span class="as-meta">외 ' +
                (groups[k].length - 6) + '명 — 위에서 ' + esc(k) + ' 을 고르면 전부 보여요</span></td>' +
                '<td colspan="' + (asS.weeks * 3) + '"></td></tr>';
    });
  } else {
    var sorted = asSort(list);
    var shown = Math.min(asS.limit, sorted.length);
    sorted.slice(0, shown).forEach(function(x, i){ body += asBookRow(x, i + 1); });
    if (sorted.length > shown)
      tail = '<button class="as-more" type="button" onclick="asMore()">' + shown + ' / ' + sorted.length + '명 표시 중 · 40명 더 보기</button>';
  }
  return '<p class="as-h">' + esc(asScope()) + ' 주차별 기록부 <small>칸의 시간 = 그 주에 들은 수업. 이름을 누르면 상세가 펼쳐져요</small></p>' +
    '<div class="as-mwrap"><table class="as-mx as-bk">' + asBookHead() + '<tbody>' + body + '</tbody></table></div>' +
    asLegend() + tail;
}

    '<span><i style="background:#F6D9D7"></i>결 = 결석</span>' +

/* ── 이달의 신입생 — 전체 시간표 하단 카드 (2026-08-22 사용자 요청)
 * superstar 신입 등록의 등록일 기준, 기존 newStudents 액션 재사용 (백엔드 변경 없음) */
var nsCache = {}, nsLoading = {}, nsMonth = '';
function nsMonthNow(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function newStuSection(){
  if (!nsMonth) nsMonth = nsMonthNow();
  var card = document.createElement('div');
  card.className = 'ns-card';
  card.id = 'ns-card';
  nsRender(card);
  return card;
}
function nsMove(n){
  var p = nsMonth.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1);
  nsMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  var card = $('ns-card');
  if (card) nsRender(card);
}
function nsSlotsTT(st){
  var parts = [];
  if (st.classA) parts.push('가 ' + st.classA);
  if (st.classB) parts.push('나 ' + st.classB);
  if (st.progress && st.progress !== st.classA) parts.push('진도 ' + st.progress);
  if (st.checkup && st.checkup !== st.classB) parts.push('확인 ' + st.checkup);
  return parts.length ? parts.join(' · ') : '시간표 미배정';
}
function nsRender(card){
  var m = nsMonth;
  var list = nsCache[m];
  var h = '<div class="ns-head"><b>' + (+m.slice(5)) + '월 신입생</b>' +
    '<span class="ns-cnt">' + (list && list.length ? list.length + '명' : '') + '</span><span class="sp"></span>' +
    '<button type="button" class="ah-wk" onclick="nsMove(-1)">◀ 지난달</button>' +
    '<button type="button" class="ah-wk" onclick="nsMove(1)">다음달 ▶</button></div>';
  if (!list){
    card.innerHTML = h + '<p class="ns-empty">' + (list === null
      ? '목록을 불러오지 못했어요. <button type="button" class="ah-wk" onclick="nsRetry()">다시 시도</button>'
      : '불러오는 중…') + '</p>';
    if (list !== null) nsLoad(m);
    return;
  }
  if (!list.length){
    card.innerHTML = h + '<p class="ns-empty">' + (+m.slice(5)) + '월에 등록한 신입생이 없어요.</p>' +
      '<p class="ns-note">등록일 기록은 2026-08-19부터예요 — 그 전에 등록한 학생은 표시되지 않아요.</p>';
    return;
  }
  h += list.map(function(st){
    return '<div class="ns-row"><b>' + esc(st.name) + '</b>' +
      '<span class="ns-meta">' + esc([st.school, st.grade].filter(Boolean).join(' ')) +
      (st.teacher ? ' · ' + esc(st.teacher) + 'T' : '') + '</span>' +
      '<span class="ns-slot">' + esc(nsSlotsTT(st)) + '</span>' +
      '<span class="ns-date">' + (+st.date.slice(5, 7)) + '/' + (+st.date.slice(8, 10)) + ' 등록</span></div>';
  }).join('');
  card.innerHTML = h + '<p class="ns-note">신입 등록·수정은 슈퍼스타 관리의 신입 등록에서 해요 (등록일 기록은 2026-08-19부터).</p>';
}
function nsRetry(){
  delete nsCache[nsMonth];
  var card = $('ns-card');
  if (card) nsRender(card);
}
function nsLoad(m){
  if (nsLoading[m]) return;
  nsLoading[m] = true;
  fetch(ENDPOINT + '?action=newStudents&pw=' + encodeURIComponent(pw) + '&month=' + m + '&t=' + Date.now())
    .then(function(r){ return r.json(); }).catch(function(){ return null; })
    .then(function(d){
      nsLoading[m] = false;
      nsCache[m] = (d && d.result === 'success') ? (d.students || []) : null;   // null = 실패 표시
      var card = $('ns-card');
      if (card && nsMonth === m) nsRender(card);
    });
}

/* ══════════════════════════════════════════════════════════════════════
 * 카카오 알림톡 — 결석 알림 (2026-09-11 사용자 결정 "솔라피로 할게요. 결석 알림부터")
 * 결석을 저장하면(개별·복수 선택) 확인 창을 띄워 학생·학부모에게 알림톡을 보낸다 — 자동 발송은 없다,
 * 조교가 잘못 찍은 결석이 바로 학부모에게 가면 곤란해서. 발송·기록·설정은 전부 백엔드(alimSend/alimLog/
 * alimConfig/alimConfigSet)에서, 여기는 창만. 번호는 출석 창 연락처와 같은 stuPhones(수파베이스 students).
 * 함수 접두 alim, 스타일 .al-*.
 * ══════════════════════════════════════════════════════════════════════ */
var alimCfg = null, alimCfgBusy = false, alimCfgCbs = [];
var alimLogByDate = {};   // 'yyyy-MM-dd' → { 'plain이름': {ts, ok, message, who, byWho:{받는분:{ts,ok,message}}} } — 그 날짜 결석 알림 발송 여부
function alimCfgEnsure(cb, force){
  if (alimCfg && !force){ if (cb) cb(alimCfg); return; }
  if (cb) alimCfgCbs.push(cb);
  if (alimCfgBusy) return;
  alimCfgBusy = true;
  fetch(ENDPOINT + '?action=alimConfig&pw=' + encodeURIComponent(pw) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){ alimCfg = (d && d.result === 'success') ? d : { ready:false, templates:{}, error:(d && d.message) || '조회 실패' }; })
    .catch(function(){ alimCfg = { ready:false, templates:{}, error:'연결 실패' }; })
    .then(function(){ alimCfgBusy = false; alimCfgCbs.splice(0).forEach(function(f){ f(alimCfg); }); });
}
function alimLogEnsure(ymd, cb, force){
  if (alimLogByDate[ymd] && !force){ if (cb) cb(alimLogByDate[ymd]); return; }
  fetch(ENDPOINT + '?action=alimLog&pw=' + encodeURIComponent(pw) + '&from=' + ymd + '&to=' + ymd + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      var m = {};
      ((d && d.rows) || []).slice().reverse().forEach(function(r){   // 오래된 것부터 덮어 마지막 시도가 남게
        if (r.kind !== 'absent') return;
        var k = plainName(r.student), w = r.who || '';
        var e = m[k] || (m[k] = { byWho: {} });
        if (!e.byWho[w] || r.ok || !e.byWho[w].ok) e.byWho[w] = { ts: r.ts, ok: r.ok, message: r.message };
      });
      // 받는 분별 기록을 묶어 요약 — 한 사람이라도 받았으면 ok, who는 받은 사람들('학부모1·학생')
      Object.keys(m).forEach(function(k){
        var e = m[k], ws = Object.keys(e.byWho), okW = ws.filter(function(w){ return e.byWho[w].ok; });
        var last = ws.map(function(w){ return e.byWho[w]; }).filter(function(x){ return !okW.length || x.ok; })
          .sort(function(a, b){ return String(b.ts).localeCompare(String(a.ts)); })[0] || {};
        e.ok = okW.length > 0; e.ts = last.ts || ''; e.message = last.message || ''; e.who = okW.length ? okW.join('·') : ws.join('·');
      });
      alimLogByDate[ymd] = m;
    })
    .catch(function(){ alimLogByDate[ymd] = alimLogByDate[ymd] || {}; })
    .then(function(){ if (cb) cb(alimLogByDate[ymd]); });
}
/* 알림 문구 변수: 수업일 '9/11(금) 5:30' · 반이름 '고1 가' */
function alimVarsOf(c, nm, ymd){
  var d = wedOfYmd(ymd), dn = ['일','월','화','수','목','금','토'][d.getDay()];
  return { '학생명': plainName(nm), '수업일': mdOf(d) + '(' + dn + ') ' + (c ? c.start : ''), '반이름': c ? c.cls : '' };

function alimFill(text, vars){ return String(text || '').replace(/#\{([^}]+)\}/g, function(_, k){ return vars[k] != null ? vars[k] : ''; }); }

function multiApply(status){

  var cids = Object.keys(byClass);

  if (!confirm(sel.length + '명을 일괄 ' + label + ' 처리할까요?')) return;
  var done = 0, total = 0, absDone = [];   // absDone: 결석으로 기록된 {cid,nm} — 알림톡 확인 창용
  var next = function(i){
    if (i >= cids.length){

           status:status, overwrite:'1' }, label + ' 처리 중… (' + (i+1) + '/' + cids.length + ')', function(res){

          total += res.cleared || 0;
        } else {
          (res.marked || []).forEach(function(nm){ attend[attKey(cid, nm)] = { status: status, memo: '' }; absDone.push({ cid: cid, nm: nm }); });
          total += (res.marked || []).length;
        }
      }
      next(i + 1);
    });
  };
  next(0);
}

/* 반 일괄 출석 — 오늘 이 반에서 수업하는 학생(1회 이동 온 학생 포함, 나간 학생 제외) 중
 * 아직 기록이 없는 학생을 모두 '출석'으로. 지각·결석 등 기존 기록은 유지. */
function bulkAttend(c){
  var away = {}, temps = [];
  onceOutThisWeek().forEach(function(o){ if (o.fromId === c.id) away[o.student.replace(/\(.*\)$/, '')] = true; });
  onceInToday().forEach(function(o){ if (o.toId === c.id) temps.push(o.student); });
  var targets = c.students.filter(function(nm){ return !away[nm.replace(/\(.*\)$/, '')]; }).concat(temps);
  targets = targets.filter(function(nm){ return !attend[attKey(c.id, nm)]; });
  if (!targets.length){ setStatus(c.cls + ' — 모든 학생이 이미 기록되어 있어요.', 'ok'); return; }
  if (!confirm(labelOf(c) + '\n기록 없는 학생 ' + targets.length + '명을 모두 출석 처리할까요?\n(지각·결석 등 기존 기록은 그대로 둡니다)')) return;
  post({ action:'attendSetBulk', book:book, date:todayStr(), classId:c.id, students:targets },
    '일괄 출석 처리 중…', function(res){
      if (res && res.result === 'success'){
        (res.marked || []).forEach(function(nm){ attend[attKey(c.id, nm)] = { status:'출석', memo:'' }; });
        render();
        setStatus(c.cls + ' — ' + (res.marked || []).length + '명 출석 처리 완료.' +
                  (res.skipped ? ' (기존 기록 ' + res.skipped + '명 유지)' : ''), 'ok');

function futureOncePlan(cid, nm){

/* ── 학생·학부모 연락처 (2026-08-26 사용자 요청 "출석 체크 이름을 누르면 연락처가 뜨게") ──
 * students의 phone_* 열(교사 페이지라 조회 가능 — 학생 화면에는 노출 안 됨)을 한 번 받아 두고
 * 출석 창에 표시한다. 번호를 누르면 바로 전화(tel:) — 휴대폰에서 유용. */
var stuPhones = null, stuPhonesBusy = false, stuPhonesCbs = [];
function stuPhonesEnsure(cb){
  if (stuPhones){ if (cb) cb(); return; }
  if (cb) stuPhonesCbs.push(cb);
  if (stuPhonesBusy) return;
  stuPhonesBusy = true;
  fetch('https://bangdbhqpphqqdwcledg.supabase.co/rest/v1/students?select=name,phone_student,phone_parent1,phone_parent2',
        { headers: { apikey: 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT' } })
    .then(function(r){ if (!r.ok) throw new Error('students ' + r.status); return r.json(); })
    .then(function(rows){
      stuPhones = {};
      rows.forEach(function(r){
        var k = plainName(r.name);
        if (k) stuPhones[k] = { ps: String(r.phone_student || '').trim(),
                                p1: String(r.phone_parent1 || '').trim(),
                                p2: String(r.phone_parent2 || '').trim() };
      });
    })
    .catch(function(e){ console.warn('연락처 조회 실패', e); stuPhones = {}; })
    .then(function(){ stuPhonesBusy = false; stuPhonesCbs.splice(0).forEach(function(f){ f(); }); });
}
function phoneFmt(p){
  p = String(p || '').replace(/\D/g, '');
  if (p.length === 11) return p.slice(0,3) + '-' + p.slice(3,7) + '-' + p.slice(7);
  if (p.length === 10) return p.slice(0,3) + '-' + p.slice(3,6) + '-' + p.slice(6);
  return p;
}
function stuPhoneOf(nm){
  if (!stuPhones) return null;
  var p = plainName(nm);
  return stuPhones[p] || (/A$/.test(p) ? stuPhones[p.slice(0, -1)] : stuPhones[p + 'A']) || null;
}

      if (s.p1) parts.push('학부모님1 <a href="tel:' + s.p1 + '">' + phoneFmt(s.p1) + '</a>');
      if (s.p2) parts.push('학부모님2 <a href="tel:' + s.p2 + '">' + phoneFmt(s.p2) + '</a>');

    el.innerHTML = parts.length ? parts.join('<span class="tel-sep">·</span>')

/* 반 종류 그룹: 고1 가 / 고1 나 / 고3파이널 / 정리정독 중N / 논술 */
function classGroupKey(cls){
  var c = String(cls || '').trim();
  var m = c.match(/^(고[123])\s*(가|나)$/);
  if (m) return m[1] + ' ' + m[2];
  if (/^고3\s*파이널/.test(c)) return '고3파이널';
  m = c.match(/^정리정독\s*중(\d)/);
  if (m) return '정리정독 중' + m[1];
  if (/^논술/.test(c)) return '논술';
  return c;
}

    (cands.length

            '<b>' + esc(x.cls) + '</b> · ' + esc(x.day) + esc(x.start) + '~' + esc(x.end) +

/* ── 지난 'M/D부터' 표기 자동 정리 (2026-08-28 사용자 확정 "등원 전 친구들은 특이사항으로
 * 처리 + 날짜가 지나면 표기를 지우고요") ────────────────────────────────
 * 등원 시작 전 학생은 '김민재B(9/4부터)'처럼 표기해 두는데, 시작일이 지나면 낡은 안내가
 * 된다. 시간표를 불러온 뒤 하루 한 번(시간표별, localStorage tt_notesweep) 지난 표기를
 * 찾아 기존 표기수정 경로(timetableRenameStudent — 짝 반·시트·기록 동일 처리)로 지운다. */
function noteExpiredMd(note, today){
  var m = /^(\d{1,2})\/(\d{1,2})부터$/.exec(String(note || '').trim());
  if (!m) return false;
  var t = new Date(+today.slice(0,4), +today.slice(5,7)-1, +today.slice(8,10));
  // 표기에 연도가 없어 올해·작년 두 날짜로 본다 — 지난 지 1~180일이면 만료.
  // 반년 넘게 지난 것으로만 해석되는 날짜는 내년 예정으로 보고 두는다('12/28부터'를 11월에 적은 경우 등).
  return [t.getFullYear(), t.getFullYear() - 1].some(function(y){
    var d = new Date(y, +m[1] - 1, +m[2]);
    var diff = (t - d) / 86400e3;
    return diff >= 1 && diff <= 180;
  });
}
function noteSweep(){
  var today = todayStr();
  var done = {};
  try { done = JSON.parse(localStorage.getItem('tt_notesweep') || '{}'); } catch(e){}
  if (done[book] === today) return;
  var targets = [], seen = {};
  (classes || []).forEach(function(c){
    if (!c || c.wk) return;   // '이 주만' 반 명단은 원본 반을 따라가므로 원본 쪽에서 정리된다
    (c.students || []).forEach(function(nm){
      if (seen[nm]) return; seen[nm] = 1;
      // 마지막 괄호만 표기로 본다 — nameNote는 "(화정)심지후(8/21부터)"처럼
      // 앞 괄호(학교 구분)가 있으면 첫 괄호부터 통째로 잡아 여기서는 못 쓴다
      var m0 = /\(([^)]*)\)\s*$/.exec(String(nm || ''));
      if (m0 && noteExpiredMd(m0[1], today)) targets.push(nm);
    });
  });
  // 실패해도 같은 날 되풀이하지 않는다 — 내일 다시 시도된다
  done[book] = today;
  try { localStorage.setItem('tt_notesweep', JSON.stringify(done)); } catch(e){}
  if (!targets.length) return;
  (function next(i){
    if (i >= targets.length){
      setStatus('시작일이 지난 표기를 지웠어요: ' + targets.map(plainName).join(', '), 'ok');
      load(true);
      return;
    }
    // 뒤 괄호(표기)만 뗀다 — 앞 괄호는 내신 확인반 학교 구분이라 남겨야 한다
    var to = targets[i].replace(/\([^)]*\)$/, '');
    post({ action:'timetableRenameStudent', book:book, from:targets[i], to:to },
      '지난 표기 정리 중…', function(){ next(i + 1); });
  })(0);
}

/* ── 그 주에만 적용되는 명단 변경 (2026-08-23 사용자 요청) ─────────────
 * 정규 명단은 그대로 두고 기록만 남긴다 — 다른 주차·전체 시간표·학생 페이지에 영향 없음. */
function wkDayLabel(dstr){
  if (!dstr) return '';
  var d = new Date(+dstr.slice(0,4), +dstr.slice(5,7)-1, +dstr.slice(8,10));
  return mdOf(d) + ' (' + ['일','월','화','수','목','금','토'][d.getDay()] + ')';
}
/* '옮길 주' 선택 — 이번 주부터 15주 뒤까지(지금 보는 주가 그 밖이면 거기까지 이어서).
 * 값은 그 주 수요일(yyyy-MM-dd). 시간표 구분(정규/내신)이 지금 화면과 다른 주는
 * 그 주 화면에 이 시간표가 나타나지 않으므로 고를 수 없게 잠근다.
 * (10/5주차 수업을 8/24주차에 당겨서 하기 — 2026-08-23 사용자 요청) */
function weekSelHtml(id, defWed){
  var cur = weekStartOf(new Date());
  var first = (defWed < cur) ? new Date(defWed) : new Date(cur);
  var defY = ymdOf(defWed), curY = ymdOf(cur);
  var opts = [], w = new Date(first.getFullYear(), first.getMonth(), first.getDate());
  for (var i = 0; i < 40; i++){
    var wy = ymdOf(w), ds = weekDatesOf(w), bk = periodOf(w);
    var label = mdOf(ds['월']) + '~' + mdOf(ds['일']) + ' 주 · ' + bk +
      (wy === defY ? ' — 지금 보는 주' : (wy === curY ? ' — 이번 주' : ''));
    opts.push('<option value="' + wy + '"' + (wy === defY ? ' selected' : '') +
              (bk !== book ? ' disabled' : '') + '>' + label + '</option>');
    if (i >= 15 && wy >= defY) break;
    w.setDate(w.getDate() + 7);
  }
  return '<select id="' + id + '" style="font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:6px;">' +
    opts.join('') + '</select>';
}
/* 이 주만 있는 반 만들기 — 그 주의 그 요일 하루만 시간표에 나타난다 */
/* 기존 반 고르기 — 병렬 반이 이름이 같아 요일·시간을 붙여 구분한다 */
function wkSrcOptions(){
  return classes.filter(function(c){ return !c.wk; })
    .slice().sort(function(a,b){ return a.cls.localeCompare(b.cls,'ko') || (mins(a.start)-mins(b.start)); })
    .map(function(c){
      return '<option value="'+esc(c.id)+'">'+esc(c.cls)+' · '+esc(c.day)+' '+esc(c.start)+
             (c.teacher ? ' · '+esc(c.teacher)+'T' : '')+' ('+c.students.length+'명)</option>';
    }).join('');
}
/* '이 주만' 반을 만들기 전 — 그 날짜·같은 강사의 겹치는 수업이 있으면 한 번 물어본다
 * (2026-09-13 사용자 승인 "확인창 만들어줘" — 겹침 나란히 표시와 한 세트).
 * 일부러 겹치게 여는 보충은 [확인]으로 그대로 진행되고, 실수만 걸러 준다.
 * 담당T가 빈 값이면 묻지 않는다. excludeId = 그 날짜에 어차피 숨는 원본 반(옮기기 자기 자신). */
function wkOverlapOk(dstr, dayName, s, e, teacher, excludeId){
  var t = String(teacher || '').trim();
  if (!t) return true;
  var hit = classes.filter(function(c){
    if (excludeId && c.id === excludeId) return false;
    if (String(c.teacher || '').trim() !== t) return false;
    if (c.wk ? c.wk !== dstr : c.day !== dayName) return false;
    if (wkOffAt(c.id, dstr) || wkMovedAway(c.id, dstr)) return false;   // 그 날짜엔 안 하는 수업
    return mins(c.start) < e && minsEnd(c) > s;
  });
  if (!hit.length) return true;
  var lines = hit.map(function(c){ return '· ' + c.cls + ' — ' + c.start + '~' + c.end + (c.loc ? ' (' + c.loc + ')' : ''); });
  return confirm(t + 'T의 같은 시간에 이미 수업이 있어요.\n\n' + lines.join('\n') +
                 '\n\n일부러 겹치게 여는 수업이면 [확인]을 눌러 그대로 만들고,\n실수라면 [취소]를 눌러 시간을 바꿔 주세요.');
}

      '<label style="display:block;font-size:.9rem;margin-top:4px;"><input type="radio" name="nc-mode" value="move"> 원래 수업은 이 주에 안 함 — 시간만 옮김</label>'+

    '<p class="merr" id="nc-err"></p>'+
    '<div class="mbtns"><button onclick="closeModal()">취소</button>'+

  if ($('nc-day')) $('nc-day').value = defDay;

/* 원본 반을 고르면 이름·시간·담당·위치를 그 반 값으로 채운다 (반이름은 잠금 — 같은 반 수업이므로) */
function wkAddSrcChange(){
  var id = $('nc-src') ? $('nc-src').value : '';
  var c = id ? classes.find(function(x){ return x.id === id; }) : null;
  if ($('nc-srcopt')) $('nc-srcopt').style.display = c ? '' : 'none';
  var nm = $('nc-cls');
  if (!c){
    if (nm){ nm.readOnly = false; nm.style.background = ''; nm.value = ''; }
    return;
  }
  if ($('nc-start')) $('nc-start').value = timeValOf(mins(c.start));   // 옛 표기('10:00'=밤10시 끝)도 정확한 칸에 맞춘다
  if ($('nc-end')) $('nc-end').value = timeValOf(minsEnd(c));
  if ($('nc-loc')) $('nc-loc').value = c.loc || '';
  if ($('nc-teacher')) $('nc-teacher').value = c.teacher || '';
  if (nm){ nm.value = c.cls; nm.readOnly = true; nm.style.background = 'var(--icon-bg)'; }
}
function submitAddWeekClass(){
  var d = $('nc-day').value, st = $('nc-start').value, en = $('nc-end').value;
  var loc = $('nc-loc').value.trim(), teacher = $('nc-teacher').value.trim(), cls = $('nc-cls').value.trim();
  var reason = ($('nc-reason') ? $('nc-reason').value : '').trim();
  var kind = kindSelVal();   // '' 보통 / '직보' 직전보강 (2026-09-20)
  var kindNote = kind === '직보' ? ' 직전보강 표시(직)를 붙였어요.' : '';
  if (!cls){ $('nc-err').textContent = '반이름을 입력해 주세요.'; return; }
  var st0 = mins(st), en0 = mins(en);
  if (en0 <= st0) en0 += 12*60;
  if (en0 <= st0 || en0 > 24*60){ $('nc-err').textContent = '끝 시간이 시작보다 빨라요. (수업은 오전 7시 ~ 밤 12시)'; return; }
  var dstr = ymdOf(weekDates()[d]);
  // 기존 반을 고른 경우 — 그 반의 복사본으로 열어 명단이 그대로 따라오게 한다
  var srcId = $('nc-src') ? $('nc-src').value : '';
  var src = srcId ? classes.find(function(x){ return x.id === srcId; }) : null;
  if (src){
    var modeEl = document.querySelector('input[name="nc-mode"]:checked');
    var isMove = modeEl && modeEl.value === 'move';
    var srcDate = ymdOf(weekDates()[src.day]);   // 원래 수업이 있는 이 주의 날짜
    if (isMove && srcDate === dstr && st0 === mins(src.start)){
      $('nc-err').textContent = '원래 수업과 같은 요일·시간이에요. 옮길 시간을 골라주세요.'; return;
    }
    if (!wkOverlapOk(dstr, d, st0, en0, teacher, (isMove && srcDate === dstr) ? src.id : '')) return;
    closeModal();
    post({ action: isMove ? 'timetableWeekClassMove' : 'timetableWeekClassExtra',
           book:book, fromId:src.id, date:srcDate, newDate:dstr,
           day:d, start:st, end:en, loc:loc, teacher:teacher, reason:reason, kind:kind },
      '반을 만드는 중…', function(res){
        if (res && res.result === 'success'){

function submitWeekBulkAdd(cid, d){
  var c = classes.find(function(x){ return x.id === cid; }); if (!c) return;
  var srcId = $('wb-src') ? $('wb-src').value : '';
  var src = srcId ? classes.find(function(x){ return x.id === srcId; }) : null;
  if (!src){ $('wb-err').textContent = '반을 골라주세요.'; return; }
  var reason = ($('wb-reason') ? $('wb-reason').value : '').trim();
  // 이미 그 날 이 반에 들어와 있는 학생은 건너뛴다
  var have = {};
  c.students.forEach(function(nm){ have[plainName(nm)] = 1; });
  weekOnce.forEach(function(o){
    if (o.kind === '주간추가' && o.toId === cid && (o.date === d || o.ymd === d)) have[plainName(o.student)] = 1;
  });
  var list = src.students.filter(function(nm){ return !have[plainName(nm)]; });
  if (!list.length){ $('wb-err').textContent = '넣을 학생이 없어요 (이미 다 들어와 있어요).'; return; }
  if (!confirm(src.cls + ' 학생 ' + list.length + '명을 ' + wkDayLabel(d) + ' ' + c.cls + ' 에 넣을까요?')) return;
  closeModal();
  var okN = 0, failN = 0;
  (function step(i){
    if (i >= list.length){
      setStatus(okN + '명을 ' + wkDayLabel(d) + ' ' + c.cls + ' 에 넣었어요.' +
                (failN ? ' (' + failN + '명 실패 — 다시 시도해 주세요)' : ''), failN ? 'err' : 'ok');
      load(true);
      return;
    }
    setStatus('학생을 넣는 중… (' + (i + 1) + '/' + list.length + ')');
    post({ action:'timetableWeekAdd', book:book, student:list[i], toId:cid, date:d, reason:reason },
      '학생을 넣는 중… (' + (i + 1) + '/' + list.length + ')', function(res){
        if (res && res.result === 'success') okN++; else failN++;
        step(i + 1);
      });
  })(0);
}

/* ── 학생 한 명을 다른 주차로 옮기기 (2026-08-26 사용자 요청 "10/5주차 확인 수업을 이번주차로
 *    이동하는 경우 반을 한꺼번에 이동할 수가 없어요. 한명한명 옮기는 경우가 있어요") ──
 * 반 전체 옮기기([이 주만 시간 옮기기])와 별개로, 일부 학생만 다른 주에 미리/늦게 듣는 경우.
 * 원래 주에는 '주간빼기'(이 주 빠짐), 옮긴 주의 반에는 '주간추가'(이 주 학생) — 기존 두 기록을
 * 한 번에 남긴다. 되돌리기도 기존 칩 그대로(각 주에서 칩을 눌러 되돌림). */
function smClsOptions(selId){
  var norm = classes.filter(function(x){ return !x.wk; })
    .slice().sort(function(a,b){ return a.cls.localeCompare(b.cls,'ko') || (mins(a.start)-mins(b.start)); })
    .map(function(x){
      return '<option value="'+esc(x.id)+'"'+(x.id===selId?' selected':'')+'>'+esc(x.cls)+' · '+esc(x.day)+' '+esc(x.start)+
             (x.teacher ? ' · '+esc(x.teacher)+'T' : '')+'</option>';
    }).join('');
  // 새로 만든 '이 주만' 반에도 넣을 수 있다 (2026-08-26 사용자 요청) — 날짜가 지난 것은 제외
  var mon = new Date(weekStartOf(new Date())); mon.setDate(mon.getDate() - 2);
  var monY = ymdOf(mon);
  var wks = classes.filter(function(x){ return x.wk && x.wk >= monY; })
    .slice().sort(function(a,b){ return a.wk < b.wk ? -1 : a.wk > b.wk ? 1 : (mins(a.start)-mins(b.start)); })
    .map(function(x){
      return '<option value="'+esc(x.id)+'"'+(x.id===selId?' selected':'')+'>'+esc(x.cls)+' · '+esc(wkDayLabel(x.wk))+' '+esc(x.start)+
             (x.teacher ? ' · '+esc(x.teacher)+'T' : '')+'</option>';
    }).join('');
  return norm + (wks ? '<optgroup label="이 주만 있는 반 (날짜가 정해져 있어요)">'+wks+'</optgroup>' : '');
}
/* '이 주만' 반을 고르면 수업 날짜가 반에 정해져 있다 — 옮길 주 선택을 그 주로 맞추고 잠근다 */
function smClsChange(){
  var t = classes.find(function(x){ return x.id === ($('sm-cls') ? $('sm-cls').value : ''); });
  var wsel = $('sm-week'); if (!wsel) return;
  var wk = t && t.wk;
  wsel.disabled = !!wk;
  if (wk){
    var d0 = new Date(+wk.slice(0,4), +wk.slice(5,7)-1, +wk.slice(8,10));
    var wy = ymdOf(weekStartOf(d0));
    for (var i = 0; i < wsel.options.length; i++){
      if (wsel.options[i].value === wy){ wsel.value = wy; break; }
    }
  }
}

/* 학생 검색 목록 — 영구 추가·주간 추가 공용 (roster 캐시 사용) */
function pickStudent(onPick){
  var renderList = function(q){
    q = (q||'').trim();
    var rows = (roster||[]).filter(function(s){ return !q || s.name.indexOf(q)>=0 || (s.school||'').indexOf(q)>=0; }).slice(0, 40);

        }).join('')
      : '<span class="subnote">검색 결과가 없어요.</span>';
  };
  var wire = function(){
    $('add-q').addEventListener('input', function(){ renderList(this.value); });
    $('add-list').addEventListener('click', function(e){
      var b = e.target.closest('button[data-add-nm]'); if (!b) return;
      onPick(b.getAttribute('data-add-nm'));

    renderList('');
  };
  if (roster) { wire(); }
  else {
    $('add-list').innerHTML = '<span class="subnote">명단을 불러오는 중…</span>';
    fetch(ENDPOINT + '?action=roster&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ roster = (d && d.students) || []; wire(); })
      .catch(function(){ if ($('add-err')) $('add-err').textContent = '명단을 불러오지 못했어요.'; });

 * [시간표에서 직접 고르기]로 옛 방식(반 블록 클릭)도 그대로 쓸 수 있다. */
function startOnceMoveById(cid, nm){

}
function startOnceMoveGrid(cid, nm){

function onceOptLabel(t){
  return t.day + ' ' + t.start + (t.teacher ? ' · ' + t.teacher + 'T' : '') + (t.loc ? ' · ' + t.loc : '');
}
/* 1회 이동은 같은 학년·같은 이름의 반으로만 간다(2026-08-28 사용자 확정 "동일한 학년내에서
 * 동일한 이름의 반으로만 이동") — 다른 반 전체 목록은 빼고, 같은 이름 수업만 보인다.
 * 단 새로 만든 '이 주만' 반(w*)은 이름과 무관하게 항상 포함(사용자 요청) — smClsOptions와 같은 취급. */
/* 반이름 끝의 구분 알파벳 한 글자를 뗀 기본 이름 — 고3파이널A~F(2026-08-28 사용자 확인 "6개의 반"),
 * 내신 화수A/B처럼 알파벳만 다른 반은 한 묶음으로 본다. 교재 괄호("고2 화수A(동아 문학)")는 떼고 비교.
 * '논술B 국어'처럼 끝이 알파벳이 아니면 그대로라 다른 과목과 섞이지 않는다. */
function onceBaseCls(s){
  return String(s || '').trim().replace(/\([^)]*\)\s*$/, '').trim().replace(/[A-Za-z]$/, '').trim();
}
function oncePickOptions(c){
  var exact = [], sect = [];
  classes.forEach(function(x){
    if (x.wk || x.id === c.id) return;
    if (x.cls.trim() === c.cls.trim()) exact.push(x);
    else if (onceBaseCls(x.cls) && onceBaseCls(x.cls) === onceBaseCls(c.cls)) sect.push(x);
  });
  var byDayTime = function(a,b){ return (DAYS.indexOf(a.day) - DAYS.indexOf(b.day)) || (mins(a.start) - mins(b.start)); };
  exact.sort(byDayTime);
  sect.sort(function(a,b){ return a.cls.localeCompare(b.cls,'ko') || byDayTime(a,b); });
  var same = exact.concat(sect);
  // 새로 만든 '이 주만' 반 — 날짜가 반에 정해져 있고, 지난 날짜 것은 제외
  var mon = new Date(weekStartOf(new Date())); mon.setDate(mon.getDate() - 2);
  var monY = ymdOf(mon);
  var wks = classes.filter(function(x){ return x.wk && x.wk >= monY && x.id !== c.id; })
    .sort(function(a,b){ return a.wk < b.wk ? -1 : a.wk > b.wk ? 1 : (mins(a.start) - mins(b.start)); });
  var h = same.map(function(x, i){
    // 반이름을 항상 붙인다 — 같은 수업의 반인지 이름으로 확인할 수 있게 (2026-08-28 사용자 요청)
    var label = x.cls.trim() + ' · ' + onceOptLabel(x);
    return '<option value="'+esc(x.id)+'"'+(exact.length && i===0 ? ' selected' : '')+'>'+esc(label)+'</option>';
  }).join('');
  if (wks.length){
    h += '<optgroup label="새로 만든 \'이 주만\' 반 (날짜가 정해져 있어요)">' + wks.map(function(x){
      return '<option value="'+esc(x.id)+'">'+esc(x.cls)+' · '+esc(wkDayLabel(x.wk))+' '+esc(x.start)+
             (x.teacher ? ' · '+esc(x.teacher)+'T' : '')+'</option>';
    }).join('') + '</optgroup>';

function submitWeekTempMove(cid, nm, row, d){
  var t = classes.find(function(x){ return x.id === ($('sm-cls') ? $('sm-cls').value : ''); });
  if (!t){ $('sm-err').textContent = '옮길 반을 골라주세요.'; return; }
  var nd;
  if (t.wk){
    nd = t.wk;   // '이 주만' 반은 날짜가 반에 정해져 있다
  } else {
    var tw = $('sm-week') ? wedOfYmd($('sm-week').value) : new Date(weekStart);
    if (periodOf(tw) !== book){
      $('sm-err').textContent = '그 주는 ' + periodOf(tw) + ' 기간이라 이 ' + book + ' 시간표가 나타나지 않아요.'; return;
    }
    nd = ymdOf(weekDatesOf(tw)[t.day]);
  }
  if (nd === d && t.id === cid){
    $('sm-err').textContent = '지금과 같은 주·같은 반이에요. 옮길 주나 반을 골라주세요.'; return;
  }
  var reason = ($('sm-reason') ? $('sm-reason').value : '').trim();
  closeModal();
  // 새 반에 먼저 넣고, 성공하면 원래 '이 주만 추가' 기록을 지운다 — 중간에 실패해도 학생이 사라지지 않게
  post({ action:'timetableWeekAdd', book:book, student:nm, toId:t.id, date:nd, reason:reason },
    '옮기는 중…', function(res){
      if (!res || res.result !== 'success'){
        setStatus('옮기기 실패: ' + ((res && res.message) || '오류'), 'err'); return;
      }
      post({ action:'timetableWeekCancel', row:row }, '원래 기록을 정리하는 중…', function(res2){
        if (res2 && res2.result === 'success'){
          setStatus(plainName(nm) + ' — ' + wkDayLabel(nd) + ' ' + t.cls + ' 로 옮겼어요.', 'ok');

          setStatus(plainName(nm) + ' — ' + wkDayLabel(nd) + ' ' + t.cls + ' 에 추가는 됐지만, 원래 반의 [이 주] 표시를 지우지 못했어요. 원래 반에서 칩을 눌러 [되돌리기]를 해 주세요.', 'err');
        }
        loadWeek();
      });
    });
}

      if (res && res.result === 'success'){ setStatus((res.added||'') + ' 추가 완료.' + rosterNote(res), 'ok'); load(true); }
      else setStatus('추가 실패: ' + ((res && res.message) || '오류'), 'err');
    });

}

/* 반 만들기 폼 조각 — 영구 반 추가와 '이 주만 반 추가'가 함께 쓴다 */
function classFormHtml(dayFixed, step){
  // 시작: 오전 7:00 ~ 밤 11:30 / 끝: 오전 7:30 ~ 밤 12:00, 30분 단위 (2026-08-26 사용자 요청)
  // '이 주만' 반 계열(반 추가·보충·옮기기)은 15분 단위 (2026-09-11 수정 요청함 — 정규 반 만들기는 30분 유지)
  // 저장 값은 timeValOf 규칙 — 아침은 '오전7:00', 22시부터는 '밤10:00', 그 사이는 기존 '5:30' 표기 그대로
  // (mins/fmt12/timeValOf는 분 단위 어디든 왕복되고, 그리드 카드는 걸치는 30분 행에 얹혀 그려진다)
  step = (step === 15) ? 15 : 30;
  var startOpts = [], endOpts = [];
  for (var t = 7*60; t <= 23*60+30; t += step) startOpts.push(t);
  for (var t2 = 7*60+step; t2 <= 24*60; t2 += step) endOpts.push(t2);
  var partOf = function(m){ return m < 12*60 ? '오전' : m < 13*60 ? '낮' : m < 18*60 ? '오후' : m < 22*60 ? '저녁' : '밤'; };
  var timeSel = function(id, def, opts){
    var html = '<select id="'+id+'" style="font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:6px;">';
    var cur = '';
    opts.forEach(function(m){
      var g = partOf(m);
      if (g !== cur){ if (cur) html += '</optgroup>'; html += '<optgroup label="'+g+'">'; cur = g; }
      html += '<option value="'+timeValOf(m)+'"'+(m===def?' selected':'')+'>'+g+' '+fmt12(m)+'</option>';
    });
    return html + '</optgroup></select>';
  };
  var locs = [];
  classes.forEach(function(c){ if (c.loc && locs.indexOf(c.loc) < 0) locs.push(c.loc); });
  if (!locs.length) locs = ['본원','민트초코','화정센터','정리정독'];
  return '<div style="display:flex;gap:8px;"><div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">요일</label>'+
    '<select id="nc-day"'+(dayFixed ? ' disabled' : '')+' style="font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:6px;">'+
    DAYS.map(function(d){ return '<option'+(dayFixed===d?' selected':'')+'>'+d+'</option>'; }).join('')+'</select></div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">시작</label>'+timeSel('nc-start',17*60+30,startOpts)+'</div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">끝</label>'+timeSel('nc-end',19*60,endOpts)+'</div></div>'+
    '<div style="display:flex;gap:8px;margin-top:8px;"><div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">위치</label>'+
    '<input type="text" id="nc-loc" list="nc-locs" placeholder="예) 본원"><datalist id="nc-locs">'+
    locs.map(function(l){ return '<option>'+esc(l)+'</option>'; }).join('')+'</datalist></div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">담당T</label>'+
    '<input type="text" id="nc-teacher" list="nc-ts" placeholder="예) 주혜"><datalist id="nc-ts">'+
    TEACHER_ORDER.map(function(t){ return '<option>'+t+'</option>'; }).join('')+'</datalist></div></div>'+
    '<label style="font-size:.8rem;color:var(--ink-soft);display:block;margin-top:8px;">반이름</label>'+
    '<input type="text" id="nc-cls" placeholder="예) 고1 가 · 정리정독 중2 · 내신 화정고">';
}
function openAddClass(){
  openModal(
    '<h3>반 추가 — '+esc(book)+' 시간표</h3>'+

    '<p class="subnote">반이름이 \'가/나\'로 끝나면 학생 이동 시 리포트의 정규 가/나 칸에 연결돼요.</p>'+

function submitAddClass(){
  var d = $('nc-day').value, st = $('nc-start').value, en = $('nc-end').value;
  var loc = $('nc-loc').value.trim(), teacher = $('nc-teacher').value.trim(), cls = $('nc-cls').value.trim();

  // 표시 로직(minsEnd)과 같은 규칙: 끝이 시작보다 이르면 오후로 해석 — 저녁 8:30~10:00(밤) 허용

/* ── 결석자 영상보충 관리 ── */
var makeupList = [];
var mkOtherClasses = null;   // 다른 시간표(정규↔내신)의 반 목록 — 결석자 관리 라벨·반이동용
/* 결석자 관리는 정규·내신을 함께 다루므로, 그 건이 속한 시간표의 반 목록에서 찾는다.
   (2026-08-23 사용자 요청: 미완료 건은 주차가 정규→내신으로 바뀌어도 계속 보여야 한다) */
function mkClassesOf(bk){
  if (!bk || bk === book) return classes;
  if (mkOtherClasses) return mkOtherClasses;
  var c = cacheGet('list:' + bk);
  return (c && c.classes) || [];
}
function classLabelOf(cid, bk){
  var c = mkClassesOf(bk).find(function(x){ return x.id === cid; });
  return c ? (c.cls + ' (' + c.day + c.start + ' ' + c.teacher + 'T)') : cid;
}
function openMakeup(){
  openModal('<h3>결석자 관리</h3>'+
    '<p class="mdesc">반이동·무단 결석·당일 결석은 처리하면 바로 완료돼요.<br>영상·대면 보충은 일정을 적으면 보충 목록으로 넘어가고, 다녀가면 출석 버튼을 눌러 완료하세요.</p>'+
    '<div id="mk-list"><p class="subnote">불러오는 중…</p></div>'+
    '<div class="mbtns"><button onclick="closeModal()">닫기</button></div>', true);
  // 정규·내신을 함께 불러온다 — 주차가 바뀌어도 미완료 건이 목록에서 사라지지 않도록
  var other = (book === '정규') ? '내신' : '정규';
  var qs = '&pw=' + encodeURIComponent(pw) + '&t=' + Date.now();
  function mkGet(u){ return fetch(u).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
  Promise.all([
    mkGet(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent(book) + qs),
    mkGet(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent(other) + qs),
    cacheGet('list:' + other) ? Promise.resolve(null)
      : mkGet(ENDPOINT + '?action=timetableList&book=' + encodeURIComponent(other) + qs)
  ]).then(function(rs){
    if (rs[2] && rs[2].result === 'success')
      cacheSet('list:' + other, { classes: rs[2].classes || [], onceMoves: rs[2].onceMoves || [] });
    var oc = cacheGet('list:' + other);
    mkOtherClasses = (oc && oc.classes) || [];
    var mine = (rs[0] && rs[0].result === 'success') ? (rs[0].list || []) : null;
    if (mine === null){ $('mk-list').innerHTML = '<p class="subnote">불러오지 못했어요.</p>'; return; }
    var theirs = (rs[1] && rs[1].result === 'success') ? (rs[1].list || []) : [];
    makeupList = mine.map(function(m){ m.book = book; return m; })
      .concat(theirs.map(function(m){ m.book = other; return m; }));
    renderMakeup();
  }).catch(function(){ $('mk-list').innerHTML = '<p class="subnote">서버 연결에 실패했어요.</p>'; });
}
function mkDayOf(dateStr){
  var p = String(dateStr).split('-');
  if (p.length !== 3) return '';
  return ['일','월','화','수','목','금','토'][new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function mkIsVideo(m){ return !m.done && String(m.plan || '').indexOf('영상보충') === 0; }
function mkIsOffline(m){ var pl = String(m.plan || ''); return !m.done && (pl.indexOf('대면보충') === 0 || pl.indexOf('오프라인 보충') === 0); }
function mkSecOf(m){ return m.done ? 2 : ((mkIsVideo(m) || mkIsOffline(m)) ? 1 : 0); }
function renderMakeup(){
  var box = $('mk-list'); if (!box) return;
  if (!makeupList.length){ box.innerHTML = '<p class="subnote">결석 기록이 없어요.</p>'; return; }
  var sorted = makeupList.slice().sort(function(a, b){ return (mkSecOf(a) - mkSecOf(b)) || (a.date < b.date ? 1 : -1); });
  var html = '', sec = -1;
  var titles = ['미완료 — 처리 방법을 고르세요', '영상·대면 보충 — 다녀가면 출석을 눌러 완료', '완료'];
  sorted.forEach(function(m){
    var s = mkSecOf(m);
    if (s !== sec){ sec = s; html += '<p class="mk-sec">' + titles[s] + '</p>'; }
    var i = makeupList.indexOf(m);
    var planLine = m.plan
      ? '<div class="mk-plan">보충: <b>' + esc(m.plan) + '</b></div>'
      : '';
    var memoLine = m.mkMemo
      ? '<div class="mk-plan">메모: ' + esc(m.mkMemo) + '</div>'
      : '';
    var btnLine;
    var delBtn = '<button style="color:#B4574E;" onclick="deleteAbsence(' + i + ')">삭제</button>';
    if (m.done){
      btnLine = '<div class="mk-row">' +
        '<button onclick="openMkMemo(' + i + ')">메모</button>' +
        '<button onclick="saveMakeup(' + i + ', false)">미완료로</button>' + delBtn + '</div>';
    } else if (s === 1){
      var isOff = mkIsOffline(m);
      btnLine = '<div class="mk-row">' +
        '<button onclick="openMkMemo(' + i + ')">메모</button>' +
        '<button onclick="' + (isOff ? 'openMakeupOffline' : 'openMakeupVideo') + '(' + i + ')">일정 수정</button>' + delBtn +
        '<button class="done-btn" onclick="saveMakeup(' + i + ', true)">' + (isOff ? '보충 출석' : '영상보충 출석') + '</button></div>';
    } else {
      btnLine = '<div class="mk-row">' +
        '<button onclick="openMakeupMove(' + i + ')">이동</button>' +
        '<button onclick="openMakeupVideo(' + i + ')">영상보충</button>' +
        '<button onclick="openMakeupOffline(' + i + ')">대면보충</button>' +
        '<button onclick="noRemedy(' + i + ', \'무단 결석\')">무단 결석</button>' +
        '<button onclick="noRemedy(' + i + ', \'당일 결석\')">당일 결석</button>' +
        '<button onclick="openMkMemo(' + i + ')">메모</button>' + delBtn +
        '</div>' +
        (m.plan ? '<div class="mk-row" style="justify-content:flex-end;border-top:1px dotted var(--line);padding-top:6px;">' +
          '<button class="done-btn" onclick="saveMakeup(' + i + ', true)">처리 완료</button></div>' : '');
    }
    html += '<div class="mk-item' + (m.done ? ' done' : '') + '">' +
      '<div class="mk-top"><b>' + esc(plainName(m.student)) + '</b>' +
      '<small>' + esc(m.date) + ' (' + mkDayOf(m.date) + ') 결석 · ' + esc(classLabelOf(m.classId, m.book)) +
      (m.book === '내신' ? ' <b>(내신)</b>' : '') + (m.memo ? ' · ' + esc(m.memo) : '') + '</small></div>' +
      planLine + memoLine + btnLine +
      '</div>';
  });
  box.innerHTML = html;
}
/* 결석 기록 삭제 — 잘못 기록되거나 중복된 결석 건을 목록에서 지운다 (출석기록 행 삭제) */
function deleteAbsence(i){
  var m = makeupList[i]; if (!m) return;
  if (!confirm(plainName(m.student) + ' — ' + m.date + ' (' + mkDayOf(m.date) + ') 결석 기록을 지울까요?\n잘못 기록되거나 중복된 건만 지워주세요. 보충 일정·메모도 함께 사라져요.\n(같은 날 같은 반 중복 기록은 한 번에 한 건씩 지워져요)')) return;
  post({ action:'attendSet', book:(m.book || book), date:m.date, classId:m.classId, student:m.student, status:'', memo:'' },
    '기록을 지우는 중…', function(res){
      if (res && res.result === 'success'){
        setStatus(plainName(m.student) + ' — 결석 기록을 지웠어요.', 'ok');
        openMakeup();   // 목록 새로고침 (중복이었다면 남은 건이 보여요)
      } else setStatus('삭제 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}

/* 결석 건 메모 — 약속 변경·태도 등 */
function openMkMemo(i){

function saveMkMemo(i){

function saveMakeup(i, doneVal){
  var m = makeupList[i]; if (!m) return;

/* ── 오늘의 보충 방문 (2026-08-26 사용자 요청 — "영상보충은 해당 날짜의 오늘의 시간표에서",
 *    "사이드에 열었다 닫았다 할 수 있게") ──
 * 결석자 관리에 적힌 영상·대면 보충 일정("영상보충: 8/26(수) 6:00") 중 날짜가 오늘인 건을
 * 오늘의 시간표 오른쪽 패널(#vmpanel — 변경사항 패널과 같은 모양)로 보여 주고,
 * 그 자리에서 출석 완료 처리한다. 올 친구가 없는 날에도 패널에 '없습니다'로 알린다. */
var vmList = null, vmBusy = false;   // null = 아직 조회 전 ([다시 불러오기]가 비운다)
var vmHadAny = false;                // 오늘 원래 올 사람이 있었는지 — 빈 문구 구분용
/* 기본은 펼침 — 다만 좁은 화면에선 패널이 시간표를 통째로 덮어서 접어 둔다 (2026-09-21) */
var vmOpen = (sessionStorage.getItem('tt_vmopen') != null)
  ? sessionStorage.getItem('tt_vmopen') === '1'
  : window.innerWidth >= 1100;
function vmPlanMD(plan){
  var m = /(\d{1,2})\s*\/\s*(\d{1,2})/.exec(String(plan || ''));
  return m ? (+m[1]) + '/' + (+m[2]) : '';
}
function vmTodayMD(){ var t = new Date(); return (t.getMonth()+1) + '/' + t.getDate(); }
function vmEnsure(){
  if (mode !== 'today' || vmBusy || vmList !== null) return;
  vmBusy = true;
  var other = (book === '정규') ? '내신' : '정규';
  var qs2 = '&pw=' + encodeURIComponent(pw) + '&t=' + Date.now();
  function g(u){ return fetch(u).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
  Promise.all([
    g(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent(book) + qs2),
    g(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent(other) + qs2),
    cacheGet('list:' + other) ? Promise.resolve(null)
      : g(ENDPOINT + '?action=timetableList&book=' + encodeURIComponent(other) + qs2)
  ]).then(function(rs){
    vmBusy = false;
    if (rs[2] && rs[2].result === 'success')
      cacheSet('list:' + other, { classes: rs[2].classes || [], onceMoves: rs[2].onceMoves || [] });
    var all = [];
    if (rs[0] && rs[0].result === 'success') (rs[0].list || []).forEach(function(m){ m.book = book; all.push(m); });
    if (rs[1] && rs[1].result === 'success') (rs[1].list || []).forEach(function(m){ m.book = other; all.push(m); });
    var md = vmTodayMD();
    vmList = all.filter(function(m){ return (mkIsVideo(m) || mkIsOffline(m)) && vmPlanMD(m.plan) === md; });
    vmHadAny = vmList.length > 0;
    vmRenderSide();
  }).catch(function(){ vmBusy = false; });
}
/* 패널 표시 — 오늘의 시간표에서만. 변경사항 패널(chSync)과 같은 방식, 열림은 세션에 기억 */
function vmSyncPanel(){
  var el = $('vmpanel'); if (!el) return;

/* 결석 보충 — 다른 동일 시간표(같은 종류 반)로 1회 이동 */
/* 결석 날짜가 속한 수업 주차(수요일 시작, 월·화=직전보강) 기준으로 보충 갈 반(요일)의 적용 날짜.
   이미 지난 날짜면 한 주 뒤로. — 미래 결석(예: 다음주 일요일)의 보충이 이번 주로 기록되지 않게 한다. */
function mkApplyDate(absYmd, day){
  var off = { '수':0, '목':1, '금':2, '토':3, '일':4, '월':-2, '화':-1 }[day];
  if (off == null) return todayStr();
  var d = new Date(+absYmd.slice(0,4), +absYmd.slice(5,7)-1, +absYmd.slice(8,10));
  var dow = d.getDay();   // 0=일
  var wed = new Date(d);
  if (dow >= 3) wed.setDate(d.getDate() - (dow - 3));        // 수~토 → 그 주 수요일
  else if (dow === 0) wed.setDate(d.getDate() - 4);          // 일 → 지난 수요일
  else wed.setDate(d.getDate() + (3 - dow));                 // 월·화(직전보강) → 다가오는 수요일 주차
  var t = new Date(wed); t.setDate(wed.getDate() + off);
  var now = new Date(); now = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (t < now) t.setDate(t.getDate() + 7);
  return ymdOf(t);
}
function openMakeupMove(i){

  var g = classGroupKey(fromC.cls);
  var cands = mkCls.filter(function(x){ return x.id !== fromC.id && classGroupKey(x.cls) === g; })
    .sort(function(a, b){ return (DAY_IDX[a.day] - DAY_IDX[b.day]) || (mins(a.start) - mins(b.start)); });
  var dk = ['일','월','화','수','목','금','토'];
  function adLabelOf(ymd){
    var d = new Date(+ymd.slice(0,4), +ymd.slice(5,7)-1, +ymd.slice(8,10));

  openModal(

    (cands.length
      ? '<div class="pick-list" style="flex-direction:column;align-items:stretch;">'+
        cands.map(function(x){
          return '<button data-mk-to="' + esc(x.id) + '" style="text-align:left;border-radius:10px;padding:8px 12px;">'+
            '<b>' + esc(x.cls) + '</b> · ' + esc(x.day) + esc(x.start) + '~' + esc(x.end) +
            ' · ' + esc(x.teacher) + 'T (' + esc(x.loc) + ') · ' + x.students.length + '명'+
            ' · <b>' + esc(adLabelOf(mkApplyDate(m.date, x.day))) + ' 보충</b></button>';
        }).join('') + '</div>'
      : '<p class="subnote">같은 종류의 다른 반이 없어요. 영상보충 메모를 이용해 주세요.</p>')+
    '<div class="mbtns"><button onclick="openMakeup()">뒤로</button></div>', true
  );
  $('modal-box').querySelectorAll('button[data-mk-to]').forEach(function(b){
    b.addEventListener('click', function(){
      var t = mkCls.find(function(x){ return x.id === b.getAttribute('data-mk-to'); });
      if (!t) return;
      var ad = mkApplyDate(m.date, t.day);
      if (!confirm(plainName(m.student) + '\n' + fromC.cls + ' (' + m.date + ' 결석)\n→ ' + labelOf(t) + ' 에서 ' + adLabelOf(ad) + ' 1회 보충\n\n기록할까요?')) return;
      var reason = m.date.slice(5).replace('-', '/') + ' 결석 보충';
      post({ action:'timetableMove', book:(m.book || book), student:m.student, fromId:fromC.id, toId:t.id,
             moveType:'once', reason:reason, date:ad }, '보충 이동 기록 중…', function(res){
        if (!(res && res.result === 'success')){
          setStatus('보충 이동 실패: ' + ((res && res.message) || '오류'), 'err');
          openMakeup(); return;
        }
        // 결석 완료 처리는 백엔드(mkAutoComplete_)가 이동 기록과 함께 자동으로 한다
        setStatus(plainName(m.student) + ' — ' + (res.makeupDone || ('반 이동 보충: ' + t.cls + ' ' + t.day + t.start)) + ' 기록·완료 처리했어요.', 'ok');
        load(true);        // 1회 이동을 오늘·주차별 시간표에 반영

/* 이동 기록 */
/* ── 변경사항 패널 — 주차별·전체 시간표 오른쪽에 접었다 폈다 (2026-08-23 사용자 요청)
 * 옛 [이동 기록] 모달을 대체한다. 이동·빼기·추가 기록이 저장될 때마다 자동 갱신. */
var chOpen = sessionStorage.getItem('tt_chopen') === '1';
var chLoaded = false, chBusy = false;
var chRows = [], chKind = '';   // 받아 둔 기록 전체 + 고른 종류(빈 값이면 전체)
var chLimit = 100, chMayMore = false, chKeepScroll = null;   // [지난 기록 더 보기] — 100건씩 시작해 늘려 받는다

function chSync(){
  var el = $('chpanel'); if (!el) return;
  var show = (mode === 'all' || mode === 'week');
  el.hidden = !show;
  if (!show){ document.body.classList.remove('ch-on'); return; }
  el.classList.toggle('closed', !chOpen);
  document.body.classList.toggle('ch-on', chOpen);
  var tab = $('ch-tab');
  if (tab) tab.setAttribute('aria-expanded', chOpen ? 'true' : 'false');
  if (chOpen && !chLoaded) chLoad();
  // 화면(주차별/전체)·보는 주가 바뀌면 그 범위로 다시 거른다 — chSync는 renderTabs마다 불린다
  else if (chOpen && chLoaded){ chKinds(); chRender(); }
}
function chToggle(){
  chOpen = !chOpen;
  sessionStorage.setItem('tt_chopen', chOpen ? '1' : '0');
  chSync();
  // 패널이 여닫히면 본문 폭이 바뀌어 칩 줄바꿈이 달라진다 — 폭 전환(.22s)이 끝난 뒤 다시
  // 그려 칸 높이를 맞춘다. 안 하면 카드가 잘린다 (2026-08-26 사용자 신고 "오류가 종종 발생")
  setTimeout(function(){ if (mode === 'all' || mode === 'week') render(); }, 260);
}
/* 기록이 바뀌면 다음에 열 때 새로 불러오도록 표시 — 열려 있으면 즉시 갱신 */
function chDirty(){
  chLoaded = false;
  if (chOpen && !$('chpanel').hidden) chLoad();
}
function chLoad(force){
  var list = $('ch-list'); if (!list) return;
  if (chBusy) return;

  list.innerHTML = '<span class="ch-none">불러오는 중…</span>';
