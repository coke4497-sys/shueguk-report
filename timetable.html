<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>슈국 스케쥴 · 이수경국어</title>
<meta name="description" content="이수경국어 정규 수업 시간표 — 반 편성 확인 · 학생 이동 (교사용)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#C6D5D2; --surface:#FFFFFF;
    --ink:#2A332F; --ink-soft:#65726B;
    --accent:#4C6E66; --btn:#628C83; --icon-bg:#EBF0ED;
    --line:#D7E3DD; --line-soft:#E5EDE8; --radius:16px;
    --g1:#FBF3DA; --g2:#EFE7F5; --g3:#DFEBE6; --mid:#E9EDF8; --etc:#F3EAE4;
    --reg:#DCE8EF; --reg-ink:#454D51; --reg-line:#C4D6E1;      /* 캘린더 기간 색: 정규(기본)=파스텔 하늘색 */
    --exam:#E3DBEF; --exam-line:#CEC2E0; --exam-ink:#454D51;   /* 내신=파스텔 연보라 */
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,system-ui,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 70px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px;}
  header{padding:6px 4px 8px;text-align:center;}
  .backlink{display:inline-flex;align-items:center;gap:6px;margin:18px 0 0;color:var(--ink-soft);text-decoration:none;font-size:.86rem;}
  .backlink:hover{color:var(--accent);}
  .brand{font-family:"Gowun Batang",serif;font-size:1.35rem;font-weight:700;color:var(--accent);margin:0;}
  .sub{color:var(--ink-soft);font-size:.85rem;margin:4px 0 0;}

  .gate{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:26px 22px;margin:26px auto;max-width:380px;text-align:center;}
  .gate input{width:100%;font:inherit;font-size:1.05rem;text-align:center;letter-spacing:.2em;
    padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:14px 0 10px;}
  .gate button{width:100%;font:inherit;font-size:1rem;color:#fff;background:var(--btn);
    border:none;border-radius:12px;padding:13px;cursor:pointer;}
  .gate .err{color:#B4574E;font-size:.85rem;min-height:1.2em;margin:8px 0 0;}

  .bar{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:12px 14px;margin:10px 0;display:none;}
  .viewtabs{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .viewtabs button{font:inherit;font-size:.92rem;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:6px 14px;color:var(--ink);cursor:pointer;}
  /* 선택 = 기존 버튼 유지 + 채도 20% 증가 + 테두리, 스프링 애니메이션 */
  @keyframes ppyong{0%{transform:scale(.78)}45%{transform:scale(1.13)}70%{transform:scale(.95)}100%{transform:scale(1)}}
  .viewtabs button.on{background:var(--icon-bg);filter:saturate(1.2);
    color:var(--accent);font-weight:700;
    animation:ppyong .38s cubic-bezier(.34,1.56,.64,1);}
  /* 정규/내신 토글 — 전체 시간표 제목 옆 (2026-08-22 사용자 확정: 메인 메뉴에서 이동) */
  .bookwrap{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;}
  .bookwrap button{font:inherit;font-size:.88rem;background:#fff;border:none;border-radius:0;
    padding:6px 14px;color:var(--ink);cursor:pointer;}
  .bookwrap button.on{background:var(--icon-bg);filter:saturate(1.2);
    color:var(--accent);font-weight:700;
    animation:ppyong .38s cubic-bezier(.34,1.56,.64,1);}
  .today-head{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.1rem;color:var(--accent);margin:14px 4px 2px;}
  .weeknav-tt{display:flex;align-items:center;gap:10px;margin:14px 4px 8px;}
  .weeknav-tt button{font:inherit;font-size:.88rem;background:var(--icon-bg);color:var(--ink);
    border:1px solid var(--line-soft);border-radius:10px;padding:6px 12px;cursor:pointer;}
  .weeknav-tt b{font-family:"Gowun Batang",serif;font-size:1.05rem;color:var(--accent);}
  .weeknav-tt small{color:var(--ink-soft);}
  .dhead small{font-weight:400;font-size:.72rem;opacity:.9;margin-left:4px;}
  .today-sum{font-size:.82rem;color:var(--ink-soft);margin:0 4px 10px;}
  .today-sum b{color:var(--accent);}
  /* 슈국 캘린더 */
  /* 주차 안내 배너 — 정규/내신 모두 연한 그레이 (내신은 살짝 진하게) */
  .pbadge{display:none;font-size:.88rem;font-weight:700;color:#454D51;background:#EAEDEF;
    border:1px solid #D8DDE0;border-radius:10px;padding:7px 14px;margin:0 0 8px;}
  .pbadge.exam{background:#DDE1E4;border-color:#C9CFD3;}
  .cal-head{display:flex;align-items:center;gap:10px;margin:14px 4px 10px;flex-wrap:wrap;}
  .cal-head button{font:inherit;font-size:.88rem;background:var(--icon-bg);border:1px solid var(--line-soft);border-radius:10px;padding:6px 12px;cursor:pointer;color:var(--ink);}
  .cal-head b{font-family:"Gowun Batang",serif;font-size:1.05rem;color:var(--accent);}
  .cal-head small{flex-basis:100%;color:var(--ink-soft);font-size:.78rem;}
  .calgrid{display:grid;grid-template-columns:88px repeat(7,1fr);gap:4px;margin:0 4px 8px;}
  .cal-dh{text-align:center;font-weight:700;font-size:.82rem;color:var(--ink-soft);padding:2px 0;}
  .cal-period{display:flex;flex-direction:column;gap:4px;justify-content:center;}
  .cal-period button{font:inherit;font-size:.76rem;border:1px solid var(--line);background:#fff;color:var(--ink-soft);border-radius:8px;padding:4px 2px;cursor:pointer;}
  .cal-period button.on-reg{background:var(--reg);border-color:var(--reg-line);color:var(--reg-ink);font-weight:700;}
  .cal-period button.on-exam{background:var(--exam);border-color:var(--exam-line);color:var(--exam-ink);font-weight:700;}
  .cal-cell{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;min-height:76px;padding:6px 8px;cursor:pointer;}
  .cal-cell:hover{border-color:var(--accent);}
  .cal-cell.other{opacity:.4;}
  .cal-cell.today{outline:2px solid var(--accent);outline-offset:-1px;}
  .cal-cell .dnum{font-weight:700;font-size:.82rem;}
  .cal-cell.holiday{background:#FBF4F2;}
  .cal-cell.memoed{background:#FAF5DF;}   /* 메모 있는 날 = 파스텔 레몬 */
  .cal-cell .dnum.hd{color:#B4574E;}
  .cal-cell .hname{font-size:.68rem;font-weight:700;color:#B4574E;margin-left:4px;word-break:keep-all;}
  .cal-cell .cmemo{font-size:.7rem;color:var(--ink-soft);margin-top:3px;line-height:1.45;max-height:4.3em;overflow:hidden;word-break:break-word;white-space:pre-wrap;}
  /* 지필고사 일정 — 달력 과목 칩 + 접이식 섹션 */
  .cal-exam{font-size:.64rem;border-radius:6px;padding:1px 5px;margin-top:2px;border:1px solid rgba(0,0,0,.07);line-height:1.45;word-break:keep-all;}
  .cal-exam b{font-size:.66rem;}
  .exs-cnt{font-weight:400;font-size:.78rem;color:var(--ink-soft);font-family:"Gowun Dodum",sans-serif;margin-left:8px;}
  .cal-exam-first{font-weight:700;color:#B4574E;}
  /* 휴대폰 달력 요약 배지 — 누르면 날짜 팝업으로 상세 */
  .cal-sum{display:flex;flex-direction:column;gap:2px;margin-top:3px;align-items:flex-start;}
  .cal-sum span{font-size:.62rem;font-weight:700;border-radius:6px;padding:1px 5px;white-space:nowrap;}
  .cs-exam{background:var(--icon-bg);color:var(--accent);}
  .cs-first{background:#F8E8E5;color:#B4574E;}
  .cs-memo{background:#FAF5DF;color:#8A7B3A;}
  .exs-first{font-size:.72rem;font-weight:700;color:#B4574E;flex:none;}
  .exs-season{display:flex;gap:8px;margin:4px 0 8px;flex-wrap:wrap;}
  .exs-season button{font:inherit;font-size:.85rem;font-weight:700;border:1.5px solid var(--line);background:#fff;
    color:var(--ink-soft);border-radius:11px;padding:7px 15px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:1px;}
  .exs-season button small{font-size:.68rem;font-weight:400;}
  .exs-season button.on{border-color:var(--accent);color:var(--accent);background:var(--icon-bg);}
  .exs-season button:hover{border-color:var(--accent);}
  .exs-desc{font-size:.78rem;color:var(--ink-soft);margin:8px 0 10px;}
  .exs-row{display:flex;align-items:center;gap:9px;border:1px solid var(--line-soft,#E5EDE8);border-radius:10px;
    padding:7px 10px;margin-bottom:6px;font-size:.84rem;flex-wrap:wrap;}
  .exs-tag{font-size:.76rem;font-weight:700;border-radius:12px;padding:2px 10px;border:1px solid rgba(0,0,0,.08);flex:none;}
  .exs-range{font-weight:700;}
  .exs-note{color:var(--ink-soft);font-size:.78rem;}
  .exs-acts{margin-left:auto;display:flex;gap:6px;flex:none;}
  .exs-acts button{font:inherit;font-size:.74rem;border:1px solid var(--line);background:#fff;border-radius:8px;padding:3px 9px;cursor:pointer;color:var(--ink-soft);}
  .exs-acts button:hover{color:var(--accent);border-color:var(--accent);}
  .exs-none{font-size:.8rem;color:var(--ink-soft);margin:6px 0;}
  .exs-sub-h{font-size:.8rem;font-weight:700;color:var(--ink-soft);margin:12px 0 6px;}
  .exs-sub-d{font-size:.78rem;font-weight:700;margin:10px 0 4px;}
  .exs-sub-d b{color:#B4574E;}   /* 여러 학교 겹치는 날 = 직전보강 몰리는 날 */
  .exs-add{display:flex;gap:8px;margin-top:10px;}
  .exs-add button{font:inherit;font-size:.82rem;font-weight:700;border:1.5px solid var(--line);background:#fff;
    color:var(--accent);border-radius:10px;padding:8px 13px;cursor:pointer;}
  .exs-add button:hover{border-color:var(--accent);}
  .exs-filter{display:flex;gap:6px;margin:10px 0 2px;}
  .exs-filter button{font:inherit;font-size:.78rem;border:1px solid var(--line);background:#fff;border-radius:999px;
    padding:4px 13px;cursor:pointer;color:var(--ink-soft);}
  .exs-filter button.on{background:var(--icon-bg);color:var(--accent);font-weight:700;border-color:var(--accent);}
  /* 시트 형식 타임라인 — 월·날짜·요일 축 + 학교 막대, 주말·오늘 세로 띠, 격줄 배경 (겹침 확인) */
  .exs-tl{display:grid;gap:2px;align-items:center;margin:4px 0 14px;overflow-x:auto;padding-bottom:2px;}
  .exs-tl-m{font-size:.68rem;font-weight:700;color:var(--accent);white-space:nowrap;text-align:left;
    align-self:end;padding:0 0 2px 3px;border-bottom:1px solid var(--line);}
  .exs-tl-m span{position:sticky;left:83px;display:inline-block;}   /* 가로 스크롤에도 달 이름이 시야에 남게 */
  .exs-tl-d{font-size:.64rem;color:var(--ink-soft);text-align:center;white-space:nowrap;}
  .exs-tl-w{font-size:.56rem;color:var(--ink-soft);text-align:center;white-space:nowrap;}
  .exs-tl-d.we,.exs-tl-w.we{color:#C9827A;}
  .exs-tl-d.td,.exs-tl-w.td{font-weight:700;color:var(--accent);}
  .exs-tl-col{align-self:stretch;border-radius:5px;}
  .exs-tl-col.we{background:#FAF3F1;}
  .exs-tl-col.td{background:#E3EDE6;box-shadow:inset 0 0 0 1px #BCD0C3;}
  .exs-tl-track{align-self:stretch;background:rgba(76,110,102,.045);border-radius:5px;}
  .exs-tl-n{font-size:.74rem;font-weight:700;white-space:nowrap;padding:2px 8px 2px 2px;
    position:sticky;left:0;z-index:3;background:var(--surface);}
  .exs-tl-nd{display:block;font-size:.6rem;font-weight:400;color:var(--ink-soft);line-height:1.2;}
  .exs-tl-c{position:sticky;left:0;z-index:3;background:var(--surface);align-self:stretch;}
  .exs-tl-bar{font:inherit;font-size:.64rem;font-weight:700;color:var(--ink);border:1px solid rgba(0,0,0,.12);
    border-radius:7px;padding:2px 4px;cursor:pointer;white-space:nowrap;overflow:hidden;height:22px;line-height:1.3;z-index:2;}
  .exs-tl-bar:hover{filter:brightness(.95);}
  /* 막대 아래 과목 칸 — 시트처럼 그 날짜 칸에 학년·과목, 빈 칸 클릭 = 입력 */
  .exs-tl-sb{align-self:stretch;background:#fff;border:1px solid var(--line);border-radius:0 0 7px 7px;min-height:16px;}
  .exs-tl-s{align-self:stretch;display:flex;flex-direction:column;justify-content:center;z-index:1;
    font-size:.58rem;line-height:1.3;text-align:center;padding:1px 1px 2px;cursor:pointer;color:var(--ink);word-break:keep-all;}
  .exs-tl-s.has{font-weight:700;}
  .exs-tl-s.inbox{border-left:1px dashed var(--line-soft);}
  .exs-tl-s.out{background:#fff;border:1px solid var(--line);border-radius:6px;}
  .exs-tl-s:hover{background:var(--icon-bg);}
  .exs-tl-s:not(.has):hover::after{content:'+';color:var(--ink-soft);font-weight:700;}
  .exs-tl-cap{font-size:.76rem;font-weight:700;color:var(--ink-soft);margin:10px 0 4px;}
  .memobox{background:var(--surface);border:1px solid var(--line-soft);border-radius:14px;padding:14px 16px;margin:16px 4px 8px;}
  .memobox .memotitle{font-family:"Gowun Batang",serif;font-weight:700;color:var(--accent);margin:0 0 8px;font-size:.98rem;}
  .memobox textarea{width:100%;box-sizing:border-box;font:inherit;font-size:.9rem;border:1px solid var(--line);
    border-radius:10px;padding:9px 11px;min-height:64px;resize:vertical;background:#fff;color:var(--ink);}
  .memoact{display:flex;align-items:center;gap:10px;margin-top:8px;}
  .memoact button{font:inherit;font-size:.88rem;background:var(--btn);color:#fff;border:1px solid var(--btn);
    border-radius:10px;padding:7px 16px;cursor:pointer;}
  .memoact span{font-size:.82rem;color:var(--accent);}
  .wm-row{display:flex;gap:12px;align-items:flex-start;padding:8px 6px;border-top:1px solid var(--line-soft);cursor:pointer;border-radius:8px;}
  .wm-row:hover{background:var(--icon-bg);}
  .wm-day{flex:none;width:78px;font-size:.85rem;font-weight:700;color:var(--ink-soft);}
  .wm-text{font-size:.88rem;line-height:1.6;white-space:pre-wrap;word-break:break-word;min-width:0;}
  .wm-none{font-size:.85rem;color:var(--ink-soft);opacity:.55;}
  /* 출석 칩 색 — '나' 수업 블록의 채도 낮춘 필터에서 보이던 부드러운 톤을 전 반 공통으로 (2026-08-22 사용자 확정,
     saturate(.35) 결과값을 그대로 색으로 고정) */
  .blk .stus button.note{background:#E5E9EE;color:#4E5864;}
  .blk .stus button.at-ok{background:#778683;color:#fff;}
  .blk .stus button.at-late{background:#E8E2D5;color:#5D5544;}
  .blk .stus button.at-abs{background:#E2D9D8;color:#614643;text-decoration:line-through;}
  .att-btns{display:flex;gap:8px;margin:10px 0 4px;}
  .att-btns button{flex:1;font:inherit;font-size:.95rem;border-radius:10px;padding:11px 4px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);}
  .att-btns button.pick-ok.on{background:var(--btn);border-color:var(--btn);color:#fff;}
  .att-btns button.pick-late.on{background:#B08A3E;border-color:#B08A3E;color:#fff;}
  .att-btns button.pick-abs.on{background:#B4574E;border-color:#B4574E;color:#fff;}
  .viewtabs .sp{flex:1;}
  /* 메인 메뉴 — 보기 탭은 개별 버튼(2026-08-22 사용자 확정: 붙은 세그먼트는 모바일 이어 컴퓨터에서도 분리) */
  .viewtabs .seg{display:inline-flex;gap:6px;flex-wrap:wrap;}
  .cluster{display:inline-flex;align-items:center;gap:6px;background:#F6F9F7;border:1px solid var(--line-soft);
    border-radius:12px;padding:4px 7px 4px 11px;flex-wrap:wrap;}
  .cluster .clabel{font-size:.76rem;color:var(--ink-soft);font-weight:700;white-space:nowrap;}
  .cluster button{font:inherit;font-size:.82rem;background:#fff;border:1px solid var(--line-soft);
    border-radius:9px;padding:5px 11px;cursor:pointer;color:var(--ink);white-space:nowrap;}
  .cluster button:hover{color:var(--accent);}
  .viewtabs .iconbtn{width:34px;height:34px;display:inline-flex;align-items:center;justify-content:center;flex:none;
    padding:0;background:var(--icon-bg);border:1px solid var(--line-soft);border-radius:10px;color:var(--accent);cursor:pointer;}
  .viewtabs .iconbtn svg{width:17px;height:17px;}
  /* 시간표 카드 안 도구줄 */
  .toolline{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  .toolline .sp{flex:1;}
  .sheet-title{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:6px 2px 10px;}
  .sheet-title b{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.1rem;color:var(--accent);}
  .sheet-title .sp{flex:1;}
  .sheet-title .mview-toggle{margin:0;}
  .attbar{display:none;gap:6px;align-items:center;flex-wrap:wrap;
    background:#F6F9F7;border:1px solid var(--line-soft);border-radius:12px;padding:6px 10px;}
  .attbar.show{display:flex;}
  .attbar .elabel{font-size:.78rem;color:var(--ink-soft);margin-right:2px;}
  .attbar button{font:inherit;font-size:.84rem;background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:9px;padding:5px 12px;color:var(--ink);cursor:pointer;}
  .attbar button.on{background:var(--icon-bg);filter:saturate(1.2);color:var(--accent);font-weight:700;animation:ppyong .38s cubic-bezier(.34,1.56,.64,1);}
  body.multisel .blk{cursor:pointer;}
  .stus button.msel{outline:2px solid var(--accent);outline-offset:1px;font-weight:700;}
  .searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
  /* 검색창 — 길게 + 세이지 라인 돋보기 아이콘 (2026-08-22 사용자 요청 "작아요") */
  .searchbar .searchbox{position:relative;display:inline-flex;align-items:center;max-width:100%;}
  .searchbar .searchbox svg{position:absolute;left:12px;width:16px;height:16px;color:var(--accent);pointer-events:none;}
  .searchbar input{font:inherit;font-size:.9rem;padding:7px 12px 7px 36px;border:1.5px solid var(--line);border-radius:10px;width:290px;max-width:100%;}
  .searchbar input:focus{outline:none;border-color:var(--accent);}
  #searchResults{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;align-items:center;color:var(--ink-soft);}
  #searchResults button{font:inherit;font-size:.8rem;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--ink);}
  #searchResults button b{color:var(--accent);}
  .blk.search-blk{outline:2px solid #B08A3E;}
  .stus button.search-hit{background:#B08A3E;border-color:#B08A3E;color:#fff;font-weight:700;}
  .editbar{display:none;gap:6px;align-items:center;flex-wrap:wrap;
    background:#F6F9F7;border:1px solid var(--line-soft);border-radius:12px;padding:6px 10px;}
  .editbar.show{display:flex;}
  .editbar .elabel{font-size:.78rem;color:var(--ink-soft);margin-right:2px;}
  .editbar button{font:inherit;font-size:.84rem;background:#fff;border:1px solid var(--line-soft);
    border-radius:9px;padding:5px 12px;color:var(--ink);cursor:pointer;}

<script>
/* ══ 수파베이스 연결부 (2026-08-22 DB 이전 1단계) ═══════════════════════
 * 기존 액션 API 호출(fetch)을 가로채 수파베이스로 보낸다 — 호출부는 그대로.
 *  · 읽기 전부: 수파베이스 (첫 화면·주차별·이력·랭킹 0.1~0.3초)
 *  · 출석·메모 쓰기: 수파베이스 먼저(즉시) + 기존 시트에 백그라운드 이중 기록
 *    (숙제 검사 배지·시트 열람이 시트를 읽는 동안 유지 — 백업 잡 도입 전까지)
 *  · 반·명단 구조 변경: 기존 백엔드 먼저(학생정보 연동 로직 유지) + 수파베이스 미러
 *  · 지필일정·1회이동 수정/취소: 수파베이스가 원본(행 번호 대신 id) — 시트 '지필일정'
 *    탭은 더 이상 갱신되지 않는다(supabase/README.md 참고)
 *  · 수파베이스 호출이 실패하면 자동으로 기존 백엔드로 폴백한다.
 * 미이전 액션(roster 등)은 그대로 기존 백엔드로 나간다. */
(function(){
  if (window.__sbAdapter) return; window.__sbAdapter = true;
  var SB = 'https://bangdbhqpphqqdwcledg.supabase.co/rest/v1';
  var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
  var rawFetch = window.fetch.bind(window);

  function hdr(extra){
    var h = { 'apikey': SB_KEY, 'Authorization': 'Bearer ' + SB_KEY, 'Content-Type': 'application/json' };
    if (extra) for (var k in extra) h[k] = extra[k];
    return h;
  }
  var PAGE = 1000;   // 수파베이스 REST 1회 응답 한도 — 넘으면 이어서 받는다
  function sbGet(path, _from, _acc){
    var from = _from || 0, acc = _acc || [];
    return rawFetch(SB + path, { headers: hdr({ 'Range-Unit': 'items', 'Range': from + '-' + (from + PAGE - 1) }) })
      .then(function(r){
        if (!r.ok) throw new Error('sb ' + r.status);
        return r.json();
      })
      .then(function(rows){
        acc = acc.concat(rows);
        if (rows.length < PAGE) return acc;
        return sbGet(path, from + PAGE, acc);
      });
  }
  function sbWrite(method, path, body, extra){
    return rawFetch(SB + path, { method: method, headers: hdr(extra), body: body == null ? undefined : JSON.stringify(body) })
      .then(function(r){
        if (!r.ok) return r.text().then(function(t){ throw new Error('sb ' + r.status + ' ' + t.slice(0,120)); });
        var rep = (extra && /representation/.test(extra['Prefer'] || ''));
        return rep ? r.json() : null;
      });
  }
  function q(v){ return encodeURIComponent(String(v == null ? '' : v)); }
  function plain(nm){ return String(nm || '').replace(/\(.*\)$/, '').trim(); }
  function pad2(n){ return String(n).padStart(2, '0'); }
  function localYmd(d){ return d.getFullYear() + '-' + pad2(d.getMonth()+1) + '-' + pad2(d.getDate()); }
  function tYmd(){ return localYmd(new Date()); }
  function atYmd(iso){ var d = new Date(iso); return isNaN(d) ? String(iso || '').slice(0,10) : localYmd(d); }
  function nowIso(){
    var d = new Date();
    return localYmd(d) + 'T' + pad2(d.getHours()) + ':' + pad2(d.getMinutes()) + ':' + pad2(d.getSeconds()) + '+09:00';
  }
  function applyYmdOf(g){ return (g.apply_date && /^\d{4}-\d{2}-\d{2}$/.test(g.apply_date)) ? g.apply_date : atYmd(g.at); }
  function isoBefore(ymdStr, days){
    var t = Date.parse(ymdStr || tYmd()); if (isNaN(t)) t = Date.now();
    return new Date(t - days * 86400000).toISOString();
  }
  function ok(o){ o.result = 'success'; return o; }
  function fake(data){ return { ok: true, status: 200, json: function(){ return Promise.resolve(data); } }; }
  function bookOf(v){ return String(v || '').trim() === '내신' ? '내신' : '정규'; }

  /* ── 공통 조회 ── */
  function fetchClasses(book){
    return sbGet('/tt_classes?book=eq.' + q(book) + '&order=id&select=class_id,day,start_time,end_time,location,teacher,name,roster')
      .then(function(rows){
        return rows.map(function(r){
          return { id: r.class_id, day: r.day, start: r.start_time, end: r.end_time,
                   loc: r.location, teacher: r.teacher, cls: r.name,
                   students: String(r.roster || '').trim().split(/\s+/).filter(String) };
        });
      });
  }
  function fetchOnceLogs(baseYmd){
    // 기록일 기준 (기준일-68일) 이후의 1회 이동 전체 — 적용일 필터는 호출부에서
    return sbGet('/tt_log?kind=eq.' + q('1회') + '&at=gte.' + q(isoBefore(baseYmd, 68)) + '&order=at');
  }
  function onceListShape(g){
    return { row: g.id, date: atYmd(g.at), ymd: applyYmdOf(g), student: g.student,
             fromId: g.from_class_id, toId: g.to_class_id, reason: g.reason };
  }
  function onceWeekShape(g){
    return { row: g.id, date: applyYmdOf(g), student: g.student,
             fromId: g.from_class_id, toId: g.to_class_id, reason: g.reason };
  }
  function fetchAttendRange(from, to, book){
    var p = '/attendance?date=gte.' + q(from) + '&date=lte.' + q(to) + '&order=date';
    if (book) p += '&book=eq.' + q(book);
    return sbGet(p);
  }
  function attTodayShape(a){ return { classId: a.class_id, student: a.student, status: a.status, memo: a.memo }; }
  function attWeekShape(a){ return { date: a.date, classId: a.class_id, student: a.student, status: a.status, memo: a.memo }; }

  /* ── GET 핸들러 ── */
  var GETS = {
    ttBoot: function(p){
      var book = bookOf(p.get('book'));
      var dateStr = (p.get('date') || '').trim();
      var mfrom = (p.get('mfrom') || '').trim() || dateStr, mto = (p.get('mto') || '').trim() || mfrom;
      var wfrom = (p.get('wfrom') || '').trim(), wto = (p.get('wto') || '').trim();
      var base = [tYmd(), wfrom || tYmd(), mfrom || tYmd()].sort()[0];
      var jobs = [
        fetchClasses(book),
        fetchOnceLogs(base),
        dateStr ? fetchAttendRange(dateStr, dateStr, book) : Promise.resolve([]),
        mfrom ? sbGet('/tt_memo?date=gte.' + q(mfrom) + '&date=lte.' + q(mto)) : Promise.resolve([]),
        sbGet('/tt_period?select=week_wednesday,book'),
        (wfrom && wto) ? fetchAttendRange(wfrom, wto, book) : Promise.resolve(null)
      ];
      return Promise.all(jobs).then(function(rs){
        var t = tYmd(), span = 8 * 86400000;
        var once = rs[1].filter(function(g){
          if (g.book !== book) return false;
          var am = Date.parse(applyYmdOf(g));
          return am && Math.abs(am - Date.parse(t)) <= span;
        }).map(onceListShape);
        var out = { book: book, date: dateStr,
          classes: rs[0], onceMoves: once,
          attend: rs[2].map(attTodayShape),
          memos: rs[3].filter(function(m){ return String(m.memo || '').trim(); })
                      .map(function(m){ return { date: m.date, memo: m.memo }; }),
          periods: rs[4].map(function(x){ return { week: x.week_wednesday, book: x.book }; }) };
        if (rs[5]){
          out.week = { attend: rs[5].map(attWeekShape),
            onceMoves: rs[1].filter(function(g){
              if (g.book !== book) return false;
              var a = applyYmdOf(g); return a >= wfrom && a <= wto;
            }).map(onceWeekShape) };
        }
        return ok(out);
      });
    },
    timetableList: function(p){
      var book = bookOf(p.get('book'));
      return Promise.all([fetchClasses(book), fetchOnceLogs(tYmd())]).then(function(rs){
        var t = Date.parse(tYmd()), span = 8 * 86400000;
        var once = rs[1].filter(function(g){
          if (g.book !== book) return false;
          var am = Date.parse(applyYmdOf(g));
          return am && Math.abs(am - t) <= span;
        }).map(onceListShape);
        return ok({ classes: rs[0], onceMoves: once });
      });
    },
    timetableWeek: function(p){
      var book = bookOf(p.get('book'));
      var from = (p.get('from') || '').trim(), to = (p.get('to') || '').trim();
      if (!from || !to) return Promise.resolve({ result:'error', message:'기간이 필요합니다.' });
      return Promise.all([fetchAttendRange(from, to, book), fetchOnceLogs(from)]).then(function(rs){
        return ok({ from: from, to: to, attend: rs[0].map(attWeekShape),
          onceMoves: rs[1].filter(function(g){
            if (g.book !== book) return false;
            var a = applyYmdOf(g); return a >= from && a <= to;
          }).map(onceWeekShape) });
      });
    },
    ttPeriodList: function(){
      return sbGet('/tt_period?select=week_wednesday,book').then(function(rows){
        return ok({ periods: rows.map(function(x){ return { week: x.week_wednesday, book: x.book }; }) });
      });
    },
    ttMemoList: function(p){
      var from = (p.get('from') || '').trim(), to = (p.get('to') || '').trim() || from;
      if (!from) return Promise.resolve({ result:'error', message:'기간이 필요합니다.' });
      return sbGet('/tt_memo?date=gte.' + q(from) + '&date=lte.' + q(to) + '&order=date').then(function(rows){
        return ok({ from: from, to: to,
          memos: rows.filter(function(m){ return String(m.memo || '').trim(); })
                     .map(function(m){ return { date: m.date, memo: m.memo }; }) });
      });
    },
    examSched: function(p){
      var from = (p.get('from') || '').trim(), to = (p.get('to') || '').trim();
      return sbGet('/exam_sched?order=start_date').then(function(rows){
        var periods = [], subjects = [];
        rows.forEach(function(r){
          var s = r.start_date, e = r.end_date || r.start_date;
          if (r.kind === '과목'){
            if ((from && s < from) || (to && s > to)) return;
            subjects.push({ row: r.id, school: r.school, date: s, text: r.text });
          } else {
            if ((from && e < from) || (to && s > to)) return;
            periods.push({ row: r.id, school: r.school, start: s, end: e, text: r.text });
          }
        });
        return ok({ periods: periods, subjects: subjects });
      });
    },
    attendStudent: function(p){
      var nm = plain(p.get('name')), from = (p.get('from') || '').trim(), to = (p.get('to') || '').trim();
      if (!nm || !from || !to) return Promise.resolve({ result:'error', message:'이름과 기간이 필요합니다.' });
      return Promise.all([
        sbGet('/attendance?student_plain=eq.' + q(nm) + '&date=gte.' + q(from) + '&date=lte.' + q(to) + '&order=date'),
        fetchOnceLogs(from)
      ]).then(function(rs){
        return ok({ name: nm, from: from, to: to,
          attend: rs[0].map(function(a){
            return { date: a.date, book: a.book, classId: a.class_id, status: a.status, memo: a.memo,
                     plan: a.makeup_plan, done: a.makeup_done === '1', mkMemo: a.makeup_memo };
          }),
          once: rs[1].filter(function(g){
            if (plain(g.student) !== nm) return false;
            var a = applyYmdOf(g); return a >= from && a <= to;
          }).map(function(g){
            return { date: applyYmdOf(g), book: g.book, fromId: g.from_class_id, toId: g.to_class_id, reason: g.reason };
          }) });
      });
    },
    attendWarnList: function(p){
      var from = (p.get('from') || '').trim(), to = (p.get('to') || '').trim();
      if (!from || !to) return Promise.resolve({ result:'error', message:'기간이 필요합니다.' });
      return Promise.all([fetchAttendRange(from, to, ''), fetchOnceLogs(from)]).then(function(rs){
        var agg = {};
        function of_(nm){ return agg[nm] || (agg[nm] = { name: nm, att: 0, late: 0, abs: 0, absDone: 0, move: 0, items: [] }); }
        rs[0].forEach(function(a){
          var nm = plain(a.student); if (!nm) return;
          var s = of_(nm);
          if (a.status === '출석'){ s.att++; return; }
          if (a.status !== '지각' && a.status !== '결석') return;
          var it = { date: a.date, kind: a.status, book: a.book, classId: a.class_id, memo: a.memo };
          if (a.status === '지각') s.late++;
          else {
            s.abs++;
            it.plan = a.makeup_plan; it.done = a.makeup_done === '1'; it.mkMemo = a.makeup_memo;
            if (it.done) s.absDone++;
          }
          s.items.push(it);
        });
        rs[1].forEach(function(g){
          var a = applyYmdOf(g); if (a < from || a > to) return;
          var nm = plain(g.student); if (!nm) return;
          var m = of_(nm); m.move++;
          m.items.push({ date: a, kind: '이동', book: g.book, fromId: g.from_class_id, toId: g.to_class_id, reason: g.reason });
        });
        var list = [];
        for (var k in agg) if (agg[k].late + agg[k].abs + agg[k].move > 0) list.push(agg[k]);
        return ok({ from: from, to: to, list: list });
      });
    },
    attendAbsentList: function(p){
      var book = bookOf(p.get('book'));
      return sbGet('/attendance?status=eq.' + q('결석') + '&book=eq.' + q(book) + '&order=date').then(function(rows){
        return ok({ list: rows.map(function(a){
          return { date: a.date, classId: a.class_id, student: a.student, memo: a.memo,
                   plan: a.makeup_plan, done: a.makeup_done === '1', mkMemo: a.makeup_memo };
        }) });
      });
    },
    timetableLog: function(){
      return sbGet('/tt_log?order=at.desc&limit=100').then(function(rows){
        return ok({ log: rows.map(function(g){
          return { row: g.id, date: atYmd(g.at), kind: g.kind, student: g.student,
                   fromCls: g.from_class, toCls: g.to_class, fromId: g.from_class_id, toId: g.to_class_id,
                   reason: g.reason, book: g.book };
        }) });
      });
    }
  };

  /* ── 쓰기 보조 ── */
  function legacyBg(body){
    // 시트 이중 기록 (백그라운드, 1회 재시도) — 숙제 검사 배지·시트 열람용
    function go(){
      return rawFetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) });
    }
    go().catch(function(){ setTimeout(function(){ go().catch(function(e){ console.warn('시트 이중 기록 실패', body.action, e); }); }, 3000); });
  }
  function legacyPost(body){
    return rawFetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
      .then(function(r){ return r.json(); });
  }
  function attKeyPath(b){
    return 'date=eq.' + q(b.date) + '&book=eq.' + q(bookOf(b.book)) + '&class_id=eq.' + q(b.classId) +
           '&student_plain=eq.' + q(plain(b.student));
  }
  function upsertAttend(rows){
    return sbWrite('POST', '/attendance?on_conflict=date,book,class_id,student_plain', rows,
                   { 'Prefer': 'resolution=merge-duplicates,return=minimal' });
  }
  function classRow(book, id){
    var list = (typeof classes !== 'undefined' && classes) || [];
    for (var i = 0; i < list.length; i++) if (list[i].id === id) return list[i];
    return null;
  }
  function classLabel(c){ return c ? c.cls : ''; }
  function setRoster(book, id, students){
    return sbWrite('PATCH', '/tt_classes?book=eq.' + q(book) + '&class_id=eq.' + q(id),
                   { roster: students.join(' ') });
  }
  function insertLog(rec){
    rec.at = rec.at || nowIso();
    ['from_class_id','from_class','to_class_id','to_class','reason'].forEach(function(k){ if (rec[k] == null) rec[k] = ''; });
    if (!('apply_date' in rec)) rec.apply_date = null;
    return sbWrite('POST', '/tt_log', rec);
  }
  function resyncClasses(book){
    // 구조 변경 뒤 자기 치유 — 기존 백엔드의 최신 명단으로 수파베이스를 맞춘다
    rawFetch(ENDPOINT + '?action=timetableList&pw=' + q(typeof pw !== 'undefined' ? pw : 'sh') + '&book=' + q(book) + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || d.result !== 'success' || !d.classes) return;
        var rows = d.classes.map(function(c){
          return { book: book, class_id: c.id, day: c.day, start_time: c.start, end_time: c.end,
                   location: c.loc, teacher: c.teacher, name: c.cls, roster: (c.students || []).join(' ') };
        });
        var keep = rows.map(function(r){ return r.class_id; }).join(',');
        return sbWrite('POST', '/tt_classes?on_conflict=book,class_id', rows,
                       { 'Prefer': 'resolution=merge-duplicates,return=minimal' })
          .then(function(){
            return sbWrite('DELETE', '/tt_classes?book=eq.' + q(book) + '&class_id=not.in.(' + keep + ')');
          });
      })
      .catch(function(e){ console.warn('명단 재동기화 실패', e); });
  }
  function findLegacyOnceRow(g, cb){
    // 시트 쪽 같은 1회 이동의 행 번호 찾기(취소·수정 미러용, 실패해도 무방)
    var lds = applyYmdOf(g);
    rawFetch(ENDPOINT + '?action=timetableWeek&pw=' + q(typeof pw !== 'undefined' ? pw : 'sh') +
             '&book=' + q(g.book) + '&from=' + q(lds) + '&to=' + q(lds) + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){
        if (!d || d.result !== 'success') return;
        var hit = (d.onceMoves || []).filter(function(o){
          return o.student === g.student && o.toId === g.to_class_id && o.fromId === g.from_class_id;
        })[0];
        if (hit) cb(hit.row);
      })
      .catch(function(){});
  }

  /* ── POST 핸들러 ── */
  var POSTS = {
    /* 출석·메모 — 수파베이스 먼저(즉시), 시트 이중 기록 */
    attendSet: function(b){
      var status = String(b.status || '').trim(), memo = String(b.memo || '').trim();
      if (!b.date || !b.classId || !b.student) return Promise.resolve({ result:'error', message:'날짜·반·학생 정보가 필요합니다.' });
      if (status && ['출석','지각','결석'].indexOf(status) < 0) return Promise.resolve({ result:'error', message:'상태는 출석/지각/결석 중 하나여야 해요.' });
      if (status === '지각' && !memo) return Promise.resolve({ result:'error', message:'지각은 메모를 적어주세요. (미리 연락 여부, 몇 분 지각 등)' });
      if (!status){
        return sbWrite('DELETE', '/attendance?' + attKeyPath(b)).then(function(){
          legacyBg(b);
          return ok({ cleared: true });
        });
      }
      return upsertAttend([{ date: b.date, book: bookOf(b.book), class_id: b.classId,
                             student: String(b.student).trim(), status: status, memo: memo }])
        .then(function(){
          legacyBg(b);
          return ok({ status: status });
        });
    },
    attendSetBulk: function(b){
      var book = bookOf(b.book), status = String(b.status == null ? '출석' : b.status).trim();
      var students = (b.students || []).map(function(s){ return String(s || '').trim(); }).filter(String);
      var overwrite = String(b.overwrite || '') === '1';
      if (!b.date || !b.classId || !students.length) return Promise.resolve({ result:'error', message:'날짜·반·학생 명단이 필요합니다.' });
      if (status && ['출석','결석'].indexOf(status) < 0) return Promise.resolve({ result:'error', message:'일괄 처리는 출석/결석/지우기만 가능해요. (지각은 메모가 필요해 개별로)' });
      var base = '/attendance?date=eq.' + q(b.date) + '&book=eq.' + q(book) + '&class_id=eq.' + q(b.classId);
      return sbGet(base + '&select=student_plain').then(function(rows){
        var have = {}; rows.forEach(function(r){ have[r.student_plain] = true; });
        if (!status){
          var clearedNames = students.filter(function(nm){ return have[plain(nm)]; });
          if (!clearedNames.length) return ok({ cleared: 0, clearedNames: [] });
          var keys = clearedNames.map(function(nm){ return '"' + plain(nm) + '"'; }).join(',');
          return sbWrite('DELETE', base + '&student_plain=in.(' + encodeURIComponent(keys) + ')').then(function(){
            legacyBg(b);
            return ok({ cleared: clearedNames.length, clearedNames: clearedNames });
          });
        }
        var marked = students.filter(function(nm){ return overwrite || !have[plain(nm)]; });
        if (!marked.length) return ok({ marked: [], skipped: students.length });
        return upsertAttend(marked.map(function(nm){
          return { date: b.date, book: book, class_id: b.classId, student: nm, status: status, memo: '' };
        })).then(function(){
          legacyBg(b);
          return ok({ marked: marked, skipped: students.length - marked.length });
        });
      });
    },
    attendMakeupSet: function(b){
      return sbWrite('PATCH', '/attendance?' + attKeyPath(b),
                     { makeup_plan: String(b.plan || ''), makeup_done: String(b.done || ''), makeup_memo: String(b.mkMemo || '') },
                     { 'Prefer': 'return=representation' })
        .then(function(rows){
          if (!rows || !rows.length) return { result:'error', message:'기록을 찾을 수 없어요. 새로고침 후 다시 시도해 주세요.' };
          legacyBg(b);
          return ok({});
        });
    },
    ttMemoSet: function(b){
      var d = String(b.date || '').trim(), memo = String(b.memo || '').trim();
      if (!/^\d{4}-\d{2}-\d{2}$/.test(d)) return Promise.resolve({ result:'error', message:'날짜가 필요합니다.' });
      var job = memo
        ? sbWrite('POST', '/tt_memo?on_conflict=date', [{ date: d, memo: memo }], { 'Prefer': 'resolution=merge-duplicates,return=minimal' })
        : sbWrite('DELETE', '/tt_memo?date=eq.' + q(d));
      return job.then(function(){
        legacyBg(b);
        return ok(memo ? {} : { cleared: true });
      });
    },

    /* 지필일정 — 수파베이스가 원본 (id 기반) */
    examSchedSet: function(b){
      var row = parseInt(b.row, 10) || 0;
      if (b.del){
        if (!row) return Promise.resolve({ result:'error', message:'행을 찾을 수 없어요.' });
        return sbGet('/exam_sched?id=eq.' + row + '&select=school').then(function(rows){
          if (!rows.length) return { result:'error', message:'행을 찾을 수 없어요.' };
          if (String(rows[0].school).trim() !== String(b.school || '').trim())
            return { result:'error', message:'내용이 달라졌어요. 새로고침 후 다시 시도해 주세요.' };
          return sbWrite('DELETE', '/exam_sched?id=eq.' + row).then(function(){ return ok({ deleted: true }); });
        });
      }
      var kind = (String(b.kind || '').trim() === '과목') ? '과목' : '기간';
      var school = String(b.school || '').trim().slice(0, 20);
      var start = String(b.start || '').trim(), end = String(b.end || '').trim();
      var text = String(b.text || '').trim().slice(0, 200);
      if (!school || !/^\d{4}-\d{2}-\d{2}$/.test(start)) return Promise.resolve({ result:'error', message:'학교와 날짜가 필요합니다.' });
      if (kind === '기간'){
        if (!/^\d{4}-\d{2}-\d{2}$/.test(end)) end = start;
        if (end < start){ var t0 = start; start = end; end = t0; }
      } else end = start;
      var rec = { kind: kind, school: school, start_date: start, end_date: end, text: text };
      if (row){
        return sbWrite('PATCH', '/exam_sched?id=eq.' + row, rec, { 'Prefer': 'return=representation' })
          .then(function(rows){
            if (!rows || !rows.length) return { result:'error', message:'행을 찾을 수 없어요.' };
            return ok({ row: row });
          });
      }
      return sbWrite('POST', '/exam_sched', rec, { 'Prefer': 'return=representation' })
        .then(function(rows){ return ok({ row: rows[0].id }); });
    },

    /* 1회 이동 수정·취소 — 수파베이스가 원본, 시트에도 같은 기록을 찾아 미러(실패 무방) */
    timetableOnceCancel: function(b){
      var row = parseInt(b.row, 10) || 0;
      return sbGet('/tt_log?id=eq.' + row).then(function(rows){
        var g = rows[0];
        if (!g || g.kind !== '1회' || g.student !== String(b.student || '').trim())
          return { result:'error', message:'기록이 달라졌어요. 새로고침 후 다시 시도해 주세요.' };
        return sbWrite('DELETE', '/tt_log?id=eq.' + row).then(function(){
          findLegacyOnceRow(g, function(shRow){ legacyBg({ action:'timetableOnceCancel', pw: b.pw, row: shRow, student: b.student }); });
          return ok({});
        });
      });
    },
    timetableOnceEdit: function(b){
      var row = parseInt(b.row, 10) || 0, reason = String(b.reason || '').trim();
      if (!reason) return Promise.resolve({ result:'error', message:'사유를 적어주세요.' });
      return sbGet('/tt_log?id=eq.' + row).then(function(rows){
        var g = rows[0];
        if (!g || g.kind !== '1회' || g.student !== String(b.student || '').trim())
          return { result:'error', message:'기록이 달라졌어요. 새로고침 후 다시 시도해 주세요.' };
        return sbWrite('PATCH', '/tt_log?id=eq.' + row, { reason: reason }).then(function(){
          findLegacyOnceRow(g, function(shRow){ legacyBg({ action:'timetableOnceEdit', pw: b.pw, row: shRow, student: b.student, reason: reason }); });
          return ok({ reason: reason });
        });
      });
    },

    /* 주별 기간 — 내신 페이지가 시트를 읽으므로 기존 백엔드 먼저, 수파베이스 미러 */
    ttPeriodSet: function(b){
      return legacyPost(b).then(function(res){
        if (res && res.result === 'success'){
          var bk = String(b.book || '').trim();
          var job = bk
            ? sbWrite('POST', '/tt_period?on_conflict=week_wednesday', [{ week_wednesday: b.week, book: bookOf(bk) }],
                      { 'Prefer': 'resolution=merge-duplicates,return=minimal' })
            : sbWrite('DELETE', '/tt_period?week_wednesday=eq.' + q(b.week));
          return job.then(function(){ return res; }, function(e){ console.warn('기간 미러 실패', e); return res; });
        }
        return res;
      });
    },

    /* 반·명단 구조 변경 — 기존 백엔드 먼저(학생정보 연동), 수파베이스 미러 */
    timetableMove: function(b){
      return legacyPost(b).then(function(res){
        if (!res || res.result !== 'success') return res;
        var book = bookOf(b.book);
        var fromC = classRow(book, b.fromId), toC = classRow(book, b.toId);
        var mirror;
        if (b.moveType === 'once'){
          var applyDate = (res.date || b.date || tYmd());
          mirror = insertLog({ kind:'1회', student: res.moved || b.student, book: book,
            from_class_id: b.fromId, from_class: classLabel(fromC),
            to_class_id: b.toId, to_class: classLabel(toC),
            reason: String(b.reason || ''), apply_date: applyDate })
            .then(function(){
              if (!res.makeupDone) return;
              // 백엔드의 결석 보충 자동 완료를 수파베이스에도 동일 규칙으로 반영
              return sbGet('/attendance?status=eq.' + q('결석') + '&book=eq.' + q(book) +
                           '&class_id=eq.' + q(b.fromId) + '&student_plain=eq.' + q(plain(b.student)) +
                           '&makeup_done=neq.1&select=id,date')
                .then(function(rows){
                  var am = Date.parse(applyDate), best = null, gap = 15;
                  rows.forEach(function(r){
                    var g2 = Math.abs((Date.parse(r.date) - am) / 86400000);
                    if (g2 < gap){ gap = g2; best = r; }
                  });
                  if (best) return sbWrite('PATCH', '/attendance?id=eq.' + best.id,
                                           { makeup_plan: res.makeupDone, makeup_done: '1' });
                });
            });
        } else {
          var moved = res.moved || b.student, jobs = [];
          if (fromC) jobs.push(setRoster(book, b.fromId, fromC.students.filter(function(nm){ return plain(nm) !== plain(moved); })));
          if (toC) jobs.push(setRoster(book, b.toId, toC.students.concat([moved])));
          jobs.push(insertLog({ kind:'영구', student: moved, book: book,
            from_class_id: b.fromId, from_class: classLabel(fromC),
            to_class_id: b.toId, to_class: classLabel(toC), reason: String(b.reason || '') }));
          mirror = Promise.all(jobs);
        }
        return mirror.then(function(){ resyncClasses(book); return res; },
                           function(e){ console.warn('이동 미러 실패', e); resyncClasses(book); return res; });
      });
    },
    timetableAdd: function(b){
      return legacyPost(b).then(function(res){
        if (!res || res.result !== 'success') return res;
        var book = bookOf(b.book), toC = classRow(book, b.toId), added = res.added || b.student;
        var jobs = [];
        if (toC) jobs.push(setRoster(book, b.toId, toC.students.concat([added])));
        jobs.push(insertLog({ kind:'추가', student: added, book: book, to_class_id: b.toId, to_class: classLabel(toC) }));
        return Promise.all(jobs).then(function(){ resyncClasses(book); return res; },
                                      function(e){ console.warn('추가 미러 실패', e); resyncClasses(book); return res; });
      });
    },
    timetableRemove: function(b){
      return legacyPost(b).then(function(res){
        if (!res || res.result !== 'success') return res;
        var book = bookOf(b.book), fromC = classRow(book, b.fromId), removed = res.removed || b.student;
        var jobs = [];
        if (fromC) jobs.push(setRoster(book, b.fromId, fromC.students.filter(function(nm){ return plain(nm) !== plain(removed); })));
        jobs.push(insertLog({ kind:'빼기', student: removed, book: book, from_class_id: b.fromId, from_class: classLabel(fromC),
                              reason: String(b.reason || '') }));
        return Promise.all(jobs).then(function(){ resyncClasses(book); return res; },
                                      function(e){ console.warn('빼기 미러 실패', e); resyncClasses(book); return res; });
      });
    },
    timetableRenameStudent: function(b){
      return legacyPost(b).then(function(res){
        if (!res || res.result !== 'success') return res;
        var book = bookOf(b.book), from = String(b.from || '').trim(), to = String(b.to || '').trim();
        var jobs = [];
        ((typeof classes !== 'undefined' && classes) || []).forEach(function(c){
          if (c.students.indexOf(from) < 0) return;
          jobs.push(setRoster(book, c.id, c.students.map(function(nm){ return nm === from ? to : nm; })));
        });
        jobs.push(insertLog({ kind:'표기수정', student: from, book: book, reason: from + ' → ' + to }));
        return Promise.all(jobs).then(function(){ resyncClasses(book); return res; },
                                      function(e){ console.warn('표기 미러 실패', e); resyncClasses(book); return res; });
      });
    },
    timetableAddClass: function(b){
      return legacyPost(b).then(function(res){
        if (!res || res.result !== 'success' || !res.id) return res;
        var book = bookOf(b.book);
        return sbWrite('POST', '/tt_classes', { book: book, class_id: res.id, day: b.day, start_time: b.start,
                                                end_time: b.end, location: String(b.loc || ''), teacher: String(b.teacher || ''),
                                                name: b.cls, roster: '' })
          .then(function(){ return res; }, function(e){ console.warn('반 추가 미러 실패', e); resyncClasses(book); return res; });
      });
    },
    timetableDeleteClass: function(b){
      return legacyPost(b).then(function(res){
        if (!res || res.result !== 'success') return res;
        var book = bookOf(b.book);
        return sbWrite('DELETE', '/tt_classes?book=eq.' + q(book) + '&class_id=eq.' + q(b.classId))
          .then(function(){ return res; }, function(e){ console.warn('반 삭제 미러 실패', e); resyncClasses(book); return res; });
      });
    },
    timetableMoveClass: function(b){
      return legacyPost(b).then(function(res){
        if (!res || res.result !== 'success') return res;
        var book = bookOf(b.book);
        return sbWrite('PATCH', '/tt_classes?book=eq.' + q(book) + '&class_id=eq.' + q(b.classId),
                       { day: b.day, start_time: b.start, end_time: b.end,
                         location: String(b.loc || ''), teacher: String(b.teacher || '') })
          .then(function(){ resyncClasses(book); return res; },
                function(e){ console.warn('반 이동 미러 실패', e); resyncClasses(book); return res; });
      });
    }
  };

  /* ── fetch 가로채기 ── */
  window.fetch = function(url, opts){
    try {
      if (typeof ENDPOINT === 'undefined' || typeof url !== 'string' || url.indexOf(ENDPOINT) !== 0)
        return rawFetch(url, opts);
      if (opts && String(opts.method || '').toUpperCase() === 'POST'){
        var body;
        try { body = JSON.parse(opts.body); } catch (e) { return rawFetch(url, opts); }
        var ph = body && POSTS[body.action];
        if (!ph) return rawFetch(url, opts);
        return ph(body).then(fake, function(err){
          console.warn('수파베이스 쓰기 실패 — 기존 백엔드로 폴백', body.action, err);
          return rawFetch(url, opts);
        });
      }
      var qs = new URLSearchParams(url.slice(url.indexOf('?') + 1));
      var gh = GETS[qs.get('action')];
      if (!gh) return rawFetch(url, opts);
      return gh(qs).then(fake, function(err){
        console.warn('수파베이스 조회 실패 — 기존 백엔드로 폴백', qs.get('action'), err);
        return rawFetch(url, opts);
      });
    } catch (e) {
      return rawFetch(url, opts);
    }
  };
})();

var WEEK_VIEW_ORDER = ['월','화','수','목','금','토','일'];   // 주차별 배치 — 월·화(직전보강)는 수요일 '직전' 날짜, 날짜 오름차순
var weekAttend = {};   // 주차 출석: 날짜|반ID|학생 -> {status, memo}
var memos = {};        // 오늘의 이슈 메모: 날짜(yyyy-MM-dd) -> 텍스트
var memoDraft = null;  // 다시 그릴 때 저장 전 입력 보존용
var periods = {};      // 주별 기간: 주차 수요일(yyyy-MM-dd) -> '정규'|'내신' (미설정=정규)
var calMonth = null;   // 캘린더가 보는 달 (그 달 1일 Date)
var weekOnce = [];     // 주차 1회 이동
var attDate = null;    // 출석 모달이 다루는 날짜
var editMode = null;        // 'move' | 'add' | 'del' — 편집 도구줄에서 선택
var multiMode = false;      // 오늘 보기 복수 선택 모드
var multiSel = {};          // 선택된 학생: cid|이름 → {cid, nm}
var pendingScroll = null;   // 재렌더 후 복원할 스크롤 위치
var keepScroll = true;      // 보기 전환 시에는 복원하지 않음
var book = sessionStorage.getItem('tt_book') || '정규';  // '정규' | '내신'
var moving = null;      // 학생 이동 중 {name, fromId, fromLabel}
var classMoving = null; // 반 통째 이동 중 {id}

function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
/* 오늘의 시간표용 1회 이동 필터 — 주차별 보기와 같은 규칙 (2026-08-20 사용자 확정)
 * · 나간 학생(1회↗): 적용일이 '이번 주(월~일)'면 원래 반에서 빠짐 표시
 *   (목 수업 결석 → 토 반으로 보충 가는 경우, 목요일 화면에서도 빠짐이 보여야 함)
 * · 이동 온 학생(· 1회 칩): 적용일 당일에만 그 반에 표시 */
function thisWeekRange(){
  var ws = weekStartOf(new Date());
  var mon = new Date(ws); mon.setDate(mon.getDate() - 2);
  var sun = new Date(ws); sun.setDate(sun.getDate() + 4);
  return { from: ymdOf(mon), to: ymdOf(sun) };
}
function onceOutThisWeek(){
  var w = thisWeekRange(), t = todayStr();
  return onceMoves.filter(function(o){ return !o.ymd ? true : (o.ymd >= w.from && o.ymd <= w.to); });
}
function onceInToday(){
  var t = todayStr();
  return onceMoves.filter(function(o){ return !o.ymd || o.ymd === t; });
}
function todayDay(){ return ['일','월','화','수','목','금','토'][new Date().getDay()]; }
function weekStartOf(d){
  // 그 날짜가 속한 월~일 달력 주의 '수요일' (월·화는 아직 오지 않은 이번 주 수요일)
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7) + 2);
  return x;
}
var weekStart = weekStartOf(new Date());
function ymdOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mdOf(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
function weekDates(){
  // 월(-2)·화(-1)는 수요일 직전 날짜 — 월화수목금토일 날짜가 순서대로 이어짐
  var off = { '월':-2, '화':-1, '수':0, '목':1, '금':2, '토':3, '일':4 };
  var out = {};
  WEEK_VIEW_ORDER.forEach(function(dy){
    var d = new Date(weekStart); d.setDate(d.getDate() + off[dy]);
    out[dy] = d;
  });
  return out;
}
function moveWeek(n){
  weekStart.setDate(weekStart.getDate() + 7*n);
  renderTabs();
  if (applyAutoBook()) return;   // 기간이 바뀌면 load()가 이어서 그림
  loadWeek();
}
function loadWeek(){
  var from = new Date(weekStart); from.setDate(from.getDate() - 2);   // 월요일
  var to = new Date(weekStart); to.setDate(to.getDate() + 4);         // 일요일
  // 캐시가 있으면 먼저 그리고 최신으로 갱신
  var ck = 'week:' + book + ':' + ymdOf(from);
  var cw = cacheGet(ck);
  if (cw){
    weekAttend = {};
    (cw.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
    weekOnce = cw.onceMoves || [];
    render();
    setStatus('최신 데이터 확인 중…');
  } else {
    setStatus('주차 기록을 불러오는 중…');
  }
  var pWeek = fetch(ENDPOINT + '?action=timetableWeek&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) +
        '&from=' + ymdOf(from) + '&to=' + ymdOf(to) + '&t=' + Date.now())
    .then(function(r){ return r.json(); }).catch(function(){ return null; });
  var pMemo = new Promise(function(res){ loadMemos(ymdOf(from), ymdOf(to), res); });
  Promise.all([pWeek, pMemo]).then(function(rs){
    var d = rs[0];
    if (d && d.result === 'success'){
      weekAttend = {}; weekOnce = [];
      (d.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
      weekOnce = d.onceMoves || [];
      cacheSet(ck, { attend: d.attend || [], onceMoves: d.onceMoves || [] });
      setStatus('');
    } else if (cw){
      setStatus('');   // 캐시 화면 유지
    } else {
      weekAttend = {}; weekOnce = [];
      setStatus('주차 기록을 불러오지 못했어요.', 'err');
    }
    render();
  });
}
/* 출석 기록 키 — 괄호(특이사항) 제외 이름 기준.
 * 특이사항 표기가 바뀌거나 기록 당시 표기가 달라도 출석 기록이 항상 학생 칩에 붙게 한다
 * (출석부의 목적은 출석 확인 — 2026-08-21 사용자 확정). 동명이인은 A/B/C 표기로 이미 구분됨. */
function attKey(cid, nm){ return cid + '|' + String(nm||'').replace(/\(.*\)$/, ''); }
function wkAttKey(dateStr, cid, nm){ return dateStr + '|' + attKey(cid, nm); }
function attendAt(dateStr, cid, nm){
  return (mode === 'week') ? weekAttend[wkAttKey(dateStr, cid, nm)] : attend[attKey(cid, nm)];
}
/* 이미 처리된 출석 기록 보존 표시 — 영구 이동·빼기로 현재 명단에서 빠진 학생이라도,
 * 그 날짜에 이 반의 출석 기록이 있으면 칩으로 계속 보여준다(클릭해 수정도 가능).
 * 전체 시간표를 고쳐도 이미 출석 처리된 날의 화면은 달라지지 않게 하기 위함(2026-08-20 사용자 확정). */
function keptAttendNames(c, rosterNames, temps, dstr){
  var have = {};
  rosterNames.forEach(function(nm){ have[nm.replace(/\(.*\)$/,'')] = true; });
  (temps || []).forEach(function(o){ have[String(o.student||'').replace(/\(.*\)$/,'')] = true; });
  var pre = (mode === 'week') ? (dstr + '|' + c.id + '|') : (c.id + '|');
  var src = (mode === 'week') ? weekAttend : attend;
  var out = [];
  Object.keys(src).forEach(function(k){
    if (k.indexOf(pre) !== 0) return;
    var nm = k.slice(pre.length);
    if (!have[nm.replace(/\(.*\)$/,'')]) out.push(nm);
  });
  return sortNames(out);
}
function keptChip(c, nm, a){
  var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : '';
  var tp = '반 이동 전에 기록된 출석이에요 — 지금은 이 반 명단에 없는 학생'+
           (a ? ' / '+a.status+(a.memo?' — '+a.memo:'') : '');
  return '<button data-att-cid="'+esc(c.id)+'" data-nm="'+esc(nm)+'" class="'+cls2+' kept" title="'+esc(tp)+'">'+
         esc(nm.replace(/\(.*\)$/,''))+'<em>이동</em></button>';
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function setStatus(m,k){ var s=$('status'); s.textContent=m||''; s.className='status'+(k?' '+k:''); }

/* "5:30" → 분(오전 10~12시는 오전, 1~9시는 오후로 해석) */
function mins(t){
  var p = String(t||'').split(':');
  var h = parseInt(p[0],10)||0, m = parseInt(p[1],10)||0;
  if (h < 10) h += 12;
  return h*60+m;
}
function minsEnd(c){
  var s = mins(c.start), e = mins(c.end || c.start);
  if (e <= s) e += 12*60;
  return e;
}
function fmt12(t){
  var h24 = Math.floor(t/60), mm = t%60;
  var h12 = h24 > 12 ? h24-12 : h24;
  return h12 + ':' + (mm<10?'0':'')+mm;
}
function sortNames(arr){
  return arr.slice().sort(function(a,b){ return String(a).localeCompare(String(b), 'ko'); });
}
function colorOf(cls){
  var base = /^고1/.test(cls) ? 'c-g1'
           : /^고2/.test(cls) ? 'c-g2'
           : /^고3/.test(cls) ? 'c-g3'
           : /정리정독/.test(cls) ? 'c-mid' : 'c-etc';
  // 채도를 낮춰 구분: 정규는 '나' 수업(반이름 끝 글자), 내신은 '확인' 수업
  var t = String(cls || '').trim();
  return base + ((/나\s*$/.test(t) || /확인/.test(t)) ? ' c-b' : '');
}

function tryLogin(){
  var v = $('pw').value.trim();
  if (!v){ $('gate-err').textContent='비밀번호를 입력해 주세요.'; return; }
  pw = v;
  $('gate-err').textContent='';
  load(false, function(ok){
    if (ok){ sessionStorage.setItem('tt_pw', pw); $('gate').style.display='none'; $('bar').style.display='block'; $('sheetcard').style.display='block'; }
    else { pw=''; $('gate-err').textContent='비밀번호가 맞지 않아요.'; }
  });
}
$('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

/* ── 데이터 — 시간표·출석·메모를 동시에 불러와 왕복 시간을 줄인다 ── */
var loadSeq = 0;   // 기간 전환 등으로 load가 겹칠 때 마지막 요청만 반영
function load(isReload, cb){
  var seq = ++loadSeq;
  if (isReload) nsCache = {};   // 다시 불러오기 = 이달의 신입생도 새로 조회
  // 캐시가 있으면 즉시 그려서 바로 보이게 (뒤에서 최신으로 갱신)
  var painted = false;
  if (!isReload){
    var cd = cacheGet('list:' + book);
    if (cd && cd.classes && cd.classes.length){
      classes = cd.classes;
      onceMoves = cd.onceMoves || [];
      attend = {};
      var ca = cacheGet('att:' + book + ':' + todayStr());
      if (ca) ca.forEach(function(x){ attend[attKey(x.classId, x.student)] = { status: x.status, memo: x.memo }; });
      if (mode === 'week'){
        var wf0 = new Date(weekStart); wf0.setDate(wf0.getDate() - 2);
        var cwk = cacheGet('week:' + book + ':' + ymdOf(wf0));
        if (cwk){
          weekAttend = {};
          (cwk.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
          weekOnce = cwk.onceMoves || [];
        }
      }
      renderTabs();
      render();
      painted = true;
    }
  }
  setStatus(painted ? '최신 데이터 확인 중…' : '시간표를 불러오는 중…');
  // 통합 부팅 조회 — 시간표·오늘 출석·메모·주별 기간(+주차별이면 주간 기록)을 한 번에 (접속 지연 대책)
  var url = ENDPOINT + '?action=ttBoot&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) +
            '&date=' + todayStr();
  var mfrom = todayStr(), mto = todayStr(), wfrom = '', wto = '';
  if (mode === 'week'){
    var wf = new Date(weekStart); wf.setDate(wf.getDate() - 2);   // 월요일
    var wt = new Date(weekStart); wt.setDate(wt.getDate() + 4);   // 일요일
    wfrom = ymdOf(wf); wto = ymdOf(wt); mfrom = wfrom; mto = wto;
  }
  url += '&mfrom=' + mfrom + '&mto=' + mto;
  if (wfrom) url += '&wfrom=' + wfrom + '&wto=' + wto;
  fetch(url + '&t=' + Date.now())
    .then(function(r){ return r.json(); }).catch(function(){ return null; })
    .then(function(d){
    if (seq !== loadSeq) return;   // 더 새 요청이 있음
    if (!d || d.result !== 'success'){
      if (painted){ setStatus(''); if (cb) cb(true); return; }   // 캐시 화면 유지
      if (cb) cb(false); else setStatus('불러오지 못했어요. 새로고침 해 주세요.', 'err');
      return;
    }
    // 주별 기간 — 이번 주 기간이 바뀌었으면 맞는 시간표로 한 번 다시 불러온다
    if (d.periods){
      periods = {};
      d.periods.forEach(function(pd){ periods[pd.week] = pd.book; });
      cacheSet('periods', d.periods);
      if ((mode === 'today' || mode === 'week') && autoBookFor() !== book){
        book = autoBookFor();
        sessionStorage.setItem('tt_book', book);
        renderTabs();
        load(isReload, cb);
        return;
      }
    }
    classes = d.classes || [];
    onceMoves = d.onceMoves || [];
    cacheSet('list:' + book, { classes: classes, onceMoves: onceMoves });
    attend = {};
    (d.attend || []).forEach(function(x){
      attend[attKey(x.classId, x.student)] = { status: x.status, memo: x.memo };
    });
    cacheSet('att:' + book + ':' + todayStr(), d.attend || []);
    if (d.memos){
      Object.keys(memos).forEach(function(k){ if (k >= mfrom && k <= mto) delete memos[k]; });
      d.memos.forEach(function(m){ memos[m.date] = m.memo; });
    }
    if (d.week){   // 주차별 보기용 주간 기록도 같이 옴
      weekAttend = {}; weekOnce = [];
      (d.week.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
      weekOnce = d.week.onceMoves || [];
      cacheSet('week:' + book + ':' + wfrom, { attend: d.week.attend || [], onceMoves: weekOnce });
    }
    setStatus(isReload ? '최신 시간표로 다시 불러왔어요.' : '', isReload ? 'ok' : '');
    renderTabs();
    if (mode === 'week' && !d.week) loadWeek(); else render();
    if (cb) cb(true);
  });
}
/* ── 브라우저 캐시: 이전 데이터를 즉시 띄우고, 뒤에서 최신으로 조용히 갱신 ── */
function cacheGet(k){ try { var v = JSON.parse(localStorage.getItem('ttc:' + k) || 'null'); return v && v.d; } catch(e){ return null; } }
function cacheSet(k, d){ try { localStorage.setItem('ttc:' + k, JSON.stringify({ t: Date.now(), d: d })); } catch(e){} }

/* 슈국 캘린더: 주별 기간(정규/내신) — 미설정 주는 정규 */
function loadPeriods(done){
  fetch(ENDPOINT + '?action=ttPeriodList&pw=' + encodeURIComponent(pw) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.result === 'success'){
        periods = {};
        (d.periods || []).forEach(function(p){ periods[p.week] = p.book; });
        cacheSet('periods', d.periods || []);
      }
      done();
    })
    .catch(function(){ done(); });
}
function periodOf(weekWedDate){ return periods[ymdOf(weekWedDate)] || '정규'; }
function autoBookFor(){
  if (mode === 'today') return periodOf(weekStartOf(new Date()));
  if (mode === 'week') return periodOf(weekStart);
  return book;
}
/* 오늘/주차별 보기에서 캘린더 기간에 맞는 시간표로 자동 전환. 다시 불러왔으면 true */
function applyAutoBook(){
  var target = autoBookFor();
  if (target !== book){
    book = target;
    sessionStorage.setItem('tt_book', book);
    load(false);
    return true;
  }
  return false;
}

/* 기간 내 '오늘의 이슈' 메모 불러오기 (범위 안은 서버 값으로 갱신) */
function loadMemos(from, to, done){
  fetch(ENDPOINT + '?action=ttMemoList&pw=' + encodeURIComponent(pw) + '&from=' + from + '&to=' + to + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.result === 'success'){
        Object.keys(memos).forEach(function(k){ if (k >= from && k <= to) delete memos[k]; });
        (d.memos || []).forEach(function(m){ memos[m.date] = m.memo; });
      }
      done();
    })
    .catch(function(){ done(); });
}

/* ── 렌더 ── */
function setEdit(m){
  if (editMode === m){ clearEdit(); return; }
  if (moving || classMoving) cancelMove();
  editMode = m;
  document.body.classList.add('editpick');
  ['e-move','e-add','e-del'].forEach(function(id){ $(id).classList.remove('on'); });
  $('e-' + m).classList.add('on');
  setStatus(m === 'move' ? '이동할 반을 누르세요. 누른 뒤 옮길 빈 자리를 누르면 반 전체가 이동해요.'
          : m === 'add'  ? '학생을 추가할 반을 누르세요.'
                         : '삭제할 반을 누르세요. (빈 반만 삭제할 수 있어요)');
}
function clearEdit(){
  editMode = null;
  document.body.classList.remove('editpick');
  ['e-move','e-add','e-del'].forEach(function(id){ var b=$(id); if(b) b.classList.remove('on'); });
  setStatus('');
}
/* 편집 도구 접기 — 평소엔 [편집 도구 ▸] 버튼만, 누르면 도구가 펼쳐짐 (2026-08-22 사용자 확정 시안) */
var editOpen = sessionStorage.getItem('tt_editopen') === '1';
function applyEditOpen(){
  var s = $('editset'), f = $('e-fold'), a = $('e-arrow');
  if (!s) return;
  s.classList.toggle('open', editOpen);
  if (f) f.classList.toggle('open', editOpen);
  if (a) a.textContent = editOpen ? '▾' : '▸';
}
function toggleEditOpen(){
  editOpen = !editOpen;
  sessionStorage.setItem('tt_editopen', editOpen ? '1' : '0');
  if (!editOpen) clearEdit();   // 접으면 진행 중이던 편집 선택도 해제
  applyEditOpen();
}
applyEditOpen();
function applyEdit(c){
  var m = editMode;
  clearEdit();
  if (m === 'move'){ startClassMove(c); return; }
  if (m === 'add'){ openAdd(c); return; }
  if (m === 'del'){
    if (c.students.length){ alert('학생이 남아 있는 반은 삭제할 수 없어요.\n먼저 학생을 다른 반으로 이동하거나 빼주세요. (' + c.students.length + '명)'); return; }
    if (!confirm(labelOf(c) + '\n\n이 빈 반을 삭제할까요?')) return;
    post({ action:'timetableDeleteClass', book:book, classId:c.id }, '삭제하는 중…', function(res){

function calWeeks(){
  var first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  var last = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0);
  var cur = new Date(first); cur.setDate(cur.getDate() - ((cur.getDay()+6)%7));   // 그 주 월요일
  var weeks = [];
  while (cur <= last){
    var w = [];
    for (var i = 0; i < 7; i++){ var d = new Date(cur); d.setDate(d.getDate()+i); w.push(d); }
    weeks.push(w);
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}
function calLoadAndRender(){
  if (!calMonth){ var n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }

/* ── 지필고사 일정 (슈국 캘린더 아래 접이식 메뉴 — 2026-08-21 사용자 확정) ──
 * 학교별 시험 기간(시작~끝)은 직접 입력(중학교 등 과목 없이 기간만 아는 경우가 많음),
 * 날짜별 과목은 선택 입력 — 넣으면 달력 날짜 칸에 학교색 칩으로 표시. '지필일정' 탭 저장. */
var examPeriods = [], examSubjects = {};   // subjects: 날짜 → [{row,school,text}]
var EXS_SCHOOLS = ['능곡고','도래울고','무원고','백양고','서정고','성사고','화수고','화정고','행신고',
                   '지도중','향동중','화수중','능곡중','서정중','지축중','무원중','백양중','화정중','고양중','덕은한강중','가람중'];
var SCHOOL_HUE = { '능곡':'#F6D9D7','도래울':'#FBE5CB','무원':'#FBF0C8','백양':'#DDEFD9','서정':'#DDE6E9',
                   '성사':'#D6E4F5','화수':'#D8E2F7','화정':'#E6DCF2','행신':'#F3DAE4','지도':'#F3D3CE',
                   '향동':'#FBE5CB','지축':'#D6E4F5','고양':'#F8DFC8','덕은한강':'#FBF0C8','가람':'#D9EBD3' };
function schoolBase(s){ return String(s||'').replace(/[고중]$/, ''); }
function schoolLevel(s){ s = String(s||''); return /중$/.test(s) ? '중' : (/고$/.test(s) ? '고' : ''); }
function exsFilter(){ try { return localStorage.getItem('tt_exs_filter') || ''; } catch(e){ return ''; } }

function schoolColor(s){
  var b = schoolBase(s);
  if (SCHOOL_HUE[b]) return SCHOOL_HUE[b];
  var h = 0; for (var i = 0; i < b.length; i++) h = (h * 31 + b.charCodeAt(i)) % 360;
  return 'hsl(' + h + ',45%,88%)';
}
/* 과목명 두 글자 축약 (표시 전용 — 저장된 원문은 그대로, 마우스 호버 title에 원문)
 * '화법과 언어'→화언, '독서 토론과 글쓰기'→독토처럼 단어 첫 글자 조합 규칙 + 예외 목록 (2026-08-21 사용자 확정) */
var SUBJ_ABBR = { '공통국어':'국어', '공통국어1':'국어', '공통국어2':'국어', '심화국어':'심국', '고전읽기':'고전' };
function subjAbbr(t){
  t = String(t || '').trim();
  if (!t) return '';
  if (t.indexOf('/') >= 0) return t.split('/').map(subjAbbr).join('/');   // '언매/화작' 같은 복수 표기
  var s = t.replace(/\s+/g, '');
  if (SUBJ_ABBR[s]) return SUBJ_ABBR[s];
  if (s.length <= 2) return s;
  var ws = t.split(/\s+/).filter(Boolean);
  if (ws.length >= 2) return ws[0].slice(0,1) + ws[1].slice(0,1);   // '독서 토론과 글쓰기' → 독토
  return s.slice(0,2);                                              // 한 단어면 앞 두 글자
}
/* 슈국 캘린더 날짜 칸 과목 칩 — 항목마다 '능곡고1 국어, 능곡고2 화언'처럼 학교+학년을 분명하게 + 과목 축약,
 * 그 학교 시험 기간의 시작일이면 '첫째날' 표시 (2026-08-21 사용자 확정 — 학교 이름 생략 금지) */
function calExamChip(x){
  var base = schoolBase(x.school), lvl = schoolLevel(x.school);
  var first = examPeriods.some(function(p){ return p.school === x.school && p.start === x.date; });
  var txt = String(x.text || '').split(',').map(function(t){
    t = t.trim();
    if (!t) return '';
    var mm = t.match(/^([고중])\s*([1-3])\s*(.*)$/);   // '고1 국어' → '능곡고1 국어'
    if (mm && (!lvl || mm[1] === lvl))
      return '<b>' + esc(base + mm[1] + mm[2]) + '</b>' + (mm[3] ? ' ' + esc(subjAbbr(mm[3])) : '');
    return '<b>' + esc(base + lvl) + '</b> ' + esc(subjAbbr(t));
  }).filter(Boolean).join(', ');
  return '<div class="cal-exam" style="background:' + schoolColor(x.school) + '"' +
    ' title="' + esc(x.school + ' ' + x.text + (first ? ' · 시험 첫째날' : '')) + '">' +
    (first ? '<span class="cal-exam-first">첫째날</span> ' : '') + txt + '</div>';
}
function loadExamSched(from, to, done){
  fetch(ENDPOINT + '?action=examSched&pw=' + encodeURIComponent(pw) + '&from=' + from + '&to=' + to + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.result === 'success'){
        examPeriods = d.periods || [];
        examSubjects = {};
        (d.subjects || []).forEach(function(x){ (examSubjects[x.date] = examSubjects[x.date] || []).push(x); });
      }
      done();
    }).catch(function(){ done(); });
}

function exsLoadAndRender(){

}
function exsAddDays(d, n){ var x = new Date(+d.slice(0,4), +d.slice(5,7)-1, +d.slice(8,10)); x.setDate(x.getDate()+n); return ymdOf(x); }
/* 시즌 묶기 — 기간들을 시작일 간격 14일 이내로 묶는다(같은 중간/기말 시즌).
 * 시즌 이름은 시작 월로 추정: 3~7월 = 1학기(5월까지 중간), 8~2월 = 2학기(8~10월 중간). */
function exsClusters(){
  var ps = examPeriods.slice().sort(function(a,b){ return a.start.localeCompare(b.start) || a.school.localeCompare(b.school,'ko'); });
  if (!ps.length) return [];
  var clusters = [], cur = null, curEnd = '';
  ps.forEach(function(p){
    if (!cur || p.start > exsAddDays(curEnd, 14)){ cur = []; clusters.push(cur); curEnd = p.end; }
    cur.push(p);
    if (p.end > curEnd) curEnd = p.end;
  });
  return clusters;
}
function exsClusterRange(cl){
  var mn = cl[0].start, mx = cl[0].end;
  cl.forEach(function(p){ if (p.start < mn) mn = p.start; if (p.end > mx) mx = p.end; });
  return { mn: mn, mx: mx };
}
function exsSeasonName(cl){
  var mth = +exsClusterRange(cl).mn.slice(5,7);
  var sem = (mth >= 3 && mth <= 7) ? '1학기' : '2학기';
  var mid = (sem === '1학기') ? (mth <= 5) : (mth >= 8 && mth <= 10);
  return sem + ' ' + (mid ? '중간' : '기말');
}
function exsSetSeason(k){ try { sessionStorage.setItem('tt_exs_season', k); } catch(e){} render(); }
function exsMd(d){ return d ? d.slice(5).replace(/^0/,'').replace('-0','/').replace('-','/') + '(' + mkDayOf(d) + ')' : ''; }
function exsMdN(d){ return d ? (+d.slice(5,7)) + '/' + (+d.slice(8,10)) : ''; }   // 요일 없는 짧은 표기 (막대 안)
function exsDayDiff(a, b){
  return Math.round((new Date(+b.slice(0,4), +b.slice(5,7)-1, +b.slice(8,10)) -
                     new Date(+a.slice(0,4), +a.slice(5,7)-1, +a.slice(8,10))) / 864e5);
}
/* 지필고사 일정 메뉴 본문 — 시즌 버튼(2학기 중간/기말 등)으로 골라 보고, 기본은 진행 중이거나 다가오는 시즌 */
function examSchedView(){
  var box = document.createElement('div');
  box.className = 'memobox';
  var clusters = exsClusters();
  var infos = clusters.map(function(cl){
    var r = exsClusterRange(cl);
    return { cl: cl, key: r.mn, mn: r.mn, mx: r.mx, name: exsSeasonName(cl) };
  });
  var nameCnt = {};   // 같은 이름이 두 해에 걸치면 연도를 붙여 구분
  infos.forEach(function(x){ nameCnt[x.name] = (nameCnt[x.name] || 0) + 1; });
  infos.forEach(function(x){ if (nameCnt[x.name] > 1) x.name = x.mn.slice(2,4) + '년 ' + x.name; });
  var td = todayStr();
  var selKey = '';
  try { selKey = sessionStorage.getItem('tt_exs_season') || ''; } catch(e){}
  var sel = null;
  infos.forEach(function(x){ if (x.key === selKey) sel = x; });
  if (!sel) infos.some(function(x){ if (x.mx >= td){ sel = x; return true; } return false; });
  if (!sel && infos.length) sel = infos[infos.length - 1];
  var ps = sel ? sel.cl : [];
  var f = exsFilter();
  var nHi = ps.filter(function(p){ return schoolLevel(p.school) === '고'; }).length;
  var nMi = ps.filter(function(p){ return schoolLevel(p.school) === '중'; }).length;
  var cnt = ps.length ? ((nHi ? '고등 ' + nHi : '') + (nHi && nMi ? ' · ' : '') + (nMi ? '중등 ' + nMi : '') || ps.length + '개') : '';
  var dday = '';
  if (ps.some(function(p){ return p.start <= td && td <= p.end; })) dday = '시험 기간 중';
  else {
    var nx = '';
    ps.forEach(function(p){ if (p.start > td && (!nx || p.start < nx)) nx = p.start; });
    if (nx) dday = '첫 시험 ' + exsMd(nx) + ' · D-' + exsDayDiff(td, nx);
  }
  var h = '<p class="memotitle">지필고사 일정' +
    (cnt || dday ? '<span class="exs-cnt">  ' + cnt + (dday ? ' · ' + dday : '') + '</span>' : '') + '</p>';
  if (infos.length){
    h += '<div class="exs-season">' + infos.map(function(x){
      return '<button type="button" class="' + (sel && x.key === sel.key ? 'on' : '') + '"' +
        ' onclick="exsSetSeason(\'' + x.key + '\')">' + esc(x.name) +
        '<small>' + exsMdN(x.mn) + '~' + exsMdN(x.mx) + '</small></button>';
    }).join('') + '</div>';
  }
  if (!ps.length){
    h += '<p class="exs-none">등록된 시험 기간이 없어요 — [+ 시험 기간 추가]로 학교별 시험 기간부터 넣으세요.</p>';
  } else {
    h += '<div class="exs-filter">' + [['', '전체'], ['고', '고등'], ['중', '중등']].map(function(o){
      return '<button type="button" class="' + (f === o[0] ? 'on' : '') + '" onclick="exsSetFilter(\'' + o[0] + '\')">' + o[1] + '</button>';
    }).join('') + '</div>';
    h += '<p class="exs-desc">' + exsMd(sel.mn) + ' ~ ' + exsMd(sel.mx) +
      ' — 시험 시간표가 나오면 <b>막대 아래 칸을 눌러</b> 그 날짜의 학년·과목을 넣으세요. 넣은 과목은 슈국 캘린더 날짜 칸에도 표시돼요(시험 첫째날엔 \'첫째날\' 표시).</p>';
    [['고', '고등학교'], ['중', '중학교'], ['', '기타']].forEach(function(g){
      if (f && g[0] !== f) return;
      var rows = ps.filter(function(p){ return schoolLevel(p.school) === g[0]; });
      if (!rows.length) return;
      h += '<p class="exs-sub-h">' + g[1] + ' (' + rows.length + ')</p>' + exsTimeline(rows);
    });
    var subList = [];
    Object.keys(examSubjects).sort().forEach(function(d){
      if (d < sel.mn || d > sel.mx) return;
      examSubjects[d].forEach(function(x){ if (!f || schoolLevel(x.school) === f) subList.push(x); });
    });
    if (subList.length){
      // 날짜별로 묶어서 — 한 날짜에 여러 학교가 겹치면 직전보강이 몰리는 날이라 세어서 표시
      h += '<p class="exs-sub-h">날짜별 과목 (막대 아래 칸·슈국 캘린더에 표시)</p>';
      var byDate = {};
      subList.forEach(function(x){ (byDate[x.date] = byDate[x.date] || []).push(x); });
      Object.keys(byDate).sort().forEach(function(dk){
        var arr = byDate[dk];
        var nSch = {}; arr.forEach(function(x){ nSch[x.school] = 1; });
        var nn = Object.keys(nSch).length;
        h += '<p class="exs-sub-d">' + exsMd(dk) +
             (nn >= 2 ? ' <b>· ' + nn + '개교 겹침</b>' : '') + '</p>';
        h += arr.map(function(x){
          var first = examPeriods.some(function(p){ return p.school === x.school && p.start === x.date; });
          return '<div class="exs-row">' +
            '<span class="exs-tag" style="background:' + schoolColor(x.school) + '">' + esc(x.school) + '</span>' +
            (first ? '<span class="exs-first">첫째날</span>' : '') +
            '<span class="exs-note">' + esc(x.text) + '</span>' +
            '<span class="exs-acts"><button onclick="exsEditSubject(' + x.row + ')">수정</button>' +
            '<button onclick="exsDel(' + x.row + ',\'' + esc(x.school) + '\')">삭제</button></span></div>';
        }).join('');
      });
    }
  }
  h += '<div class="exs-add"><button onclick="exsEditPeriod(0)">+ 시험 기간 추가</button>' +
       '<button onclick="exsEditSubject(0)">+ 날짜별 과목 추가</button></div>';
  box.innerHTML = h;
  return box;
}
/* 막대 아래 칸 표기 — '고1 국어, 고3 독서' → '고1 국어·고3 독서' (과목 축약, 학교는 줄 이름에 있음) */
function exsCellAbbr(t){
  return String(t || '').split(',').map(function(p){
    p = p.trim();
    var mm = p.match(/^([고중])\s*([1-3])\s*(.*)$/);
    if (mm) return mm[1] + mm[2] + (mm[3] ? ' ' + subjAbbr(mm[3]) : '');
    return subjAbbr(p);
  }).filter(Boolean).join('·');
}
/* 시트와 같은 형식 — 월·날짜·요일 축이 맨 위, 학교별 색 막대가 아래로 쌓여 겹치는 일정을 한눈에.
 * 주말·오늘은 세로 띠, 한 줄 건너 격줄 배경으로 학교명과 막대를 눈으로 잇는다. 막대를 누르면 수정 창.
 * 학교명 열은 가로 스크롤에도 고정, 학교가 많으면 아래에도 날짜축을 한 번 더 그린다. (2026-08-21) */
function exsTimeline(ps){
  if (!ps.length) return '';
  var min = ps[0].start, max = ps[0].end;
  ps.forEach(function(p){ if (p.start < min) min = p.start; if (p.end > max) max = p.end; });
  var days = [];
  var d = new Date(+min.slice(0,4), +min.slice(5,7)-1, +min.slice(8,10));
  var endD = new Date(+max.slice(0,4), +max.slice(5,7)-1, +max.slice(8,10));
  while (d <= endD && days.length < 62){ days.push(ymdOf(d)); d.setDate(d.getDate()+1); }
  var idx = {}; days.forEach(function(x,i){ idx[x] = i; });
  var n = days.length, m = ps.length;
  var mirror = m > 8;                    // 막대가 많으면 아래에도 날짜축 반복(아래 줄에선 위 축이 안 보여서)
  function rowOf(pi){ return 4 + pi * 2; }   // 행: 1 월 / 2 날짜 / 3 요일 / 학교마다 막대 줄+과목 줄
  var endLine = rowOf(m) + (mirror ? 2 : 0);
  var h = '<div class="exs-tl" style="grid-template-columns:80px repeat(' + n + ',minmax(21px,1fr));">';
  days.forEach(function(x, i){           // 주말·오늘 세로 띠 (막대 뒤에 깔림)
    var wd = mkDayOf(x);
    var cls = x === todayStr() ? 'td' : ((wd === '토' || wd === '일') ? 'we' : '');
    if (cls) h += '<div class="exs-tl-col ' + cls + '" style="grid-row:2 / ' + endLine + ';grid-column:' + (i+2) + ';"></div>';
  });
  for (var t = 0; t < m; t += 2)         // 격줄 배경 (학교 한 곳 = 막대 줄+과목 줄 두 행)
    h += '<div class="exs-tl-track" style="grid-row:' + rowOf(t) + ' / ' + rowOf(t+1) + ';grid-column:2 / ' + (n+2) + ';"></div>';
  h += '<div class="exs-tl-c" style="grid-row:1;grid-column:1;"></div>';
  var ms = 0;                            // 월 표시 줄 (같은 달 날짜들을 하나로 묶음)
  for (var i = 1; i <= n; i++){
    if (i === n || days[i].slice(0,7) !== days[ms].slice(0,7)){
      h += '<div class="exs-tl-m" style="grid-row:1;grid-column:' + (ms+2) + ' / ' + (i+2) + ';"><span>' + (+days[ms].slice(5,7)) + '월</span></div>';
      ms = i;
    }
  }
  function axisRow(row, kind){           // kind 'd'=날짜 숫자 줄, 'w'=요일 줄
    return '<div class="exs-tl-c" style="grid-row:' + row + ';grid-column:1;"></div>' + days.map(function(x, i){
      var wd = mkDayOf(x);
      var cls = ((wd === '토' || wd === '일') ? ' we' : '') + (x === todayStr() ? ' td' : '');
      return '<div class="exs-tl-' + kind + cls + '" style="grid-row:' + row + ';grid-column:' + (i+2) + ';"' +
             ' title="' + exsMd(x) + '">' + (kind === 'd' ? +x.slice(8,10) : wd) + '</div>';
    }).join('');
  }
  h += axisRow(2, 'd') + axisRow(3, 'w');
  ps.forEach(function(p, pi){
    var s = idx[p.start] != null ? idx[p.start] : 0;
    var e = idx[p.end] != null ? idx[p.end] : n - 1;
    var r0 = rowOf(pi);
    var label = exsMdN(p.start) + (p.end !== p.start ? '~' + exsMdN(p.end) : '');
    var full = exsMd(p.start) + (p.end !== p.start ? ' ~ ' + exsMd(p.end) : '');
    h += '<div class="exs-tl-n" style="grid-row:' + r0 + ' / ' + (r0+2) + ';grid-column:1;">' + esc(p.school) +
      '<span class="exs-tl-nd">' + label + '</span></div>' +
      '<button type="button" class="exs-tl-bar" style="grid-row:' + r0 + ';grid-column:' + (s+2) + ' / ' + (e+3) + ';background:' + schoolColor(p.school) + ';"' +
      ' title="' + esc(p.school + ' ' + full + (p.text ? ' · ' + p.text : '') + ' — 누르면 수정') + '"' +
      ' onclick="exsEditPeriod(' + p.row + ')">' + label + '</button>';
    // 과목 줄 — 시트처럼 막대 바로 아래 칸에 그 날짜의 학년·과목. 빈 칸을 누르면 그 학교·날짜로 바로 입력.
    h += '<div class="exs-tl-sb" style="grid-row:' + (r0+1) + ';grid-column:' + (s+2) + ' / ' + (e+3) + ';"></div>';
    for (var c = 0; c < n; c++){
      var xs = (examSubjects[days[c]] || []).filter(function(x){ return x.school === p.school; });
      if ((c < s || c > e) && !xs.length) continue;   // 기간 밖 날짜는 과목이 있을 때만
      h += '<div class="exs-tl-s' + (xs.length ? ' has' : '') + (c > s && c <= e ? ' inbox' : '') + ((c < s || c > e) ? ' out' : '') + '"' +
        ' style="grid-row:' + (r0+1) + ';grid-column:' + (c+2) + ';"' +
        ' title="' + esc(p.school + ' ' + exsMd(days[c]) + (xs.length ? ' — 누르면 수정' : ' 과목 입력')) + '"' +
        ' onclick="' + (xs.length ? 'exsEditSubject(' + xs[0].row + ')'
                                  : 'exsEditSubject(0,\'' + esc(p.school) + '\',\'' + days[c] + '\')') + '">' +
        xs.map(function(x){ return esc(exsCellAbbr(x.text)); }).join('<br>') + '</div>';
    }
  });
  if (mirror) h += axisRow(rowOf(m), 'w') + axisRow(rowOf(m) + 1, 'd');
  return h + '</div>';
}
function exsSchoolInput(val){

function exsEditSubject(row, school, date){   // school·date: 타임라인 막대 아래 칸에서 눌렀을 때 미리 채움
