<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>정규 시간표 · 이수경국어</title>
<meta name="description" content="이수경국어 정규 수업 시간표 — 반 편성 확인 · 학생 이동 (교사용)" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ccircle cx='50' cy='50' r='48' fill='%23DCE9E4'/%3E%3C/svg%3E" />
<style>
  :root{
    --bg:#C6D5D2; --surface:#FFFFFF;
    --ink:#2A332F; --ink-soft:#65726B;
    --accent:#4C6E66; --btn:#628C83; --icon-bg:#EBF0ED;
    --line:#D7E3DD; --line-soft:#E5EDE8; --radius:16px;
    --g1:#FBF3DA; --g2:#EFE7F5; --g3:#DFEBE6; --mid:#E9EDF8; --etc:#F3EAE4;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);
    font-family:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",-apple-system,system-ui,sans-serif;
    font-size:16px;line-height:1.5;-webkit-font-smoothing:antialiased;padding:0 0 70px;}
  .wrap{max-width:1180px;margin:0 auto;padding:0 14px;}
  header{padding:6px 4px 8px;text-align:center;}
  .backlink{display:inline-flex;align-items:center;gap:6px;margin:18px 0 0;color:var(--ink-soft);text-decoration:none;font-size:.86rem;}
  .backlink:hover{color:var(--accent);}
  .brand{font-family:"Gowun Batang",serif;font-size:1.35rem;font-weight:700;color:var(--accent);margin:0;}
  .sub{color:var(--ink-soft);font-size:.85rem;margin:4px 0 0;}

  .gate{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:26px 22px;margin:26px auto;max-width:380px;text-align:center;}
  .gate input{width:100%;font:inherit;font-size:1.05rem;text-align:center;letter-spacing:.2em;
    padding:12px;border:1.5px solid var(--line);border-radius:12px;margin:14px 0 10px;}
  .gate button{width:100%;font:inherit;font-size:1rem;color:#fff;background:var(--btn);
    border:none;border-radius:12px;padding:13px;cursor:pointer;}
  .gate .err{color:#B4574E;font-size:.85rem;min-height:1.2em;margin:8px 0 0;}

  .bar{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:12px 14px;margin:10px 0;display:none;}
  .viewtabs{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap;}
  .viewtabs button{font:inherit;font-size:.92rem;background:#fff;border:1px solid var(--line);
    border-radius:10px;padding:6px 14px;color:var(--ink);cursor:pointer;}
  .viewtabs button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  .bookwrap{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;margin-right:6px;}
  .bookwrap button{border:none;border-radius:0;}
  .bookwrap button.on{background:var(--btn);color:#fff;font-weight:700;}
  .today-head{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.1rem;color:var(--accent);margin:14px 4px 2px;}
  .weeknav-tt{display:flex;align-items:center;gap:10px;margin:14px 4px 8px;}
  .weeknav-tt button{font:inherit;font-size:.88rem;background:var(--icon-bg);color:var(--ink);
    border:1px solid var(--line-soft);border-radius:10px;padding:6px 12px;cursor:pointer;}
  .weeknav-tt b{font-family:"Gowun Batang",serif;font-size:1.05rem;color:var(--accent);}
  .weeknav-tt small{color:var(--ink-soft);}
  .dhead small{font-weight:400;font-size:.72rem;opacity:.9;margin-left:4px;}
  .today-sum{font-size:.82rem;color:var(--ink-soft);margin:0 4px 10px;}
  .today-sum b{color:var(--accent);}
  .blk .stus button.at-ok{background:var(--btn);border-color:var(--btn);color:#fff;}
  .blk .stus button.at-late{background:#F5E7C6;border-color:#B08A3E;color:#6B5423;}
  .blk .stus button.at-abs{background:#F0DBD8;border-color:#C99B94;color:#8A3B33;text-decoration:line-through;}
  .att-btns{display:flex;gap:8px;margin:10px 0 4px;}
  .att-btns button{flex:1;font:inherit;font-size:.95rem;border-radius:10px;padding:11px 4px;cursor:pointer;border:1.5px solid var(--line);background:#fff;color:var(--ink);}
  .att-btns button.pick-ok.on{background:var(--btn);border-color:var(--btn);color:#fff;}
  .att-btns button.pick-late.on{background:#B08A3E;border-color:#B08A3E;color:#fff;}
  .att-btns button.pick-abs.on{background:#B4574E;border-color:#B4574E;color:#fff;}
  .viewtabs .sp{flex:1;}
  .viewtabs .reload{font-size:.82rem;background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:9px;padding:6px 12px;color:var(--ink-soft);cursor:pointer;}
  .attbar{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .attbar.show{display:flex;}
  .attbar .elabel{font-size:.78rem;color:var(--ink-soft);margin-right:2px;}
  .attbar button{font:inherit;font-size:.84rem;background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:9px;padding:5px 12px;color:var(--ink);cursor:pointer;}
  .attbar button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  body.multisel .blk{cursor:pointer;}
  .stus button.msel{outline:2px solid var(--accent);outline-offset:1px;font-weight:700;}
  .searchbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .searchbar input{font:inherit;font-size:.9rem;padding:6px 12px;border:1.5px solid var(--line);border-radius:10px;width:150px;}
  #searchResults{display:flex;gap:6px;flex-wrap:wrap;font-size:.8rem;align-items:center;color:var(--ink-soft);}
  #searchResults button{font:inherit;font-size:.8rem;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:3px 11px;cursor:pointer;color:var(--ink);}
  #searchResults button b{color:var(--accent);}
  .blk.search-blk{outline:2px solid #B08A3E;}
  .stus button.search-hit{background:#B08A3E;border-color:#B08A3E;color:#fff;font-weight:700;}
  .editbar{display:none;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px;}
  .editbar.show{display:flex;}
  .editbar .elabel{font-size:.78rem;color:var(--ink-soft);margin-right:2px;}
  .editbar button{font:inherit;font-size:.84rem;background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:9px;padding:5px 12px;color:var(--ink);cursor:pointer;}
  .editbar button.on{background:var(--accent);border-color:var(--accent);color:#fff;font-weight:700;}
  body.editpick .blk{cursor:pointer;}
  body.editpick .blk:hover{outline:2px solid var(--btn);}
  .daytabs{display:none;gap:6px;flex-wrap:wrap;align-items:center;}
  .daytabs.show{display:flex;}
  .daytabs button{font:inherit;font-size:.95rem;background:#fff;border:1px solid var(--line);
    border-radius:999px;padding:6px 16px;color:var(--ink);cursor:pointer;}
  .daytabs button.on{background:var(--btn);border-color:var(--btn);color:#fff;font-weight:700;}
  .dayhead{font-family:"Gowun Batang",serif;font-weight:700;font-size:1.05rem;color:var(--accent);
    margin:18px 4px 6px;padding-top:4px;}
  .dayhead:first-child{margin-top:2px;}
  .dayhead small{font-family:"Gowun Dodum",sans-serif;font-weight:400;color:var(--ink-soft);font-size:.78rem;margin-left:8px;}
  .day-empty{color:var(--ink-soft);font-size:.82rem;margin:0 4px 10px;}
  .hint{font-size:.8rem;color:var(--ink-soft);margin:8px 2px 0;}
  .legend{display:flex;gap:10px;flex-wrap:wrap;font-size:.75rem;color:var(--ink-soft);margin-top:6px;}
  .legend i{display:inline-block;width:12px;height:12px;border-radius:3px;margin-right:4px;vertical-align:-1px;border:1px solid rgba(0,0,0,.06);}

  /* 이동 모드 바 */
  .movebar{display:none;position:sticky;top:0;z-index:30;background:var(--accent);color:#fff;
    border-radius:12px;padding:10px 14px;margin:8px 0;align-items:center;gap:10px;}
  .movebar.on{display:flex;}
  .movebar b{font-family:"Gowun Batang",serif;}
  .movebar .sp{flex:1;}
  .movebar button{font:inherit;font-size:.85rem;background:rgba(255,255,255,.16);color:#fff;
    border:1px solid rgba(255,255,255,.45);border-radius:9px;padding:5px 12px;cursor:pointer;}

  .status{min-height:1.3em;font-size:.85rem;margin:6px 4px;color:var(--ink-soft);}
  .status.ok{color:#4C8A5C;}
  .status.err{color:#B4574E;}

  /* 시간표 그리드 */
  .sheet{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--radius);
    padding:14px;margin:8px 0;overflow-x:auto;display:none;}
  .grid{display:grid;gap:3px;min-width:900px;}
  .grid.fitgrid{min-width:0;}
  .grid.fitgrid .blk{padding:4px 5px;}
  .grid.fitgrid .blk .stus{gap:2px;}
  .grid.fitgrid .blk .stus button{font:inherit;font-size:.65rem;padding:0 4px;letter-spacing:-.02em;line-height:1.6;}
  .grid.fitgrid .blk .bt small{font-size:.64rem;white-space:normal;}
  .grid.fitgrid .blk .bt .nm{font-size:.74rem;}
  .thead{font-size:.8rem;text-align:center;color:var(--ink-soft);padding:2px 0 4px;}
  .thead b{display:block;font-family:"Gowun Batang",serif;font-size:.9rem;color:var(--accent);}
  .tlab{font-size:.7rem;color:var(--ink-soft);text-align:right;padding:2px 6px 0 0;white-space:nowrap;}
  .blk{border-radius:10px;border:1px solid rgba(0,0,0,.05);padding:6px 7px;overflow:hidden;
    font-size:.78rem;cursor:default;}
  .blk .bt{margin-bottom:3px;}
  .blk .bt .nm{display:block;font-weight:700;font-size:.8rem;line-height:1.35;word-break:keep-all;}
  .blk .bt small{display:block;font-weight:400;color:var(--ink-soft);font-size:.68rem;white-space:nowrap;}
  .blk .stus{display:flex;flex-wrap:wrap;gap:3px;}
  .blk .stus button{font:inherit;font-size:.74rem;background:rgba(255,255,255,.75);border:1px solid rgba(0,0,0,.08);
    border-radius:999px;padding:1px 8px;cursor:pointer;color:var(--ink);line-height:1.5;}
  .blk .stus button:hover{border-color:var(--accent);}
  .blk .stus button.sel{background:var(--accent);border-color:var(--accent);color:#fff;}
  .blk .stus button.once{background:#EFE9F7;border:1px dashed #8A6FA8;color:#5E4A78;font-weight:700;}
  .blk .stus button.away{opacity:.5;}
  .blk .stus button.away em{font-style:normal;font-size:.66rem;color:var(--accent);margin-left:3px;}
  .blk .empty-note{color:var(--ink-soft);font-size:.72rem;}
  .blk .btns{display:flex;gap:2px;margin:0 0 4px;flex-wrap:wrap;}
  .blk .bbtn{font:inherit;font-size:.62rem;background:rgba(255,255,255,.7);border:1px solid rgba(0,0,0,.12);
    border-radius:7px;padding:1px 5px;cursor:pointer;color:var(--ink-soft);white-space:nowrap;flex:none;}
  .blk .bbtn:hover{border-color:var(--accent);color:var(--accent);}
  body.moving .blk .btns{visibility:hidden;}
  .cell{border-top:1px dotted #BFCFC9;}
  .tlab{border-top:1px dotted #BFCFC9;}
  .thead{border-top:none;}
  .dhead{font-family:"Gowun Batang",serif;font-weight:700;text-align:center;color:#fff;background:var(--btn);
    border-radius:8px;padding:3px 0;font-size:.9rem;}
  .scrollwrap{max-height:calc(100vh - 150px);overflow:auto;}
  .stickhead{position:sticky;top:0;z-index:10;background:var(--surface);width:max-content;min-width:100%;
    padding-bottom:3px;box-shadow:0 3px 6px -3px rgba(42,51,47,.18);}
  .stickhead .grid{min-width:0;}
  .stickhead .thead{background:var(--surface);}
  body.classmoving .cell{outline:1.5px dashed var(--line);outline-offset:-2px;cursor:pointer;}
  body.classmoving .cell:hover{background:var(--icon-bg);outline-color:var(--btn);}
  body.classmoving .blk{opacity:.55;pointer-events:none;}
  body.classmoving #mv-remove{display:none;}
  body.classmoving .blk.moving-src{opacity:1;outline:2px solid var(--accent);}

  /* 모달 */
  .modal-bg{position:fixed;inset:0;background:rgba(42,51,47,.45);display:none;z-index:50;align-items:center;justify-content:center;padding:16px;}
  .modal-bg.on{display:flex;}
  .modal{background:#fff;border-radius:16px;max-width:430px;width:100%;padding:20px;max-height:82vh;overflow:auto;}
  .modal.wide{max-width:520px;}
  .modal h3{font-family:"Gowun Batang",serif;color:var(--accent);margin:0 0 4px;font-size:1.05rem;}
  .modal .mdesc{font-size:.85rem;color:var(--ink-soft);margin:0 0 10px;}
  .modal label.radio{display:block;border:1.5px solid var(--line);border-radius:10px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:.92rem;}
  .modal label.radio.on{border-color:var(--btn);background:var(--icon-bg);}
  .modal label.radio small{display:block;color:var(--ink-soft);font-size:.76rem;}
  .modal textarea,.modal input[type=text]{width:100%;font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;margin-top:6px;}
  .modal textarea{min-height:54px;resize:vertical;}
  .modal .mbtns{display:flex;gap:8px;margin-top:14px;}
  .modal .mbtns button{flex:1;font:inherit;font-size:.95rem;border-radius:10px;padding:10px;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .modal .mbtns .primary{background:var(--btn);border-color:var(--btn);color:#fff;}
  .modal .merr{color:#B4574E;font-size:.8rem;min-height:1.1em;margin:6px 0 0;}
  .modal .subnote{font-size:.76rem;color:var(--ink-soft);margin-top:8px;}
  .pick-list{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px;max-height:200px;overflow:auto;}
  .pick-list button{font:inherit;font-size:.84rem;background:#fff;border:1px solid var(--line);border-radius:999px;padding:4px 11px;cursor:pointer;}
  .pick-list button small{color:var(--ink-soft);font-size:.72rem;margin-left:4px;}
  .mk-item{border:1px solid var(--line-soft);border-radius:10px;padding:9px 11px;font-size:.86rem;margin-top:8px;}
  .mk-item.done{opacity:.55;}
  .mk-item .mk-top{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap;}
  .mk-item .mk-top b{font-family:"Gowun Batang",serif;}
  .mk-item .mk-top small{color:var(--ink-soft);}
  .mk-item .mk-row{display:flex;gap:6px;margin-top:6px;align-items:center;}
  .mk-item .mk-row input{flex:1;font:inherit;font-size:.84rem;border:1.5px solid var(--line);border-radius:8px;padding:5px 9px;}
  .mk-item .mk-row button{font:inherit;font-size:.78rem;background:var(--icon-bg);border:1px solid var(--line-soft);
    border-radius:8px;padding:5px 10px;cursor:pointer;color:var(--ink);white-space:nowrap;}
  .mk-item .mk-row button.done-btn{background:var(--btn);border-color:var(--btn);color:#fff;}
  .mk-sec{font-size:.8rem;color:var(--ink-soft);margin:12px 0 2px;font-weight:700;}
  .mk-item .mk-alt{font-size:.76rem;color:var(--ink-soft);white-space:nowrap;}
  .mk-item .mk-plan{font-size:.82rem;color:var(--accent);margin-top:5px;}
  .log-list{display:flex;flex-direction:column;gap:8px;margin-top:10px;}
  .log-item{border:1px solid var(--line-soft);border-radius:10px;padding:8px 10px;font-size:.84rem;}
  .log-item .lk{display:inline-block;font-size:.7rem;border-radius:6px;padding:0 6px;margin-right:6px;color:#fff;background:var(--btn);}
  .log-item .lk.once{background:#B08A3E;}
  .log-item .lk.minus{background:#B4574E;}
  .log-item .lr{color:var(--ink-soft);font-size:.78rem;margin-top:2px;}
  .blk.c-g1{background:var(--g1);} .blk.c-g2{background:var(--g2);} .blk.c-g3{background:var(--g3);}
  .blk.c-mid{background:var(--mid);} .blk.c-etc{background:var(--etc);}
  body.moving .blk.droppable{outline:2px dashed var(--btn);outline-offset:1px;cursor:pointer;}
  body.moving .blk.droppable:hover{outline-style:solid;background-image:linear-gradient(rgba(98,140,131,.12),rgba(98,140,131,.12));}
  body.moving .blk .stus button{pointer-events:none;}
  body.moving .blk .stus button.sel{pointer-events:auto;}
  .empty-day{text-align:center;color:var(--ink-soft);padding:30px 0;font-size:.9rem;}
  footer{text-align:center;margin-top:34px;color:var(--ink-soft);font-size:.8rem;}
</style>
</head>
<body>
<main class="wrap">
  <a class="backlink" href="https://coke4497-sys.github.io/shueguk-hub/index.html">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="width:16px;height:16px;"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    티쳐스 메인 페이지로 가기
  </a>
  <header>
    <p class="brand">정규 시간표</p>
    <p class="sub">Shueguk · 반 편성 확인과 학생 이동 (교사용) — 이동은 저장 즉시 리포트·학생 페이지에 반영</p>
  </header>

  <!-- 비밀번호 게이트 -->
  <div class="gate" id="gate">
    <div style="font-family:'Gowun Batang',serif;font-weight:700;">교사 확인</div>
    <input id="pw" type="password" inputmode="text" placeholder="비밀번호" autocomplete="off" />
    <button onclick="tryLogin()">확인</button>
    <p class="err" id="gate-err"></p>
  </div>

  <!-- 상단 컨트롤 -->
  <div class="bar" id="bar">
    <div class="viewtabs">
      <span class="bookwrap"><button id="b-reg" onclick="setBook('정규')">정규</button><button id="b-exam" onclick="setBook('내신')">내신</button></span>
      <button id="v-today" onclick="setMode('today')">오늘의 시간표</button>
      <button id="v-all" onclick="setMode('all')">전체 시간표</button>
      <button id="v-week" onclick="setMode('week')">주차별</button>
      <span class="sp"></span>
      <button class="reload" onclick="openMakeup()">결석자 관리</button>
      <button class="reload" onclick="load(true)">다시 불러오기</button>
    </div>
    <div class="editbar" id="editbar">
      <span class="elabel">편집</span>
      <button id="e-move" onclick="setEdit('move')">반 이동</button>
      <button id="e-add" onclick="setEdit('add')">학생 추가</button>
      <button id="e-del" onclick="setEdit('del')">반 삭제</button>
      <button onclick="openAddClass()">반 추가</button>
      <button onclick="openLog()">이동 기록</button>
    </div>
    <div class="attbar" id="attbar">
      <span class="elabel">출석</span>
      <button id="a-multi" onclick="toggleMulti()">복수 선택</button>
      <button onclick="multiApply('출석')">선택 출석</button>
      <button onclick="multiApply('결석')">선택 결석</button>
      <button onclick="multiApply('')">선택 기록 지우기</button>
      <span id="multiCnt" class="elabel"></span>
    </div>
    <div class="searchbar">
      <input id="stu-q" placeholder="학생 검색" autocomplete="off" />
      <span id="searchResults"></span>
    </div>
    <p class="hint">학생 이름을 누르면 이동 모드가 켜져요. 옮길 반(다른 요일 포함)을 누르면 이동됩니다.</p>
    <div class="legend">
      <span><i style="background:var(--g1)"></i>고1</span>
      <span><i style="background:var(--g2)"></i>고2</span>
      <span><i style="background:var(--g3)"></i>고3</span>
      <span><i style="background:var(--mid)"></i>정리정독(중등)</span>
      <span><i style="background:var(--etc)"></i>기타</span>
    </div>
  </div>

  <div class="movebar" id="movebar">
    <span>이동 중 — <b id="mv-name"></b> <span id="mv-from" style="font-size:.82rem;opacity:.85;"></span></span>
    <span class="sp"></span>
    <button id="mv-remove" onclick="openRemove()">반에서 빼기</button>
    <button onclick="cancelMove()">취소</button>
  </div>
  <p class="status" id="status"></p>

  <div class="sheet" id="sheet"></div>

  <footer>이수경국어 Shueguk · 정규 시간표</footer>
</main>

<div class="modal-bg" id="modal"><div class="modal" id="modal-box"></div></div>

<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzhCncBwn-JlqXARC3wfrWUCuNHzlNK2df0bdhx-w78Xr8mzYUcIYZOJdRi9N4bHtsb/exec";
var DAYS = ['월', '화', '수', '목', '금', '토', '일'];
var TEACHER_ORDER = ['슈', '선주', '승연', '주혜', '현정', '연주', '현지', '지원', '덕기', '은지'];

var pw = 'sh';   // 티쳐스 페이지 비밀번호 제거(접속 간소화, 2026-08-14) — 백엔드 TEACHER_PW 내장
var classes = [];      // {id, day, start, end, loc, teacher, cls, students[]}
var onceMoves = [];    // {row, date, student, fromId, toId, reason}
var roster = null;     // 재원생 명단 캐시 (추가용)
var attend = {};       // 오늘 출석: (반ID + '|' + 학생) -> {status, memo}
var day = '수';
var mode = sessionStorage.getItem('tt_mode') || 'today'; // 'today'(오늘) | 'all'(전체) | 'week'(주차별)
if (mode === 'day') mode = 'week';
var WEEK_DAYS = ['수','목','금','토','일','월','화'];   // 주차 = 수요일 시작 (숙제 검사와 동일)
var WEEK_VIEW_ORDER = ['월','화','수','목','금','토','일'];   // 주차별 화면 배치: 월·화(직전보강)를 수요일 왼쪽에
var weekAttend = {};   // 주차 출석: 날짜|반ID|학생 -> {status, memo}
var weekOnce = [];     // 주차 1회 이동
var attDate = null;    // 출석 모달이 다루는 날짜
var editMode = null;        // 'move' | 'add' | 'del' — 편집 도구줄에서 선택
var multiMode = false;      // 오늘 보기 복수 선택 모드
var multiSel = {};          // 선택된 학생: cid|이름 → {cid, nm}
var pendingScroll = null;   // 재렌더 후 복원할 스크롤 위치
var keepScroll = true;      // 보기 전환 시에는 복원하지 않음
var book = sessionStorage.getItem('tt_book') || '정규';  // '정규' | '내신'
var moving = null;      // 학생 이동 중 {name, fromId, fromLabel}
var classMoving = null; // 반 통째 이동 중 {id}

function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function todayDay(){ return ['일','월','화','수','목','금','토'][new Date().getDay()]; }
function weekStartOf(d){
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 4) % 7));   // 수요일로
  return x;
}
var weekStart = weekStartOf(new Date());
function ymdOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mdOf(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
function weekDates(){
  var out = {};
  for (var i = 0; i < 7; i++){
    var d = new Date(weekStart); d.setDate(d.getDate() + i);
    out[WEEK_DAYS[i]] = d;
  }
  return out;
}
function moveWeek(n){
  weekStart.setDate(weekStart.getDate() + 7*n);
  loadWeek();
}
function loadWeek(){
  var to = new Date(weekStart); to.setDate(to.getDate() + 6);
  setStatus('주차 기록을 불러오는 중…');
  fetch(ENDPOINT + '?action=timetableWeek&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) +
        '&from=' + ymdOf(weekStart) + '&to=' + ymdOf(to) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      weekAttend = {}; weekOnce = [];
      if (d && d.result === 'success'){
        (d.attend || []).forEach(function(a){ weekAttend[a.date + '|' + a.classId + '|' + a.student] = { status:a.status, memo:a.memo }; });
        weekOnce = d.onceMoves || [];
      }
      setStatus('');
      render();
    })
    .catch(function(){ setStatus('주차 기록을 불러오지 못했어요.', 'err'); render(); });
}
function attendAt(dateStr, cid, nm){
  return (mode === 'week') ? weekAttend[dateStr + '|' + cid + '|' + nm] : attend[cid + '|' + nm];
}

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function setStatus(m,k){ var s=$('status'); s.textContent=m||''; s.className='status'+(k?' '+k:''); }

/* "5:30" → 분(오전 10~12시는 오전, 1~9시는 오후로 해석) */
function mins(t){
  var p = String(t||'').split(':');
  var h = parseInt(p[0],10)||0, m = parseInt(p[1],10)||0;
  if (h < 10) h += 12;
  return h*60+m;
}
function minsEnd(c){
  var s = mins(c.start), e = mins(c.end || c.start);
  if (e <= s) e += 12*60;
  return e;
}
function fmt12(t){
  var h24 = Math.floor(t/60), mm = t%60;
  var h12 = h24 > 12 ? h24-12 : h24;
  return h12 + ':' + (mm<10?'0':'')+mm;
}
function sortNames(arr){
  return arr.slice().sort(function(a,b){ return String(a).localeCompare(String(b), 'ko'); });
}
function colorOf(cls){
  if (/^고1/.test(cls)) return 'c-g1';
  if (/^고2/.test(cls)) return 'c-g2';
  if (/^고3/.test(cls)) return 'c-g3';
  if (/정리정독/.test(cls)) return 'c-mid';
  return 'c-etc';
}

/* ── 로그인 ── */
function tryLogin(){
  var v = $('pw').value.trim();
  if (!v){ $('gate-err').textContent='비밀번호를 입력해 주세요.'; return; }
  pw = v;
  $('gate-err').textContent='';
  load(false, function(ok){
    if (ok){ sessionStorage.setItem('tt_pw', pw); $('gate').style.display='none'; $('bar').style.display='block'; $('sheet').style.display='block'; }
    else { pw=''; $('gate-err').textContent='비밀번호가 맞지 않아요.'; }
  });
}
$('pw').addEventListener('keydown', function(e){ if(e.key==='Enter') tryLogin(); });

/* ── 데이터 ── */
function load(isReload, cb){
  setStatus('시간표를 불러오는 중…');
  fetch(ENDPOINT + '?action=timetableList&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.result !== 'success'){
        if (cb) cb(false); else setStatus('불러오지 못했어요. 새로고침 해 주세요.', 'err');
        return;
      }
      classes = d.classes || [];
      onceMoves = d.onceMoves || [];
      setStatus(isReload ? '최신 시간표로 다시 불러왔어요.' : '', isReload ? 'ok' : '');
      loadAttend(function(){
        renderTabs();
        if (mode === 'week') loadWeek(); else render();
        if (cb) cb(true);
      });
    })
    .catch(function(){ if (cb) cb(false); else setStatus('서버 연결에 실패했어요.', 'err'); });
}
function loadAttend(done){
  fetch(ENDPOINT + '?action=attendList&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) +
        '&date=' + todayStr() + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      attend = {};
      if (d && d.result === 'success') (d.attend || []).forEach(function(a){
        attend[a.classId + '|' + a.student] = { status: a.status, memo: a.memo };
      });
      done();
    })
    .catch(function(){ done(); });
}

/* ── 렌더 ── */
function setEdit(m){
  if (editMode === m){ clearEdit(); return; }
  if (moving || classMoving) cancelMove();
  editMode = m;
  document.body.classList.add('editpick');
  ['e-move','e-add','e-del'].forEach(function(id){ $(id).classList.remove('on'); });
  $('e-' + m).classList.add('on');
  setStatus(m === 'move' ? '이동할 반을 누르세요. 누른 뒤 옮길 빈 자리를 누르면 반 전체가 이동해요.'
          : m === 'add'  ? '학생을 추가할 반을 누르세요.'
                         : '삭제할 반을 누르세요. (빈 반만 삭제할 수 있어요)');
}
function clearEdit(){
  editMode = null;
  document.body.classList.remove('editpick');
  ['e-move','e-add','e-del'].forEach(function(id){ var b=$(id); if(b) b.classList.remove('on'); });
  setStatus('');
}
function applyEdit(c){
  var m = editMode;
  clearEdit();
  if (m === 'move'){ startClassMove(c); return; }
  if (m === 'add'){ openAdd(c); return; }
  if (m === 'del'){
    if (c.students.length){ alert('학생이 남아 있는 반은 삭제할 수 없어요.\n먼저 학생을 다른 반으로 이동하거나 빼주세요. (' + c.students.length + '명)'); return; }
    if (!confirm(labelOf(c) + '\n\n이 빈 반을 삭제할까요?')) return;
    post({ action:'timetableDeleteClass', book:book, classId:c.id }, '삭제하는 중…', function(res){
      if (res && res.result === 'success'){ setStatus('반을 삭제했어요.', 'ok'); load(true); }
      else setStatus('삭제 실패: ' + ((res && res.message) || '오류'), 'err');
    });
  }
}
function setMode(m){
  mode = m;
  sessionStorage.setItem('tt_mode', m);
  keepScroll = false;
  clearEdit();
  cancelMove();
  renderTabs();
  if (m === 'week') loadWeek(); else render();
}
function setBook(b){
  if (b === book) return;
  book = b;
  sessionStorage.setItem('tt_book', b);
  cancelMove();
  load(false);
}
function renderTabs(){
  $('b-reg').classList.toggle('on', book==='정규');
  $('b-exam').classList.toggle('on', book==='내신');
  $('v-today').classList.toggle('on', mode==='today');
  $('v-all').classList.toggle('on', mode==='all');
  $('v-week').classList.toggle('on', mode==='week');
  document.querySelector('.hint').textContent =
    (mode === 'today') ? '학생 이름을 누르면 출석·지각·결석 기록 창이 떠요. 그 창 아래 [다른 반으로 1회 이동] 버튼으로 1회 이동도 할 수 있어요.'
    : (mode === 'week') ? '그 주의 출석·1회 이동 기록이 함께 보여요. 학생 이름을 누르면 해당 날짜의 출석 기록·수정. 월·화 직전보강은 위 반 추가 버튼으로 만드세요.'
    : '학생 이름을 누르면 이동 모드가 켜져요. 옮길 반(다른 요일 포함)을 누르면 영구 이동됩니다.';
  $('editbar').classList.toggle('show', mode !== 'today');
  $('attbar').classList.toggle('show', mode === 'today');
}
function render(){
  var host = $('sheet');
  var prevSw = host.querySelector('.scrollwrap');
  pendingScroll = (keepScroll && prevSw) ? { top: prevSw.scrollTop, left: prevSw.scrollLeft } : null;
  keepScroll = true;
  host.innerHTML = '';
  if (mode === 'today'){
    var td = todayDay();
    var list = classes.filter(function(c){ return c.day===td; });
    var head = document.createElement('p');
    head.className = 'today-head';
    var dt = new Date();
    head.textContent = '오늘의 시간표 — ' + (dt.getMonth()+1) + '/' + dt.getDate() + ' (' + td + ') · ' + book;
    host.appendChild(head);
    var cnt = { '출석':0, '지각':0, '결석':0 };
    Object.keys(attend).forEach(function(k){ if (cnt[attend[k].status] != null) cnt[attend[k].status]++; });
    var sum = document.createElement('p');
    sum.className = 'today-sum';
    sum.innerHTML = '출석 <b>' + cnt['출석'] + '</b> · 지각 <b>' + cnt['지각'] + '</b> · 결석 <b>' + cnt['결석'] + '</b>';
    host.appendChild(sum);
    if (!list.length){
      var em = document.createElement('p');
      em.className = 'empty-day';
      em.textContent = '오늘(' + td + ')은 등록된 ' + book + ' 수업이 없어요.';
      host.appendChild(em);
      return;
    }
    host.appendChild(buildDayGrid(list));
    return;
  }
  if (mode === 'all'){
    host.appendChild(buildFullGrid());
    return;
  }
  // 주차별
  var to = new Date(weekStart); to.setDate(to.getDate() + 6);
  var isThis = ymdOf(weekStart) === ymdOf(weekStartOf(new Date()));
  var nav = document.createElement('div');
  nav.className = 'weeknav-tt';
  nav.innerHTML = '<button onclick="moveWeek(-1)">지난주</button>'+
    '<b>' + mdOf(weekStart) + ' ~ ' + mdOf(to) + ' 주차</b>' + (isThis ? '<small>(이번 주)</small>' : '')+
    '<button onclick="moveWeek(1)">다음주</button>';
  host.appendChild(nav);
  host.appendChild(buildWeekGrid());
}

function fmtT(t){
  var h24 = Math.floor(t/60), mm = t%60;
  var h12 = h24 > 12 ? h24-12 : h24;
  return h12 + ':' + (mm<10?'0':'')+mm;
}

/* 반 블록 요소 (내용·클릭 공통) — 위치는 호출한 쪽에서 지정 */
function blockEl(c){
  var b = document.createElement('div');
  var todayDrop = (mode==='today' && moving && moving.once) ? 'droppable ' : '';
  b.className = 'blk ' + (mode==='today' ? todayDrop : 'droppable ') + colorOf(c.cls) + (classMoving && classMoving.id===c.id ? ' moving-src' : '');
  b.setAttribute('data-cid', c.id);
  var awayOf = {};   // 이 반에서 1회 이동으로 빠진 학생 → {label, row}
  var temps = [];    // 이 반으로 1회 이동해 온 학생
  onceMoves.forEach(function(o){
    if (o.fromId === c.id){ var t = classes.find(function(x){ return x.id===o.toId; }); awayOf[o.student.replace(/\(.*\)$/,'')] = { label: t ? labelOf(t) : '', row: o.row }; }
    if (o.toId === c.id) temps.push(o);
  });
  var chips = '';
  var sorted = sortNames(c.students);
  if (mode === 'today'){
    chips = sorted.map(function(nm){
      var plain = nm.replace(/\(.*\)$/,'');
      var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
      var a = attend[c.id + '|' + nm];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : '';
      var tail = a && a.status==='지각' ? ' · 지각' : '';
      return '<button data-att-cid="'+esc(c.id)+'" data-nm="'+esc(nm)+'" class="'+cls2+(away?' away':'')+'"'+
             (away ? ' data-away-row="'+awayOf[plain].row+'"' : '')+
             ((a && a.memo) ? ' title="'+esc(a.memo)+'"' : (away ? ' title="오늘 1회 이동: '+esc(awayOf[plain].label)+'"' : ''))+'>'+
             esc(nm)+tail+(away?'<em>1회↗</em>':'')+'</button>';
    }).join('');
    chips += temps.sort(function(a,b){ return a.student.localeCompare(b.student,'ko'); }).map(function(o){
      var a = attend[c.id + '|' + o.student];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : 'once';
      return '<button data-att-cid="'+esc(c.id)+'" data-nm="'+esc(o.student)+'" data-once-row="'+o.row+'" class="'+cls2+'" title="1회 이동 · 사유: '+esc(o.reason)+((a&&a.memo)?' / '+esc(a.memo):'')+'">'+esc(o.student)+' · 1회</button>';
    }).join('');
  } else {
    chips = sorted.map(function(nm){
      var plain = nm.replace(/\(.*\)$/,'');
      var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
      return '<button data-cid="'+esc(c.id)+'" data-nm="'+esc(nm)+'"'+
             (away ? ' class="away" title="이번 주 1회 이동: '+esc(awayOf[plain].label)+'"' : '')+'>'+
             esc(nm)+(away?'<em>1회↗</em>':'')+'</button>';
    }).join('');
    chips += temps.map(function(o){
      return '<button class="once" data-once-row="'+o.row+'" data-nm="'+esc(o.student)+'" title="사유: '+esc(o.reason)+' ('+esc(o.date)+') — 수정은 오늘의 시간표에서">'+esc(o.student)+' · 1회</button>';
    }).join('');
  }
  if (!chips) chips = '<span class="empty-note">비어 있음</span>';
  var btnRow = (mode === 'today')
    ? '<div class="btns"><button class="bbtn attall" title="기록 없는 학생을 모두 출석 처리">전체 출석</button></div>'
    : '';   // 편집 기능은 상단 편집 도구줄에서
  b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+'</span>'+
                '<small>'+esc(c.start)+'~'+esc(c.end)+' · '+c.students.length+'명</small></div>'+
                btnRow +
                '<div class="stus">'+chips+'</div>';
  b.addEventListener('click', function(e){ onBlockClick(e, c); });
  return b;
}

/* 렌더 후 블록이 잘리지 않도록 30분 행 높이를 일괄 상향(균일 간격 유지) */
function tuneRowHeight(g, headerAuto, nrows){
  requestAnimationFrame(function(){
    var maxPer = 46;
    g.querySelectorAll('.blk').forEach(function(b){
      var gr = String(b.style.gridRow).split('/');
      var span = Math.max(1, (parseInt(gr[1], 10) - parseInt(gr[0], 10)) || 1);
      var per = Math.ceil((b.scrollHeight + 2 - (span - 1) * 3) / span);
      if (per > maxPer) maxPer = per;
    });
    maxPer = Math.min(maxPer, 140);
    if (maxPer > 46) g.style.gridTemplateRows = (headerAuto ? headerAuto + ' ' : '') + 'repeat(' + nrows + ', ' + maxPer + 'px)';
    var sw = g.closest ? g.closest('.scrollwrap') : null;
    if (sw && pendingScroll){ sw.scrollTop = pendingScroll.top; sw.scrollLeft = pendingScroll.left; pendingScroll = null; }
    applySearchHits();
    applyMultiSel();
  });
}
function addCell(g, ci, r, dname, cinfo, lo, rowOffset){
  var cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.gridColumn = String(ci);
  cell.style.gridRow = String(r + rowOffset);
  cell.addEventListener('click', function(){
    if (classMoving) dropClass(dname, cinfo, lo + r*30);
  });
  g.appendChild(cell);
}

/* 요일별·오늘 보기: 담당T × 시간 그리드 */
function buildDayGrid(list){
  var dname = list.length ? list[0].day : day;
  var cols = [], seen = {};
  classes.forEach(function(c){
    var key = c.loc + '|' + c.teacher;
    if (!seen[key]){ seen[key] = true; cols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
  });
  cols.sort(function(a,b){
    var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  if (!cols.length) cols = TEACHER_ORDER.slice(0,4).map(function(t){ return { key:'|'+t, loc:'', teacher:t }; });
  var colIdx = {}; cols.forEach(function(c,i){ colIdx[c.key] = i; });

  // 행: 스프레드시트와 같은 고정 축 — 평일 2:00~10:00, 주말 10:00~9:00. 수업이 벗어나면 자동 확장.
  var weekend = (dname === '토' || dname === '일');
  var lo = weekend ? 10*60 : 14*60;
  var hi = weekend ? 21*60 : 22*60;
  list.forEach(function(c){
    lo = Math.min(lo, mins(c.start));
    hi = Math.max(hi, minsEnd(c));
  });
  lo = Math.floor(lo/30)*30; hi = Math.ceil(hi/30)*30;
  var nrows = Math.max(1, Math.round((hi - lo) / 30));

  var g = document.createElement('div');
  g.className = 'grid' + (mode==='today' ? ' fitgrid' : '');
  g.style.gridTemplateColumns = (mode==='today')
    ? '42px repeat(' + cols.length + ', minmax(0, 1fr))'      // 오늘 보기: 스크롤 없이 전체 폭에 맞춤
    : '52px repeat(' + cols.length + ', minmax(118px, 1fr))';
  g.style.gridTemplateRows = 'auto repeat(' + nrows + ', 46px)';   // 30분 = 46px 균일 간격

  var corner = document.createElement('div'); corner.className='thead'; g.appendChild(corner);
  cols.forEach(function(c){
    var h = document.createElement('div');
    h.className = 'thead';
    h.innerHTML = '<b>' + esc(c.teacher) + '</b>' + esc(c.loc);
    g.appendChild(h);
  });
  for (var r = 0; r < nrows; r++){
    var lab = document.createElement('div');
    lab.className = 'tlab';
    lab.textContent = fmtT(lo + r*30);
    lab.style.gridColumn = '1';
    lab.style.gridRow = String(r+2);
    g.appendChild(lab);
  }
  cols.forEach(function(cinfo, ci){
    for (var r = 0; r < nrows; r++) addCell(g, ci+2, r, dname, cinfo, lo, 2);
  });
  list.forEach(function(c){
    var r0 = Math.floor((mins(c.start)-lo)/30), r1 = Math.ceil((minsEnd(c)-lo)/30);
    if (r1 <= r0) r1 = r0+1;
    var b = blockEl(c);
    b.style.gridColumn = String((colIdx[c.loc+'|'+c.teacher]||0)+2);
    b.style.gridRow = (r0+2) + ' / ' + (r1+2);
    g.appendChild(b);
  });

  tuneRowHeight(g, 'auto', nrows);
  var wrap = document.createElement('div');
  wrap.style.overflowX = 'auto';
  wrap.appendChild(g);
  return wrap;
}

/* 전체 보기: 월~일이 가로축 — 모든 요일에 전체 담당T 열(본원 포함)을 항상 표시 */
function buildFullGrid(){
  var baseCols = [], seenB = {};
  classes.forEach(function(c){
    var key = c.loc + '|' + c.teacher;
    if (!seenB[key]){ seenB[key] = true; baseCols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
  });
  baseCols.sort(function(a,b){
    var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  if (!baseCols.length) baseCols = [{ key:'-', loc:'', teacher:'' }];
  var dayCols = {};
  DAYS.forEach(function(dname){
    if (dname === '월' || dname === '화'){
      var cols = [], seen = {};
      classes.forEach(function(c){
        if (c.day !== dname) return;
        var key = c.loc + '|' + c.teacher;
        if (!seen[key]){ seen[key] = true; cols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
      });
      cols.sort(function(a,b){
        var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
        return (ia<0?99:ia) - (ib<0?99:ib);
      });
      dayCols[dname] = cols.length ? cols : [{ key:'-', loc:'', teacher:'' }];
    } else {
      dayCols[dname] = baseCols;
    }
  });

  // 통합 시간축: 10:00 ~ 10:00(22시), 수업이 벗어나면 확장
  var lo = 10*60, hi = 22*60;
  classes.forEach(function(c){
    lo = Math.min(lo, mins(c.start));
    hi = Math.max(hi, minsEnd(c));
  });
  lo = Math.floor(lo/30)*30; hi = Math.ceil(hi/30)*30;
  var nrows = Math.round((hi - lo) / 30);

  // 그리드 컬럼: 시간축 + [요일별 열들 + 구분선]
  var colDefs = ['46px'], colMeta = [];   // colMeta[i] = {day, cinfo} (1-based 제외한 데이터열)
  DAYS.forEach(function(dname, di){
    dayCols[dname].forEach(function(cinfo){
      colDefs.push('minmax(96px, 1fr)');
      colMeta.push({ day: dname, cinfo: cinfo });
    });
    if (di < DAYS.length-1){ colDefs.push('7px'); colMeta.push(null); }   // 요일 구분 공백
  });

  // 고정 헤더 그리드 (요일 + 담당T)
  var hg = document.createElement('div');
  hg.className = 'grid fullgrid';
  hg.style.gridTemplateColumns = colDefs.join(' ');
  hg.style.gridTemplateRows = 'auto auto';
  var corner = document.createElement('div'); corner.style.gridRow='1 / 3'; hg.appendChild(corner);
  var colPos = 2;
  DAYS.forEach(function(dname, di){
    var n = dayCols[dname].length;
    var dh = document.createElement('div');
    dh.className = 'dhead';
    dh.textContent = dname;
    dh.style.gridColumn = colPos + ' / ' + (colPos + n);
    dh.style.gridRow = '1';
    hg.appendChild(dh);
    dayCols[dname].forEach(function(cinfo, i){
      var h = document.createElement('div');
      h.className = 'thead';
      h.innerHTML = cinfo.teacher ? '<b>' + esc(cinfo.teacher) + '</b>' + esc(cinfo.loc) : '<b>—</b>';
      h.style.gridColumn = String(colPos + i);
      h.style.gridRow = '2';
      hg.appendChild(h);
    });
    colPos += n + (di < DAYS.length-1 ? 1 : 0);
  });

  // 본문 그리드 (시간축 + 수업)
  var g = document.createElement('div');
  g.className = 'grid fullgrid';
  g.style.gridTemplateColumns = colDefs.join(' ');
  g.style.gridTemplateRows = 'repeat(' + nrows + ', 46px)';
  for (var r = 0; r < nrows; r++){
    var lab = document.createElement('div');
    lab.className = 'tlab';
    lab.textContent = fmtT(lo + r*30);
    lab.style.gridColumn = '1';
    lab.style.gridRow = String(r+1);
    g.appendChild(lab);
  }
  var gcol = 2;
  var colOfKey = {};   // day|loc|teacher → grid column
  DAYS.forEach(function(dname, di){
    dayCols[dname].forEach(function(cinfo){
      colOfKey[dname + '|' + cinfo.key] = gcol;
      for (var r = 0; r < nrows; r++) addCell(g, gcol, r, dname, cinfo, lo, 1);
      gcol++;
    });
    if (di < DAYS.length-1) gcol++;
  });
  classes.forEach(function(c){
    var col = colOfKey[c.day + '|' + c.loc + '|' + c.teacher];
    if (!col) return;
    var r0 = Math.floor((mins(c.start)-lo)/30), r1 = Math.ceil((minsEnd(c)-lo)/30);
    if (r1 <= r0) r1 = r0+1;
    var b = blockEl(c);
    b.style.gridColumn = String(col);
    b.style.gridRow = (r0+1) + ' / ' + (r1+1);
    g.appendChild(b);
  });

  tuneRowHeight(g, '', nrows);
  var wrap = document.createElement('div');
  wrap.className = 'scrollwrap';
  var sh2 = document.createElement('div');
  sh2.className = 'stickhead';
  sh2.appendChild(hg);
  wrap.appendChild(sh2);
  wrap.appendChild(g);
  return wrap;
}

/* 주차별 보기: 그 주의 날짜·출석·1회 이동이 반영된 주간 그리드 */
function buildWeekGrid(){
  var dates = weekDates();
  var baseCols = [], seenB = {};
  classes.forEach(function(c){
    var key = c.loc + '|' + c.teacher;
    if (!seenB[key]){ seenB[key] = true; baseCols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
  });
  baseCols.sort(function(a,b){
    var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  if (!baseCols.length) baseCols = [{ key:'-', loc:'', teacher:'' }];

  var lo = 10*60, hi = 22*60;
  classes.forEach(function(c){
    lo = Math.min(lo, mins(c.start));
    hi = Math.max(hi, minsEnd(c));
  });
  lo = Math.floor(lo/30)*30; hi = Math.ceil(hi/30)*30;
  var nrows = Math.round((hi - lo) / 30);

  // 요일별 열: 월·화는 그날 수업(직전보강)만큼만(없으면 한 줄), 수~일은 전체 담당T 열
  var dayColsOf = {};
  WEEK_VIEW_ORDER.forEach(function(dname){
    if (dname === '월' || dname === '화'){
      var cols = [], seen = {};
      classes.forEach(function(c){
        if (c.day !== dname) return;
        var key = c.loc + '|' + c.teacher;
        if (!seen[key]){ seen[key] = true; cols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
      });
      cols.sort(function(a,b){
        var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
        return (ia<0?99:ia) - (ib<0?99:ib);
      });
      dayColsOf[dname] = cols.length ? cols : [{ key:'-', loc:'', teacher:'' }];
    } else {
      dayColsOf[dname] = baseCols;
    }
  });
  var colDefs = ['46px'];
  WEEK_VIEW_ORDER.forEach(function(dname, di){
    dayColsOf[dname].forEach(function(){ colDefs.push('minmax(96px, 1fr)'); });
    if (di < WEEK_VIEW_ORDER.length-1) colDefs.push('7px');
  });

  // 고정 헤더 그리드 (요일+날짜, 담당T)
  var hg = document.createElement('div');
  hg.className = 'grid fullgrid';
  hg.style.gridTemplateColumns = colDefs.join(' ');
  hg.style.gridTemplateRows = 'auto auto';
  var corner = document.createElement('div'); corner.style.gridRow='1 / 3'; hg.appendChild(corner);
  var colPos = 2;
  var colOfKey = {};
  WEEK_VIEW_ORDER.forEach(function(dname, di){
    var dcols = dayColsOf[dname];
    var dh = document.createElement('div');
    dh.className = 'dhead';
    dh.innerHTML = esc(dname) + '<small>' + mdOf(dates[dname]) + '</small>';
    dh.style.gridColumn = colPos + ' / ' + (colPos + dcols.length);
    dh.style.gridRow = '1';
    hg.appendChild(dh);
    dcols.forEach(function(cinfo, i){
      var h = document.createElement('div');
      h.className = 'thead';
      h.innerHTML = cinfo.teacher ? '<b>' + esc(cinfo.teacher) + '</b>' + esc(cinfo.loc) : '<b>—</b>';
      h.style.gridColumn = String(colPos + i);
      h.style.gridRow = '2';
      hg.appendChild(h);
      colOfKey[dname + '|' + cinfo.key] = colPos + i;
    });
    colPos += dcols.length + (di < WEEK_VIEW_ORDER.length-1 ? 1 : 0);
  });

  // 본문 그리드
  var g = document.createElement('div');
  g.className = 'grid fullgrid';
  g.style.gridTemplateColumns = colDefs.join(' ');
  g.style.gridTemplateRows = 'repeat(' + nrows + ', 46px)';
  for (var r = 0; r < nrows; r++){
    var lab = document.createElement('div');
    lab.className = 'tlab';
    lab.textContent = fmtT(lo + r*30);
    lab.style.gridColumn = '1';
    lab.style.gridRow = String(r+1);
    g.appendChild(lab);
  }
  WEEK_VIEW_ORDER.forEach(function(dname){
    dayColsOf[dname].forEach(function(cinfo){
      var col = colOfKey[dname + '|' + cinfo.key];
      for (var r = 0; r < nrows; r++) addCell(g, col, r, dname, cinfo, lo, 1);
    });
  });
  classes.forEach(function(c){
    var col = colOfKey[c.day + '|' + c.loc + '|' + c.teacher];
    if (!col) return;
    var dstr = ymdOf(dates[c.day]);
    var r0 = Math.floor((mins(c.start)-lo)/30), r1 = Math.ceil((minsEnd(c)-lo)/30);
    if (r1 <= r0) r1 = r0+1;
    var b = document.createElement('div');
    b.className = 'blk ' + colorOf(c.cls);
    b.setAttribute('data-cid', c.id);
    b.style.gridColumn = String(col);
    b.style.gridRow = (r0+1) + ' / ' + (r1+1);
    var awayOf = {}, temps = [];
    weekOnce.forEach(function(o){
      if (o.fromId === c.id){ var t = classes.find(function(x){ return x.id===o.toId; }); awayOf[o.student.replace(/\(.*\)$/,'')] = { label: t ? labelOf(t) : '', row: o.row }; }
      if (o.toId === c.id) temps.push(o);
    });
    var chips = sortNames(c.students).map(function(nm){
      var plain = nm.replace(/\(.*\)$/,'');
      var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
      var a = weekAttend[dstr + '|' + c.id + '|' + nm];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : '';
      var tail = a && a.status==='지각' ? ' · 지각' : '';
      return '<button data-nm="'+esc(nm)+'" class="'+cls2+(away?' away':'')+'"'+
             (away ? ' data-away-row="'+awayOf[plain].row+'"' : '')+
             ((a && a.memo) ? ' title="'+esc(a.memo)+'"' : (away ? ' title="이 주 1회 이동: '+esc(awayOf[plain].label)+'"' : ''))+'>'+
             esc(nm)+tail+(away?'<em>1회↗</em>':'')+'</button>';
    }).join('');
    chips += temps.sort(function(a,b){ return a.student.localeCompare(b.student,'ko'); }).map(function(o){
      var a = weekAttend[dstr + '|' + c.id + '|' + o.student];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : 'once';
      return '<button data-nm="'+esc(o.student)+'" data-once-row="'+o.row+'" class="'+cls2+'" title="1회 이동 · 사유: '+esc(o.reason)+((a&&a.memo)?' / '+esc(a.memo):'')+'">'+esc(o.student)+' · 1회</button>';
    }).join('');
    if (!chips) chips = '<span class="empty-note">비어 있음</span>';
    b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+'</span>'+
                  '<small>'+esc(c.start)+'~'+esc(c.end)+' · '+c.students.length+'명</small></div>'+

                  '<div class="stus">'+chips+'</div>';
    b.addEventListener('click', function(e){ onWeekClick(e, c, dstr); });
    g.appendChild(b);
  });

  tuneRowHeight(g, '', nrows);
  var wrap = document.createElement('div');
  wrap.className = 'scrollwrap';
  var sh2 = document.createElement('div');
  sh2.className = 'stickhead';
  sh2.appendChild(hg);
  wrap.appendChild(sh2);
  wrap.appendChild(g);
  return wrap;
}
function onWeekClick(e, c, dstr){
  if (editMode && !moving && !classMoving){ applyEdit(c); return; }
  var chip = e.target.closest('button[data-nm]');
  if (!chip) return;
  var nm = chip.getAttribute('data-nm');
  if (chip.hasAttribute('data-once-row')){ openOnceManage(c, nm, parseInt(chip.getAttribute('data-once-row'),10), 'in', dstr); return; }
  if (chip.hasAttribute('data-away-row')){ openOnceManage(c, nm, parseInt(chip.getAttribute('data-away-row'),10), 'out', dstr); return; }
  openAttend(c, nm, dstr);
}

/* ── 서버 요청 공통 ── */
function post(body, busyMsg, done){
  setStatus(busyMsg || '저장하는 중…');
  body.pw = pw;
  fetch(ENDPOINT, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){ done(res); })
  .catch(function(){ setStatus('전송에 실패했어요. 인터넷을 확인해 주세요.', 'err'); });
}
function rosterNote(res){
  return res.rosterUpdated ? ' 리포트·학생 페이지에도 반영됐어요.' : (res.rosterMsg ? ' (' + res.rosterMsg + ')' : '');
}

/* ── 학생 검색 ── */
function plainName(nm){ return String(nm || '').replace(/\(.*\)$/, ''); }
function searchStudent(){
  var q = $('stu-q').value.trim();
  var box = $('searchResults');
  if (!q){ box.innerHTML = ''; applySearchHits(); return; }
  var out = [];
  classes.forEach(function(c){
    c.students.forEach(function(nm){
      if (plainName(nm).indexOf(q) >= 0) out.push({ c: c, nm: nm });
    });
  });
  out.sort(function(a, b){ return plainName(a.nm).localeCompare(plainName(b.nm), 'ko') || (DAY_IDX[a.c.day] - DAY_IDX[b.c.day]); });
  box.innerHTML = out.length
    ? out.slice(0, 12).map(function(h){
        return '<button onclick="gotoSearchHit(\'' + esc(h.c.id) + '\')"><b>' + esc(h.nm) + '</b> ' +
               esc(h.c.cls) + ' · ' + esc(h.c.day) + esc(h.c.start) + ' ' + esc(h.c.teacher) + 'T</button>';
      }).join('') + (out.length > 12 ? '<span>외 ' + (out.length - 12) + '건</span>' : '')
    : '<span>검색 결과가 없어요.</span>';
  applySearchHits();
}
function applySearchHits(){
  var q = $('stu-q') ? $('stu-q').value.trim() : '';
  document.querySelectorAll('.stus button.search-hit').forEach(function(b){ b.classList.remove('search-hit'); });
  document.querySelectorAll('.blk.search-blk').forEach(function(b){ b.classList.remove('search-blk'); });
  if (!q) return;
  document.querySelectorAll('.stus button[data-nm]').forEach(function(b){
    if (plainName(b.getAttribute('data-nm')).indexOf(q) >= 0){
      b.classList.add('search-hit');
      var blk = b.closest('.blk');
      if (blk) blk.classList.add('search-blk');
    }
  });
}
function gotoSearchHit(cid){
  var el = document.querySelector('.blk[data-cid="' + cid + '"]');
  if (!el && mode === 'today'){
    setMode('all');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ gotoSearchHit(cid); }); });
    return;
  }
  if (!el) return;
  el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
}

/* ── 모달 ── */
function openModal(html, wide){
  $('modal-box').innerHTML = html;
  $('modal-box').classList.toggle('wide', !!wide);
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
$('stu-q').addEventListener('input', searchStudent);

/* ── 이동 ── */
function labelOf(c){ return c.cls + ' (' + c.day + c.start + ' ' + c.teacher + 'T)'; }
function onBlockClick(e, c){
  if (mode === 'today'){
    var aa = e.target.closest('.attall');
    if (aa){ bulkAttend(c); return; }
    if (multiMode){
      var mchip = e.target.closest('button[data-att-cid]');
      if (mchip) toggleSelOne(mchip.getAttribute('data-att-cid'), mchip.getAttribute('data-nm'));
      else toggleSelClass(c);
      return;
    }
    var chip0 = e.target.closest('button[data-nm]');
    if (moving && moving.once){
      // 1회 이동 대상 반 선택 중
      if (chip0 && chip0.classList.contains('sel')){ cancelMove(); return; }
      if (c.id === moving.fromId) return;
      openOnceModal(c);
      return;
    }
    if (!chip0) return;
    var nm0 = chip0.getAttribute('data-nm');
    if (chip0.hasAttribute('data-once-row')){ openOnceManage(c, nm0, parseInt(chip0.getAttribute('data-once-row'),10), 'in'); return; }
    if (chip0.hasAttribute('data-away-row')){ openOnceManage(c, nm0, parseInt(chip0.getAttribute('data-away-row'),10), 'out'); return; }
    openAttend(c, nm0);
    return;
  }
  if (editMode && !moving && !classMoving){ applyEdit(c); return; }
  var onceChip = e.target.closest('button[data-once-row]');
  if (onceChip && !moving){
    setStatus('1회 이동 학생이에요. 사유 확인·수정·취소는 오늘의 시간표에서 이름을 눌러 해주세요.', 'err');
    return;
  }
  var chip = e.target.closest('button[data-nm]');
  if (chip && !moving){
    moving = { name: chip.getAttribute('data-nm'), fromId: chip.getAttribute('data-cid'), fromLabel: labelOf(c) };
    document.body.classList.add('moving');
    $('movebar').classList.add('on');
    $('mv-name').textContent = moving.name;
    $('mv-from').textContent = moving.fromLabel + ' 에서';
    chip.classList.add('sel');
    setStatus('아래 목록에서 옮길 반을 고르거나, 시간표에서 반을 직접 누르세요.');
    openMovePicker(c);
    return;
  }
  if (chip && moving && chip.classList.contains('sel')){ cancelMove(); return; }
  if (!moving) return;
  if (c.id === moving.fromId) return;
  openMoveModal(c);
}
function cancelMove(){
  var wasClass = !!classMoving;
  var wasOnce = !!(moving && moving.once);
  moving = null; classMoving = null;
  $('mv-remove').style.display = '';
  document.body.classList.remove('moving');
  document.body.classList.remove('classmoving');
  $('movebar').classList.remove('on');
  document.querySelectorAll('.stus button.sel').forEach(function(b){ b.classList.remove('sel'); });
  setStatus('');
  if (wasClass || wasOnce) render();
}

/* ── 반 통째 이동 ── */
function startClassMove(c){
  classMoving = { id: c.id };
  document.body.classList.add('classmoving');
  $('movebar').classList.add('on');
  $('mv-name').textContent = c.cls;
  $('mv-from').textContent = '(' + c.day + c.start + ' ' + c.teacher + 'T) — 반 통째 이동: 옮길 빈 자리를 누르세요';
  render();
  setStatus('빈 자리를 누르면 그 요일·시간·담당으로 반 전체가 이동해요. 다른 요일은 전체 보기에서 그 요일의 빈 자리를 누르면 됩니다.');
}
function dropClass(dname, cinfo, startMin){
  var cm = classMoving; if (!cm) return;
  var c = classes.find(function(x){ return x.id===cm.id; });
  if (!c) { cancelMove(); return; }
  var dur = Math.max(30, minsEnd(c) - mins(c.start));
  var s = startMin, e2 = startMin + dur;
  // 겹침 확인 (같은 요일·같은 열)
  var clash = classes.find(function(x){
    return x.id !== c.id && x.day === dname && x.loc === cinfo.loc && x.teacher === cinfo.teacher &&
           mins(x.start) < e2 && s < minsEnd(x);
  });
  if (clash){ setStatus('그 자리엔 이미 ' + clash.cls + ' 수업이 있어요. 다른 빈 자리를 눌러주세요.', 'err'); return; }
  var startStr = fmt12(s), endStr = fmt12(e2);
  var newTeacher = cinfo.teacher || c.teacher, newLoc = cinfo.loc || c.loc;   // 빈 열(월·화 등)이면 담당·위치 유지

/* ── 복수 선택 출석 ── */
function toggleMulti(){
  multiMode = !multiMode;
  if (!multiMode) multiSel = {};
  document.body.classList.toggle('multisel', multiMode);
  $('a-multi').classList.toggle('on', multiMode);
  updateMultiCnt();
  applyMultiSel();
  setStatus(multiMode ? '학생 이름을 눌러 선택하세요. 반의 빈 곳을 누르면 그 반 전체가 선택돼요.' : '');
}
function updateMultiCnt(){
  var n = Object.keys(multiSel).length;
  $('multiCnt').textContent = n ? n + '명 선택' : '';
}
function applyMultiSel(){
  document.querySelectorAll('.stus button.msel').forEach(function(b){ b.classList.remove('msel'); });
  if (!multiMode) return;
  document.querySelectorAll('.stus button[data-att-cid]').forEach(function(b){
    var key = b.getAttribute('data-att-cid') + '|' + b.getAttribute('data-nm');
    if (multiSel[key]) b.classList.add('msel');
  });
}
function toggleSelOne(cid, nm){
  var key = cid + '|' + nm;
  if (multiSel[key]) delete multiSel[key]; else multiSel[key] = { cid: cid, nm: nm };
  updateMultiCnt(); applyMultiSel();
}
function toggleSelClass(c){
  var away = {}, temps = [];
  onceMoves.forEach(function(o){
    if (o.fromId === c.id) away[o.student.replace(/\(.*\)$/, '')] = true;
    if (o.toId === c.id) temps.push(o.student);
  });
  var names = c.students.filter(function(nm){ return !away[nm.replace(/\(.*\)$/, '')]; }).concat(temps);
  var allSel = names.every(function(nm){ return multiSel[c.id + '|' + nm]; });
  names.forEach(function(nm){
    var key = c.id + '|' + nm;
    if (allSel) delete multiSel[key]; else multiSel[key] = { cid: c.id, nm: nm };
  });
  updateMultiCnt(); applyMultiSel();
}
function multiApply(status){
  if (!multiMode){ setStatus('먼저 [복수 선택]을 켜고 학생을 선택해 주세요.', 'err'); return; }
  var sel = Object.keys(multiSel).map(function(k){ return multiSel[k]; });
  if (!sel.length){ setStatus('선택된 학생이 없어요.', 'err'); return; }
  var byClass = {};
  sel.forEach(function(s){ (byClass[s.cid] = byClass[s.cid] || []).push(s.nm); });
  var cids = Object.keys(byClass);
  var label = status === '' ? '기록 지우기' : status;
  if (!confirm(sel.length + '명을 일괄 ' + label + ' 처리할까요?')) return;
  var done = 0, total = 0;
  var next = function(i){
    if (i >= cids.length){
      multiSel = {}; updateMultiCnt();
      render();
      setStatus(total + '명 ' + label + ' 완료.', 'ok');
      return;
    }
    var cid = cids[i];
    post({ action:'attendSetBulk', book:book, date:todayStr(), classId:cid, students:byClass[cid],
           status:status, overwrite:'1' }, label + ' 처리 중… (' + (i+1) + '/' + cids.length + ')', function(res){
      if (res && res.result === 'success'){
        if (status === ''){
          byClass[cid].forEach(function(nm){ delete attend[cid + '|' + nm]; });
          total += res.cleared || 0;
        } else {
          (res.marked || []).forEach(function(nm){ attend[cid + '|' + nm] = { status: status, memo: '' }; });
          total += (res.marked || []).length;
        }
      }
      next(i + 1);
    });
  };
  next(0);
}

/* ── 출석 체크 ── */
/* 반 일괄 출석 — 오늘 이 반에서 수업하는 학생(1회 이동 온 학생 포함, 나간 학생 제외) 중
 * 아직 기록이 없는 학생을 모두 '출석'으로. 지각·결석 등 기존 기록은 유지. */
function bulkAttend(c){
  var away = {}, temps = [];
  onceMoves.forEach(function(o){
    if (o.fromId === c.id) away[o.student.replace(/\(.*\)$/, '')] = true;
    if (o.toId === c.id) temps.push(o.student);
  });
  var targets = c.students.filter(function(nm){ return !away[nm.replace(/\(.*\)$/, '')]; }).concat(temps);
  targets = targets.filter(function(nm){ return !attend[c.id + '|' + nm]; });
  if (!targets.length){ setStatus(c.cls + ' — 모든 학생이 이미 기록되어 있어요.', 'ok'); return; }
  if (!confirm(labelOf(c) + '\n기록 없는 학생 ' + targets.length + '명을 모두 출석 처리할까요?\n(지각·결석 등 기존 기록은 그대로 둡니다)')) return;
  post({ action:'attendSetBulk', book:book, date:todayStr(), classId:c.id, students:targets },
    '일괄 출석 처리 중…', function(res){
      if (res && res.result === 'success'){
        (res.marked || []).forEach(function(nm){ attend[c.id + '|' + nm] = { status:'출석', memo:'' }; });
        render();
        setStatus(c.cls + ' — ' + (res.marked || []).length + '명 출석 처리 완료.' +
                  (res.skipped ? ' (기존 기록 ' + res.skipped + '명 유지)' : ''), 'ok');
      } else setStatus('일괄 처리 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}
function openAttend(c, nm, dateStr){
  attDate = dateStr || todayStr();

  openModal(

    '<button class="pick-late'+(cur&&cur.status==='지각'?' on':'')+'" onclick="submitAttend(\''+esc(c.id)+'\',\''+esc(nm)+'\',\'지각\')">지각</button>'+
    '<button class="pick-abs'+(cur&&cur.status==='결석'?' on':'')+'" onclick="submitAttend(\''+esc(c.id)+'\',\''+esc(nm)+'\',\'결석\')">결석</button>'+

    '<p class="merr" id="att-err"></p>'+

    (mode === 'today' ? '<button onclick="startOnceMoveById(\''+esc(c.id)+'\',\''+esc(nm)+'\')">다른 반으로 1회 이동</button>' : '')+

function submitAttend(cid, nm, status){
  var memo = ($('att-memo') ? $('att-memo').value : '').trim();
  if (status === '지각' && !memo){ $('att-err').textContent = '지각은 메모를 적어주세요. (미리 연락 여부, 몇 분 지각 등)'; return; }
  var d = attDate || todayStr();
  closeModal();
  post({ action:'attendSet', book:book, date:d, classId:cid, student:nm, status:status, memo:memo },
    '기록하는 중…', function(res){

          var wkey = d + '|' + cid + '|' + nm;
          if (status) weekAttend[wkey] = { status: status, memo: memo }; else delete weekAttend[wkey];
        }

        }
        render();

      } else setStatus('기록 실패: ' + ((res && res.message) || '오류'), 'err');

/* 반 종류 그룹: 고1 가 / 고1 나 / 고3파이널 / 정리정독 중N / 논술 */
function classGroupKey(cls){
  var c = String(cls || '').trim();
  var m = c.match(/^(고[123])\s*(가|나)$/);
  if (m) return m[1] + ' ' + m[2];
  if (/^고3\s*파이널/.test(c)) return '고3파이널';
  m = c.match(/^정리정독\s*중(\d)/);
  if (m) return '정리정독 중' + m[1];
  if (/^논술/.test(c)) return '논술';
  return c;
}
var DAY_IDX = { '월':0, '화':1, '수':2, '목':3, '금':4, '토':5, '일':6 };
/* 학생 클릭 시: 같은 종류 반 목록에서 바로 골라 이동 */
function openMovePicker(fromC){
  var m = moving; if (!m) return;
  var g = classGroupKey(fromC.cls);
  var cands = classes.filter(function(x){ return x.id !== fromC.id && classGroupKey(x.cls) === g; })
    .sort(function(a, b){ return (DAY_IDX[a.day] - DAY_IDX[b.day]) || (mins(a.start) - mins(b.start)); });
  openModal(
    '<h3>학생 이동 — ' + esc(m.name) + '</h3>'+
    '<p class="mdesc">' + esc(m.fromLabel) + ' 에서 이동. 같은 종류(<b>' + esc(g) + '</b>) 반:</p>'+
    (cands.length
      ? '<div class="pick-list" style="flex-direction:column;align-items:stretch;">'+
        cands.map(function(x){
          return '<button data-mv-to="' + esc(x.id) + '" style="text-align:left;border-radius:10px;padding:8px 12px;">'+
            '<b>' + esc(x.cls) + '</b> · ' + esc(x.day) + esc(x.start) + '~' + esc(x.end) +
            ' · ' + esc(x.teacher) + 'T (' + esc(x.loc) + ') · ' + x.students.length + '명</button>';
        }).join('') + '</div>'
      : '<p class="subnote">같은 종류의 다른 반이 없어요.</p>')+
    '<p class="subnote">다른 종류의 반으로 옮기려면 아래 버튼으로 창을 닫고, 시간표에서 옮길 반을 직접 누르세요.</p>'+
    '<div class="mbtns"><button onclick="cancelMove(); closeModal();">이동 취소</button>'+
    '<button onclick="closeModal()">시간표에서 직접 선택</button></div>'
  );
  $('modal-box').querySelectorAll('button[data-mv-to]').forEach(function(b){
    b.addEventListener('click', function(){
      var t = classes.find(function(x){ return x.id === b.getAttribute('data-mv-to'); });
      if (t) openMoveModal(t);
    });
  });
}

      setStatus((res.removed||'') + ' 을(를) 반에서 뺐어요.' + rosterNote(res), 'ok');
      load(true);
    } else { setStatus('실패: ' + ((res && res.message) || '오류'), 'err'); cancelMove(); }
  });
}

/* 반에 학생 추가 */
function openAdd(c){
  openModal(
    '<h3>반에 학생 추가</h3>'+
    '<p class="mdesc">'+esc(labelOf(c))+'</p>'+
    '<input type="text" id="add-q" placeholder="이름 검색" autocomplete="off">'+
    '<div class="pick-list" id="add-list"></div>'+
    '<p class="subnote">명단에 없는 새친구는 먼저 <b>슈퍼스타 관리</b>에서 신입 등록하면 여기에 나타나요.</p>'+
    '<p class="merr" id="add-err"></p>'+
    '<div class="mbtns"><button onclick="closeModal()">닫기</button></div>'
  );
  var renderList = function(q){
    q = (q||'').trim();
    var rows = (roster||[]).filter(function(s){ return !q || s.name.indexOf(q)>=0 || (s.school||'').indexOf(q)>=0; }).slice(0, 40);
    $('add-list').innerHTML = rows.length
      ? rows.map(function(s){
          return '<button data-add-nm="'+esc(s.name)+'">'+esc(s.name)+'<small>'+esc(s.school||'')+' '+esc((s.grade||'').replace('2026 ',''))+'</small></button>';
        }).join('')
      : '<span class="subnote">검색 결과가 없어요.</span>';
  };
  var wire = function(){
    $('add-q').addEventListener('input', function(){ renderList(this.value); });
    $('add-list').addEventListener('click', function(e){
      var b = e.target.closest('button[data-add-nm]'); if (!b) return;
      var nm = b.getAttribute('data-add-nm');
      if (!confirm(nm + ' 을(를) ' + labelOf(c) + ' 에 추가할까요?')) return;
      closeModal();
      post({ action:'timetableAdd', book:book, student:nm, toId:c.id }, '추가하는 중…', function(res){
        if (res && res.result === 'success'){ setStatus((res.added||'') + ' 추가 완료.' + rosterNote(res), 'ok'); load(true); }
        else setStatus('추가 실패: ' + ((res && res.message) || '오류'), 'err');
      });
    });
    renderList('');
  };
  if (roster) { wire(); }
  else {
    $('add-list').innerHTML = '<span class="subnote">명단을 불러오는 중…</span>';
    fetch(ENDPOINT + '?action=roster&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ roster = (d && d.students) || []; wire(); })
      .catch(function(){ $('add-err').textContent = '명단을 불러오지 못했어요.'; });
  }
}

/* 반 추가 */
function openAddClass(){
  var timeOpts = [];
  for (var t = 10*60; t <= 21*60+30; t += 30) timeOpts.push(fmt12(t));
  var timeSel = function(id, def){
    return '<select id="'+id+'" style="font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:6px;">'+
      timeOpts.map(function(o){ return '<option'+(o===def?' selected':'')+'>'+o+'</option>'; }).join('')+'</select>';
  };
  var locs = [];
  classes.forEach(function(c){ if (c.loc && locs.indexOf(c.loc) < 0) locs.push(c.loc); });
  if (!locs.length) locs = ['본원','민트초코','화정센터','정리정독'];
  openModal(
    '<h3>반 추가 — '+esc(book)+' 시간표</h3>'+
    '<div style="display:flex;gap:8px;"><div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">요일</label>'+
    '<select id="nc-day" style="font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:6px;">'+
    DAYS.map(function(d){ return '<option>'+d+'</option>'; }).join('')+'</select></div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">시작</label>'+timeSel('nc-start','5:30')+'</div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">끝</label>'+timeSel('nc-end','7:00')+'</div></div>'+
    '<div style="display:flex;gap:8px;margin-top:8px;"><div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">위치</label>'+
    '<input type="text" id="nc-loc" list="nc-locs" placeholder="예) 본원"><datalist id="nc-locs">'+
    locs.map(function(l){ return '<option>'+esc(l)+'</option>'; }).join('')+'</datalist></div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">담당T</label>'+
    '<input type="text" id="nc-teacher" list="nc-ts" placeholder="예) 주혜"><datalist id="nc-ts">'+
    TEACHER_ORDER.map(function(t){ return '<option>'+t+'</option>'; }).join('')+'</datalist></div></div>'+
    '<label style="font-size:.8rem;color:var(--ink-soft);display:block;margin-top:8px;">반이름</label>'+
    '<input type="text" id="nc-cls" placeholder="예) 고1 가 · 정리정독 중2 · 내신 화정고">'+
    '<p class="subnote">반이름이 \'가/나\'로 끝나면 학생 이동 시 리포트의 정규 가/나 칸에 연결돼요.</p>'+
    '<p class="merr" id="nc-err"></p>'+
    '<div class="mbtns"><button onclick="closeModal()">취소</button>'+
    '<button class="primary" onclick="submitAddClass()">만들기</button></div>'
  );
}
function submitAddClass(){
  var d = $('nc-day').value, st = $('nc-start').value, en = $('nc-end').value;
  var loc = $('nc-loc').value.trim(), teacher = $('nc-teacher').value.trim(), cls = $('nc-cls').value.trim();
  if (!cls){ $('nc-err').textContent = '반이름을 입력해 주세요.'; return; }
  if (mins(en) <= mins(st)){ $('nc-err').textContent = '끝 시간이 시작보다 빨라요.'; return; }
  closeModal();
  post({ action:'timetableAddClass', book:book, day:d, start:st, end:en, loc:loc, teacher:teacher, cls:cls },
    '반을 만드는 중…', function(res){
      if (res && res.result === 'success'){ setStatus(cls + ' 반을 만들었어요. 이제 학생을 추가해 주세요.', 'ok'); load(true); }
      else setStatus('반 추가 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}

/* ── 결석자 영상보충 관리 ── */
var makeupList = [];
function classLabelOf(cid){
  var c = classes.find(function(x){ return x.id === cid; });
  return c ? (c.cls + ' (' + c.day + c.start + ' ' + c.teacher + 'T)') : cid;
}
function openMakeup(){
  openModal('<h3>결석자 관리</h3>'+
    '<p class="mdesc">결석 기록마다 보충 일정(날짜·요일·시간)을 적고, 확인 후 완료 처리하세요.</p>'+
    '<div id="mk-list"><p class="subnote">불러오는 중…</p></div>'+
    '<div class="mbtns"><button onclick="closeModal()">닫기</button></div>', true);
  fetch(ENDPOINT + '?action=attendAbsentList&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.result !== 'success'){ $('mk-list').innerHTML = '<p class="subnote">불러오지 못했어요.</p>'; return; }
      makeupList = d.list || [];
      renderMakeup();
    })
    .catch(function(){ $('mk-list').innerHTML = '<p class="subnote">서버 연결에 실패했어요.</p>'; });
}
function mkDayOf(dateStr){
  var p = String(dateStr).split('-');
  if (p.length !== 3) return '';
  return ['일','월','화','수','목','금','토'][new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function renderMakeup(){
  var box = $('mk-list'); if (!box) return;
  if (!makeupList.length){ box.innerHTML = '<p class="subnote">결석 기록이 없어요.</p>'; return; }
  var sorted = makeupList.slice().sort(function(a, b){ return (a.done - b.done) || (a.date < b.date ? 1 : -1); });
  var html = '', sec = null;
  sorted.forEach(function(m, idx){
    var s = m.done ? 'done' : 'todo';
    if (s !== sec){ sec = s; html += '<p class="mk-sec">' + (m.done ? '완료' : '미완료') + '</p>'; }
    var i = makeupList.indexOf(m);
    var planLine = m.plan
      ? '<div class="mk-plan">보충: <b>' + esc(m.plan) + '</b></div>'
      : '';
    var btnLine = m.done
      ? '<div class="mk-row"><button onclick="saveMakeup(' + i + ', false)">미완료로</button></div>'
      : '<div class="mk-row"><span class="mk-alt">처리 방법 —</span>' +
        '<button onclick="openMakeupMove(' + i + ')">반이동</button>' +
        '<button onclick="openMakeupVideo(' + i + ')">영상보충</button>' +
        '<button onclick="noRemedy(' + i + ', \'무단 결석\')">무단 결석</button>' +
        '<button onclick="noRemedy(' + i + ', \'당일 결석\')">당일 결석</button>' +
        '</div>' +
        (m.plan ? '<div class="mk-row" style="justify-content:flex-end;border-top:1px dotted var(--line);padding-top:6px;">' +
          '<button class="done-btn" onclick="saveMakeup(' + i + ', true)">처리 완료</button></div>' : '');
    html += '<div class="mk-item' + (m.done ? ' done' : '') + '">' +
      '<div class="mk-top"><b>' + esc(m.student) + '</b>' +
      '<small>' + esc(m.date) + ' (' + mkDayOf(m.date) + ') 결석 · ' + esc(classLabelOf(m.classId)) + (m.memo ? ' · ' + esc(m.memo) : '') + '</small></div>' +
      planLine + btnLine +
      '</div>';
  });
  box.innerHTML = html;
}
function saveMakeup(i, doneVal){
  var m = makeupList[i]; if (!m) return;
  var el = $('mk-plan-' + i);
  var plan = (el ? el.value : m.plan || '').trim();
  var done = (doneVal === null) ? m.done : doneVal;
  if (done && !plan){
    alert('완료 처리 전에 보충 방법(반이동·영상보충 등)을 먼저 기록해 주세요.');
    return;
  }
  post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
         plan:plan, done: done ? '1' : '' }, '저장하는 중…', function(res){
    if (res && res.result === 'success'){
      m.plan = plan; m.done = done;
      renderMakeup();
      setStatus(m.student + ' — 보충 ' + (doneVal === null ? '일정 저장' : (done ? '완료 처리' : '미완료로 변경')) + ' 완료.', 'ok');
    } else setStatus('저장 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}

/* 영상보충 기능창 — 날짜·요일·시간 메모 */
function openMakeupVideo(i){
  var m = makeupList[i]; if (!m) return;
  openModal(
    '<h3>영상보충 — ' + esc(m.student) + '</h3>'+
    '<p class="mdesc">' + esc(m.date) + ' (' + mkDayOf(m.date) + ') ' + esc(classLabelOf(m.classId)) + ' 결석.<br>영상보충하러 오는 날짜·요일·시간을 적어주세요.</p>'+
    '<input type="text" id="mk-plan-' + i + '" placeholder="예) 8/17(월) 6:00" value="' + esc(m.plan.indexOf('영상보충') === 0 ? m.plan.replace(/^영상보충:\s*/, '') : '') + '" />'+
    '<p class="merr" id="mkv-err"></p>'+
    '<div class="mbtns"><button onclick="openMakeup()">뒤로</button>'+
    '<button class="primary" onclick="saveMakeupVideo(' + i + ')">저장</button></div>', true
  );
}
function saveMakeupVideo(i){
  var m = makeupList[i]; if (!m) return;
  var v = $('mk-plan-' + i).value.trim();
  if (!v){ $('mkv-err').textContent = '날짜·요일·시간을 적어주세요.'; return; }
  post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
         plan:'영상보충: ' + v, done:'' }, '저장하는 중…', function(res){
    if (res && res.result === 'success'){
      m.plan = '영상보충: ' + v;
      setStatus(m.student + ' — 영상보충 일정 저장 완료.', 'ok');
      openMakeup();
    } else setStatus('저장 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}

/* 무단 결석·당일 통보 — 보충 없이 완료 처리 */
function noRemedy(i, type){
  var m = makeupList[i]; if (!m) return;
  if (!confirm(m.student + ' (' + m.date + ' 결석)\n"' + type + '"로 기록하고 보충 없이 완료 처리할까요?')) return;
  var plan = type + ' (보충 없음)';
  post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
         plan:plan, done:'1' }, '처리 중…', function(res){
    if (res && res.result === 'success'){
      m.plan = plan; m.done = true;
      renderMakeup();
      setStatus(m.student + ' — ' + type + '로 완료 처리했어요.', 'ok');
    } else setStatus('처리 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}

/* 결석 보충 — 다른 동일 시간표(같은 종류 반)로 1회 이동 */
function openMakeupMove(i){
  var m = makeupList[i]; if (!m) return;
  var fromC = classes.find(function(x){ return x.id === m.classId; });
  if (!fromC){ alert('결석했던 반을 시간표에서 찾을 수 없어요.'); return; }
  var g = classGroupKey(fromC.cls);
  var cands = classes.filter(function(x){ return x.id !== fromC.id && classGroupKey(x.cls) === g; })
    .sort(function(a, b){ return (DAY_IDX[a.day] - DAY_IDX[b.day]) || (mins(a.start) - mins(b.start)); });
  openModal(
    '<h3>반 이동 보충 — ' + esc(m.student) + '</h3>'+
    '<p class="mdesc">' + esc(m.date) + ' (' + mkDayOf(m.date) + ') ' + esc(fromC.cls) + ' 결석.<br>같은 종류(<b>' + esc(g) + '</b>) 반에서 1회 보충할 반을 고르세요. 시간표에 보라색으로 표시돼요.</p>'+
    (cands.length
      ? '<div class="pick-list" style="flex-direction:column;align-items:stretch;">'+
        cands.map(function(x){
          return '<button data-mk-to="' + esc(x.id) + '" style="text-align:left;border-radius:10px;padding:8px 12px;">'+
            '<b>' + esc(x.cls) + '</b> · ' + esc(x.day) + esc(x.start) + '~' + esc(x.end) +
            ' · ' + esc(x.teacher) + 'T (' + esc(x.loc) + ') · ' + x.students.length + '명</button>';
        }).join('') + '</div>'
      : '<p class="subnote">같은 종류의 다른 반이 없어요. 영상보충 메모를 이용해 주세요.</p>')+
    '<div class="mbtns"><button onclick="openMakeup()">뒤로</button></div>', true
  );
  $('modal-box').querySelectorAll('button[data-mk-to]').forEach(function(b){
    b.addEventListener('click', function(){
      var t = classes.find(function(x){ return x.id === b.getAttribute('data-mk-to'); });
      if (!t) return;
      if (!confirm(m.student + '\n' + fromC.cls + ' (' + m.date + ' 결석)\n→ ' + labelOf(t) + ' 에서 1회 보충\n\n기록할까요?')) return;
      var reason = m.date.slice(5).replace('-', '/') + ' 결석 보충';
      post({ action:'timetableMove', book:book, student:m.student, fromId:fromC.id, toId:t.id,
             moveType:'once', reason:reason }, '보충 이동 기록 중…', function(res){
        if (!(res && res.result === 'success')){
          setStatus('보충 이동 실패: ' + ((res && res.message) || '오류'), 'err');
          openMakeup(); return;
        }
        var plan = '반 이동 보충: ' + t.cls + ' ' + t.day + t.start + ' (' + t.teacher + 'T)';
        post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
               plan:plan, done:'' }, '보충 일정 저장 중…', function(res2){
          setStatus(m.student + ' — ' + plan + ' 기록 완료. 시간표에 표시됩니다.', 'ok');
          load(true);        // 1회 이동을 오늘·주차별 시간표에 반영
          openMakeup();      // 목록 새로고침
        });
      });
    });
  });
}

/* 이동 기록 */
function openLog(){
  openModal('<h3>이동 기록</h3><div class="log-list" id="log-list"><span class="subnote">불러오는 중…</span></div>'+
            '<div class="mbtns"><button onclick="closeModal()">닫기</button></div>');
  fetch(ENDPOINT + '?action=timetableLog&pw=' + encodeURIComponent(pw) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.result !== 'success'){ $('log-list').innerHTML = '<span class="subnote">불러오지 못했어요.</span>'; return; }
      if (!d.log.length){ $('log-list').innerHTML = '<span class="subnote">아직 기록이 없어요.</span>'; return; }
      $('log-list').innerHTML = d.log.map(function(g){
        var kcls = g.kind === '1회' ? ' once' : (g.kind === '빼기' ? ' minus' : '');
        var path = g.fromCls && g.toCls ? esc(g.fromCls)+' → '+esc(g.toCls)
                 : (g.toCls ? '→ '+esc(g.toCls) : esc(g.fromCls)+' 에서');
        return '<div class="log-item"><span class="lk'+kcls+'">'+esc(g.kind)+'</span>'+(g.book==='내신'?'<span class="lk" style="background:#8A6FA8;">내신</span>':'')+'<b>'+esc(g.student)+'</b> '+path+
               '<div class="lr">'+esc(g.date)+(g.reason ? ' · '+esc(g.reason) : '')+'</div></div>';
      }).join('');
    })
    .catch(function(){ $('log-list').innerHTML = '<span class="subnote">불러오지 못했어요.</span>'; });
}

/* ── 시작 ── */
$('gate').style.display = 'none';
$('bar').style.display = 'block';
$('sheet').style.display = 'block';
renderTabs();
load(false);
</script>
