    .then(function(r){ return r.json(); })
    .then(function(d){
      chBusy = false;
      if (!d || d.result !== 'success'){ list.innerHTML = '<span class="ch-none">불러오지 못했어요.</span>'; return; }
      chLoaded = true;
      chRows = d.log || [];
      // more가 없는 응답(옛 백엔드 폴백)은 받은 수로 짐작한다
      chMayMore = (d.more != null) ? !!d.more : chRows.length >= chLimit;
      chClsIdx = null;
      chKinds();
      chRender();
      chFillClassIndex();
    })
    .catch(function(){ chBusy = false; list.innerHTML = '<span class="ch-none">불러오지 못했어요.</span>'; });
}
/* 종류 칩 — 사용자 확정 묶음으로 고정 (2026-08-28 "결석, 1회 이동, 반 이동, 변경 등의 현황과
 * 신입생 추가, 퇴원생 삭제 등이 표시되어야"): 순서는 고정, 기록이 있는 묶음만 보인다. */
var CH_GROUPS = [
  ['결석',      function(g){ return g.kind === '결석'; }],
  ['1회 이동',  function(g){ return g.kind === '1회'; }],
  ['반 이동',   function(g){ return g.kind === '영구' || g.kind === '반이동'; }],
  ['신입·추가', function(g){ return g.kind === '추가'; }],
  ['퇴원·빼기', function(g){ return g.kind === '빼기'; }]
];
function chGroupOf(g){
  for (var i = 0; i < CH_GROUPS.length; i++) if (CH_GROUPS[i][1](g)) return CH_GROUPS[i][0];
  return '변경';   // 나머지 전부 — 표기수정, 이 주만 변경(주간*), 반 만들기/삭제
}
/* 화면에 따라 보여줄 기록을 나눈다 (2026-08-28 사용자 확정 "주차별에는 해당 주차의 변경 사항이,
 * 전체에는 신입, 퇴원, 영구 이동의 변경 사항이"):
 * 전체 시간표 = 영구적인 변경만(신입·퇴원·영구 이동·반 전체 이동·표기수정·반 만들기/삭제),
 * 주차별 = 보고 있는 주에 해당하는 것만(1회 이동·이 주만 변경·결석은 적용일/수업일 기준,
 *          신입·퇴원·추가·빼기는 그 주에 기록된 것). */
var CH_PERMA = { '영구':1, '반이동':1, '추가':1, '빼기':1, '표기수정':1, '반추가':1, '반삭제':1 };
function chScopeFilter(g){
  if (mode === 'all') return !!CH_PERMA[g.kind];
  if (mode !== 'week') return true;
  var ds = weekDates(), from = ymdOf(ds['월']), to = ymdOf(ds['일']);
  function inW(d){ return d && d >= from && d <= to; }
  if (g.kind === '결석') return inW(g.date);                       // 수업일
  if (g.kind === '1회' || /^주간/.test(g.kind))                     // 적용일 또는 복사본 날짜
    return inW(g.apply || g.date) || inW(wkIdYmd(g.toId));
  if (g.kind === '추가' || g.kind === '빼기') return inW(g.date);   // 그 주에 등록·퇴원(기록일)
  return false;   // 영구 이동·반 통째 이동·표기수정 등은 전체 시간표에서
}
function chScopeNote(){
  if (mode === 'all') return '전체 시간표 — 영구 변경만 (신입 · 퇴원 · 반 이동 · 표기수정)';
  if (mode === 'week'){
    var ds = weekDates();
    return '이 주(' + mdOf(ds['월']) + '~' + mdOf(ds['일']) + ')의 변경만 — 1회 이동 · 이 주만 변경 · 결석 · 신입 · 퇴원';
  }
  return '';
}
/* 기록 배지에 쓰는 표시명 — 내부 용어 대신 알아보기 쉬운 말로 */
var CH_KIND_NAMES = { '영구':'반 이동', '반이동':'반 전체 이동', '1회':'1회 이동',
  '주간추가':'이 주만 추가', '주간빼기':'이 주만 빼기', '주간반이동':'이 주만 시간 이동',
  '주간반보강':'이 주만 보충', '주간반휴강':'이 주만 휴강', '주간반추가':'이 주만 반 추가',
  '주간반삭제':'이 주만 반 삭제', '반추가':'반 만들기', '반삭제':'반 삭제' };
function chKindLabel(g){
  if (g.kind === '추가') return /신입/.test(g.reason || '') ? '신입' : '추가';
  if (g.kind === '빼기') return /아웃/.test(g.reason || '') ? '퇴원' : '빼기';
  return CH_KIND_NAMES[g.kind] || g.kind;
}
function chKinds(){
  var box = $('ch-kinds'); if (!box) return;
  var seen = {};
  chRows.filter(chScopeFilter).forEach(function(g){ seen[chGroupOf(g)] = true; });
  var ks = CH_GROUPS.map(function(d){ return d[0]; }).concat(['변경']).filter(function(k){ return seen[k]; });
  if (chKind && !seen[chKind]) chKind = '';
  box.innerHTML = ks.length < 2 ? '' : [''].concat(ks).map(function(k){
    return '<button type="button"' + (k === chKind ? ' class="on"' : '') +
           ' onclick="chSetKind(' + JSON.stringify(k).replace(/"/g, '&quot;') + ')">' +
           (k ? esc(k) : '전체') + '</button>';
  }).join('');
}
function chSetKind(k){ chKind = (chKind === k) ? '' : k; chKinds(); chRender(); }
/* 반ID → '반이름 (요일시간)' — 같은 이름의 병렬 반을 구분하기 위해 (2026-08-23 사용자 요청
 * "이동 요일과 시간이 표시되지 않아 고2확인→고2확인 ... 알아보기가 어렵네요") */
var chClsIdx = null;
function chClassIndex(){
  if (chClsIdx) return chClsIdx;
  var when = {}, name = {};
  function add(list){
    (list || []).forEach(function(c){
      if (c && c.id && !when[c.id]){
        when[c.id] = String(c.day || '') + String(c.start || '');
        name[c.id] = String(c.cls || '');
      }
    });
  }
  add(classes);
  ['정규','내신'].forEach(function(bk){ var v = cacheGet('list:' + bk); if (v) add(v.classes); });
  chClsIdx = { when: when, name: name };
  return chClsIdx;
}
function chClsLabel(id, name){
  var idx = chClassIndex();
  // 결석 기록은 반이름 없이 반ID만 온다 — 색인에서 이름을 찾아 채운다
  var nm = String(name || '').trim() || String(idx.name[id] || '').trim();
  if (!nm) return '';
  var when = idx.when[id] || '';
  // '이 주만' 반(w+yyMMdd)은 날짜가 ID에 있다 — 요일만으로는 어느 날인지 몰라 날짜를 붙인다
  // (2026-08-26 사용자 지적 "이동한 날짜와 요일 시간이 모두 확인할 수 있어야")
  var ymd = wkIdYmd(id);
  if (ymd) when = wkDayLabel(ymd) + ' ' + when.replace(/^[월화수목금토일]/, '');
  return esc(nm) + (when.trim() ? ' <span class="ch-when">' + esc(when.trim()) + '</span>' : '');
}
/* 다른 시간표(내신/정규) 목록이 캐시에 없으면 한 번 받아 와서 다시 그린다 */
function chFillClassIndex(){
  var need = ['정규','내신'].filter(function(bk){ return !cacheGet('list:' + bk); });
  if (!need.length || chIdxBusy) return;
  chIdxBusy = true;
  Promise.all(need.map(function(bk){
    return fetch(ENDPOINT + '?action=timetableList&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(bk) + '&t=' + Date.now())
      .then(function(r){ return r.json(); })
      .then(function(d){ if (d && d.result === 'success') cacheSet('list:' + bk, { classes: d.classes || [], onceMoves: d.onceMoves || [] }); })
      .catch(function(){});
  })).then(function(){ chIdxBusy = false; chClsIdx = null; chRender(); });
}
var chIdxBusy = false;
/* 검색어(이름·반·사유·날짜)와 종류로 걸러 다시 그린다 */
function chRender(){
  var list = $('ch-list'); if (!list || !chLoaded) return;
  var q = ($('ch-q') ? $('ch-q').value : '').trim().toLowerCase();
  var scoped = chRows.filter(chScopeFilter);
  var rows = scoped.filter(function(g){
    if (chKind && chGroupOf(g) !== chKind) return false;
    if (!q) return true;
    var idx = chClassIndex();
    return [g.student, g.fromCls, g.toCls, g.reason, g.date, g.kind, chKindLabel(g), g.book,
            idx.when[g.fromId], idx.when[g.toId], idx.name[g.fromId], idx.name[g.toId],
            wkDayLabel(g.date || ''),
            g.apply, wkDayLabel(g.apply || ''), wkDayLabel(wkIdYmd(g.fromId)), wkDayLabel(wkIdYmd(g.toId))]
      .map(function(x){ return String(x == null ? '' : x).toLowerCase(); })
      .join(' ').indexOf(q) >= 0;
  });
  var sub = $('ch-sub');
  if (sub) sub.textContent = !scoped.length ? ''
    : (rows.length < scoped.length ? rows.length + ' / ' + scoped.length + '건' : scoped.length + '건');
  var note = '<div class="ch-scope">' + esc(chScopeNote()) + '</div>';
  if (!scoped.length){
    list.innerHTML = note + '<span class="ch-none">' +
      (mode === 'week' ? '이 주에는 변경 기록이 없어요.' : '아직 기록이 없어요.') + '</span>';
    return;
  }
  if (!rows.length){ list.innerHTML = note + '<span class="ch-none">찾는 기록이 없어요.</span>'; return; }
  // 날짜별로 묶어 소제목을 붙인다 (2026-08-28 사용자 확정 — 결석은 수업일, 나머지는 기록일 기준)
  var today = todayStr(), html = [note], lastDay = null;
  rows.forEach(function(g){
    if (g.date !== lastDay){
      lastDay = g.date;
      var dl = wkDayLabel(g.date) || g.date;
      html.push('<div class="ch-day">' + esc(dl) + (g.date === today ? ' · 오늘' : '') + '</div>');
    }
    var lbl = chKindLabel(g);
    var kcls = g.kind === '결석' ? ' abs'
             : lbl === '신입' ? ' new'
             : lbl === '퇴원' ? ' out'
             : (g.kind === '1회' || g.kind === '주간추가' || g.kind === '주간반추가' ||
                g.kind === '주간반이동' || g.kind === '주간반보강') ? ' once'
             : (g.kind === '빼기' || g.kind === '주간빼기' || g.kind === '주간반삭제' ||
                g.kind === '주간반휴강') ? ' minus' : '';
    var fromL = chClsLabel(g.fromId, g.fromCls), toL = chClsLabel(g.toId, g.toCls);
    var path = g.kind === '결석' ? fromL
             : (fromL && toL ? fromL + ' → ' + toL : (toL ? '→ ' + toL : (fromL ? fromL + ' 에서' : '')));
    // 적용일 — 어느 날짜의 수업에 해당하는 기록인지 (주간반이동은 원래 수업일이 숨는 날)
    var applyL = g.apply ? ((g.kind === '주간반이동' ? '원래 수업일 ' : '적용 ') + wkDayLabel(g.apply)) : '';
    var lr = (applyL ? '<b>' + esc(applyL) + '</b>' : '') +
             (g.reason ? (applyL ? ' · ' : '') + esc(g.reason) : '');
    html.push('<div class="ch-item"><span class="lk' + kcls + '">' + esc(lbl) + '</span>' +
           (g.book === '내신' ? '<span class="lk" style="background:#8A6FA8;">내신</span>' : '') +
           (g.student ? '<b>' + esc(g.student) + '</b> ' : '') + path +
           (lr ? '<div class="lr">' + lr + '</div>' : '') + '</div>');
  });
  list.innerHTML = html.join('') +
  (chMayMore ? '<button type="button" class="ch-more" onclick="chMore()">지난 기록 더 보기</button>' : '');
  // 더 보기로 다시 그렸을 때는 보던 자리를 지킨다
  if (chKeepScroll != null){ list.scrollTop = chKeepScroll; chKeepScroll = null; }
}
/* 지난 기록 더 보기 — 200건씩 늘려 다시 받는다 (기록이 적어 통째로 다시 받아도 가볍다) */
function chMore(){
  var list = $('ch-list');
  chKeepScroll = list ? list.scrollTop : null;
  chLimit += 200;
  chLoad(true);
}

/* ── 앱 바 (2026-09-21) ── */
/* 안내문 — 기본 한 줄, ⓘ 를 누르면 전부 펼친다 */
function hintToggle(){
  var on = !$('hintline').classList.contains('open');
  hintSet(on);
  sessionStorage.setItem('tt_hintopen', on ? '1' : '0');
}
function hintSet(on){
  $('hintline').classList.toggle('open', on);
  $('hint-i').setAttribute('aria-expanded', on ? 'true' : 'false');
}
/* 앱 바가 화면 위에 붙어 있으므로, 옆 패널·이동 바가 그 아래에서 시작하도록 높이를 알려 준다 */
function abHeight(){
  var bar = $('bar');
  if (bar) document.documentElement.style.setProperty('--abh', bar.offsetHeight + 'px');
}

/* ── 시작 ── */
$('gate').style.display = 'none';
$('bar').style.display = 'block';
$('sheetcard').style.display = 'block';
/* 캐시된 주별 기간을 먼저 적용해 시작 시간표를 정확히 고른다 */
var cachedPeriods = cacheGet('periods');
if (cachedPeriods){ periods = {}; cachedPeriods.forEach(function(p){ periods[p.week] = p.book; }); }
if (mode === 'today' || mode === 'week'){
  book = autoBookFor();
  sessionStorage.setItem('tt_book', book);
}
hintSet(sessionStorage.getItem('tt_hintopen') === '1');
renderTabs();
abHeight();
window.addEventListener('resize', abHeight);
if (document.fonts && document.fonts.ready) document.fonts.ready.then(abHeight);
/* 캐시로 즉시 그리며 불러오기 시작 + 주별 기간은 동시에 최신 확인.
 * 기간이 달라진 드문 경우에만 그 기간의 시간표로 다시 불러온다. */
if (mode === 'cal'){
  calLoadAndRender();
  loadPeriods(function(){ renderTabs(); render(); });
}
chSync();      // 변경사항 패널 — 주차별·전체에서만 보이고, 접힘 상태는 세션에 기억
load(false);   // ttBoot 한 번에 시간표·출석·메모·기간이 함께 온다 (기간이 다르면 안에서 다시 불러옴)
/* 창 폭이 바뀌면 그리드를 다시 그린다 — 칸 높이는 그릴 때 한 번만 재기 때문에,
 * 폭이 바뀌어 칩 줄바꿈이 달라지면 다시 재지 않는 한 카드가 잘린다 (2026-08-26).
 * 모바일 주소창 때문에 높이만 바뀌는 resize는 건너뛴다. */
var rszTimer = null, rszW = window.innerWidth;
window.addEventListener('resize', function(){
  if (window.innerWidth === rszW) return;
  clearTimeout(rszTimer);
  rszTimer = setTimeout(function(){
    rszW = window.innerWidth;
    if (mode === 'today' || mode === 'week' || mode === 'all') render();
  }, 200);
});
/* 웹폰트(고운 돋움)가 측정 뒤에 로드되면 글자 폭이 바뀌어 칩 줄바꿈이 달라진다 — 한 번 더 */
if (document.fonts && document.fonts.ready){
  document.fonts.ready.then(function(){
    if (mode === 'today' || mode === 'week' || mode === 'all') render();
  });
}
</script>
