}
/* 오늘의 시간표용 1회 이동 필터 — 주차별 보기와 같은 규칙 (2026-08-20 사용자 확정)
 * · 나간 학생(1회↗): 적용일이 '이번 주(월~일)'면 원래 반에서 빠짐 표시
 *   (목 수업 결석 → 토 반으로 보충 가는 경우, 목요일 화면에서도 빠짐이 보여야 함)
 * · 이동 온 학생(· 1회 칩): 적용일 당일에만 그 반에 표시 */
function thisWeekRange(){
  var ws = weekStartOf(new Date());
  var mon = new Date(ws); mon.setDate(mon.getDate() - 2);
  var sun = new Date(ws); sun.setDate(sun.getDate() + 4);
  return { from: ymdOf(mon), to: ymdOf(sun) };
}
/* 기록 중 '학생 한 명'에 대한 것만 (1회 이동·주간추가·주간빼기).
 * 반 단위 기록(주간반이동·주간반보강 등)은 student가 비어 있고 from/to에 반ID만 있어서,
 * 걸러내지 않으면 옮겨 간 반에 이름 없는 '· 1회' 칩이 생기고 인원수도 '5-1명'으로 어긋난다
 * (2026-08-23 브라우저 테스트에서 발견). */
var STUDENT_KINDS = { '1회':1, '주간추가':1, '주간빼기':1 };
function isStudentLog(o){
  return !!String(o && o.student || '').trim() && (!o.kind || STUDENT_KINDS[o.kind]);
}
function onceOutThisWeek(){
  var w = thisWeekRange(), t = todayStr();
  return onceMoves.filter(function(o){ return isStudentLog(o) && (!o.ymd ? true : (o.ymd >= w.from && o.ymd <= w.to)); });
}
function onceInToday(){
  var t = todayStr();
  return onceMoves.filter(function(o){ return isStudentLog(o) && (!o.ymd || o.ymd === t); });
}
/* 명단에 이미 있는 학생은 '이 주'·'1회' 칩을 다시 만들지 않는다 — 안 거르면 한 사람이 두 칩으로
 * 겹쳐 보인다(2026-08-26 실제 발생: 지워진 반 ID(w260829a)가 재사용되며 옛 주간추가 기록이
 * 새 복사본에 되붙어 백양A가 9+9명으로 표시). 이 반에서 빠진(away) 학생의 재추가는 그대로 둔다. */
function dedupTemps(c, temps, awayOf){
  var have = {};
  c.students.forEach(function(nm){
    var p = plainName(nm);
    have[p] = 1;
    if (/A$/.test(p)) have[p.slice(0, -1)] = 1;   // 동명이인 표기 차이(명단 '양지우A' ↔ 기록 '양지우') — asKey처럼 끝의 A만 뗀다
  });
  var seen = {};   // 같은 학생·같은 종류의 중복 기록은 칩 하나만 (데이터에 중복이 남아도 화면은 한 번, 2026-08-27)
  return temps.filter(function(o){
    var p = plainName(o.student);
    var sk = String(o.kind || '1회') + '|' + p;
    if (seen[sk]) return false;
    seen[sk] = 1;
    if (awayOf && awayOf[String(o.student || '').replace(/\(.*\)$/, '')]) return true;
    return !(have[p] || (/A$/.test(p) && have[p.slice(0, -1)]));
  });
}
function todayDay(){ return ['일','월','화','수','목','금','토'][new Date().getDay()]; }
function weekStartOf(d){
  // 그 날짜가 속한 월~일 달력 주의 '수요일' (월·화는 아직 오지 않은 이번 주 수요일)
  var x = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  x.setDate(x.getDate() - ((x.getDay() + 6) % 7) + 2);
  return x;
}
var weekStart = weekStartOf(new Date());
function ymdOf(d){ return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0'); }
function mdOf(d){ return (d.getMonth()+1) + '/' + d.getDate(); }
function weekDatesOf(wed){
  // 월(-2)·화(-1)는 수요일 직전 날짜 — 월화수목금토일 날짜가 순서대로 이어짐
  var off = { '월':-2, '화':-1, '수':0, '목':1, '금':2, '토':3, '일':4 };
  var out = {};
  WEEK_VIEW_ORDER.forEach(function(dy){
    var d = new Date(wed.getFullYear(), wed.getMonth(), wed.getDate()); d.setDate(d.getDate() + off[dy]);
    out[dy] = d;
  });
  return out;
}
function weekDates(){ return weekDatesOf(weekStart); }
function wedOfYmd(ymd){ return new Date(+ymd.slice(0,4), +ymd.slice(5,7)-1, +ymd.slice(8,10)); }
function moveWeek(n){
  weekStart.setDate(weekStart.getDate() + 7*n);
  renderTabs();
  if (applyAutoBook()) return;   // 기간이 바뀌면 load()가 이어서 그림
  loadWeek();
}
function loadWeek(){
  var from = new Date(weekStart); from.setDate(from.getDate() - 2);   // 월요일
  var to = new Date(weekStart); to.setDate(to.getDate() + 4);         // 일요일
  // 캐시가 있으면 먼저 그리고 최신으로 갱신
  var ck = 'week:' + book + ':' + ymdOf(from);
  var cw = cacheGet(ck);
  if (cw){
    weekAttend = {};
    (cw.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
    weekOnce = cw.onceMoves || [];
    teacherOffs = cw.teacherOffs || [];
    render();
    setStatus('최신 데이터 확인 중…');
  } else {
    teacherOffs = [];
    setStatus('주차 기록을 불러오는 중…');
  }
  var pWeek = fetch(ENDPOINT + '?action=timetableWeek&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) +
        '&from=' + ymdOf(from) + '&to=' + ymdOf(to) + '&t=' + Date.now())
    .then(function(r){ return r.json(); }).catch(function(){ return null; });
  var pMemo = new Promise(function(res){ loadMemos(ymdOf(from), ymdOf(to), res); });
  Promise.all([pWeek, pMemo]).then(function(rs){
    var d = rs[0];
    if (d && d.result === 'success'){
      weekAttend = {}; weekOnce = [];
      (d.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
      weekOnce = d.onceMoves || [];
      teacherOffs = d.teacherOffs || [];
      cacheSet(ck, { attend: d.attend || [], onceMoves: d.onceMoves || [], teacherOffs: teacherOffs });
      setStatus('');
    } else if (cw){
      setStatus('');   // 캐시 화면 유지
    } else {
      weekAttend = {}; weekOnce = []; teacherOffs = [];
      setStatus('주차 기록을 불러오지 못했어요.', 'err');
    }
    render();
  });
}
/* 출석 기록 키 — 괄호(특이사항) 제외 이름 기준.
 * 특이사항 표기가 바뀌거나 기록 당시 표기가 달라도 출석 기록이 항상 학생 칩에 붙게 한다
 * (출석부의 목적은 출석 확인 — 2026-08-21 사용자 확정). 동명이인은 A/B/C 표기로 이미 구분됨. */
function attKey(cid, nm){ return cid + '|' + String(nm||'').replace(/\(.*\)$/, ''); }
function wkAttKey(dateStr, cid, nm){ return dateStr + '|' + attKey(cid, nm); }
function attendAt(dateStr, cid, nm){
  return (mode === 'week') ? weekAttend[wkAttKey(dateStr, cid, nm)] : attend[attKey(cid, nm)];
}
/* 이미 처리된 출석 기록 보존 표시 — 영구 이동·빼기로 현재 명단에서 빠진 학생이라도,
 * 그 날짜에 이 반의 출석 기록이 있으면 칩으로 계속 보여준다(클릭해 수정도 가능).
 * 전체 시간표를 고쳐도 이미 출석 처리된 날의 화면은 달라지지 않게 하기 위함(2026-08-20 사용자 확정). */
function keptAttendNames(c, rosterNames, temps, dstr){
  var have = {};
  rosterNames.forEach(function(nm){ have[nm.replace(/\(.*\)$/,'')] = true; });
  (temps || []).forEach(function(o){ have[String(o.student||'').replace(/\(.*\)$/,'')] = true; });
  var pre = (mode === 'week') ? (dstr + '|' + c.id + '|') : (c.id + '|');
  var src = (mode === 'week') ? weekAttend : attend;
  var out = [];
  Object.keys(src).forEach(function(k){
    if (k.indexOf(pre) !== 0) return;
    var nm = k.slice(pre.length);
    if (!have[nm.replace(/\(.*\)$/,'')]) out.push(nm);
  });
  return sortNames(out);
}

/* "5:30" → 분(오전 10~12시는 오전, 1~9시는 오후로 해석) */
function mins(t){
  var s = String(t||'').trim();
  // '오전7:00'(아침)·'밤10:00'(22시~자정) 접두 표기 — 12시간 표기로는 구분이 안 되는 시간대만 쓴다 (2026-08-26)
  var am = s.indexOf('오전') === 0, night = s.indexOf('밤') === 0;
  var p = s.replace(/^(오전|밤)\s*/, '').split(':');
  var h = parseInt(p[0],10)||0, m = parseInt(p[1],10)||0;
  if (am) return (h === 12 ? 0 : h)*60 + m;
  if (night) return (h === 12 ? 24 : h + 12)*60 + m;   // 밤12:00 = 자정(1440)
  if (h < 10) h += 12;
  return h*60+m;
}
function minsEnd(c){
  var s = mins(c.start), e = mins(c.end || c.start);
  if (e <= s) e += 12*60;
  return e;
}
function fmt12(t){
  var h24 = Math.floor(t/60), mm = t%60;
  var h12 = h24 > 12 ? h24-12 : h24;
  return h12 + ':' + (mm<10?'0':'')+mm;
}
/* 분 → 저장용 시간 문자열. 10시 전(아침)은 '오전7:00', 22시부터는 '밤10:00',
 * 그 사이는 기존 12시간 표기('5:30') 그대로 — mins()가 셋 다 읽는다. */
function timeValOf(m){
  if (m < 10*60) return '오전' + fmt12(m);
  if (m >= 22*60) return '밤' + fmt12(m);
  return fmt12(m);
}
function sortNames(arr){
  return arr.slice().sort(function(a,b){ return String(a).localeCompare(String(b), 'ko'); });
}
function colorOf(cls){
  var base = /^고1/.test(cls) ? 'c-g1'
           : /^고2/.test(cls) ? 'c-g2'
           : /^고3/.test(cls) ? 'c-g3'
           : /정리정독/.test(cls) ? 'c-mid' : 'c-etc';
  // 채도를 낮춰 구분: 정규는 '나' 수업(반이름 끝 글자), 내신은 '확인' 수업
  var t = String(cls || '').trim();
  return base + ((/나\s*$/.test(t) || /확인/.test(t)) ? ' c-b' : '');
}

/* ── 데이터 — 시간표·출석·메모를 동시에 불러와 왕복 시간을 줄인다 ── */
var loadSeq = 0;   // 기간 전환 등으로 load가 겹칠 때 마지막 요청만 반영
function load(isReload, cb){
  var seq = ++loadSeq;
  if (isReload){ nsCache = {}; vmList = null; }   // 다시 불러오기 = 이달의 신입생·오늘 보충 방문도 새로 조회
  // 캐시가 있으면 즉시 그려서 바로 보이게 (뒤에서 최신으로 갱신)
  var painted = false;
  if (!isReload){
    var cd = cacheGet('list:' + book);
    if (cd && cd.classes && cd.classes.length){
      classes = cd.classes;
      onceMoves = cd.onceMoves || [];
      attend = {};
      var ca = cacheGet('att:' + book + ':' + todayStr());
      if (ca) ca.forEach(function(x){ attend[attKey(x.classId, x.student)] = { status: x.status, memo: x.memo }; });
      todayOffs = cacheGet('toff:' + todayStr()) || [];
      if (mode === 'week'){
        var wf0 = new Date(weekStart); wf0.setDate(wf0.getDate() - 2);
        var cwk = cacheGet('week:' + book + ':' + ymdOf(wf0));
        if (cwk){
          weekAttend = {};
          (cwk.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
          weekOnce = cwk.onceMoves || [];
          teacherOffs = cwk.teacherOffs || [];
        }
      }
      renderTabs();
      render();
      painted = true;
    }
  }
  setStatus(painted ? '최신 데이터 확인 중…' : '시간표를 불러오는 중…');
  // 통합 부팅 조회 — 시간표·오늘 출석·메모·주별 기간(+주차별이면 주간 기록)을 한 번에 (접속 지연 대책)
  var url = ENDPOINT + '?action=ttBoot&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) +
            '&date=' + todayStr();
  var mfrom = todayStr(), mto = todayStr(), wfrom = '', wto = '';
  if (mode === 'week'){
    var wf = new Date(weekStart); wf.setDate(wf.getDate() - 2);   // 월요일
    var wt = new Date(weekStart); wt.setDate(wt.getDate() + 4);   // 일요일
    wfrom = ymdOf(wf); wto = ymdOf(wt); mfrom = wfrom; mto = wto;
  }
  url += '&mfrom=' + mfrom + '&mto=' + mto;
  if (wfrom) url += '&wfrom=' + wfrom + '&wto=' + wto;
  fetch(url + '&t=' + Date.now())
    .then(function(r){ return r.json(); }).catch(function(){ return null; })
    .then(function(d){
    if (seq !== loadSeq) return;   // 더 새 요청이 있음
    if (!d || d.result !== 'success'){
      if (painted){ setStatus(''); if (cb) cb(true); return; }   // 캐시 화면 유지
      if (cb) cb(false); else setStatus('불러오지 못했어요. 새로고침 해 주세요.', 'err');
      return;
    }
    // 주별 기간 — 이번 주 기간이 바뀌었으면 맞는 시간표로 한 번 다시 불러온다
    if (d.periods){
      periods = {};
      d.periods.forEach(function(pd){ periods[pd.week] = pd.book; });
      cacheSet('periods', d.periods);
      if ((mode === 'today' || mode === 'week') && autoBookFor() !== book){
        book = autoBookFor();
        sessionStorage.setItem('tt_book', book);
        renderTabs();
        load(isReload, cb);
        return;
      }
    }
    classes = d.classes || [];
    onceMoves = d.onceMoves || [];
    cacheSet('list:' + book, { classes: classes, onceMoves: onceMoves });
    attend = {};
    (d.attend || []).forEach(function(x){
      attend[attKey(x.classId, x.student)] = { status: x.status, memo: x.memo };
    });
    cacheSet('att:' + book + ':' + todayStr(), d.attend || []);
    if (d.todayOffs){ todayOffs = d.todayOffs; cacheSet('toff:' + todayStr(), todayOffs); }
    if (d.memos){
      Object.keys(memos).forEach(function(k){ if (k >= mfrom && k <= mto) delete memos[k]; });
      d.memos.forEach(function(m){ memos[m.date] = m.memo; });
    }
    if (d.week){   // 주차별 보기용 주간 기록도 같이 옴
      weekAttend = {}; weekOnce = [];
      (d.week.attend || []).forEach(function(a){ weekAttend[wkAttKey(a.date, a.classId, a.student)] = { status:a.status, memo:a.memo }; });
      weekOnce = d.week.onceMoves || [];
      teacherOffs = d.week.teacherOffs || [];
      cacheSet('week:' + book + ':' + wfrom, { attend: d.week.attend || [], onceMoves: weekOnce, teacherOffs: teacherOffs });
    }
    setStatus(isReload ? '최신 시간표로 다시 불러왔어요.' : '', isReload ? 'ok' : '');
    renderTabs();
    if (mode === 'week' && !d.week) loadWeek(); else render();
    if (cb) cb(true);
    noteSweep();   // 시작일이 지난 'M/D부터' 표기 정리 (하루 한 번)
  });
}
/* ── 브라우저 캐시: 이전 데이터를 즉시 띄우고, 뒤에서 최신으로 조용히 갱신 ── */
function cacheGet(k){ try { var v = JSON.parse(localStorage.getItem('ttc:' + k) || 'null'); return v && v.d; } catch(e){ return null; } }
function cacheSet(k, d){ try { localStorage.setItem('ttc:' + k, JSON.stringify({ t: Date.now(), d: d })); } catch(e){} }

/* 슈국 캘린더: 주별 기간(정규/내신) — 미설정 주는 정규 */
function loadPeriods(done){
  fetch(ENDPOINT + '?action=ttPeriodList&pw=' + encodeURIComponent(pw) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.result === 'success'){
        periods = {};
        (d.periods || []).forEach(function(p){ periods[p.week] = p.book; });
        cacheSet('periods', d.periods || []);
      }
      done();
    })
    .catch(function(){ done(); });
}
function periodOf(weekWedDate){ return periods[ymdOf(weekWedDate)] || '정규'; }
function autoBookFor(){
  if (mode === 'today') return periodOf(weekStartOf(new Date()));
  if (mode === 'week') return periodOf(weekStart);
  return book;
}
/* 오늘/주차별 보기에서 캘린더 기간에 맞는 시간표로 자동 전환. 다시 불러왔으면 true */
function applyAutoBook(){
  var target = autoBookFor();
  if (target !== book){
    book = target;
    sessionStorage.setItem('tt_book', book);
    load(false);
    return true;
  }
  return false;
}

function loadMemos(from, to, done){
  fetch(ENDPOINT + '?action=ttMemoList&pw=' + encodeURIComponent(pw) + '&from=' + from + '&to=' + to + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (d && d.result === 'success'){
        Object.keys(memos).forEach(function(k){ if (k >= from && k <= to) delete memos[k]; });
        (d.memos || []).forEach(function(m){ memos[m.date] = m.memo; });
      }
      done();
    })
    .catch(function(){ done(); });
}

function syncWeekClassRosters(){
  var src = (onceMoves || []).concat(weekOnce || []);
  var done = {};
  src.forEach(function(o){
    if ((o.kind !== '주간반이동' && o.kind !== '주간반보강') || done[o.toId]) return;
    done[o.toId] = 1;
    var copy = null, from = null;
    for (var i = 0; i < classes.length; i++){
      if (classes[i].id === o.toId) copy = classes[i];
      if (classes[i].id === o.fromId) from = classes[i];
    }
    if (copy && from) copy.students = from.students.slice();
  });
}

function calWeeks(){
  var first = new Date(calMonth.getFullYear(), calMonth.getMonth(), 1);
  var last = new Date(calMonth.getFullYear(), calMonth.getMonth()+1, 0);
  var cur = new Date(first); cur.setDate(cur.getDate() - ((cur.getDay()+6)%7));   // 그 주 월요일
  var weeks = [];
  while (cur <= last){
    var w = [];
    for (var i = 0; i < 7; i++){ var d = new Date(cur); d.setDate(d.getDate()+i); w.push(d); }
    weeks.push(w);
    cur.setDate(cur.getDate()+7);
  }
  return weeks;
}
function calLoadAndRender(){
  bootKicked.cal = true;
  if (!calMonth){ var n = new Date(); calMonth = new Date(n.getFullYear(), n.getMonth(), 1); }
  var weeks = calWeeks();

  var r = exsFetchRange();
  loadMemos(from, to, function(){ loadExamSched(r.from, r.to, function(){ render(); }); });
}

/* ── 지필고사 일정 (슈국 캘린더 아래 접이식 메뉴 — 2026-08-21 사용자 확정) ──

function schoolBase(s){ return String(s||'').replace(/[고중]$/, ''); }

function exsFilter(){ try { return localStorage.getItem('tt_exs_filter') || ''; } catch(e){ return ''; } }

/* 과목명 두 글자 축약 (표시 전용 — 저장된 원문은 그대로, 마우스 호버 title에 원문)
 * '화법과 언어'→화언, '독서 토론과 글쓰기'→독토처럼 단어 첫 글자 조합 규칙 + 예외 목록 (2026-08-21 사용자 확정) */
var SUBJ_ABBR = { '공통국어':'국어', '공통국어1':'국어', '공통국어2':'국어', '심화국어':'심국', '고전읽기':'고전' };
function subjAbbr(t){

  if (SUBJ_ABBR[s]) return SUBJ_ABBR[s];
  if (s.length <= 2) return s;
  var ws = t.split(/\s+/).filter(Boolean);
  if (ws.length >= 2) return ws[0].slice(0,1) + ws[1].slice(0,1);   // '독서 토론과 글쓰기' → 독토

}
/* 슈국 캘린더 날짜 칸 과목 칩 — 항목마다 '능곡고1 국어, 능곡고2 화언'처럼 학교+학년을 분명하게 + 과목 축약,
 * 그 학교 시험 기간의 시작일이면 '첫째날' 표시 (2026-08-21 사용자 확정 — 학교 이름 생략 금지) */
function calExamChip(x){
  var base = schoolBase(x.school), lvl = schoolLevel(x.school);
  var first = examPeriods.some(function(p){ return p.school === x.school && p.start === x.date; });

    t = t.trim();

    if (mm && (!lvl || mm[1] === lvl))
      return '<b>' + esc(base + mm[1] + mm[2]) + '</b>' + (mm[3] ? ' ' + esc(subjAbbr(mm[3])) : '');
    return '<b>' + esc(base + lvl) + '</b> ' + esc(subjAbbr(t));
  }).filter(Boolean).join(', ');
  return '<div class="cal-exam" style="background:' + schoolColor(x.school) + '"' +
    ' title="' + esc(x.school + ' ' + x.text + (first ? ' · 시험 첫째날' : '')) + '">' +

/* 시즌 묶기 — 기간들을 시작일 간격 14일 이내로 묶는다(같은 중간/기말 시즌).
 * 시즌 이름은 시작 월로 추정: 3~7월 = 1학기(5월까지 중간), 8~2월 = 2학기(8~10월 중간). */
function exsClusters(){

  if (!ps.length) return [];

function exsClusterRange(cl){

/* 지필고사 일정 메뉴 본문 — 시즌 버튼(2학기 중간/기말 등)으로 골라 보고, 기본은 진행 중이거나 다가오는 시즌 */

          var first = examPeriods.some(function(p){ return p.school === x.school && p.start === x.date; });
          return '<div class="exs-row">' +
            '<span class="exs-tag" style="background:' + schoolColor(x.school) + '">' + esc(x.school) + '</span>' +
            (first ? '<span class="exs-first">첫째날</span>' : '') +
            '<span class="exs-note">' + esc(x.text) + '</span>' +
            '<span class="exs-acts"><button onclick="exsEditSubject(' + x.row + ')">수정</button>' +
            '<button onclick="exsDel(' + x.row + ',\'' + esc(x.school) + '\')">삭제</button></span></div>';
        }).join('');
      });
    }
  }
  h += '<div class="exs-add"><button onclick="exsEditPeriod(0)">+ 시험 기간 추가</button>' +
       '<button onclick="exsEditSubject(0)">+ 날짜별 과목 추가</button></div>';
  box.innerHTML = h;
  return box;
}
/* 막대 아래 칸 표기 — '고1 국어, 고3 독서' → '고1 국어·고3 독서' (과목 축약, 학교는 줄 이름에 있음) */
function exsCellAbbr(t){
  return String(t || '').split(',').map(function(p){
    p = p.trim();
    var mm = p.match(/^([고중])\s*([1-3])\s*(.*)$/);
    if (mm) return mm[1] + mm[2] + (mm[3] ? ' ' + subjAbbr(mm[3]) : '');
    return subjAbbr(p);
  }).filter(Boolean).join('·');
}
/* 시트와 같은 형식 — 월·날짜·요일 축이 맨 위, 학교별 색 막대가 아래로 쌓여 겹치는 일정을 한눈에.
 * 주말·오늘은 세로 띠, 한 줄 건너 격줄 배경으로 학교명과 막대를 눈으로 잇는다. 막대를 누르면 수정 창.
 * 학교명 열은 가로 스크롤에도 고정, 학교가 많으면 아래에도 날짜축을 한 번 더 그린다. (2026-08-21) */
function exsTimeline(ps){
  if (!ps.length) return '';
  var min = ps[0].start, max = ps[0].end;
  ps.forEach(function(p){ if (p.start < min) min = p.start; if (p.end > max) max = p.end; });
  var days = [];
  var d = new Date(+min.slice(0,4), +min.slice(5,7)-1, +min.slice(8,10));
  var endD = new Date(+max.slice(0,4), +max.slice(5,7)-1, +max.slice(8,10));
  while (d <= endD && days.length < 62){ days.push(ymdOf(d)); d.setDate(d.getDate()+1); }
  var idx = {}; days.forEach(function(x,i){ idx[x] = i; });
  var n = days.length, m = ps.length;
  var mirror = m > 8;                    // 막대가 많으면 아래에도 날짜축 반복(아래 줄에선 위 축이 안 보여서)
  function rowOf(pi){ return 4 + pi * 2; }   // 행: 1 월 / 2 날짜 / 3 요일 / 학교마다 막대 줄+과목 줄
  var endLine = rowOf(m) + (mirror ? 2 : 0);
  var h = '<div class="exs-tl" style="grid-template-columns:80px repeat(' + n + ',minmax(21px,1fr));">';
  days.forEach(function(x, i){           // 주말·오늘 세로 띠 (막대 뒤에 깔림)
    var wd = mkDayOf(x);
    var cls = x === todayStr() ? 'td' : ((wd === '토' || wd === '일') ? 'we' : '');
    if (cls) h += '<div class="exs-tl-col ' + cls + '" style="grid-row:2 / ' + endLine + ';grid-column:' + (i+2) + ';"></div>';
  });
  for (var t = 0; t < m; t += 2)         // 격줄 배경 (학교 한 곳 = 막대 줄+과목 줄 두 행)
    h += '<div class="exs-tl-track" style="grid-row:' + rowOf(t) + ' / ' + rowOf(t+1) + ';grid-column:2 / ' + (n+2) + ';"></div>';
  h += '<div class="exs-tl-c" style="grid-row:1;grid-column:1;"></div>';
  var ms = 0;                            // 월 표시 줄 (같은 달 날짜들을 하나로 묶음)
  for (var i = 1; i <= n; i++){
    if (i === n || days[i].slice(0,7) !== days[ms].slice(0,7)){
      h += '<div class="exs-tl-m" style="grid-row:1;grid-column:' + (ms+2) + ' / ' + (i+2) + ';"><span>' + (+days[ms].slice(5,7)) + '월</span></div>';
      ms = i;
    }
  }
  function axisRow(row, kind){           // kind 'd'=날짜 숫자 줄, 'w'=요일 줄
    return '<div class="exs-tl-c" style="grid-row:' + row + ';grid-column:1;"></div>' + days.map(function(x, i){
      var wd = mkDayOf(x);
      var cls = ((wd === '토' || wd === '일') ? ' we' : '') + (x === todayStr() ? ' td' : '');
      return '<div class="exs-tl-' + kind + cls + '" style="grid-row:' + row + ';grid-column:' + (i+2) + ';"' +
             ' title="' + exsMd(x) + '">' + (kind === 'd' ? +x.slice(8,10) : wd) + '</div>';
    }).join('');
  }
  h += axisRow(2, 'd') + axisRow(3, 'w');
  ps.forEach(function(p, pi){
    var s = idx[p.start] != null ? idx[p.start] : 0;
    var e = idx[p.end] != null ? idx[p.end] : n - 1;
    var r0 = rowOf(pi);
    var label = exsMdN(p.start) + (p.end !== p.start ? '~' + exsMdN(p.end) : '');
    var full = exsMd(p.start) + (p.end !== p.start ? ' ~ ' + exsMd(p.end) : '');
    h += '<div class="exs-tl-n" style="grid-row:' + r0 + ' / ' + (r0+2) + ';grid-column:1;">' + esc(p.school) +
      '<span class="exs-tl-nd">' + label + '</span></div>' +
      '<button type="button" class="exs-tl-bar" style="grid-row:' + r0 + ';grid-column:' + (s+2) + ' / ' + (e+3) + ';background:' + schoolColor(p.school) + ';"' +
      ' title="' + esc(p.school + ' ' + full + (p.text ? ' · ' + p.text : '') + ' — 누르면 수정') + '"' +
      ' onclick="exsEditPeriod(' + p.row + ')">' + label + '</button>';
    // 과목 줄 — 시트처럼 막대 바로 아래 칸에 그 날짜의 학년·과목. 빈 칸을 누르면 그 학교·날짜로 바로 입력.
    h += '<div class="exs-tl-sb" style="grid-row:' + (r0+1) + ';grid-column:' + (s+2) + ' / ' + (e+3) + ';"></div>';
    for (var c = 0; c < n; c++){
      var xs = (examSubjects[days[c]] || []).filter(function(x){ return x.school === p.school; });
      if ((c < s || c > e) && !xs.length) continue;   // 기간 밖 날짜는 과목이 있을 때만
      h += '<div class="exs-tl-s' + (xs.length ? ' has' : '') + (c > s && c <= e ? ' inbox' : '') + ((c < s || c > e) ? ' out' : '') + '"' +
        ' style="grid-row:' + (r0+1) + ';grid-column:' + (c+2) + ';"' +
        ' title="' + esc(p.school + ' ' + exsMd(days[c]) + (xs.length ? ' — 누르면 수정' : ' 과목 입력')) + '"' +
        ' onclick="' + (xs.length ? 'exsEditSubject(' + xs[0].row + ')'
                                  : 'exsEditSubject(0,\'' + esc(p.school) + '\',\'' + days[c] + '\')') + '">' +
        xs.map(function(x){ return esc(exsCellAbbr(x.text)); }).join('<br>') + '</div>';
    }
  });
  if (mirror) h += axisRow(rowOf(m), 'w') + axisRow(rowOf(m) + 1, 'd');
  return h + '</div>';
}

function exsSave(row, kind){

  var end = ($('exs-end') ? $('exs-end').value : '').trim();
  var text = ($('exs-text') ? $('exs-text').value : '').trim();
  var err = $('exs-err');
  if (!school || !start){ if (err) err.textContent = '학교와 날짜를 넣어주세요.'; return; }
  if (kind === '과목' && !text){ if (err) err.textContent = '과목 내용을 적어주세요.'; return; }
  closeModal();
  post({ action:'examSchedSet', row: row || '', kind: kind, school: school, start: start, end: end, text: text },
    '지필 일정을 저장하는 중…', function(res){
      if (res && res.result === 'success'){ setStatus(school + ' — 지필 일정을 저장했어요.', 'ok'); exsReload(); }
      else setStatus('저장 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}

    if (res && res.result === 'success'){ setStatus(school + ' 일정을 지웠어요.', 'ok'); exsReload(); }

function fmtT(t){

}

/* 반 블록 요소 (내용·클릭 공통) — 위치는 호출한 쪽에서 지정 */
function blockEl(c, forList){
  var b = document.createElement('div');
  var todayDrop = (mode==='today' && moving && moving.once) ? 'droppable ' : '';
  var offToday = (mode === 'today') ? wkOffAt(c.id, todayStr()) : null;   // 오늘 휴강인 반

  b.className = 'blk ' + (mode==='today' ? todayDrop : 'droppable ') + colorOf(c.cls) +
                (c.wk ? ' wkonly' : '') + ((offToday || mvdToday) ? ' wkoff' : '') +

    b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+jbBadge(c)+' <em class="wkflag">오늘 이동</em></span>'+
                  '<small>'+esc(c.start)+'~'+esc(c.end)+
                  (forList ? ' · '+esc(c.teacher)+'T'+(c.loc ? ' · '+esc(c.loc) : '') : '')+'</small></div>'+
                  '<div class="stus"><span class="empty-note">→ '+esc(wkMovedToLabel(mvdToday))+' 에서 해요'+

    b.addEventListener('click', function(){ openWeekMovedInfo(c, todayStr(), mvdToday); });

  }
  if (offToday){
    // 오늘은 수업이 없는 반 — 출석 대상이 아니므로 학생 칩 없이 휴강만 알린다
    b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+jbBadge(c)+' <em class="wkflag">오늘 휴강</em></span>'+
                  '<small>'+esc(c.start)+'~'+esc(c.end)+

                  (offToday.reason ? ' — '+esc(offToday.reason) : '')+'</span></div>';

  }
  var awayOf = {};   // 이 반에서 1회 이동으로 빠진 학생 → {label, row}
  var temps = [];    // 이 반으로 1회 이동해 온 학생
  // 오늘 보기는 '오늘 적용되는' 이동만 반영 (미래 예약 이동은 그 날짜에 나타남).
  // 전체 시간표는 주차와 무관한 '기본값'이므로 1회 이동을 표시하지 않음 — 1회 이동은 오늘/주차별에서만.
  if (mode === 'today'){
    onceOutThisWeek().forEach(function(o){
      if (o.fromId !== c.id) return;
      // 주간빼기는 그 날짜에만 — 1회 이동처럼 주 전체로 넓히지 않는다
      if (o.kind === '주간빼기' && o.ymd && o.ymd !== todayStr()) return;
      var t = classes.find(function(x){ return x.id===o.toId; });
      var md = o.ymd ? o.ymd.slice(5).replace(/^0/, '').replace('-0', '/').replace('-', '/') : '';
      awayOf[o.student.replace(/\(.*\)$/,'')] = { row: o.row, kind: o.kind || '1회', reason: o.reason,
        label: (o.kind === '주간빼기') ? '이 주만 빠짐' : ((t ? labelOf(t) : '') + (md ? ' · ' + md + ' 보충' : '')) };
    });
    onceInToday().forEach(function(o){ if (o.toId === c.id) temps.push(o); });

  // 오늘 이후에 적용될 1회 이동 예약 — 마우스를 올리면 안내가 보이도록 (표시 자체는 적용일에)
  var planOf = {};
  if (mode === 'today'){
    var wkTo = thisWeekRange().to;
    onceMoves.forEach(function(o){
      if ((o.kind && o.kind !== '1회') || o.fromId !== c.id || !o.ymd || o.ymd <= wkTo) return;

      var md = o.ymd.slice(5).replace(/^0/, '').replace('-0', '/').replace('-', '/');
      planOf[o.student.replace(/\(.*\)$/,'')] =

    });
  }
  var chips = '';
  var sorted = sortNames(c.students);
  if (mode === 'today'){
    chips = sorted.map(function(nm){
      var plain = nm.replace(/\(.*\)$/,'');
      var note = nameNote(nm);
      var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
      var a = attend[attKey(c.id, nm)];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : (note ? 'note' : '');
      var tp = [];
      if (note) tp.push(note);
      // 지각은 이름 옆 글자 대신 색으로만 구분, 세부는 마우스 호버·출석 창에서 (공간 확보, 2026-08-20 사용자 확정)
      if (a && a.status==='지각') tp.push('지각' + (a.memo ? ' — ' + a.memo : ''));
      else if (a && a.memo) tp.push(a.memo);
      else if (away) tp.push(awayOf[plain].kind === '주간빼기'
        ? ('이 주만 빠짐' + (awayOf[plain].reason ? ' — ' + awayOf[plain].reason : ''))

      if (planOf[plain]) tp.push(planOf[plain]);
      return '<button data-att-cid="'+esc(c.id)+'" data-nm="'+esc(nm)+'" class="'+cls2+(away?' away':'')+(planOf[plain]?' plan-once':'')+'"'+
             (away ? ' data-away-row="'+awayOf[plain].row+'"' : '')+
             (tp.length ? ' title="'+esc(tp.join(' · '))+'"' : '')+'>'+
             esc(plain)+(away ? (awayOf[plain].kind === '주간빼기' ? '<em>이 주 빠짐</em>' : '<em>1회↗</em>')
                               : (planOf[plain]?'<em style="color:#8AA0C8;">예약↗</em>':''))+'</button>';
    }).join('');
    chips += temps.sort(function(a,b){ return a.student.localeCompare(b.student,'ko'); }).map(function(o){
      var a = attend[attKey(c.id, o.student)];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : 'once';
      var wk = (o.kind === '주간추가');
      return '<button data-att-cid="'+esc(c.id)+'" data-nm="'+esc(o.student)+'" data-once-row="'+o.row+'" class="'+cls2+'" title="'+
             (wk ? '이 주만 추가' : '1회 이동') + (o.reason ? ' · 사유: '+esc(o.reason) : '')+
             ((a&&a.status==='지각')?' / 지각'+(a.memo?' — '+esc(a.memo):''):((a&&a.memo)?' / '+esc(a.memo):''))+'">'+
             esc(o.student)+(wk ? ' · 이 주' : ' · 1회')+'</button>';
    }).join('');
    chips += keptAttendNames(c, sorted, temps).map(function(nm){
      return keptChip(c, nm, attend[attKey(c.id, nm)]);
    }).join('');
  } else {
    chips = sorted.map(function(nm){
      var plain = nm.replace(/\(.*\)$/,'');
      var note = nameNote(nm);
      var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
      var tp = [];
      if (note) tp.push(note);
      if (away) tp.push('이번 주 1회 이동: ' + awayOf[plain].label);
      var cls2 = (away ? 'away' : '') + (note ? (away ? ' ' : '') + 'note' : '');
      return '<button data-cid="'+esc(c.id)+'" data-nm="'+esc(nm)+'"'+
             (cls2 ? ' class="'+cls2+'"' : '')+
             (tp.length ? ' title="'+esc(tp.join(' · '))+'"' : '')+'>'+
             esc(plain)+(away?'<em>1회↗</em>':'')+'</button>';
    }).join('');
    chips += temps.map(function(o){
      return '<button class="once" data-once-row="'+o.row+'" data-nm="'+esc(o.student)+'" title="사유: '+esc(o.reason)+' ('+esc(o.date)+') — 수정은 주차별 시간표에서">'+esc(o.student)+' · 1회</button>';
    }).join('');
  }
  if (!chips) chips = '<span class="empty-note">비어 있음</span>';
  var btnRow = (mode === 'today')
    ? '<div class="btns"><button class="bbtn attall" title="기록 없는 학생을 모두 출석 처리">전체 출석</button>' +
      crBtnHtml(c) + '</div>'   // [검사 기록] 링크는 2026-10-01 원장님 "오늘의 시간표의 과제검사는 필요 없다"로 뺐다 — 검사는 [수업 기록] 창에서
    : '';   // 편집 기능은 상단 편집 도구줄에서
  var cntLabel = (mode === 'today') ? countLabel(c, awayOf, temps) : (c.students.length + '명');
  var meta = esc(c.start)+'~'+esc(c.end)+
             (forList ? ' · '+esc(c.teacher)+'T'+(c.loc ? ' · '+esc(c.loc) : '') : '')+
             ' · '+cntLabel;
  b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+jbBadge(c)+(c.wk ? ' <em class="wkflag">이 주만</em>' : '')+'</span>'+
                '<small>'+meta+'</small></div>'+
                btnRow +
                '<div class="stus">'+chips+'</div>';
  b.addEventListener('click', function(e){ onBlockClick(e, c); });
  return b;
}

/* 가로 스크롤 시 시간 라벨을 화면 왼쪽에 고정 (스크롤량만큼 이동) */
function attachTimeSync(wrap, g){
  var labs = g.querySelectorAll('.tlab');
  var apply = function(){
    var t = wrap.scrollLeft ? 'translateX(' + wrap.scrollLeft + 'px)' : '';

/* 렌더 후 블록이 잘리지 않도록 30분 행 높이를 일괄 상향(균일 간격 유지) */
function tuneRowHeight(g, headerAuto, nrows){
  requestAnimationFrame(function(){
    var maxPer = 46;
    g.querySelectorAll('.blk').forEach(function(b){
      var gr = String(b.style.gridRow).split('/');
      var span = Math.max(1, (parseInt(gr[1], 10) - parseInt(gr[0], 10)) || 1);
      var per = Math.ceil((b.scrollHeight + 2 - (span - 1) * 3) / span);
      if (per > maxPer) maxPer = per;
    });
    maxPer = Math.min(maxPer, 140);
    if (maxPer > 46) g.style.gridTemplateRows = (headerAuto ? headerAuto + ' ' : '') + 'repeat(' + nrows + ', ' + maxPer + 'px)';
    var sw = g.closest ? g.closest('.scrollwrap') : null;
    if (sw && pendingScroll){ sw.scrollTop = pendingScroll.top; sw.scrollLeft = pendingScroll.left; pendingScroll = null; }
    applySearchHits();
    applyMultiSel();
  });
}
function addCell(g, ci, r, dname, cinfo, lo, rowOffset){
  var cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.gridColumn = String(ci);
  cell.style.gridRow = String(r + rowOffset);

/* 같은 열(강사)에서 시간이 겹치는 카드는 폭을 나눠 나란히 배치 — 한 장이 다른 장을
 * 완전히 덮어 클릭조차 못 하던 문제 대응 (2026-09-13 사용자 "겹침 개선" — 9/12 토 3:30
 * 옛 '이 주만' 백양C 반이 같은 시간 확인 수업 카드와 포개져 조교가 지우지 못했다).
 * items = [{ el, col, s, e }] (col=그리드 열 키, s·e=분). 겹치는 묶음 안에서 차선(lane)을
 * 배정하고 width/margin-left(%)로 나눈다 — 그리드 칸 기준 %라 열 폭이 바뀌어도 맞다. */
function spreadOverlaps(items){
  var byCol = {};
  items.forEach(function(it){ (byCol[it.col] = byCol[it.col] || []).push(it); });
  Object.keys(byCol).forEach(function(k){
    var arr = byCol[k].sort(function(a, b){ return a.s - b.s || a.e - b.e; });
    var cluster = [], lanes = [], end = -1;
    function flush(){
      if (cluster.length > 1){
        var n = lanes.length;
        cluster.forEach(function(it){
          it.el.style.width = 'calc(' + (100 / n) + '% - 2px)';
          it.el.style.marginLeft = 'calc(' + (100 * it.lane / n) + '% + 1px)';
        });
      }
      cluster = []; lanes = []; end = -1;
    }
    arr.forEach(function(it){
      if (cluster.length && it.s >= end) flush();
      var lane = -1;
      for (var i = 0; i < lanes.length; i++){ if (lanes[i] <= it.s){ lane = i; break; } }
      if (lane < 0){ lane = lanes.length; lanes.push(0); }
      lanes[lane] = it.e;
      it.lane = lane;
      cluster.push(it);
      if (it.e > end) end = it.e;
    });
    flush();
  });
}

/* 요일별·오늘 보기: 담당T × 시간 그리드 */
function buildDayGrid(list){
  var dname = list.length ? list[0].day : todayDay();
  var cols = [], seen = {};
  classes.forEach(function(c){
    var key = c.loc + '|' + c.teacher;
    if (!seen[key]){ seen[key] = true; cols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
  });
  cols.sort(function(a,b){
    var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  if (!cols.length) cols = TEACHER_ORDER.slice(0,4).map(function(t){ return { key:'|'+t, loc:'', teacher:t }; });
  var colIdx = {}; cols.forEach(function(c,i){ colIdx[c.key] = i; });

  // 행: 그 날 가장 이른 수업 시작 시각부터 표시(빈 앞줄 제거 — 2026-08-21 사용자 확정).
  // 수업이 없으면 기존 고정 축(평일 2:00~10:00, 주말 10:00~9:00), 끝은 마지막 수업까지 자동 확장.
  var weekend = (dname === '토' || dname === '일');
  var lo, hi = weekend ? 21*60 : 22*60;
  if (list.length){
    lo = Infinity;
    list.forEach(function(c){
      lo = Math.min(lo, mins(c.start));
      hi = Math.max(hi, minsEnd(c));
    });
  } else {
    lo = weekend ? 10*60 : 14*60;
  }
  lo = Math.floor(lo/30)*30; hi = Math.ceil(hi/30)*30;
  var nrows = Math.max(1, Math.round((hi - lo) / 30));

  // 좁은 화면(모바일)은 열 최소폭을 확보해 가로 스크롤, 넓은 화면은 전체 폭에 맞춤
  var narrow = window.innerWidth < 760;
  var colDefs = '42px repeat(' + cols.length + ', ' + (narrow ? 'minmax(96px, 1fr)' : 'minmax(0, 1fr)') + ')';

  // 고정 헤더(담당T·위치) — 세로 스크롤 시 상단 고정
  var hg = document.createElement('div');
  hg.className = 'grid fitgrid';
  hg.style.gridTemplateColumns = colDefs;
  hg.style.gridTemplateRows = 'auto';
  var corner = document.createElement('div'); corner.className='thead'; hg.appendChild(corner);
  cols.forEach(function(c){
    var h = document.createElement('div');
    h.className = 'thead';
    h.innerHTML = '<b>' + esc(c.teacher) + '</b>' + esc(c.loc) + todayOffHeadHtml(c.teacher);
    hg.appendChild(h);
  });

  var g = document.createElement('div');
  g.className = 'grid fitgrid';
  g.style.gridTemplateColumns = colDefs;
  g.style.gridTemplateRows = 'repeat(' + nrows + ', 46px)';   // 30분 = 46px 균일 간격
  for (var r = 0; r < nrows; r++){
    var lab = document.createElement('div');
    lab.className = 'tlab stick';
    lab.textContent = fmtT(lo + r*30);
    lab.style.gridColumn = '1 / -1';
    lab.style.width = '42px';
    lab.style.gridRow = String(r+1);
    g.appendChild(lab);
  }
  cols.forEach(function(cinfo, ci){
    for (var r = 0; r < nrows; r++) addCell(g, ci+2, r, dname, cinfo, lo, 1);
  });
  var placed = [], bandAt = {};
  list.forEach(function(c){
    var r0 = Math.floor((mins(c.start)-lo)/30), r1 = Math.ceil((minsEnd(c)-lo)/30);
    if (r1 <= r0) r1 = r0+1;
    var col = (colIdx[c.loc+'|'+c.teacher]||0)+2;
    var off = wkOffAt(c.id, todayStr());
    if (off){
      // 오늘 휴강은 얇은 띠 — 자리 다툼에 끼지 않아 실제 수업이 원래 폭을 쓴다 (2026-09-18 '1안')
      var band = offBandEl(c, off, todayStr(), false);
      var bk = col + '|' + r0, bi = bandAt[bk] || 0; bandAt[bk] = bi + 1;
      band.style.gridColumn = String(col);
      band.style.gridRow = String(r0+1);
      if (bi) band.style.marginBottom = (2 + bi*20) + 'px';
      g.appendChild(band);
      return;
    }
    var b = blockEl(c);
    b.style.gridColumn = String(col);
    b.style.gridRow = (r0+1) + ' / ' + (r1+1);
    g.appendChild(b);
    placed.push({ el: b, col: col, s: mins(c.start), e: minsEnd(c) });
  });
  spreadOverlaps(placed);

  tuneRowHeight(g, '', nrows);
  var wrap = document.createElement('div');
  wrap.className = 'scrollwrap';
  var sh2 = document.createElement('div');
  sh2.className = 'stickhead';
  sh2.appendChild(hg);
  wrap.appendChild(sh2);
  wrap.appendChild(g);
  attachTimeSync(wrap, g);
  return wrap;
}

/* 모바일 목록 보기(오늘의 시간표) — 그리드 대신 수업을 카드로.
 * 구역(정리정독→화정센터→민트초코→본원) 순서로 묶고, 구역 안에서는 시간순 (2026-08-20 사용자 확정).
 * 진행 중 수업은 테두리 강조, 끝난 수업은 흐리게. 카드 자체는 blockEl 재사용이라
 * 출석 체크·1회 이동·특이사항 등 모든 기능이 그리드와 동일하게 동작한다. */
var LOC_ORDER = ['정리정독', '화정센터', '민트초코', '본원'];
function narrowScreen(){ return window.innerWidth < 760; }
function useListView(){ return narrowScreen() && (localStorage.getItem('tt_mview') || 'list') === 'list'; }
function mviewToggleBtn(){
  var useList = useListView();

  tg.onclick = function(){ localStorage.setItem('tt_mview', useList ? 'grid' : 'list'); keepScroll = false; render(); };
  return tg;
}
/* 구역(정리정독→화정센터→민트초코→본원)별로 묶고 구역 안에서 시간순 정렬한 카드 목록 */
function locGroupList(list, makeCard, offCtx){
  var box = document.createElement('div');
  box.className = 'daylist';
  var ord = function(t){ var i = TEACHER_ORDER.indexOf(t); return i < 0 ? 99 : i; };
  var lord = function(l){ var i = LOC_ORDER.indexOf(l); return i < 0 ? 99 : i; };
  var sorted = list.slice().sort(function(a,b){
    return (lord(a.loc)-lord(b.loc)) || (mins(a.start)-mins(b.start)) || (ord(a.teacher)-ord(b.teacher));
  });
  var lastLoc = null;
  // 교사 임시 휴무 — 그 선생님 센터 제목 아래 빨간 줄 (주차별 휴대폰 목록, 2026-10-02 사용자 "모바일에서는 휴무가 안 보여요")
  var toffs = (offCtx && offCtx.toffs) || {};
  var toffOnly = function(beforeRank){
    Object.keys(toffs).filter(function(l){ return !toffs[l].done && lord(l) < beforeRank; })
      .sort(function(a, b){ return lord(a) - lord(b); })
      .forEach(function(l){ toffs[l].done = true; teacherOffLocBlock(box, l, toffs[l], 'dl-time'); });
  };
  // 같은 구역의 휴강은 모아 뒀다가 구간 끝에 — 2건 이상이면 한 장으로 (2026-09-18 '1안')
  var pendingOff = [];
  var flushOff = function(){
    if (!pendingOff.length) return;
    if (pendingOff.length >= 2) box.appendChild(offSummaryCard(pendingOff, offCtx.dstr, offCtx.canManage, offCtx.flag));
    else box.appendChild(makeCard(pendingOff[0].c));   // 1건은 지금처럼 낱장 흐린 카드
    pendingOff = [];
  };
  sorted.forEach(function(c){
    if (c.loc !== lastLoc){
      flushOff();
      toffOnly(lord(c.loc));
      lastLoc = c.loc;
      var h = document.createElement('div');
      h.className = 'dl-time';
      h.textContent = c.loc || '기타';
      box.appendChild(h);
      if (toffs[c.loc] && !toffs[c.loc].done){ toffs[c.loc].done = true; box.appendChild(teacherOffCtrEl(toffs[c.loc])); }
    }
    var off = offCtx ? wkOffAt(c.id, offCtx.dstr) : null;
    if (off){ pendingOff.push({ c: c, off: off }); return; }
    box.appendChild(makeCard(c));
  });
  flushOff();
  toffOnly(1e9);
  requestAnimationFrame(function(){ applySearchHits(); applyMultiSel(); });
  return box;
}
function buildDayList(list){
  var now = new Date();
  var nowM = now.getHours()*60 + now.getMinutes();
  return locGroupList(list, function(c){
    var b = blockEl(c, true);
    if (nowM >= mins(c.start) && nowM < minsEnd(c)) b.classList.add('dl-now');
    else if (minsEnd(c) <= nowM) b.classList.add('dl-past');
    return b;
  }, { dstr: todayStr(), canManage: false, flag: '오늘 휴강' });
}
/* 요일 선택 탭 — 전체 시간표·주차별 목록 보기 공용 */

}
/* 전체 시간표 목록 보기 — 요일을 골라 그 요일 수업을 구역별·시간순으로 */
var allListDay = null;
function buildAllList(){

  wrap.appendChild(dayTabsEl(allListDay, function(dy){ return esc(dy); },

/* 주차별 목록 보기 — 날짜(요일)를 골라 그 날 수업 + 출석 기록을 구역별·시간순으로 */
var weekListDay = null;
function buildWeekList(){
  var days = weekDates();
  if (!weekListDay){
    var td = todayDay();
    weekListDay = (ymdOf(days[td]) === todayStr()) ? td : '수';
  }
  var wrap = document.createElement('div');
  wrap.appendChild(dayTabsEl(weekListDay,
    function(dy){ return esc(dy) + '<small>' + mdOf(days[dy]) + '</small>' +
                         (teacherOffsAt(ymdOf(days[dy])).length ? '<small class="toff-tab">휴무</small>' : ''); },
    function(dy){ weekListDay = dy; keepScroll = false; render(); }));
  var dstr = ymdOf(days[weekListDay]);

    var em = document.createElement('p');

      .forEach(function(l){ teacherOffLocBlock(wrap, l, offLoc0[l], 'dl-time'); });

                                  { dstr: dstr, canManage: true, flag: '이 주 휴강',
                                    toffs: teacherOffsByLoc(dstr, weekListDay) }));

}
/* ── 휴강 표시 정리 (2026-09-18 사용자 '1안' 승인 — 중2 전 학년 휴강 주에 흐린 카드가
 * 수업 카드를 덮어 가독성이 떨어진 문제) ──
 * 그리드 = 휴강을 얇은 띠(offBandEl)로 시작 칸에 두고 자리 다툼(spreadOverlaps)에서 뺀다.
 * 목록·개요 = 같은 구역에 휴강이 2건 이상이면 한 장(offSummaryCard/개요 wkoffsum)으로 묶는다.
 * 1건은 지금처럼 낱장 흐린 카드 — 조교가 실수로 넣은 휴강은 종전대로 바로 보이고 되돌린다. */
function offBandEl(c, off, dstr, canManage){
  var b = document.createElement('div');
  b.className = 'blk wkband ' + colorOf(c.cls);
  b.setAttribute('data-cid', c.id);
  var flag = canManage ? '이 주 휴강' : '오늘 휴강';

  b.title = c.cls + ' ' + c.start + '~' + c.end + ' — ' + flag +
            (off.reason ? ' · ' + off.reason : '') + (canManage ? ' (누르면 되돌리기)' : '');
  if (canManage) b.addEventListener('click', function(e){ e.stopPropagation(); openWeekClassOffManage(c, dstr, off); });
  else b.style.cursor = 'default';
  return b;
}
function offSummaryCard(items, dstr, canManage, flag){   // items = [{c, off}]
  var b = document.createElement('div');
  b.className = 'blk wkoff wksum';
  var rows = items.map(function(it, i){
    return '<button type="button" data-i="' + i + '"><s>' + esc(it.c.cls) + ' ' + esc(it.c.start) + '</s>' +
           (it.off.reason ? ' — ' + esc(it.off.reason) : '') + (canManage ? '<em>되돌리기</em>' : '') + '</button>';
  }).join('');
  b.innerHTML = '<div class="bt"><span class="nm">' + esc(flag) + ' ' + items.length + '건</span>' +
                '<small>누르면 목록이 열려요</small></div>' +
                '<div class="wksum-list" hidden>' + rows + '</div>';
  b.addEventListener('click', function(e){
    var row = e.target.closest('button[data-i]');
    if (row && canManage){
      var it = items[parseInt(row.getAttribute('data-i'), 10)];
      openWeekClassOffManage(it.c, dstr, it.off);
      return;
    }
    var listEl = b.querySelector('.wksum-list');
    listEl.hidden = !listEl.hidden;
  });
  return b;
}
/* 주차별 반 카드 — 그리드·목록 공용 (그 날짜의 출석·1회 이동·보존 기록 칩 포함) */
function weekBlockEl(c, dstr, forList){
  var b = document.createElement('div');
  var off = wkOffAt(c.id, dstr);   // 이 주만 휴강
  var mvd = wkMovedAway(c.id, dstr);   // 이 주만 다른 시간으로 이동해 나감
  b.className = 'blk ' + colorOf(c.cls) + (c.wk ? ' wkonly' : '') + ((off || mvd) ? ' wkoff' : '');
  b.setAttribute('data-cid', c.id);
  if (mvd){
    // 이동해 나간 자리 — 어디로 갔는지 연하게 남긴다 (2026-08-26 사용자 요청)
    b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+jbBadge(c)+' <em class="wkflag">이 주 이동</em></span>'+
                  '<small>'+esc(c.start)+'~'+esc(c.end)+
                  (forList ? ' · '+esc(c.teacher)+'T'+(c.loc ? ' · '+esc(c.loc) : '') : '')+'</small></div>'+
                  '<div class="stus"><span class="empty-note">→ '+esc(wkMovedToLabel(mvd))+' 에서 해요'+
                  (mvd.reason ? ' — '+esc(mvd.reason) : '')+'</span></div>';
    b.addEventListener('click', function(){ openWeekMovedInfo(c, dstr, mvd); });
    return b;
  }
  if (off){
    b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+jbBadge(c)+' <em class="wkflag">이 주 휴강</em></span>'+
                  '<small>'+esc(c.start)+'~'+esc(c.end)+
                  (forList ? ' · '+esc(c.teacher)+'T'+(c.loc ? ' · '+esc(c.loc) : '') : '')+'</small></div>'+
                  '<div class="stus"><span class="empty-note">이 주는 수업이 없어요'+
                  (off.reason ? ' — '+esc(off.reason) : '')+'</span></div>';
    b.addEventListener('click', function(){ openWeekClassOffManage(c, dstr, off); });
    return b;
  }
  var awayOf = {}, temps = [];
  weekOnce.forEach(function(o){
    if (!isStudentLog(o)) return;   // 반 단위 기록(주간반이동·보강)은 학생 칩이 아니다
    if (o.fromId === c.id){
      var t = classes.find(function(x){ return x.id===o.toId; });
      awayOf[o.student.replace(/\(.*\)$/,'')] = { label: t ? labelOf(t) : '', row: o.row, kind: o.kind || '1회', reason: o.reason };
    }
    if (o.toId === c.id) temps.push(o);
  });
  temps = dedupTemps(c, temps, awayOf);
  var chips = sortNames(c.students).map(function(nm){
    var plain = nm.replace(/\(.*\)$/,'');
    var note = nameNote(nm);
    var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
    var a = weekAttend[wkAttKey(dstr, c.id, nm)];
    var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : (note ? 'note' : '');
    var tp = [];
    if (note) tp.push(note);
    if (a && a.status==='지각') tp.push('지각' + (a.memo ? ' — ' + a.memo : ''));
    else if (a && a.memo) tp.push(a.memo);
    else if (away) tp.push(awayOf[plain].kind === '주간빼기'
      ? ('이 주만 빠짐' + (awayOf[plain].reason ? ' — ' + awayOf[plain].reason : ''))
      : ('이 주 1회 이동: ' + awayOf[plain].label));
    return '<button data-nm="'+esc(nm)+'" class="'+cls2+(away?' away':'')+'"'+
           (away ? ' data-away-row="'+awayOf[plain].row+'"' : '')+
           (tp.length ? ' title="'+esc(tp.join(' · '))+'"' : '')+'>'+
           esc(plain)+(away ? (awayOf[plain].kind === '주간빼기' ? '<em>이 주 빠짐</em>' : '<em>1회↗</em>') : '')+'</button>';
  }).join('');
  chips += temps.sort(function(a,b){ return a.student.localeCompare(b.student,'ko'); }).map(function(o){
    var a = weekAttend[wkAttKey(dstr, c.id, o.student)];
    var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : 'once';
    var wk = (o.kind === '주간추가');
    return '<button data-nm="'+esc(o.student)+'" data-once-row="'+o.row+'" class="'+cls2+'" title="'+
           (wk ? '이 주만 추가' : '1회 이동') + (o.reason ? ' · 사유: '+esc(o.reason) : '')+
           ((a&&a.status==='지각')?' / 지각'+(a.memo?' — '+esc(a.memo):''):((a&&a.memo)?' / '+esc(a.memo):''))+'">'+
           esc(o.student)+(wk ? ' · 이 주' : ' · 1회')+'</button>';
  }).join('');
  chips += keptAttendNames(c, c.students, temps, dstr).map(function(nm){
    return keptChip(c, nm, weekAttend[wkAttKey(dstr, c.id, nm)]);
  }).join('');
  if (!chips) chips = '<span class="empty-note">비어 있음</span>';
  var meta = esc(c.start)+'~'+esc(c.end)+
             (forList ? ' · '+esc(c.teacher)+'T'+(c.loc ? ' · '+esc(c.loc) : '') : '')+
             ' · '+countLabel(c, awayOf, temps);
  b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+jbBadge(c)+(c.wk ? ' <em class="wkflag">이 주만</em>' : '')+'</span>'+
                '<small>'+meta+'</small></div>'+
                '<div class="stus">'+chips+'</div>';
  b.addEventListener('click', function(e){ onWeekClick(e, c, dstr); });
  return b;
}

/* 전체 보기: 월~일이 가로축 — 모든 요일에 전체 담당T 열(본원 포함)을 항상 표시 */
function buildFullGrid(){
  var baseCols = [], seenB = {};
  // 전체 시간표는 '기본값' — 그 주에만 있는 반은 넣지 않는다
  classes.forEach(function(c){
    if (c.wk || !allTeacherOn(c)) return;
    var key = c.loc + '|' + c.teacher;
    if (!seenB[key]){ seenB[key] = true; baseCols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
  });
  baseCols.sort(function(a,b){
    var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  if (!baseCols.length) baseCols = [{ key:'-', loc:'', teacher:'' }];
  var dayCols = {};
  DAYS.forEach(function(dname){
    if (dname === '월' || dname === '화'){
      var cols = [], seen = {};
      classes.forEach(function(c){
        if (c.day !== dname || c.wk || !allTeacherOn(c)) return;
        var key = c.loc + '|' + c.teacher;
        if (!seen[key]){ seen[key] = true; cols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
      });
      cols.sort(function(a,b){
        var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
        return (ia<0?99:ia) - (ib<0?99:ib);
      });
      dayCols[dname] = cols.length ? cols : [{ key:'-', loc:'', teacher:'' }];
    } else {
      dayCols[dname] = baseCols;
    }
  });

  // 통합 시간축: 10:00 ~ 10:00(22시), 수업이 벗어나면 확장
  var lo = 10*60, hi = 22*60;
  classes.forEach(function(c){
    if (c.wk || !allTeacherOn(c)) return;
    lo = Math.min(lo, mins(c.start));
    hi = Math.max(hi, minsEnd(c));
  });
  lo = Math.floor(lo/30)*30; hi = Math.ceil(hi/30)*30;
  var nrows = Math.round((hi - lo) / 30);

  // 그리드 컬럼: 시간축 + [요일별 열들 + 구분선]
  var colDefs = ['46px'], colMeta = [];   // colMeta[i] = {day, cinfo} (1-based 제외한 데이터열)
  DAYS.forEach(function(dname, di){
    dayCols[dname].forEach(function(cinfo){
      colDefs.push('minmax(96px, 1fr)');
      colMeta.push({ day: dname, cinfo: cinfo });
    });
    if (di < DAYS.length-1){ colDefs.push('7px'); colMeta.push(null); }   // 요일 구분 공백
  });

  // 고정 헤더 그리드 (요일 + 담당T)
  var hg = document.createElement('div');
  hg.className = 'grid fullgrid';
  hg.style.gridTemplateColumns = colDefs.join(' ');
  hg.style.gridTemplateRows = 'auto auto';
  var corner = document.createElement('div'); corner.style.gridRow='1 / 3'; hg.appendChild(corner);
  var colPos = 2;
  DAYS.forEach(function(dname, di){
    var n = dayCols[dname].length;
    var dh = document.createElement('div');
    dh.className = 'dhead';
    dh.textContent = dname;
    dh.style.gridColumn = colPos + ' / ' + (colPos + n);
    dh.style.gridRow = '1';
    hg.appendChild(dh);
    dayCols[dname].forEach(function(cinfo, i){
      var h = document.createElement('div');
      h.className = 'thead';
      h.innerHTML = cinfo.teacher ? '<b>' + esc(cinfo.teacher) + '</b>' + esc(cinfo.loc) : '<b>—</b>';
      h.style.gridColumn = String(colPos + i);
      h.style.gridRow = '2';
      hg.appendChild(h);
    });
    colPos += n + (di < DAYS.length-1 ? 1 : 0);
  });

  // 본문 그리드 (시간축 + 수업)
  var g = document.createElement('div');
  g.className = 'grid fullgrid';
  g.style.gridTemplateColumns = colDefs.join(' ');
  g.style.gridTemplateRows = 'repeat(' + nrows + ', 46px)';
  for (var r = 0; r < nrows; r++){
    var lab = document.createElement('div');
    lab.className = 'tlab stick';
    lab.textContent = fmtT(lo + r*30);
    lab.style.gridColumn = '1 / -1';
    lab.style.gridRow = String(r+1);
    g.appendChild(lab);
  }
  var gcol = 2;
  var colOfKey = {};   // day|loc|teacher → grid column
  DAYS.forEach(function(dname, di){
    dayCols[dname].forEach(function(cinfo){
      colOfKey[dname + '|' + cinfo.key] = gcol;
      for (var r = 0; r < nrows; r++) addCell(g, gcol, r, dname, cinfo, lo, 1);
      gcol++;
    });
    if (di < DAYS.length-1) gcol++;
  });
  var placedF = [];
  classes.forEach(function(c){
    if (c.wk || !allTeacherOn(c)) return;
    var col = colOfKey[c.day + '|' + c.loc + '|' + c.teacher];
    if (!col) return;
    var r0 = Math.floor((mins(c.start)-lo)/30), r1 = Math.ceil((minsEnd(c)-lo)/30);
    if (r1 <= r0) r1 = r0+1;
    var b = blockEl(c);
    b.style.gridColumn = String(col);
    b.style.gridRow = (r0+1) + ' / ' + (r1+1);
    g.appendChild(b);
    placedF.push({ el: b, col: col, s: mins(c.start), e: minsEnd(c) });
  });
  spreadOverlaps(placedF);

  tuneRowHeight(g, '', nrows);
  var wrap = document.createElement('div');
  wrap.className = 'scrollwrap';
  var sh2 = document.createElement('div');
  sh2.className = 'stickhead';
  sh2.appendChild(hg);
  wrap.appendChild(sh2);
  wrap.appendChild(g);
  attachTimeSync(wrap, g);
  return wrap;
}

/* ── 전체 시간표: 한 페이지 개요 ↔ 요일 확대 (2026-08-22 사용자 요청 — 주차별과 같은 방식, 가로 스크롤 없음)
 * 개요: 월~일 7열, 요일마다 센터 순 반 요약 카드(시간·담당T·인원). 카드/요일 머리글 클릭 = 그 요일 확대.
 * 확대: 반 블록(학생 칩) 그대로 — 학생 클릭 영구 이동·편집 도구줄 모두 동작.
 * 반 통째 이동(빈 자리 클릭)만 시간 그리드가 필요해서 [시간 그리드로 보기] 토글로 옛 화면 유지 —
 * 편집 '반 이동'을 시작하면 자동으로 그리드로 전환, 끝나면 개요로 복귀. */
var allZoomDay = null;      // null = 개요, '금' = 그 요일 확대
/* ── 강사별 보기 (2026-09-10 사용자 요청 "전체 시간표에 강사별 시간표를 드롭다운으로") ──
 * 제목 줄의 드롭다운에서 강사를 고르면 개요·요일 확대·시간 그리드·모바일 목록이 그 강사의 반만
 * 보여 준다. 정규/내신 전환·새로고침에도 유지(sessionStorage). 검색 결과가 다른 강사 반이면
 * 필터를 풀고 찾아간다(gotoSearchHit). 주차별·오늘의 시간표에는 적용하지 않는다. */
var allTeacher = sessionStorage.getItem('tt_allteacher') || '';   // '' = 모든 강사
function allTeacherOn(c){ return !allTeacher || String(c.teacher || '').trim() === allTeacher; }
function allTeacherList(){
  var seen = {}, out = [];
  classes.forEach(function(c){
    if (c.wk) return;
    var t = String(c.teacher || '').trim();
    if (t && !seen[t]){ seen[t] = true; out.push(t); }
  });
  if (allTeacher && !seen[allTeacher]) out.push(allTeacher);   // 이 시간표에 반이 없어도 고른 값은 보이게

/* 확대 화면 — 센터별 시간 그리드로 그린다 (2026-08-22 사용자 확정 시안 A).

function zoomTuneRows(g, nrows){
  requestAnimationFrame(function(){
    var per = 30;
    g.querySelectorAll('.blk').forEach(function(b){
      var gr = String(b.style.gridRow).split('/');
      var span = Math.max(1, (parseInt(gr[1], 10) - parseInt(gr[0], 10)) || 1);
      var need = Math.ceil((b.scrollHeight + 2 - (span - 1) * 2) / span);
      if (need > per) per = need;
    });
    per = Math.min(per, 120);
    g.style.gridTemplateRows = 'auto repeat(' + nrows + ', ' + per + 'px)';
    applySearchHits();
    applyMultiSel();
  });
}
function zoomCenterGrids(big, dname, list, makeBlock, makeBand, dstr){   // dstr = 주차별 날짜(교사 휴무 머리글 표시용)
  var order = [], byLoc = {};

    if (!byLoc[c.loc]){ byLoc[c.loc] = []; order.push(c.loc); }
    byLoc[c.loc].push(c);
  });
  var offLoc = dstr ? teacherOffsByLoc(dstr, dname) : {};
  var offOnly = function(beforeRank){
    Object.keys(offLoc).filter(function(l){ return !offLoc[l].done && wkLocRank(l) < beforeRank; })
      .sort(function(a, b){ return wkLocRank(a) - wkLocRank(b); })
      .forEach(function(l){ offLoc[l].done = true; teacherOffLocBlock(big, l, offLoc[l], 'wk-ch'); });
  };
  order.forEach(function(loc){
    var cl = byLoc[loc];
    offOnly(wkLocRank(loc));
    var ch = document.createElement('div');

    big.appendChild(ch);
    if (offLoc[loc] && !offLoc[loc].done){ offLoc[loc].done = true; big.appendChild(teacherOffCtrEl(offLoc[loc])); }
    var cols = [], seen = {};
    cl.forEach(function(c){ if (!seen[c.teacher]){ seen[c.teacher] = true; cols.push(c.teacher); } });
    cols.sort(function(a, b){
      var ia = TEACHER_ORDER.indexOf(a), ib = TEACHER_ORDER.indexOf(b);
      return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
    });
    var lo = 24 * 60, hi = 0;
    cl.forEach(function(c){ lo = Math.min(lo, mins(c.start)); hi = Math.max(hi, minsEnd(c)); });
    lo = Math.floor(lo / 30) * 30; hi = Math.ceil(hi / 30) * 30;
    var n = Math.max(1, Math.round((hi - lo) / 30));
    var g = document.createElement('div');
    g.className = 'wk-tgrid';
    g.style.gridTemplateColumns = '46px repeat(' + cols.length + ', minmax(var(--zcol, 0px), 1fr))';
    g.style.gridTemplateRows = 'auto repeat(' + n + ', 30px)';
    var corner = document.createElement('div');
    corner.className = 'wk-tcorner';
    g.appendChild(corner);
    cols.forEach(function(t){
      var th = document.createElement('div');
      th.className = 'wk-th';
      th.textContent = t + 'T';
      var toff = dstr ? teacherOffAt(dstr, t) : null;   // 그 날 임시 휴무면 열 머리글에 표시 (2026-09-30)
      if (toff){

        th.appendChild(ts);

      g.appendChild(th);
    });
    for (var r = 0; r < n; r++){
      var lab = document.createElement('div');
      lab.className = 'wk-tlab';
      lab.textContent = fmtT(lo + r * 30);
      lab.style.gridColumn = '1';
      lab.style.gridRow = String(r + 2);
      g.appendChild(lab);
      for (var j = 0; j < cols.length; j++){
        addCell(g, j + 2, r, dname, { key: loc + '|' + cols[j], loc: loc, teacher: cols[j] }, lo, 2);
      }
    }
    var placedZ = [], bandAt = {};
    cl.forEach(function(c){
      var r0 = Math.floor((mins(c.start) - lo) / 30), r1 = Math.ceil((minsEnd(c) - lo) / 30);
      if (r1 <= r0) r1 = r0 + 1;
      var col = cols.indexOf(c.teacher) + 2;
      var band = makeBand ? makeBand(c) : null;
      if (band){
        // 휴강 띠 — 자리 다툼에 끼지 않는다 (2026-09-18 '1안')

      g.appendChild(b);
      placedZ.push({ el: b, col: col, s: mins(c.start), e: minsEnd(c) });
    });

  });

/* 주차별 보기: 그 주의 날짜·출석·1회 이동이 반영된 주간 그리드 */
/* ── 주차별 보기: 한 페이지 개요 ↔ 요일 확대 (2026-08-21 사용자 확정 시안) ──
 * 개요: 월~일 7열, 요일마다 센터(본원→화정센터→민초센터→정리정독) 순으로 묶은 반 요약 카드
 *       (시간·인원·출석 요약 숫자). 요일 머리글/카드를 누르면 그 요일 확대.
 * 확대: 그 요일이 센터 섹션으로 펼쳐지고(학생 칩·출석 기록 그대로), 나머지 요일은 옆에 가는 열.
 *       확대된 요일 머리글을 다시 누르면 개요로 복귀. */
var weekZoomDay = null;   // null = 개요, '금' = 그 요일 확대

/* 개요 카드·옆 요일 막대의 높이를 수업 길이에 비례시킨다 (2026-09-10 사용자 요청
 * "90분·120분·180분 수업 각각 수업 시간과 시간표 칸 높이가 비례하도록"). 확대·그리드 화면은
 * 원래 30분 눈금이라 비례하고, 개요 카드만 같은 높이였다. 분당 px — 90분 카드가 글자 두 줄(전체)·
 * 세 줄(주차별, 출석 요약)보다 작아지지 않는 값. 값을 줄이면 90분 카드가 내용 높이에 걸려 비례가 깨진다. */

function wkTeacherRank(t){ var i = TEACHER_ORDER.indexOf(t); return i < 0 ? 99 : i; }
/* 주간 전용 반('w…')은 그 날짜에만 — 날짜를 안 주면(전체 시간표) 숨긴다.

function wkMovedFrom(cid){

function teacherOffsAt(dstr){
  return teacherOffs.filter(function(o){ return o.date === dstr; })
    .sort(function(a,b){ return wkTeacherRank(a.teacher) - wkTeacherRank(b.teacher) || a.teacher.localeCompare(b.teacher,'ko'); });
}
/* 교사 휴무 표기 — '현지T OFF (화 직보)' (2026-09-30 사용자 지정) */
function teacherOffLabel(o){
  return o.teacher + 'T OFF' + (o.reason ? ' (' + o.reason + ')' : '');
}
/* 휴무 선생님이 평소 수업하는 센터 — 그 요일 반의 센터, 없으면 가장 많이 맡은 센터 (2026-09-30 사용자
   "오프 당사자의 각 센터 표시 아래에 빨간 글씨로") */
function teacherHomeLoc(t, dname){
  var cnt = {}, best = '', bestN = 0;
  for (var i = 0; i < classes.length; i++){
    var c = classes[i];
    if (c.teacher !== t || /^w/.test(c.id || '')) continue;
    if (c.day === dname) return c.loc || '';
    cnt[c.loc] = (cnt[c.loc] || 0) + 1;
    if (cnt[c.loc] > bestN){ bestN = cnt[c.loc]; best = c.loc || ''; }
  }
  return best;
}
function teacherOffsByLoc(dstr, dname){
  var m = {};
  teacherOffsAt(dstr).forEach(function(o){ var l = teacherHomeLoc(o.teacher, dname); (m[l] = m[l] || []).push(o); });
  return m;
}
function teacherOffCtrEl(rows){
  var d = document.createElement('div');
  d.className = 'toff-ctr';
  d.innerHTML = rows.map(function(o){ return '<div>' + esc(teacherOffLabel(o)) + '</div>'; }).join('');
  return d;
}
/* 센터 라벨(cls = 'wk-ctr' 또는 'wk-ch') + 그 센터 휴무 줄 — 휴무 센터에 그 날 수업이 없어도 라벨을 세운다 */
function teacherOffLocBlock(host, loc, rows, cls){
  var cl = document.createElement('div');
  cl.className = cls;
  cl.textContent = wkLocLabel(loc);
  host.appendChild(cl);
  host.appendChild(teacherOffCtrEl(rows));
}
/* 오늘의 시간표 — 오늘 휴무인 선생님을 요약 줄과 강사 열 머리글에 표시한다(2026-09-30 사용자 요청).
   주차별과 마찬가지로 표시만 하고 수업·출석은 바꾸지 않는다. 설정·해제는 주차별 [교사 휴무 설정]에서. */
function todayOffOf(teacher){
  for (var i = 0; i < todayOffs.length; i++){
    if (todayOffs[i].date === todayStr() && todayOffs[i].teacher === teacher) return todayOffs[i];
  }

}

function todayOffStrip(){

    .sort(function(a,b){ return wkTeacherRank(a.teacher) - wkTeacherRank(b.teacher) || a.teacher.localeCompare(b.teacher,'ko'); });
  if (!rows.length) return null;

  }).join('') + '<small class="toff-note">수업은 그대로 두었어요. 바꾸려면 주차별의 [교사 휴무 설정]에서 하세요.</small>';
  return box;

function teacherOffTeachers(){
  var seen = {}, out = [];
  TEACHER_ORDER.concat(classes.map(function(c){ return c.teacher; })).forEach(function(t){
    t = String(t || '').trim();
    if (t && !seen[t]){ seen[t] = 1; out.push(t); }
  });
  return out;
}
function teacherClassesAt(dstr, teacher){
  var d = new Date(+dstr.slice(0,4), +dstr.slice(5,7)-1, +dstr.slice(8,10));
  var dy = ['일','월','화','수','목','금','토'][d.getDay()];
  return classes.filter(function(c){
    if (String(c.teacher || '').trim() !== teacher) return false;
    if (c.wk ? c.wk !== dstr : c.day !== dy) return false;
    return !wkOffAt(c.id, dstr) && !wkMovedAway(c.id, dstr);
  });
}

    '</div><p id="toff-remain"></p>'+ existingBtns +
    '<div class="mbtns"><button onclick="closeModal()">취소</button>'+
    '<button id="toff-del" onclick="deleteTeacherOff()"'+(existing?'':' style="display:none"')+'>휴무 해제</button>'+
    '<button class="primary" onclick="saveTeacherOff()">휴무 저장</button></div>'
  );
  teacherOffFormSync(false);

function teacherOffFormSync(fillReason){

function buildWeekOverview(){
  var dates = weekDates();
  var wrap = document.createElement('div');
  wrap.className = 'wk-ov';
  WEEK_VIEW_ORDER.forEach(function(dname){
    var col = document.createElement('div');
    col.className = 'wk-ov-col';
    var dstr = ymdOf(dates[dname]);
    col.appendChild(wkDayHeader(dname, dates, '', function(){ weekZoomDay = dname; keepScroll = false; render(); }));
    var list = wkDayClasses(dname, dstr);
    var lastLoc = null;
    var offLoc = teacherOffsByLoc(dstr, dname);
    // 그 날 수업이 없는 센터의 휴무는 센터 순서대로 라벨을 세워 끼운다
    var offOnly = function(beforeRank){
      Object.keys(offLoc).filter(function(l){ return !offLoc[l].done && wkLocRank(l) < beforeRank; })
        .sort(function(a, b){ return wkLocRank(a) - wkLocRank(b); })
        .forEach(function(l){ offLoc[l].done = true; teacherOffLocBlock(col, l, offLoc[l], 'wk-ctr'); });
    };
    var zoomHere = function(){ weekZoomDay = dname; keepScroll = false; render(); };
    // 같은 센터의 휴강은 모아 뒀다가 구간 끝에 — 2건 이상이면 한 장으로 (2026-09-18 '1안')
    var pendingOff = [];
    var flushOff = function(){
      if (!pendingOff.length) return;
      var m = document.createElement('button');
      m.type = 'button';
      if (pendingOff.length >= 2){
        m.className = 'wk-mini wkoffsum';
        m.innerHTML = '<b>이 주 휴강 ' + pendingOff.length + '건</b><small>' +
                      pendingOff.map(function(it){ return esc(it.c.start); }).join(' · ') + '</small>';
        m.title = pendingOff.map(function(it){ return it.c.cls + ' ' + it.c.start; }).join(', ') +
                  ' — 누르면 ' + dname + '요일 확대';
      } else {
        var it = pendingOff[0];
        m.className = 'wk-mini offm ' + colorOf(it.c.cls);
        m.setAttribute('data-cid', it.c.id);
        m.innerHTML = '<b><span class="wk-nm">'+wkTeacherTag(it.c)+esc(it.c.cls)+'</span>'+jbBadge(it.c)+'</b><small>'+esc(it.c.start)+'~'+esc(it.c.end)+
                      ' · 이 주 휴강</small><span class="sum"><i class="none">휴강</i></span>';
        m.title = it.c.cls + ' — 이 주 휴강' + (it.off.reason ? ' · ' + it.off.reason : '');
        durHeight(m, it.c, DUR_PX.week);
      }
      m.addEventListener('click', zoomHere);
      col.appendChild(m);
      pendingOff = [];
    };
    list.forEach(function(c){
      if (c.loc !== lastLoc){
        flushOff();
        offOnly(wkLocRank(c.loc));
        lastLoc = c.loc;
        var cl = document.createElement('div');
        cl.className = 'wk-ctr';
        cl.textContent = wkLocLabel(c.loc);
        col.appendChild(cl);
        if (offLoc[c.loc] && !offLoc[c.loc].done){ offLoc[c.loc].done = true; col.appendChild(teacherOffCtrEl(offLoc[c.loc])); }
      }
      var off = wkOffAt(c.id, dstr);
      if (off){ pendingOff.push({ c: c, off: off }); return; }
      var m = document.createElement('button');
      m.type = 'button';
      var mvd = wkMovedAway(c.id, dstr);
      m.className = 'wk-mini ' + colorOf(c.cls) + (mvd ? ' mvd' : '');
      m.setAttribute('data-cid', c.id);
      var s = wkAttSummary(c.id, dstr);
      var att = mvd ? '<i class="none">이동</i>'
        : s.any
        ? (s.cnt['출석'] ? '<i class="ok">'+s.cnt['출석']+'</i>' : '') +
          (s.cnt['지각'] ? '<i class="late">'+s.cnt['지각']+'</i>' : '') +
          (s.cnt['결석'] ? '<i class="abs">'+s.cnt['결석']+'</i>' : '')
        : '<i class="none">—</i>';
      m.innerHTML = '<b><span class="wk-nm">'+wkTeacherTag(c)+esc(c.cls)+'</span>'+jbBadge(c)+'</b><small>'+
                    (mvd ? '→ '+esc(wkMovedToLabel(mvd)) : esc(c.start)+'~'+esc(c.end)+' · '+c.students.length+'명')+
                    '</small><span class="sum">'+att+'</span>';
      m.title = mvd ? esc(c.cls) + ' — 이 주는 ' + wkMovedToLabel(mvd) + ' 에서 해요'
                    : esc(c.cls) + ' — 누르면 ' + dname + '요일 확대';
      durHeight(m, c, DUR_PX.week);
      m.addEventListener('click', zoomHere);
      col.appendChild(m);
    });
    flushOff();
    offOnly(1e9);
    if (!list.length){
      var em = document.createElement('div'); em.className = 'wk-empty'; em.textContent = '수업 없음';
      col.appendChild(em);
    }
    wrap.appendChild(col);
  });
  return wrap;

function onWeekClick(e, c, dstr){
  if (editMode && !moving && !classMoving){ applyEdit(c, dstr); return; }
  if (moving && moving.once){
    // 주차별 1회 이동: 옮겨 갈 반을 누르면 그 반 요일의 날짜로 기록
    var selChip = e.target.closest('button[data-nm]');
    if (selChip && selChip.classList.contains('sel')){ cancelMove(); return; }
    if (c.id === moving.fromId) return;
    openOnceModal(c);
    return;
  }
  var chip = e.target.closest('button[data-nm]');
  if (!chip){
    if (c.wk) openWeekClassManage(c, dstr);   // 이 주만 있는 반 — 학생 넣기·지우기
    else openWeekClassMenu(c, dstr);          // 보통 반 — 이 주만 시간 옮기기·학생 넣기
    return;
  }
  var nm = chip.getAttribute('data-nm');
  // 이미 1회 이동한 학생은 사유 확인·수정·취소
  if (chip.hasAttribute('data-once-row')){ openOnceManage(c, nm, parseInt(chip.getAttribute('data-once-row'),10), 'in', dstr); return; }
  if (chip.hasAttribute('data-away-row')){ openOnceManage(c, nm, parseInt(chip.getAttribute('data-away-row'),10), 'out', dstr); return; }
  // 그 밖의 학생을 누르면 그 날짜의 출석 창 — 지난 날짜 출석도 여기서 고친다
  // (창 안의 [다른 반으로 1회 이동] 버튼으로 1회 이동 시작)
  openAttend(c, nm, dstr);
}

                   timetableWeekAdd:1, timetableWeekRemove:1, timetableWeekCancel:1, timetableWeekClass:1,
                   timetableAdd:1, timetableRemove:1, timetableClassMove:1, timetableClassAdd:1,

function post(body, busyMsg, done){
  setStatus(busyMsg || '저장하는 중…');
  body.pw = pw;
  fetch(ENDPOINT, {
    method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'},
    body: JSON.stringify(body)
  })
  .then(function(r){ return r.json(); })
  .then(function(res){
    // 시간표를 바꾸는 저장이 성공하면 변경사항 패널을 새로 불러온다
    if (res && res.result === 'success' && CH_ACTIONS[body.action]) chDirty();
    done(res);
  })
  .catch(function(){ setStatus('전송에 실패했어요. 인터넷을 확인해 주세요.', 'err'); });
}
function rosterNote(res){
  var base = res.rosterUpdated ? ' 리포트·학생 페이지에도 반영됐어요.' : (res.rosterMsg ? ' (' + res.rosterMsg + ')' : '');
  return base + twinNote(res);
}
/* 중3·고3은 정규·내신이 같은 반이라 짝 시간표도 함께 바뀐다 — 무엇이 같이 바뀌었는지 알려 준다 */
function twinNote(res){ return (res && res.twinMsg) ? ' ' + res.twinMsg : ''; }

/* ── 학생 검색 ── */
/* 이름에서 괄호 표기를 떼어 낸 '진짜 이름'.
 * 뒤 괄호(특이사항 "김현우(8/23부터)")뿐 아니라 앞 괄호(내신 확인반 학교 구분 "(화정)심지후")도 뗀다
 * — 앞 괄호를 남기면 재원 명단과 대조가 안 돼 '미등록생'으로 잘못 잡힌다 (2026-08-23) */
function plainName(nm){ return String(nm || '').replace(/^\s*\([^)]*\)\s*/, '').replace(/\(.*\)$/, ''); }
/* 이름 뒤 괄호 특이사항(신입 시작일·입테 등) — "김현우(8/23부터)" → "8/23부터" */
function nameNote(nm){
  var s = String(nm || ''), m = s.match(/\((.+)\)\s*$/);
  if (m) return m[1];
  m = s.match(/^\s*\(([^)]*)\)/);            // 앞 괄호로 적힌 학교 구분도 특이사항으로 읽는다
  return m ? m[1] : '';
}
function searchStudent(){
  var q = $('stu-q').value.trim();
  var box = $('searchResults');
  if (!q){ box.innerHTML = ''; applySearchHits(); return; }
  // 주차별은 그 주 기록(1회 이동·반 전체 이동·주간추가/빼기·휴강)을 반영해 '이번 주 실제 수업'을 찾는다
  var out = (mode === 'week') ? weekSearchHits(q) : classSearchHits(q);
  // 검색된 학생의 출석 이력 바로가기 (겹치는 이름은 최대 3명까지)
  var uniq = [];
  out.forEach(function(h){ var nm = plainName(h.nm); if (uniq.indexOf(nm) < 0) uniq.push(nm); });
  var hist = uniq.slice(0, 3).map(function(nm){
    return '<button class="ahist" onclick="openAttStatus(\'' + esc(nm) + '\')">' + esc(nm) + ' 출석 이력</button>';
  }).join('');
  box.innerHTML = out.length
    ? hist + out.slice(0, 12).map(searchHitBtn).join('') +
      (out.length > 12 ? '<span>외 ' + (out.length - 12) + '건</span>' : '')
    : '<span>검색 결과가 없어요.</span>';
  applySearchHits();
}
/* 오늘·전체 시간표 — 명단 그대로. '이 주만' 반은 그 날짜에만 화면에 있으므로 오늘 열리는 것만 넣는다 */
function classSearchHits(q){
  var t = todayStr(), out = [];
  classes.forEach(function(c){
    if (c.wk && !(mode === 'today' && c.wk === t)) return;
    c.students.forEach(function(nm){
      if (plainName(nm).indexOf(q) >= 0) out.push({ c: c, nm: nm, ymd: (mode === 'today') ? t : '' });
    });
  });
  return sortHits(out);
}
/* 주차별 보기의 검색 — 그 주에 실제로 어느 반·언제 수업하는지 찾는다.
 * 정규 명단만 보면 1회 이동·반 전체 이동·주간추가/빼기가 빠져 옮겨 간 반의 시간을 알 수 없었다
 * (2026-09-02 사용자 요청 "이동한 반의 시간을 알 수 있어야"). 결과를 누르면 그 반이 열리는
 * 주·요일로 옮겨 가 학생 칩을 찾아 준다 — 다른 주로 당긴 수업도 같다. */
function weekSearchHits(q){
  var dates = weekDates(), r = weekViewRange(), byId = {}, out = [], used = {}, seen = {};
  classes.forEach(function(c){ byId[c.id] = c; });
  var away = {}, came = [];
  weekOnce.forEach(function(o){
    if (!isStudentLog(o)) return;   // 반 단위 기록(주간반이동·보강)은 학생 기록이 아니다
    if (o.fromId) away[o.fromId + '|' + plainName(o.student)] = o;
    if (o.toId) came.push(o);
  });
  // 그 반이 열리는 날짜 — '이 주만' 반은 반ID의 날짜, 기록이 있으면 그 적용일, 없으면 그 요일의 날짜
  function ymdFor(c, applyYmd){ return c.wk || applyYmd || (dates[c.day] ? ymdOf(dates[c.day]) : ''); }
  function push(h){
    var k = h.c.id + '|' + plainName(h.nm) + '|' + (h.ymd || '');
    if (seen[k]) return;
    seen[k] = 1;
    out.push(h);
  }
  classes.forEach(function(c){
    if (c.wk && (c.wk < r.from || c.wk > r.to)) return;   // 다른 주의 '이 주만' 반
    var ymd = ymdFor(c), mvd = wkMovedAway(c.id, ymd), off = wkOffAt(c.id, ymd);
    c.students.forEach(function(nm){
      if (plainName(nm).indexOf(q) < 0) return;
      var a = away[c.id + '|' + plainName(nm)];
      if (a && a.kind !== '주간빼기'){                       // 1회 이동 — 옮겨 간 반의 시간으로
        used[a.row] = 1;
        var t = byId[a.toId];
        if (t) push({ nm: nm, c: t, ymd: ymdFor(t, a.date), flag: '1회 이동', from: c, note: a.reason });
        else push({ nm: nm, c: c, ymd: ymd, flag: '1회 이동', off: true, note: '옮겨 간 반을 찾지 못했어요' });
        return;
      }
      if (a){ push({ nm: nm, c: c, ymd: ymd, flag: '이 주 빠짐', off: true, note: a.reason }); return; }
      if (mvd){                                             // 반 전체가 그 주만 다른 시간·다른 주로
        var t2 = byId[mvd.toId];
        if (t2) push({ nm: nm, c: t2, ymd: ymdFor(t2), flag: '반 이동', from: c, note: mvd.reason });
        else push({ nm: nm, c: c, ymd: ymd, flag: '반 이동', off: true, note: mvd.reason });
        return;
      }
      if (off){ push({ nm: nm, c: c, ymd: ymd, flag: '이 주 휴강', off: true, note: off.reason }); return; }
      push({ nm: nm, c: c, ymd: ymd });
    });
  });
  came.forEach(function(o){                                  // 그 주에 이동해 온·추가된 학생
    if (used[o.row] || plainName(o.student).indexOf(q) < 0) return;
    var t = byId[o.toId];
    if (!t) return;
    push({ nm: o.student, c: t, ymd: ymdFor(t, o.date),
           flag: (o.kind === '주간추가') ? '이 주 추가' : '1회 이동', note: o.reason });
  });
  return sortHits(out);
}
function sortHits(out){
  return out.sort(function(a, b){
    return plainName(a.nm).localeCompare(plainName(b.nm), 'ko') ||
           String(a.ymd || '').localeCompare(String(b.ymd || '')) ||
           (DAY_IDX[a.c.day] - DAY_IDX[b.c.day]) || (mins(a.c.start) - mins(b.c.start));
  });
}
/* 검색 결과 한 줄 — 날짜가 있으면 '8/30 (일) 2:00'처럼 그 주 날짜로 적는다 */
function searchHitBtn(h){
  var when = h.ymd ? (wkDayLabel(h.ymd) + ' ' + h.c.start) : (h.c.day + h.c.start);
  var tip = [];
  if (h.from) tip.push('원래 ' + h.from.cls + ' ' + h.from.day + h.from.start);
  if (h.note) tip.push(h.note);
  return '<button onclick="gotoSearchHit(\'' + esc(h.c.id) + '\', \'' + esc(h.ymd || '') + '\')"' +
         (tip.length ? ' title="' + esc(tip.join(' · ')) + '"' : '') + '><b>' + esc(plainName(h.nm)) + '</b> ' +
         (h.flag ? '<em class="sflag' + (h.off ? ' off' : '') + '">' + esc(h.flag) + '</em> ' : '') +
         esc(h.c.cls) + ' · ' + esc(when) + ' ' + esc(h.c.teacher) + 'T</button>';
}
/* 지금 보고 있는 주의 월~일 날짜 범위 */
function weekViewRange(){
  var f = new Date(weekStart); f.setDate(f.getDate() - 2);
  var t = new Date(weekStart); t.setDate(t.getDate() + 4);
  return { from: ymdOf(f), to: ymdOf(t) };
}
function applySearchHits(){
  var q = $('stu-q') ? $('stu-q').value.trim() : '';
  document.querySelectorAll('.stus button.search-hit').forEach(function(b){ b.classList.remove('search-hit'); });
  document.querySelectorAll('.blk.search-blk').forEach(function(b){ b.classList.remove('search-blk'); });
  if (!q) return;
  document.querySelectorAll('.stus button[data-nm]').forEach(function(b){
    if (plainName(b.getAttribute('data-nm')).indexOf(q) >= 0){
      b.classList.add('search-hit');
      var blk = b.closest('.blk');
      if (blk) blk.classList.add('search-blk');
    }
  });
}
var pendingGoto = null;   // 다른 주의 수업으로 찾아가는 중 (주간 기록을 받은 뒤 render에서 이어서 처리)
function gotoSearchHit(cid, ymd){
  // 주차별: 그 수업이 열리는 주·요일로 먼저 옮겨 간다 (다른 주로 당긴 수업도 찾아간다)
  if (mode === 'week' && ymd){
    var r = weekViewRange();
    var d = new Date(+ymd.slice(0,4), +ymd.slice(5,7)-1, +ymd.slice(8,10));
    var dn = ['일','월','화','수','목','금','토'][d.getDay()];
    if (ymd < r.from || ymd > r.to){
      weekStart = weekStartOf(d);
      if (useListView()) weekListDay = dn; else weekZoomDay = dn;
      keepScroll = false;
      pendingGoto = { cid: cid, ymd: ymd };
      loadWeek();
      return;
    }
    var cur = useListView() ? weekListDay : weekZoomDay;
    if (cur !== dn){
      if (useListView()) weekListDay = dn; else weekZoomDay = dn;
      keepScroll = false;
      render();
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ gotoSearchHit(cid, ymd); }); });
      return;
    }
  }
  var el = document.querySelector('.blk[data-cid="' + cid + '"]');
  if (!el && mode === 'today'){
    setMode('all');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ gotoSearchHit(cid); }); });
    return;
  }
  // 강사별 보기 중 다른 강사의 반이면 필터를 풀고 찾아간다 (2026-09-10)
  if (!el && mode === 'all' && allTeacher){
    var ct = classes.find(function(x){ return x.id === cid; });
    if (ct && !allTeacherOn(ct)){
      setAllTeacher('');
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ gotoSearchHit(cid); }); });
      return;
    }
  }
  // 전체 개요 보기엔 반 블록이 없음 — 그 반의 요일을 확대한 뒤 다시 찾기
  if (!el && mode === 'all' && !useListView() && allView() !== 'grid'){
    var c = classes.find(function(x){ return x.id === cid; });
    if (c && allZoomDay !== c.day){
      allZoomDay = c.day;
      keepScroll = false;
      render();
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ gotoSearchHit(cid); }); });
      return;
    }
  }
  if (!el) return;
  el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
}

/* 결석 보충 처리 배지 — 옛 학생 이력 모달에서 옮겨 옴 (출석 현황 상세에서 사용) */
function ahMkBadge(x){
  if (!x) return '<span class="ah-badge a-mk todo">보충 미정</span>';

  if (plan.indexOf('영상보충') === 0){

           (rest ? ' · ' + esc(rest) : '') + '</span>';
