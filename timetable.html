function exsSave(row, kind){
  var school = ($('exs-school') ? $('exs-school').value : '').trim();
  var start = ($('exs-start') ? $('exs-start').value : '').trim();
  var end = ($('exs-end') ? $('exs-end').value : '').trim();
  var text = ($('exs-text') ? $('exs-text').value : '').trim();
  var err = $('exs-err');
  if (!school || !start){ if (err) err.textContent = '학교와 날짜를 넣어주세요.'; return; }
  if (kind === '과목' && !text){ if (err) err.textContent = '과목 내용을 적어주세요.'; return; }
  closeModal();
  post({ action:'examSchedSet', row: row || '', kind: kind, school: school, start: start, end: end, text: text },
    '지필 일정을 저장하는 중…', function(res){
      if (res && res.result === 'success'){ setStatus(school + ' — 지필 일정을 저장했어요.', 'ok'); exsReload(); }
      else setStatus('저장 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}
function exsDel(row, school){
  closeModal();
  if (!confirm(school + ' 일정을 지울까요?')) return;
  post({ action:'examSchedSet', row: row, del: 1, school: school }, '지우는 중…', function(res){
    if (res && res.result === 'success'){ setStatus(school + ' 일정을 지웠어요.', 'ok'); exsReload(); }
    else setStatus('삭제 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}
function setPeriod(wed, bk){
  if ((periods[wed] || '정규') === bk && periods[wed]) return;   // 이미 그 기간
  post({ action:'ttPeriodSet', week:wed, book:bk }, '기간을 저장하는 중…', function(res){
    if (res && res.result === 'success'){
      periods[wed] = bk;
      var md = wed.slice(5).replace('-', '/');
      setStatus(md + ' 주를 ' + bk + ' 기간으로 설정했어요. 오늘의 시간표·주차별에 자동 반영됩니다.', 'ok');
      render();
    } else setStatus('저장 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}

function fmtT(t){
  var h24 = Math.floor(t/60), mm = t%60;
  var h12 = h24 > 12 ? h24-12 : h24;
  return h12 + ':' + (mm<10?'0':'')+mm;
}

/* 그 날 실제 인원 표기 — '원래 인원(나간 학생 제외)+1회 이동 온 인원'.
 * 원래 인원을 그대로 두고 변동만 붙인다 — 14명 반에 1명 오면 '14+1명', 1명 빠지면 '14-1명', 1명 빠지고 2명 오면 '14-1+2명'.
 * 전체 시간표(주차 무관)는 원래 명단 그대로. */
function countLabel(c, awayOf, temps){
  var out = Object.keys(awayOf || {}).length, inn = (temps || []).length;
  return c.students.length + (out ? '-' + out : '') + (inn ? '+' + inn : '') + '명';   // 나간 것 먼저, 온 것 나중
}
/* 반 블록 요소 (내용·클릭 공통) — 위치는 호출한 쪽에서 지정 */
function blockEl(c, forList){
  var b = document.createElement('div');
  var todayDrop = (mode==='today' && moving && moving.once) ? 'droppable ' : '';
  b.className = 'blk ' + (mode==='today' ? todayDrop : 'droppable ') + colorOf(c.cls) + (classMoving && classMoving.id===c.id ? ' moving-src' : '');
  b.setAttribute('data-cid', c.id);
  var awayOf = {};   // 이 반에서 1회 이동으로 빠진 학생 → {label, row}
  var temps = [];    // 이 반으로 1회 이동해 온 학생
  // 오늘 보기는 '오늘 적용되는' 이동만 반영 (미래 예약 이동은 그 날짜에 나타남).
  // 전체 시간표는 주차와 무관한 '기본값'이므로 1회 이동을 표시하지 않음 — 1회 이동은 오늘/주차별에서만.
  if (mode === 'today'){
    onceOutThisWeek().forEach(function(o){
      if (o.fromId !== c.id) return;
      var t = classes.find(function(x){ return x.id===o.toId; });
      var md = o.ymd ? o.ymd.slice(5).replace(/^0/, '').replace('-0', '/').replace('-', '/') : '';
      awayOf[o.student.replace(/\(.*\)$/,'')] = { label: (t ? labelOf(t) : '') + (md ? ' · ' + md + ' 보충' : ''), row: o.row };
    });
    onceInToday().forEach(function(o){ if (o.toId === c.id) temps.push(o); });
  }
  // 오늘 이후에 적용될 1회 이동 예약 — 마우스를 올리면 안내가 보이도록 (표시 자체는 적용일에)
  var planOf = {};
  if (mode === 'today'){
    var wkTo = thisWeekRange().to;
    onceMoves.forEach(function(o){
      if (o.fromId !== c.id || !o.ymd || o.ymd <= wkTo) return;
      var tt = classes.find(function(x){ return x.id === o.toId; });
      var md = o.ymd.slice(5).replace(/^0/, '').replace('-0', '/').replace('-', '/');
      planOf[o.student.replace(/\(.*\)$/,'')] =
        '1회 이동 예약: ' + md + '(' + mkDayOf(o.ymd) + ') ' + (tt ? labelOf(tt) : '') + (o.reason ? ' · ' + o.reason : '');
    });
  }
  var chips = '';
  var sorted = sortNames(c.students);
  if (mode === 'today'){
    chips = sorted.map(function(nm){
      var plain = nm.replace(/\(.*\)$/,'');
      var note = nameNote(nm);
      var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
      var a = attend[attKey(c.id, nm)];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : (note ? 'note' : '');
      var tp = [];
      if (note) tp.push(note);
      // 지각은 이름 옆 글자 대신 색으로만 구분, 세부는 마우스 호버·출석 창에서 (공간 확보, 2026-08-20 사용자 확정)
      if (a && a.status==='지각') tp.push('지각' + (a.memo ? ' — ' + a.memo : ''));
      else if (a && a.memo) tp.push(a.memo);
      else if (away) tp.push('이 주 1회 이동: ' + awayOf[plain].label);
      if (planOf[plain]) tp.push(planOf[plain]);
      return '<button data-att-cid="'+esc(c.id)+'" data-nm="'+esc(nm)+'" class="'+cls2+(away?' away':'')+(planOf[plain]?' plan-once':'')+'"'+
             (away ? ' data-away-row="'+awayOf[plain].row+'"' : '')+
             (tp.length ? ' title="'+esc(tp.join(' · '))+'"' : '')+'>'+
             esc(plain)+(away?'<em>1회↗</em>':(planOf[plain]?'<em style="color:#8AA0C8;">예약↗</em>':''))+'</button>';
    }).join('');
    chips += temps.sort(function(a,b){ return a.student.localeCompare(b.student,'ko'); }).map(function(o){
      var a = attend[attKey(c.id, o.student)];
      var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : 'once';
      return '<button data-att-cid="'+esc(c.id)+'" data-nm="'+esc(o.student)+'" data-once-row="'+o.row+'" class="'+cls2+'" title="1회 이동 · 사유: '+esc(o.reason)+((a&&a.status==='지각')?' / 지각'+(a.memo?' — '+esc(a.memo):''):((a&&a.memo)?' / '+esc(a.memo):''))+'">'+esc(o.student)+' · 1회</button>';
    }).join('');
    chips += keptAttendNames(c, sorted, temps).map(function(nm){
      return keptChip(c, nm, attend[attKey(c.id, nm)]);
    }).join('');
  } else {
    chips = sorted.map(function(nm){
      var plain = nm.replace(/\(.*\)$/,'');
      var note = nameNote(nm);
      var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
      var tp = [];
      if (note) tp.push(note);
      if (away) tp.push('이번 주 1회 이동: ' + awayOf[plain].label);
      var cls2 = (away ? 'away' : '') + (note ? (away ? ' ' : '') + 'note' : '');
      return '<button data-cid="'+esc(c.id)+'" data-nm="'+esc(nm)+'"'+
             (cls2 ? ' class="'+cls2+'"' : '')+
             (tp.length ? ' title="'+esc(tp.join(' · '))+'"' : '')+'>'+
             esc(plain)+(away?'<em>1회↗</em>':'')+'</button>';
    }).join('');
    chips += temps.map(function(o){
      return '<button class="once" data-once-row="'+o.row+'" data-nm="'+esc(o.student)+'" title="사유: '+esc(o.reason)+' ('+esc(o.date)+') — 수정은 오늘의 시간표에서">'+esc(o.student)+' · 1회</button>';
    }).join('');
  }
  if (!chips) chips = '<span class="empty-note">비어 있음</span>';
  var btnRow = (mode === 'today')
    ? '<div class="btns"><button class="bbtn attall" title="기록 없는 학생을 모두 출석 처리">전체 출석</button>' +
      '<a class="bbtn" href="hwcheck.html?slot=' + encodeURIComponent(c.day + c.start) + '&cid=' + encodeURIComponent(c.id) + '" target="_blank" rel="noopener"' +
      ' onclick="event.stopPropagation()" title="이 반의 숙제 검사로 이동">숙제 검사</a></div>'
    : '';   // 편집 기능은 상단 편집 도구줄에서
  var cntLabel = (mode === 'today') ? countLabel(c, awayOf, temps) : (c.students.length + '명');
  var meta = esc(c.start)+'~'+esc(c.end)+
             (forList ? ' · '+esc(c.teacher)+'T'+(c.loc ? ' · '+esc(c.loc) : '') : '')+
             ' · '+cntLabel;
  b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+'</span>'+
                '<small>'+meta+'</small></div>'+
                btnRow +
                '<div class="stus">'+chips+'</div>';
  b.addEventListener('click', function(e){ onBlockClick(e, c); });
  return b;
}

/* 가로 스크롤 시 시간 라벨을 화면 왼쪽에 고정 (스크롤량만큼 이동) */
function attachTimeSync(wrap, g){
  var labs = g.querySelectorAll('.tlab');
  var apply = function(){
    var t = wrap.scrollLeft ? 'translateX(' + wrap.scrollLeft + 'px)' : '';
    for (var i = 0; i < labs.length; i++) labs[i].style.transform = t;
  };
  wrap.addEventListener('scroll', apply, { passive: true });
  apply();
}

/* 렌더 후 블록이 잘리지 않도록 30분 행 높이를 일괄 상향(균일 간격 유지) */
function tuneRowHeight(g, headerAuto, nrows){
  requestAnimationFrame(function(){
    var maxPer = 46;
    g.querySelectorAll('.blk').forEach(function(b){
      var gr = String(b.style.gridRow).split('/');
      var span = Math.max(1, (parseInt(gr[1], 10) - parseInt(gr[0], 10)) || 1);
      var per = Math.ceil((b.scrollHeight + 2 - (span - 1) * 3) / span);
      if (per > maxPer) maxPer = per;
    });
    maxPer = Math.min(maxPer, 140);
    if (maxPer > 46) g.style.gridTemplateRows = (headerAuto ? headerAuto + ' ' : '') + 'repeat(' + nrows + ', ' + maxPer + 'px)';
    var sw = g.closest ? g.closest('.scrollwrap') : null;
    if (sw && pendingScroll){ sw.scrollTop = pendingScroll.top; sw.scrollLeft = pendingScroll.left; pendingScroll = null; }
    applySearchHits();
    applyMultiSel();
  });
}
function addCell(g, ci, r, dname, cinfo, lo, rowOffset){
  var cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.gridColumn = String(ci);
  cell.style.gridRow = String(r + rowOffset);
  cell.addEventListener('click', function(){
    if (classMoving) dropClass(dname, cinfo, lo + r*30);
  });
  g.appendChild(cell);
}

/* 요일별·오늘 보기: 담당T × 시간 그리드 */
function buildDayGrid(list){
  var dname = list.length ? list[0].day : todayDay();
  var cols = [], seen = {};
  classes.forEach(function(c){
    var key = c.loc + '|' + c.teacher;
    if (!seen[key]){ seen[key] = true; cols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
  });
  cols.sort(function(a,b){
    var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  if (!cols.length) cols = TEACHER_ORDER.slice(0,4).map(function(t){ return { key:'|'+t, loc:'', teacher:t }; });
  var colIdx = {}; cols.forEach(function(c,i){ colIdx[c.key] = i; });

  // 행: 그 날 가장 이른 수업 시작 시각부터 표시(빈 앞줄 제거 — 2026-08-21 사용자 확정).
  // 수업이 없으면 기존 고정 축(평일 2:00~10:00, 주말 10:00~9:00), 끝은 마지막 수업까지 자동 확장.
  var weekend = (dname === '토' || dname === '일');
  var lo, hi = weekend ? 21*60 : 22*60;
  if (list.length){
    lo = Infinity;
    list.forEach(function(c){
      lo = Math.min(lo, mins(c.start));
      hi = Math.max(hi, minsEnd(c));
    });
  } else {
    lo = weekend ? 10*60 : 14*60;
  }
  lo = Math.floor(lo/30)*30; hi = Math.ceil(hi/30)*30;
  var nrows = Math.max(1, Math.round((hi - lo) / 30));

  // 좁은 화면(모바일)은 열 최소폭을 확보해 가로 스크롤, 넓은 화면은 전체 폭에 맞춤
  var narrow = window.innerWidth < 760;
  var colDefs = '42px repeat(' + cols.length + ', ' + (narrow ? 'minmax(96px, 1fr)' : 'minmax(0, 1fr)') + ')';

  // 고정 헤더(담당T·위치) — 세로 스크롤 시 상단 고정
  var hg = document.createElement('div');
  hg.className = 'grid fitgrid';
  hg.style.gridTemplateColumns = colDefs;
  hg.style.gridTemplateRows = 'auto';
  var corner = document.createElement('div'); corner.className='thead'; hg.appendChild(corner);
  cols.forEach(function(c){
    var h = document.createElement('div');
    h.className = 'thead';
    h.innerHTML = '<b>' + esc(c.teacher) + '</b>' + esc(c.loc);
    hg.appendChild(h);
  });

  var g = document.createElement('div');
  g.className = 'grid fitgrid';
  g.style.gridTemplateColumns = colDefs;
  g.style.gridTemplateRows = 'repeat(' + nrows + ', 46px)';   // 30분 = 46px 균일 간격
  for (var r = 0; r < nrows; r++){
    var lab = document.createElement('div');
    lab.className = 'tlab stick';
    lab.textContent = fmtT(lo + r*30);
    lab.style.gridColumn = '1 / -1';
    lab.style.width = '42px';
    lab.style.gridRow = String(r+1);
    g.appendChild(lab);
  }
  cols.forEach(function(cinfo, ci){
    for (var r = 0; r < nrows; r++) addCell(g, ci+2, r, dname, cinfo, lo, 1);
  });
  list.forEach(function(c){
    var r0 = Math.floor((mins(c.start)-lo)/30), r1 = Math.ceil((minsEnd(c)-lo)/30);
    if (r1 <= r0) r1 = r0+1;
    var b = blockEl(c);
    b.style.gridColumn = String((colIdx[c.loc+'|'+c.teacher]||0)+2);
    b.style.gridRow = (r0+1) + ' / ' + (r1+1);
    g.appendChild(b);
  });

  tuneRowHeight(g, '', nrows);
  var wrap = document.createElement('div');
  wrap.className = 'scrollwrap';
  var sh2 = document.createElement('div');
  sh2.className = 'stickhead';
  sh2.appendChild(hg);
  wrap.appendChild(sh2);
  wrap.appendChild(g);
  attachTimeSync(wrap, g);
  return wrap;
}

/* 모바일 목록 보기(오늘의 시간표) — 그리드 대신 수업을 카드로.
 * 구역(정리정독→화정센터→민트초코→본원) 순서로 묶고, 구역 안에서는 시간순 (2026-08-20 사용자 확정).
 * 진행 중 수업은 테두리 강조, 끝난 수업은 흐리게. 카드 자체는 blockEl 재사용이라
 * 출석 체크·1회 이동·특이사항 등 모든 기능이 그리드와 동일하게 동작한다. */
var LOC_ORDER = ['정리정독', '화정센터', '민트초코', '본원'];
function narrowScreen(){ return window.innerWidth < 760; }
function useListView(){ return narrowScreen() && (localStorage.getItem('tt_mview') || 'list') === 'list'; }
function mviewToggleBtn(){
  var useList = useListView();
  var tg = document.createElement('button');
  tg.className = 'mview-toggle';
  tg.textContent = useList ? '표로 보기' : '목록으로 보기';
  tg.onclick = function(){ localStorage.setItem('tt_mview', useList ? 'grid' : 'list'); keepScroll = false; render(); };
  return tg;
}
/* 구역(정리정독→화정센터→민트초코→본원)별로 묶고 구역 안에서 시간순 정렬한 카드 목록 */
function locGroupList(list, makeCard){
  var box = document.createElement('div');
  box.className = 'daylist';
  var ord = function(t){ var i = TEACHER_ORDER.indexOf(t); return i < 0 ? 99 : i; };
  var lord = function(l){ var i = LOC_ORDER.indexOf(l); return i < 0 ? 99 : i; };
  var sorted = list.slice().sort(function(a,b){
    return (lord(a.loc)-lord(b.loc)) || (mins(a.start)-mins(b.start)) || (ord(a.teacher)-ord(b.teacher));
  });
  var lastLoc = null;
  sorted.forEach(function(c){
    if (c.loc !== lastLoc){
      lastLoc = c.loc;
      var h = document.createElement('div');
      h.className = 'dl-time';
      h.textContent = c.loc || '기타';
      box.appendChild(h);
    }
    box.appendChild(makeCard(c));
  });
  requestAnimationFrame(function(){ applySearchHits(); applyMultiSel(); });
  return box;
}
function buildDayList(list){
  var now = new Date();
  var nowM = now.getHours()*60 + now.getMinutes();
  return locGroupList(list, function(c){
    var b = blockEl(c, true);
    if (nowM >= mins(c.start) && nowM < minsEnd(c)) b.classList.add('dl-now');
    else if (minsEnd(c) <= nowM) b.classList.add('dl-past');
    return b;
  });
}

/* 주차별 반 카드 — 그리드·목록 공용 (그 날짜의 출석·1회 이동·보존 기록 칩 포함) */
function weekBlockEl(c, dstr, forList){
  var b = document.createElement('div');
  b.className = 'blk ' + colorOf(c.cls);
  b.setAttribute('data-cid', c.id);
  var awayOf = {}, temps = [];
  weekOnce.forEach(function(o){
    if (o.fromId === c.id){ var t = classes.find(function(x){ return x.id===o.toId; }); awayOf[o.student.replace(/\(.*\)$/,'')] = { label: t ? labelOf(t) : '', row: o.row }; }
    if (o.toId === c.id) temps.push(o);
  });
  var chips = sortNames(c.students).map(function(nm){
    var plain = nm.replace(/\(.*\)$/,'');
    var note = nameNote(nm);
    var away = Object.prototype.hasOwnProperty.call(awayOf, plain);
    var a = weekAttend[wkAttKey(dstr, c.id, nm)];
    var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : (note ? 'note' : '');
    var tp = [];
    if (note) tp.push(note);
    if (a && a.status==='지각') tp.push('지각' + (a.memo ? ' — ' + a.memo : ''));
    else if (a && a.memo) tp.push(a.memo);
    else if (away) tp.push('이 주 1회 이동: ' + awayOf[plain].label);
    return '<button data-nm="'+esc(nm)+'" class="'+cls2+(away?' away':'')+'"'+
           (away ? ' data-away-row="'+awayOf[plain].row+'"' : '')+
           (tp.length ? ' title="'+esc(tp.join(' · '))+'"' : '')+'>'+
           esc(plain)+(away?'<em>1회↗</em>':'')+'</button>';
  }).join('');
  chips += temps.sort(function(a,b){ return a.student.localeCompare(b.student,'ko'); }).map(function(o){
    var a = weekAttend[wkAttKey(dstr, c.id, o.student)];
    var cls2 = a ? (a.status==='출석'?'at-ok':a.status==='지각'?'at-late':'at-abs') : 'once';
    return '<button data-nm="'+esc(o.student)+'" data-once-row="'+o.row+'" class="'+cls2+'" title="1회 이동 · 사유: '+esc(o.reason)+((a&&a.status==='지각')?' / 지각'+(a.memo?' — '+esc(a.memo):''):((a&&a.memo)?' / '+esc(a.memo):''))+'">'+esc(o.student)+' · 1회</button>';
  }).join('');
  chips += keptAttendNames(c, c.students, temps, dstr).map(function(nm){
    return keptChip(c, nm, weekAttend[wkAttKey(dstr, c.id, nm)]);
  }).join('');
  if (!chips) chips = '<span class="empty-note">비어 있음</span>';
  var meta = esc(c.start)+'~'+esc(c.end)+
             (forList ? ' · '+esc(c.teacher)+'T'+(c.loc ? ' · '+esc(c.loc) : '') : '')+
             ' · '+countLabel(c, awayOf, temps);
  b.innerHTML = '<div class="bt"><span class="nm">'+esc(c.cls)+'</span>'+
                '<small>'+meta+'</small></div>'+
                '<div class="stus">'+chips+'</div>';
  b.addEventListener('click', function(e){ onWeekClick(e, c, dstr); });
  return b;
}

/* 전체 보기: 월~일이 가로축 — 모든 요일에 전체 담당T 열(본원 포함)을 항상 표시 */
function buildFullGrid(){
  var baseCols = [], seenB = {};
  classes.forEach(function(c){
    var key = c.loc + '|' + c.teacher;
    if (!seenB[key]){ seenB[key] = true; baseCols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
  });
  baseCols.sort(function(a,b){
    var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
    return (ia<0?99:ia) - (ib<0?99:ib);
  });
  if (!baseCols.length) baseCols = [{ key:'-', loc:'', teacher:'' }];
  var dayCols = {};
  DAYS.forEach(function(dname){
    if (dname === '월' || dname === '화'){
      var cols = [], seen = {};
      classes.forEach(function(c){
        if (c.day !== dname) return;
        var key = c.loc + '|' + c.teacher;
        if (!seen[key]){ seen[key] = true; cols.push({ key:key, loc:c.loc, teacher:c.teacher }); }
      });
      cols.sort(function(a,b){
        var ia = TEACHER_ORDER.indexOf(a.teacher), ib = TEACHER_ORDER.indexOf(b.teacher);
        return (ia<0?99:ia) - (ib<0?99:ib);
      });
      dayCols[dname] = cols.length ? cols : [{ key:'-', loc:'', teacher:'' }];
    } else {
      dayCols[dname] = baseCols;
    }
  });

  // 통합 시간축: 10:00 ~ 10:00(22시), 수업이 벗어나면 확장
  var lo = 10*60, hi = 22*60;
  classes.forEach(function(c){
    lo = Math.min(lo, mins(c.start));
    hi = Math.max(hi, minsEnd(c));
  });
  lo = Math.floor(lo/30)*30; hi = Math.ceil(hi/30)*30;
  var nrows = Math.round((hi - lo) / 30);

  // 그리드 컬럼: 시간축 + [요일별 열들 + 구분선]
  var colDefs = ['46px'], colMeta = [];   // colMeta[i] = {day, cinfo} (1-based 제외한 데이터열)
  DAYS.forEach(function(dname, di){
    dayCols[dname].forEach(function(cinfo){
      colDefs.push('minmax(96px, 1fr)');
      colMeta.push({ day: dname, cinfo: cinfo });
    });
    if (di < DAYS.length-1){ colDefs.push('7px'); colMeta.push(null); }   // 요일 구분 공백
  });

  // 고정 헤더 그리드 (요일 + 담당T)
  var hg = document.createElement('div');
  hg.className = 'grid fullgrid';
  hg.style.gridTemplateColumns = colDefs.join(' ');
  hg.style.gridTemplateRows = 'auto auto';
  var corner = document.createElement('div'); corner.style.gridRow='1 / 3'; hg.appendChild(corner);
  var colPos = 2;
  DAYS.forEach(function(dname, di){
    var n = dayCols[dname].length;
    var dh = document.createElement('div');
    dh.className = 'dhead';
    dh.textContent = dname;
    dh.style.gridColumn = colPos + ' / ' + (colPos + n);
    dh.style.gridRow = '1';
    hg.appendChild(dh);
    dayCols[dname].forEach(function(cinfo, i){
      var h = document.createElement('div');
      h.className = 'thead';
      h.innerHTML = cinfo.teacher ? '<b>' + esc(cinfo.teacher) + '</b>' + esc(cinfo.loc) : '<b>—</b>';
      h.style.gridColumn = String(colPos + i);
      h.style.gridRow = '2';
      hg.appendChild(h);
    });
    colPos += n + (di < DAYS.length-1 ? 1 : 0);
  });

  // 본문 그리드 (시간축 + 수업)
  var g = document.createElement('div');
  g.className = 'grid fullgrid';
  g.style.gridTemplateColumns = colDefs.join(' ');
  g.style.gridTemplateRows = 'repeat(' + nrows + ', 46px)';
  for (var r = 0; r < nrows; r++){
    var lab = document.createElement('div');
    lab.className = 'tlab stick';
    lab.textContent = fmtT(lo + r*30);
    lab.style.gridColumn = '1 / -1';
    lab.style.gridRow = String(r+1);
    g.appendChild(lab);
  }
  var gcol = 2;
  var colOfKey = {};   // day|loc|teacher → grid column
  DAYS.forEach(function(dname, di){
    dayCols[dname].forEach(function(cinfo){
      colOfKey[dname + '|' + cinfo.key] = gcol;
      for (var r = 0; r < nrows; r++) addCell(g, gcol, r, dname, cinfo, lo, 1);
      gcol++;
    });
    if (di < DAYS.length-1) gcol++;
  });
  classes.forEach(function(c){
    var col = colOfKey[c.day + '|' + c.loc + '|' + c.teacher];
    if (!col) return;
    var r0 = Math.floor((mins(c.start)-lo)/30), r1 = Math.ceil((minsEnd(c)-lo)/30);
    if (r1 <= r0) r1 = r0+1;
    var b = blockEl(c);
    b.style.gridColumn = String(col);
    b.style.gridRow = (r0+1) + ' / ' + (r1+1);
    g.appendChild(b);
  });

  tuneRowHeight(g, '', nrows);
  var wrap = document.createElement('div');
  wrap.className = 'scrollwrap';
  var sh2 = document.createElement('div');
  sh2.className = 'stickhead';
  sh2.appendChild(hg);
  wrap.appendChild(sh2);
  wrap.appendChild(g);
  attachTimeSync(wrap, g);
  return wrap;
}

/* ── 전체 시간표: 한 페이지 개요 ↔ 요일 확대 (2026-08-22 사용자 요청 — 주차별과 같은 방식, 가로 스크롤 없음)
 * 개요: 월~일 7열, 요일마다 센터 순 반 요약 카드(시간·담당T·인원). 카드/요일 머리글 클릭 = 그 요일 확대.

/* 주차별 보기: 그 주의 날짜·출석·1회 이동이 반영된 주간 그리드 */
/* ── 주차별 보기: 한 페이지 개요 ↔ 요일 확대 (2026-08-21 사용자 확정 시안) ──
 * 개요: 월~일 7열, 요일마다 센터(본원→화정센터→민초센터→정리정독) 순으로 묶은 반 요약 카드
 *       (시간·인원·출석 요약 숫자). 요일 머리글/카드를 누르면 그 요일 확대.
 * 확대: 그 요일이 센터 섹션으로 펼쳐지고(학생 칩·출석 기록 그대로), 나머지 요일은 옆에 가는 열.
 *       확대된 요일 머리글을 다시 누르면 개요로 복귀. */
var weekZoomDay = null;   // null = 개요, '금' = 그 요일 확대
var WK_LOC_ORDER = ['본원', '화정센터', '민트초코', '정리정독'];
function wkLocLabel(l){ return l === '민트초코' ? '민초센터' : (l || '기타'); }
function wkLocRank(l){ var i = WK_LOC_ORDER.indexOf(l); return i < 0 ? 99 : i; }
function wkDayClasses(dname){
  return classes.filter(function(c){ return c.day === dname; })
    .sort(function(a,b){ return (wkLocRank(a.loc)-wkLocRank(b.loc)) || (mins(a.start)-mins(b.start)) || a.cls.localeCompare(b.cls,'ko'); });
}
/* 그 날짜·반의 출석 요약 (보존 기록 포함 — weekAttend 키 순회) */
function wkAttSummary(cid, dstr){
  var cnt = { '출석':0, '지각':0, '결석':0 }, any = false;
  var pre = dstr + '|' + cid + '|';
  Object.keys(weekAttend).forEach(function(k){
    if (k.indexOf(pre) !== 0) return;
    var st = weekAttend[k].status;
    if (cnt[st] != null){ cnt[st]++; any = true; }
  });
  return { cnt: cnt, any: any };
}

function buildWeekZoom(dname){

                   '<small>— 누르면 주간 개요로 돌아가요</small>';

      }
      sec.appendChild(weekBlockEl(c, dstr, true));

  });
  requestAnimationFrame(function(){ applySearchHits(); });

function onWeekClick(e, c, dstr){
  if (editMode && !moving && !classMoving){ applyEdit(c); return; }
  if (moving && moving.once){
    // 주차별 1회 이동: 옮겨 갈 반을 누르면 그 반 요일의 날짜로 기록
    var selChip = e.target.closest('button[data-nm]');
    if (selChip && selChip.classList.contains('sel')){ cancelMove(); return; }
    if (c.id === moving.fromId) return;
    openOnceModal(c);
    return;
  }
  var chip = e.target.closest('button[data-nm]');
  if (!chip) return;
  var nm = chip.getAttribute('data-nm');
  if (chip.hasAttribute('data-once-row')){ openOnceManage(c, nm, parseInt(chip.getAttribute('data-once-row'),10), 'in', dstr); return; }
  if (chip.hasAttribute('data-away-row')){ openOnceManage(c, nm, parseInt(chip.getAttribute('data-away-row'),10), 'out', dstr); return; }
  openAttend(c, nm, dstr);
}

function post(body, busyMsg, done){

/* ── 학생 검색 ── */
function plainName(nm){ return String(nm || '').replace(/\(.*\)$/, ''); }
/* 이름 뒤 괄호 특이사항(신입 시작일·입테 등) — "김현우(8/23부터)" → "8/23부터" */
function nameNote(nm){ var m = String(nm || '').match(/\((.+)\)\s*$/); return m ? m[1] : ''; }
function searchStudent(){
  var q = $('stu-q').value.trim();
  var box = $('searchResults');
  if (!q){ box.innerHTML = ''; applySearchHits(); return; }
  var out = [];
  classes.forEach(function(c){
    c.students.forEach(function(nm){
      if (plainName(nm).indexOf(q) >= 0) out.push({ c: c, nm: nm });
    });
  });
  out.sort(function(a, b){ return plainName(a.nm).localeCompare(plainName(b.nm), 'ko') || (DAY_IDX[a.c.day] - DAY_IDX[b.c.day]); });
  // 검색된 학생의 출석 이력 바로가기 (겹치는 이름은 최대 3명까지)
  var uniq = [];
  out.forEach(function(h){ var nm = plainName(h.nm); if (uniq.indexOf(nm) < 0) uniq.push(nm); });
  var hist = uniq.slice(0, 3).map(function(nm){
    return '<button class="ahist" onclick="openAttHistory(\'' + esc(nm) + '\')">' + esc(nm) + ' 출석 이력</button>';
  }).join('');
  box.innerHTML = out.length
    ? hist + out.slice(0, 12).map(function(h){
        return '<button onclick="gotoSearchHit(\'' + esc(h.c.id) + '\')"><b>' + esc(plainName(h.nm)) + '</b> ' +
               esc(h.c.cls) + ' · ' + esc(h.c.day) + esc(h.c.start) + ' ' + esc(h.c.teacher) + 'T</button>';
      }).join('') + (out.length > 12 ? '<span>외 ' + (out.length - 12) + '건</span>' : '')
    : '<span>검색 결과가 없어요.</span>';
  applySearchHits();
}
function applySearchHits(){
  var q = $('stu-q') ? $('stu-q').value.trim() : '';
  document.querySelectorAll('.stus button.search-hit').forEach(function(b){ b.classList.remove('search-hit'); });
  document.querySelectorAll('.blk.search-blk').forEach(function(b){ b.classList.remove('search-blk'); });
  if (!q) return;
  document.querySelectorAll('.stus button[data-nm]').forEach(function(b){
    if (plainName(b.getAttribute('data-nm')).indexOf(q) >= 0){
      b.classList.add('search-hit');
      var blk = b.closest('.blk');
      if (blk) blk.classList.add('search-blk');
    }
  });
}
function gotoSearchHit(cid){
  var el = document.querySelector('.blk[data-cid="' + cid + '"]');
  if (!el && mode === 'today'){
    setMode('all');
    requestAnimationFrame(function(){ requestAnimationFrame(function(){ gotoSearchHit(cid); }); });
    return;
  }
  // 전체 개요 보기엔 반 블록이 없음 — 그 반의 요일을 확대한 뒤 다시 찾기
  if (!el && mode === 'all' && !useListView() && allView() !== 'grid'){
    var c = classes.find(function(x){ return x.id === cid; });
    if (c && allZoomDay !== c.day){
      allZoomDay = c.day;
      keepScroll = false;
      render();
      requestAnimationFrame(function(){ requestAnimationFrame(function(){ gotoSearchHit(cid); }); });
      return;
    }
  }
  if (!el) return;
  el.scrollIntoView({ block: 'center', inline: 'center', behavior: 'smooth' });
}

/* ── 학생 출석 이력 — 학생 한 명의 출석·지각·결석·1회 이동·영상보충을 주차별로 한눈에 (2026-08-22 사용자 요청)
 * 데이터: timetableWeek(정규+내신, 기간 조회) + attendAbsentList(결석 건의 영상보충 처리 상태) — 백엔드 변경 없음 */
var ahName = '', ahWeeks = 8, ahSeq = 0;
function openAttHistory(nm){
  ahName = plainName(nm || (($('stu-q') && $('stu-q').value) || '')).trim();
  ahShell();
  if (ahName) ahLoad();
}
function ahAllNames(){
  var names = {};
  classes.forEach(function(c){ c.students.forEach(function(s){ names[plainName(s)] = 1; }); });
  var other = cacheGet('list:' + (book === '정규' ? '내신' : '정규'));
  ((other && other.classes) || []).forEach(function(c){ (c.students || []).forEach(function(s){ names[plainName(s)] = 1; }); });
  return Object.keys(names).sort(function(a, b){ return a.localeCompare(b, 'ko'); });
}
function ahShell(){
  openModal(
    '<h3>학생 출석 이력</h3>' +
    '<p class="mdesc">학생 한 명의 출석·지각·결석·1회 이동·영상보충 기록을 주차별로 모아 봐요 (정규+내신 시간표 모두).</p>' +
    '<div style="display:flex;gap:7px;flex-wrap:wrap;align-items:center;">' +
    '<input id="ah-name" list="ah-names" placeholder="학생 이름" value="' + esc(ahName) + '"' +
    ' style="flex:1;min-width:110px;font:inherit;border:1.5px solid var(--line);border-radius:9px;padding:8px 11px;">' +
    '<datalist id="ah-names">' + ahAllNames().map(function(n){ return '<option value="' + esc(n) + '">'; }).join('') + '</datalist>' +
    [4, 8, 12].map(function(w){
      return '<button type="button" class="ah-wk' + (w === ahWeeks ? ' on' : '') + '" onclick="ahSetWeeks(' + w + ')">' + w + '주</button>';
    }).join('') +
    '<button type="button" class="ah-go" onclick="ahGo()">조회</button></div>' +
    '<div id="ah-body"></div>' +
    '<div class="mbtns"><button onclick="closeModal()">닫기</button></div>',
    true);
  var inp = $('ah-name');
  if (inp){
    inp.addEventListener('keydown', function(e){ if (e.key === 'Enter') ahGo(); });
    if (!ahName) inp.focus();
  }
}
function ahSetWeeks(w){
  ahWeeks = w;
  if ($('ah-name')) ahName = plainName($('ah-name').value).trim();
  ahShell();
  if (ahName) ahLoad();
}
function ahGo(){
  ahName = plainName($('ah-name').value).trim();
  if (!ahName){ $('ah-body').innerHTML = '<p class="exs-none">학생 이름을 넣어주세요.</p>'; return; }
  ahLoad();
}
function ahFetch(url){ return fetch(url).then(function(r){ return r.json(); }).catch(function(){ return null; }); }
function ahLoad(){
  var body = $('ah-body');
  if (!body) return;
  body.innerHTML = '<p class="exs-none">' + esc(ahName) + ' 학생의 기록을 불러오는 중…</p>';
  var from = new Date(weekStart); from.setDate(from.getDate() - 2 - (ahWeeks - 1) * 7);   // 옛 주차의 월요일
  var to = new Date(weekStart); to.setDate(to.getDate() + 11);                            // 다음주 일요일 (예약 이동 포함)
  var f = ymdOf(from), t = ymdOf(to);
  var qs = '&pw=' + encodeURIComponent(pw) + '&t=' + Date.now();
  var other = (book === '정규') ? '내신' : '정규';
  var needOther = !cacheGet('list:' + other);
  var seq = ++ahSeq;
  // 1차: 전용 액션 attendStudent — 서버가 그 학생 것만 걸러 줘서 왕복 1번·작은 응답 (지연 최소화, 2026-08-22).
  // 백엔드가 아직 구버전이면 실패하므로 기존 4회 조회로 폴백.
  Promise.all([
    ahFetch(ENDPOINT + '?action=attendStudent&name=' + encodeURIComponent(ahName) + '&from=' + f + '&to=' + t + qs),
    needOther ? ahFetch(ENDPOINT + '?action=timetableList&book=' + encodeURIComponent(other) + qs) : Promise.resolve(null)
  ]).then(function(rs){
    if (seq !== ahSeq || !$('ah-body')) return;   // 다른 조회가 시작됨
    if (rs[1] && rs[1].result === 'success') cacheSet('list:' + other, { classes: rs[1].classes || [], onceMoves: rs[1].onceMoves || [] });
    var d = rs[0];
    if (d && d.result === 'success'){
      var recs = [];
      (d.attend || []).forEach(function(a){
        recs.push({ kind: 'att', date: a.date, bk: a.book, cid: a.classId, status: a.status, memo: a.memo,
                    mk: a.status === '결석' ? { plan: a.plan, done: a.done, mkMemo: a.mkMemo } : null });
      });
      (d.once || []).forEach(function(o){
        recs.push({ kind: 'once', date: o.date, bk: o.book, fromId: o.fromId, toId: o.toId, reason: o.reason });
      });
      ahShow(recs, f, t, false);
      return;
    }
    ahLoadLegacy(f, t, qs, seq);
  });
}
/* 폴백 — 구버전 백엔드용 기존 4회 조회 (timetableWeek 정규+내신, attendAbsentList 정규+내신) */
function ahLoadLegacy(f, t, qs, seq){
  var body = $('ah-body');
  if (body) body.innerHTML = '<p class="exs-none">' + esc(ahName) + ' 학생의 기록을 불러오는 중… (몇 초 걸릴 수 있어요)</p>';
  Promise.all([
    ahFetch(ENDPOINT + '?action=timetableWeek&book=' + encodeURIComponent('정규') + '&from=' + f + '&to=' + t + qs),
    ahFetch(ENDPOINT + '?action=timetableWeek&book=' + encodeURIComponent('내신') + '&from=' + f + '&to=' + t + qs),
    ahFetch(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent('정규') + qs),
    ahFetch(ENDPOINT + '?action=attendAbsentList&book=' + encodeURIComponent('내신') + qs)
  ]).then(function(rs){
    if (seq !== ahSeq || !$('ah-body')) return;
    ahRender(rs, f, t);
  });
}
function ahClassInfo(bk, cid){
  var list = (bk === book) ? classes : ((cacheGet('list:' + bk) || {}).classes || []);
  var c = null;
  (list || []).forEach(function(x){ if (x.id === cid) c = x; });
  if (!c) return { label: cid, time: '' };
  return { label: c.cls + ' · ' + c.teacher + 'T', time: c.day + ' ' + c.start + '~' + c.end };
}
function ahMkBadge(x){
  if (!x) return '<span class="ah-badge a-mk todo">보충 미정</span>';
  var plan = String(x.plan || '').trim();
  if (!plan) return '<span class="ah-badge a-mk todo">보충 미정</span>';
  if (plan.indexOf('영상보충') === 0){
    var rest = plan.slice(4).replace(/^[\s:·-]+/, '');
    return '<span class="ah-badge a-mk' + (x.done ? ' done' : '') + '">영상보충 ' + (x.done ? '완료' : '예정') +
           (rest ? ' · ' + esc(rest) : '') + '</span>';
  }
  return '<span class="ah-badge a-mk">' + esc(plan) + ' 처리</span>';
}
function ahRender(rs, f, t){
  var nm = ahName;
  var recs = [], mk = {};
  [[rs[2], '정규'], [rs[3], '내신']].forEach(function(pr){
    if (!pr[0] || pr[0].result !== 'success') return;
    (pr[0].list || []).forEach(function(x){
      if (plainName(x.student) !== nm) return;
      mk[pr[1] + '|' + x.date + '|' + x.classId] = x;
    });
  });
  var loadFail = false;
  [[rs[0], '정규'], [rs[1], '내신']].forEach(function(pr){
    if (!pr[0] || pr[0].result !== 'success'){ loadFail = true; return; }
    (pr[0].attend || []).forEach(function(a){
      if (plainName(a.student) !== nm) return;
      recs.push({ kind: 'att', date: a.date, bk: pr[1], cid: a.classId, status: a.status, memo: a.memo,
                  mk: a.status === '결석' ? mk[pr[1] + '|' + a.date + '|' + a.classId] : null });
    });
    (pr[0].onceMoves || []).forEach(function(o){
      if (plainName(o.student) !== nm) return;
      recs.push({ kind: 'once', date: o.date, bk: pr[1], fromId: o.fromId, toId: o.toId, reason: o.reason });
    });
  });
  ahShow(recs, f, t, loadFail);
}
/* 이력 그리기 — 전용 액션·폴백 조회가 공통으로 사용 */
function ahShow(recs, f, t, loadFail){
  var nm = ahName;
  var body = $('ah-body');
  if (!body) return;
  if (loadFail && !recs.length){
    body.innerHTML = '<p class="exs-none">기록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>';
    return;
  }
  if (!recs.length){
    // 이름이 정확히 일치하는 기록이 없으면 비슷한 이름을 제안
    var cand = ahAllNames().filter(function(n){ return n.indexOf(nm) >= 0 && n !== nm; });
    body.innerHTML = '<p class="exs-none">' + esc(nm) + ' 학생의 최근 ' + ahWeeks + '주 기록이 없어요.</p>' +
      (cand.length ? '<div style="display:flex;gap:6px;flex-wrap:wrap;">' + cand.slice(0, 6).map(function(n){
        return '<button type="button" class="ah-wk" onclick="openAttHistory(\'' + esc(n) + '\')">' + esc(n) + '</button>';
      }).join('') + '</div>' : '');
    return;
  }
  var cnt = { '출석': 0, '지각': 0, '결석': 0, once: 0, mkDone: 0 };
  recs.forEach(function(r){
    if (r.kind === 'once'){ cnt.once++; return; }
    if (cnt[r.status] != null) cnt[r.status]++;
    if (r.status === '결석' && r.mk && r.mk.done) cnt.mkDone++;
  });
  var h = '<div class="ah-sum">' +
    '<span>출석 ' + cnt['출석'] + '</span><span>지각 ' + cnt['지각'] + '</span>' +
    '<span>결석 ' + cnt['결석'] + (cnt['결석'] ? ' (보충 완료 ' + cnt.mkDone + ')' : '') + '</span>' +
    '<span>1회 이동 ' + cnt.once + '</span></div>';
  // 주차별 묶음 (수요일 시작, 최근 주차부터)
  var weeks = {};
  recs.forEach(function(r){
    var d = new Date(+r.date.slice(0, 4), +r.date.slice(5, 7) - 1, +r.date.slice(8, 10));
    var wk = ymdOf(weekStartOf(d));
    (weeks[wk] = weeks[wk] || []).push(r);
  });
  Object.keys(weeks).sort().reverse().forEach(function(wk){
    var wed = new Date(+wk.slice(0, 4), +wk.slice(5, 7) - 1, +wk.slice(8, 10));
    var mon = new Date(wed); mon.setDate(mon.getDate() - 2);
    var sun = new Date(wed); sun.setDate(sun.getDate() + 4);
    h += '<p class="ah-week-h">' + mdOf(mon) + '(월) ~ ' + mdOf(sun) + '(일)' +
      '<small>' + ((periods[wk] || '정규') === '내신' ? '내신 기간' : '정규 기간') + '</small></p>';
    weeks[wk].sort(function(a, b){ return a.date.localeCompare(b.date); }).forEach(function(r){
      var dt = exsMd(r.date);
      if (r.kind === 'once'){
        var fi = ahClassInfo(r.bk, r.fromId), ti = ahClassInfo(r.bk, r.toId);
        h += '<div class="ah-row"><span class="ah-date">' + dt + '</span>' +
          '<span class="ah-badge a-move">1회 이동</span>' +
          '<span class="ah-cls">' + esc(fi.label) + ' → ' + esc(ti.label) + ' (' + esc(ti.time || '') + ')</span>' +
          (r.reason ? '<span class="ah-note">사유: ' + esc(r.reason) + '</span>' : '') + '</div>';
        return;
      }
      var ci = ahClassInfo(r.bk, r.cid);
      var stCls = r.status === '출석' ? 'a-att' : (r.status === '지각' ? 'a-late' : 'a-abs');
      h += '<div class="ah-row"><span class="ah-date">' + dt + '</span>' +
        '<span class="ah-badge ' + stCls + '">' + esc(r.status) + '</span>' +
        '<span class="ah-cls">' + esc(ci.time) + ' · ' + esc(ci.label) + (r.bk === '내신' ? ' (내신)' : '') + '</span>' +
        (r.status === '결석' ? ahMkBadge(r.mk) : '') +
        (r.memo ? '<span class="ah-note">' + esc(r.memo) + '</span>' : '') +
        (r.mk && r.mk.mkMemo ? '<span class="ah-note">보충메모: ' + esc(r.mk.mkMemo) + '</span>' : '') + '</div>';
    });
  });
  h += '<p class="exs-none" style="margin-top:8px;">조회 기간: ' + exsMd(f) + ' ~ ' + exsMd(t) + ' (다음주 예약 이동 포함)</p>';
  body.innerHTML = h;
}

/* ── 출석 비성실 경고 대상자 확인 — 기간 내 지각·결석·1회 이동을 학생별로 모아 잦은 순 랭킹 (2026-08-22 사용자 요청)
 * 데이터: 전용 액션 attendWarnList(정규+내신 서버 집계, 왕복 1번) — 구버전 백엔드면 timetableWeek 2회로 폴백 */
var awWeeks = 4, awSort = 'total', awSeq = 0, awData = null;
function openAttWarn(){

function awShell(){
  openModal(

function awMarkWeeks(w){

function awSetWeeks(w){

  var to = new Date(weekStart); to.setDate(to.getDate() + 4);                       // 이번 주 일요일
  $('aw-from').value = ymdOf(from);

function awSetSort(s){

function awLoad(){
  var body = $('aw-body');
  if (!body) return;
  var f = $('aw-from').value, t = $('aw-to').value;
  if (!f || !t){ body.innerHTML = '<p class="exs-none">기간을 골라주세요.</p>'; return; }
  if (f > t){ var tmp = f; f = t; t = tmp; $('aw-from').value = f; $('aw-to').value = t; }
  body.innerHTML = '<p class="exs-none">기간 내 기록을 모으는 중…</p>';
  var qs = '&pw=' + encodeURIComponent(pw) + '&t=' + Date.now();
  var seq = ++awSeq;
  // 1차: 전용 액션 attendWarnList — 서버가 학생별로 집계해 줘서 왕복 1번·작은 응답.
  // 백엔드가 아직 구버전이면 실패하므로 timetableWeek 2회(정규+내신)로 폴백.
  ahFetch(ENDPOINT + '?action=attendWarnList&from=' + f + '&to=' + t + qs).then(function(d){
    if (seq !== awSeq || !$('aw-body')) return;   // 다른 조회가 시작됨
    if (d && d.result === 'success'){
      awData = { from: f, to: t, list: d.list || [], hasMk: true };
      awShow();
      return;
    }
    awLoadLegacy(f, t, qs, seq);
  });
}
/* 폴백 — 구버전 백엔드용 timetableWeek 2회 조회 후 화면에서 집계 (영상보충 처리 상태는 없음) */
function awLoadLegacy(f, t, qs, seq){
  var body = $('aw-body');
  if (body) body.innerHTML = '<p class="exs-none">기간 내 기록을 모으는 중… (몇 초 걸릴 수 있어요)</p>';
  Promise.all([
    ahFetch(ENDPOINT + '?action=timetableWeek&book=' + encodeURIComponent('정규') + '&from=' + f + '&to=' + t + qs),
    ahFetch(ENDPOINT + '?action=timetableWeek&book=' + encodeURIComponent('내신') + '&from=' + f + '&to=' + t + qs)
  ]).then(function(rs){
    if (seq !== awSeq || !$('aw-body')) return;
    if ((!rs[0] || rs[0].result !== 'success') && (!rs[1] || rs[1].result !== 'success')){
      $('aw-body').innerHTML = '<p class="exs-none">기록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.</p>';
      return;
    }
    var agg = {};
    function of(nm){ return agg[nm] || (agg[nm] = { name: nm, att: 0, late: 0, abs: 0, absDone: 0, move: 0, items: [] }); }
    [[rs[0], '정규'], [rs[1], '내신']].forEach(function(pr){
      if (!pr[0] || pr[0].result !== 'success') return;
      (pr[0].attend || []).forEach(function(a){
        var nm = plainName(a.student).trim();
        if (!nm) return;
        var s = of(nm);
        if (a.status === '출석'){ s.att++; return; }
        if (a.status !== '지각' && a.status !== '결석') return;
        if (a.status === '지각') s.late++; else s.abs++;
        s.items.push({ date: a.date, kind: a.status, book: pr[1], classId: a.classId, memo: a.memo });
      });
      (pr[0].onceMoves || []).forEach(function(o){
        var nm = plainName(o.student).trim();
        if (!nm) return;
        var s = of(nm);
        s.move++;
        s.items.push({ date: o.date, kind: '이동', book: pr[1], fromId: o.fromId, toId: o.toId, reason: o.reason });
      });
    });
    var list = [];
    for (var k in agg) if (agg[k].late + agg[k].abs + agg[k].move > 0) list.push(agg[k]);
    awData = { from: f, to: t, list: list, hasMk: false };
    awShow();
  });
}
function awToggle(i){
  var det = $('aw-det-' + i);
  if (det) det.hidden = !det.hidden;
}
function awShow(){
  var body = $('aw-body');
  if (!body || !awData) return;
  var list = awData.list.slice();
  if (!list.length){
    body.innerHTML = '<p class="exs-none">' + exsMd(awData.from) + ' ~ ' + exsMd(awData.to) + ' 사이 지각·결석·1회 이동 기록이 없어요.</p>';
    return;
  }
  function total(s){ return s.late + s.abs + s.move; }
  function key(s){ return awSort === 'total' ? total(s) : s[awSort]; }
  list.sort(function(a, b){
    return key(b) - key(a) || total(b) - total(a) || b.abs - a.abs || b.late - a.late ||
           a.name.localeCompare(b.name, 'ko');
  });
  if (awSort !== 'total') list = list.filter(function(s){ return key(s) > 0; });
  if (!list.length){
    body.innerHTML = '<p class="exs-none">이 기간엔 해당 기록이 없어요.</p>';
    return;
  }
  var h = '<p class="exs-none" style="margin:10px 0 2px;">' + exsMd(awData.from) + ' ~ ' + exsMd(awData.to) +
    ' · 대상 ' + list.length + '명 (지각·결석·1회 이동이 1건 이상인 학생만)</p>';
  list.forEach(function(s, i){
    var tot = total(s);
    h += '<div class="aw-item"><div class="aw-row' + (tot >= 3 ? ' hot' : '') + '" onclick="awToggle(' + i + ')">' +
      '<span class="aw-rank">' + (i + 1) + '</span><b>' + esc(s.name) + '</b>' +
      '<span class="ah-badge a-late' + (s.late ? '' : ' zero') + '">지각 ' + s.late + '</span>' +
      '<span class="ah-badge a-abs' + (s.abs ? '' : ' zero') + '">결석 ' + s.abs +
        (awData.hasMk && s.abs ? ' (보충 완료 ' + s.absDone + ')' : '') + '</span>' +
      '<span class="ah-badge a-move' + (s.move ? '' : ' zero') + '">이동 ' + s.move + '</span>' +
      '<span class="aw-att">출석 ' + s.att + '</span>' +
      '<span class="aw-total">합 ' + tot + '</span></div>' +
      '<div class="aw-det" id="aw-det-' + i + '" hidden>' +
      s.items.slice().sort(function(a, b){ return a.date.localeCompare(b.date); }).map(function(r){
        if (r.kind === '이동'){
          var fi = ahClassInfo(r.book, r.fromId), ti = ahClassInfo(r.book, r.toId);
          return '<div class="ah-row"><span class="ah-date">' + exsMd(r.date) + '</span>' +
            '<span class="ah-badge a-move">1회 이동</span>' +
            '<span class="ah-cls">' + esc(fi.label) + ' → ' + esc(ti.label) + '</span>' +
            (r.reason ? '<span class="ah-note">사유: ' + esc(r.reason) + '</span>' : '') + '</div>';
        }
        var ci = ahClassInfo(r.book, r.classId);
        return '<div class="ah-row"><span class="ah-date">' + exsMd(r.date) + '</span>' +
          '<span class="ah-badge ' + (r.kind === '지각' ? 'a-late' : 'a-abs') + '">' + esc(r.kind) + '</span>' +
          '<span class="ah-cls">' + esc(ci.label) + (r.book === '내신' ? ' (내신)' : '') + '</span>' +
          (r.kind === '결석' && awData.hasMk ? ahMkBadge(r) : '') +
          (r.memo ? '<span class="ah-note">' + esc(r.memo) + '</span>' : '') +
          (r.mkMemo ? '<span class="ah-note">보충메모: ' + esc(r.mkMemo) + '</span>' : '') + '</div>';
      }).join('') +
      '<div style="margin:4px 0 2px;"><button type="button" class="ah-wk" onclick="openAttHistory(\'' + esc(s.name) + '\')">' +
      esc(s.name) + ' 출석 이력 자세히</button></div></div></div>';
  });
  body.innerHTML = h;
}

/* ── 이달의 신입생 — 전체 시간표 하단 카드 (2026-08-22 사용자 요청)
 * superstar 신입 등록의 등록일 기준, 기존 newStudents 액션 재사용 (백엔드 변경 없음) */
var nsCache = {}, nsLoading = {}, nsMonth = '';
function nsMonthNow(){ var d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); }
function newStuSection(){
  if (!nsMonth) nsMonth = nsMonthNow();
  var card = document.createElement('div');
  card.className = 'ns-card';
  card.id = 'ns-card';
  nsRender(card);
  return card;
}
function nsMove(n){
  var p = nsMonth.split('-'), d = new Date(+p[0], +p[1] - 1 + n, 1);
  nsMonth = d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0');
  var card = $('ns-card');
  if (card) nsRender(card);
}
function nsSlotsTT(st){
  var parts = [];
  if (st.classA) parts.push('가 ' + st.classA);
  if (st.classB) parts.push('나 ' + st.classB);
  if (st.progress && st.progress !== st.classA) parts.push('진도 ' + st.progress);
  if (st.checkup && st.checkup !== st.classB) parts.push('확인 ' + st.checkup);
  return parts.length ? parts.join(' · ') : '시간표 미배정';
}
function nsRender(card){
  var m = nsMonth;
  var list = nsCache[m];
  var h = '<div class="ns-head"><b>' + (+m.slice(5)) + '월 신입생</b>' +
    '<span class="ns-cnt">' + (list && list.length ? list.length + '명' : '') + '</span><span class="sp"></span>' +
    '<button type="button" class="ah-wk" onclick="nsMove(-1)">◀ 지난달</button>' +
    '<button type="button" class="ah-wk" onclick="nsMove(1)">다음달 ▶</button></div>';
  if (!list){
    card.innerHTML = h + '<p class="ns-empty">' + (list === null
      ? '목록을 불러오지 못했어요. <button type="button" class="ah-wk" onclick="nsRetry()">다시 시도</button>'
      : '불러오는 중…') + '</p>';
    if (list !== null) nsLoad(m);
    return;
  }
  if (!list.length){
    card.innerHTML = h + '<p class="ns-empty">' + (+m.slice(5)) + '월에 등록한 신입생이 없어요.</p>' +
      '<p class="ns-note">등록일 기록은 2026-08-19부터예요 — 그 전에 등록한 학생은 표시되지 않아요.</p>';
    return;
  }
  h += list.map(function(st){
    return '<div class="ns-row"><b>' + esc(st.name) + '</b>' +
      '<span class="ns-meta">' + esc([st.school, st.grade].filter(Boolean).join(' ')) +
      (st.teacher ? ' · ' + esc(st.teacher) + 'T' : '') + '</span>' +
      '<span class="ns-slot">' + esc(nsSlotsTT(st)) + '</span>' +
      '<span class="ns-date">' + (+st.date.slice(5, 7)) + '/' + (+st.date.slice(8, 10)) + ' 등록</span></div>';
  }).join('');
  card.innerHTML = h + '<p class="ns-note">신입 등록·수정은 슈퍼스타 관리의 신입 등록에서 해요 (등록일 기록은 2026-08-19부터).</p>';
}
function nsRetry(){
  delete nsCache[nsMonth];
  var card = $('ns-card');
  if (card) nsRender(card);
}
function nsLoad(m){
  if (nsLoading[m]) return;
  nsLoading[m] = true;
  fetch(ENDPOINT + '?action=newStudents&pw=' + encodeURIComponent(pw) + '&month=' + m + '&t=' + Date.now())
    .then(function(r){ return r.json(); }).catch(function(){ return null; })
    .then(function(d){
      nsLoading[m] = false;
      nsCache[m] = (d && d.result === 'success') ? (d.students || []) : null;   // null = 실패 표시
      var card = $('ns-card');
      if (card && nsMonth === m) nsRender(card);
    });
}

/* ── 모달 ── */
function openModal(html, wide){
  $('modal-box').innerHTML = html;
  $('modal-box').classList.toggle('wide', !!wide);
  $('modal').classList.add('on');
}
function closeModal(){ $('modal').classList.remove('on'); }
$('modal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
$('stu-q').addEventListener('input', searchStudent);

/* ── 이동 ── */
function labelOf(c){ return c.cls + ' (' + c.day + c.start + ' ' + c.teacher + 'T)'; }
function onBlockClick(e, c){
  if (mode === 'today'){
    var aa = e.target.closest('.attall');
    if (aa){ bulkAttend(c); return; }
    if (multiMode){
      var mchip = e.target.closest('button[data-att-cid]');
      if (mchip) toggleSelOne(mchip.getAttribute('data-att-cid'), mchip.getAttribute('data-nm'));
      else toggleSelClass(c);
      return;
    }
    var chip0 = e.target.closest('button[data-nm]');
    if (moving && moving.once){
      // 1회 이동 대상 반 선택 중
      if (chip0 && chip0.classList.contains('sel')){ cancelMove(); return; }
      if (c.id === moving.fromId) return;
      openOnceModal(c);
      return;
    }
    if (!chip0) return;
    var nm0 = chip0.getAttribute('data-nm');
    if (chip0.hasAttribute('data-once-row')){ openOnceManage(c, nm0, parseInt(chip0.getAttribute('data-once-row'),10), 'in'); return; }
    if (chip0.hasAttribute('data-away-row')){ openOnceManage(c, nm0, parseInt(chip0.getAttribute('data-away-row'),10), 'out'); return; }
    openAttend(c, nm0);
    return;
  }
  if (editMode && !moving && !classMoving){ applyEdit(c); return; }
  var onceChip = e.target.closest('button[data-once-row]');
  if (onceChip && !moving){
    setStatus('1회 이동 학생이에요. 사유 확인·수정·취소는 오늘의 시간표에서 이름을 눌러 해주세요.', 'err');
    return;
  }
  var chip = e.target.closest('button[data-nm]');
  if (chip && !moving){
    moving = { name: chip.getAttribute('data-nm'), fromId: chip.getAttribute('data-cid'), fromLabel: labelOf(c) };
    document.body.classList.add('moving');
    $('movebar').classList.add('on');
    $('mv-name').textContent = plainName(moving.name);
    $('mv-from').textContent = moving.fromLabel + ' 에서';
    chip.classList.add('sel');
    setStatus('아래 목록에서 옮길 반을 고르거나, 시간표에서 반을 직접 누르세요.');
    openMovePicker(c);
    return;
  }
  if (chip && moving && chip.classList.contains('sel')){ cancelMove(); return; }
  if (!moving) return;
  if (c.id === moving.fromId) return;
  openMoveModal(c);
}
function cancelMove(){
  var wasClass = !!classMoving;
  var wasOnce = !!(moving && moving.once);
  moving = null; classMoving = null;
  $('mv-remove').style.display = '';
  $('mv-note').style.display = '';
  document.body.classList.remove('moving');
  document.body.classList.remove('classmoving');
  $('movebar').classList.remove('on');
  document.querySelectorAll('.stus button.sel').forEach(function(b){ b.classList.remove('sel'); });
  setStatus('');
  if (wasClass && allAutoGrid){ sessionStorage.setItem('tt_allview', 'ov'); allAutoGrid = false; }   // 반 이동 끝 → 개요 복귀
  if (wasClass || wasOnce) render();
}

/* ── 반 통째 이동 ── */
function startClassMove(c){
  classMoving = { id: c.id };
  // 빈 자리 클릭엔 시간 그리드가 필요 — 개요 보기였으면 자동 전환, 끝나면(cancelMove) 개요로 복귀
  if (mode === 'all' && !useListView() && allView() !== 'grid'){
    sessionStorage.setItem('tt_allview', 'grid');
    allAutoGrid = true;
  }
  document.body.classList.add('classmoving');
  $('movebar').classList.add('on');
  $('mv-name').textContent = c.cls;
  $('mv-from').textContent = '(' + c.day + c.start + ' ' + c.teacher + 'T) — 반 통째 이동: 옮길 빈 자리를 누르세요';
  render();
  setStatus('빈 자리를 누르면 그 요일·시간·담당으로 반 전체가 이동해요. 다른 요일은 전체 보기에서 그 요일의 빈 자리를 누르면 됩니다.');
}
function dropClass(dname, cinfo, startMin){
  var cm = classMoving; if (!cm) return;
  var c = classes.find(function(x){ return x.id===cm.id; });
  if (!c) { cancelMove(); return; }
  var dur = Math.max(30, minsEnd(c) - mins(c.start));
  var s = startMin, e2 = startMin + dur;
  // 겹침 확인 (같은 요일·같은 열)
  var clash = classes.find(function(x){
    return x.id !== c.id && x.day === dname && x.loc === cinfo.loc && x.teacher === cinfo.teacher &&
           mins(x.start) < e2 && s < minsEnd(x);
  });
  if (clash){ setStatus('그 자리엔 이미 ' + clash.cls + ' 수업이 있어요. 다른 빈 자리를 눌러주세요.', 'err'); return; }
  var startStr = fmt12(s), endStr = fmt12(e2);
  var newTeacher = cinfo.teacher || c.teacher, newLoc = cinfo.loc || c.loc;   // 빈 열(월·화 등)이면 담당·위치 유지
  if (!confirm(c.cls + ' (' + c.students.length + '명)\n' + c.day + ' ' + c.start + '~' + c.end + ' · ' + c.teacher + 'T\n→ ' + dname + ' ' + startStr + '~' + endStr + ' · ' + newTeacher + 'T (' + newLoc + ')\n\n반 전체를 이동할까요?' + (book==='정규' ? '\n(학생들 리포트의 정규 수업 시간도 함께 바뀝니다)' : ''))) return;
  post({ action:'timetableMoveClass', book:book, classId:c.id, day:dname, start:startStr, end:endStr,
         teacher:newTeacher, loc:newLoc }, '반을 이동하는 중…', function(res){
    if (res && res.result === 'success'){
      cancelMove();
      var extra = (book==='정규') ? ' 학생 ' + (res.rosterUpdated||0) + '명 리포트 반영' + (res.rosterSkipped && res.rosterSkipped.length ? ' (미반영: ' + res.rosterSkipped.join(', ') + ')' : '') : '';
      setStatus('반 이동 완료.' + extra, 'ok');
      load(true);
    } else { setStatus('반 이동 실패: ' + ((res && res.message) || '오류'), 'err'); }
  });
}

/* ── 복수 선택 출석 ── */
function toggleMulti(){

}
function updateMultiCnt(){

function toggleSelOne(cid, nm){
  var key = cid + '|' + nm;
  if (multiSel[key]) delete multiSel[key]; else multiSel[key] = { cid: cid, nm: nm };
  updateMultiCnt(); applyMultiSel();
}
function toggleSelClass(c){
  var away = {}, temps = [];
  onceOutThisWeek().forEach(function(o){ if (o.fromId === c.id) away[o.student.replace(/\(.*\)$/, '')] = true; });
  onceInToday().forEach(function(o){ if (o.toId === c.id) temps.push(o.student); });
  var names = c.students.filter(function(nm){ return !away[nm.replace(/\(.*\)$/, '')]; }).concat(temps);
  var allSel = names.every(function(nm){ return multiSel[c.id + '|' + nm]; });
  names.forEach(function(nm){
    var key = c.id + '|' + nm;
    if (allSel) delete multiSel[key]; else multiSel[key] = { cid: c.id, nm: nm };
  });
  updateMultiCnt(); applyMultiSel();
}
function multiApply(status){
  if (!multiMode){ setStatus('먼저 [복수 선택]을 켜고 학생을 선택해 주세요.', 'err'); return; }
  var sel = Object.keys(multiSel).map(function(k){ return multiSel[k]; });
  if (!sel.length){ setStatus('선택된 학생이 없어요.', 'err'); return; }
  var byClass = {};
  sel.forEach(function(s){ (byClass[s.cid] = byClass[s.cid] || []).push(s.nm); });
  var cids = Object.keys(byClass);
  var label = status === '' ? '기록 지우기' : status;
  if (!confirm(sel.length + '명을 일괄 ' + label + ' 처리할까요?')) return;
  var done = 0, total = 0;
  var next = function(i){
    if (i >= cids.length){
      multiSel = {}; updateMultiCnt();
      render();
      setStatus(total + '명 ' + label + ' 완료.', 'ok');
      return;
    }
    var cid = cids[i];
    post({ action:'attendSetBulk', book:book, date:todayStr(), classId:cid, students:byClass[cid],
           status:status, overwrite:'1' }, label + ' 처리 중… (' + (i+1) + '/' + cids.length + ')', function(res){
      if (res && res.result === 'success'){
        if (status === ''){
          byClass[cid].forEach(function(nm){ delete attend[attKey(cid, nm)]; });
          total += res.cleared || 0;
        } else {
          (res.marked || []).forEach(function(nm){ attend[attKey(cid, nm)] = { status: status, memo: '' }; });
          total += (res.marked || []).length;
        }
      }
      next(i + 1);
    });
  };
  next(0);
}

/* ── 출석 체크 ── */
/* 반 일괄 출석 — 오늘 이 반에서 수업하는 학생(1회 이동 온 학생 포함, 나간 학생 제외) 중
 * 아직 기록이 없는 학생을 모두 '출석'으로. 지각·결석 등 기존 기록은 유지. */
function bulkAttend(c){
  var away = {}, temps = [];
  onceOutThisWeek().forEach(function(o){ if (o.fromId === c.id) away[o.student.replace(/\(.*\)$/, '')] = true; });
  onceInToday().forEach(function(o){ if (o.toId === c.id) temps.push(o.student); });
  var targets = c.students.filter(function(nm){ return !away[nm.replace(/\(.*\)$/, '')]; }).concat(temps);
  targets = targets.filter(function(nm){ return !attend[attKey(c.id, nm)]; });
  if (!targets.length){ setStatus(c.cls + ' — 모든 학생이 이미 기록되어 있어요.', 'ok'); return; }
  if (!confirm(labelOf(c) + '\n기록 없는 학생 ' + targets.length + '명을 모두 출석 처리할까요?\n(지각·결석 등 기존 기록은 그대로 둡니다)')) return;
  post({ action:'attendSetBulk', book:book, date:todayStr(), classId:c.id, students:targets },
    '일괄 출석 처리 중…', function(res){
      if (res && res.result === 'success'){
        (res.marked || []).forEach(function(nm){ attend[attKey(c.id, nm)] = { status:'출석', memo:'' }; });
        render();
        setStatus(c.cls + ' — ' + (res.marked || []).length + '명 출석 처리 완료.' +
                  (res.skipped ? ' (기존 기록 ' + res.skipped + '명 유지)' : ''), 'ok');
      } else setStatus('일괄 처리 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}
/* 이 학생의 '앞으로 적용될' 1회 이동 예약 문구 — 없으면 '' */
function futureOncePlan(cid, nm){
  var tdy = todayStr(), plain = String(nm||'').replace(/\(.*\)$/,'');
  var found = '';
  onceMoves.concat(weekOnce || []).forEach(function(o){
    if (found || o.fromId !== cid || !o.ymd || o.ymd <= tdy) return;
    if (String(o.student||'').replace(/\(.*\)$/,'') !== plain) return;
    var tt = classes.find(function(x){ return x.id === o.toId; });
    var md = o.ymd.slice(5).replace(/^0/, '').replace('-0', '/').replace('-', '/');
    found = md + '(' + mkDayOf(o.ymd) + ') ' + (tt ? labelOf(tt) : '') + (o.reason ? ' · ' + o.reason : '');
  });
  return found;
}

    '</div>'+

function submitAttend(cid, nm, status){
  var memo = ($('att-memo') ? $('att-memo').value : '').trim();
  if (status === '지각' && !memo){ $('att-err').textContent = '지각은 메모를 적어주세요. (미리 연락 여부, 몇 분 지각 등)'; return; }
  var d = attDate || todayStr();
  closeModal();
  post({ action:'attendSet', book:book, date:d, classId:cid, student:nm, status:status, memo:memo },
    '기록하는 중…', function(res){
      if (res && res.result === 'success'){
        if (mode === 'week'){
          var wkey = wkAttKey(d, cid, nm);
          if (status) weekAttend[wkey] = { status: status, memo: memo }; else delete weekAttend[wkey];
        }

        }
        render();
        setStatus(plainName(nm) + (status ? ' — ' + status + ' 기록 완료.' : ' 기록을 지웠어요.') + (d !== todayStr() ? ' (' + d + ')' : ''), 'ok');
      } else setStatus('기록 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}

/* 반 종류 그룹: 고1 가 / 고1 나 / 고3파이널 / 정리정독 중N / 논술 */
function classGroupKey(cls){
  var c = String(cls || '').trim();
  var m = c.match(/^(고[123])\s*(가|나)$/);
  if (m) return m[1] + ' ' + m[2];
  if (/^고3\s*파이널/.test(c)) return '고3파이널';
  m = c.match(/^정리정독\s*중(\d)/);
  if (m) return '정리정독 중' + m[1];
  if (/^논술/.test(c)) return '논술';
  return c;
}
var DAY_IDX = { '월':0, '화':1, '수':2, '목':3, '금':4, '토':5, '일':6 };
/* 학생 클릭 시: 같은 종류 반 목록에서 바로 골라 이동 */
function openMovePicker(fromC){
  var m = moving; if (!m) return;
  var g = classGroupKey(fromC.cls);
  var cands = classes.filter(function(x){ return x.id !== fromC.id && classGroupKey(x.cls) === g; })
    .sort(function(a, b){ return (DAY_IDX[a.day] - DAY_IDX[b.day]) || (mins(a.start) - mins(b.start)); });
  openModal(
    '<h3>학생 이동 — ' + esc(plainName(m.name)) + '</h3>'+
    '<p class="mdesc">' + esc(m.fromLabel) + ' 에서 이동. 같은 종류(<b>' + esc(g) + '</b>) 반:</p>'+
    (cands.length
      ? '<div class="pick-list" style="flex-direction:column;align-items:stretch;">'+
        cands.map(function(x){
          return '<button data-mv-to="' + esc(x.id) + '" style="text-align:left;border-radius:10px;padding:8px 12px;">'+
            '<b>' + esc(x.cls) + '</b> · ' + esc(x.day) + esc(x.start) + '~' + esc(x.end) +
            ' · ' + esc(x.teacher) + 'T (' + esc(x.loc) + ') · ' + x.students.length + '명</button>';
        }).join('') + '</div>'
      : '<p class="subnote">같은 종류의 다른 반이 없어요.</p>')+
    '<p class="subnote">다른 종류의 반으로 옮기려면 아래 버튼으로 창을 닫고, 시간표에서 옮길 반을 직접 누르세요.</p>'+
    '<div class="mbtns"><button onclick="cancelMove(); closeModal();">이동 취소</button>'+
    '<button onclick="closeModal(); openNoteEdit(\''+esc(m.name)+'\')">특이사항</button>'+
    '<button onclick="closeModal()">시간표에서 직접 선택</button></div>'
  );
  $('modal-box').querySelectorAll('button[data-mv-to]').forEach(function(b){
    b.addEventListener('click', function(){
      var t = classes.find(function(x){ return x.id === b.getAttribute('data-mv-to'); });
      if (t) openMoveModal(t);
    });
  });
}

/* 반에 학생 추가 */
function openAdd(c){
  openModal(
    '<h3>반에 학생 추가</h3>'+
    '<p class="mdesc">'+esc(labelOf(c))+'</p>'+

    '<div class="pick-list" id="add-list"></div>'+

  );

        }).join('')

/* 반 추가 */
function openAddClass(){
  // 시작: 오전 10:00 ~ 밤 9:30 / 끝: 오전 10:30 ~ 밤 10:00
  // ("10:00" 끝은 밤 10시 — 끝이 시작보다 이르면 오후로 해석(minsEnd)하므로 정상 표시·저장)
  var startOpts = [], endOpts = [];
  for (var t = 10*60; t <= 21*60+30; t += 30) startOpts.push(fmt12(t));
  for (var t2 = 10*60+30; t2 <= 22*60; t2 += 30) endOpts.push(fmt12(t2));
  var timeSel = function(id, def, opts){
    return '<select id="'+id+'" style="font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:6px;">'+
      opts.map(function(o){ return '<option'+(o===def?' selected':'')+'>'+o+'</option>'; }).join('')+'</select>';
  };
  var locs = [];
  classes.forEach(function(c){ if (c.loc && locs.indexOf(c.loc) < 0) locs.push(c.loc); });
  if (!locs.length) locs = ['본원','민트초코','화정센터','정리정독'];
  openModal(
    '<h3>반 추가 — '+esc(book)+' 시간표</h3>'+
    '<div style="display:flex;gap:8px;"><div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">요일</label>'+
    '<select id="nc-day" style="font:inherit;font-size:.92rem;border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;width:100%;margin-top:6px;">'+
    DAYS.map(function(d){ return '<option>'+d+'</option>'; }).join('')+'</select></div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">시작</label>'+timeSel('nc-start','5:30',startOpts)+'</div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">끝</label>'+timeSel('nc-end','7:00',endOpts)+'</div></div>'+
    '<div style="display:flex;gap:8px;margin-top:8px;"><div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">위치</label>'+
    '<input type="text" id="nc-loc" list="nc-locs" placeholder="예) 본원"><datalist id="nc-locs">'+
    locs.map(function(l){ return '<option>'+esc(l)+'</option>'; }).join('')+'</datalist></div>'+
    '<div style="flex:1;"><label style="font-size:.8rem;color:var(--ink-soft);">담당T</label>'+
    '<input type="text" id="nc-teacher" list="nc-ts" placeholder="예) 주혜"><datalist id="nc-ts">'+
    TEACHER_ORDER.map(function(t){ return '<option>'+t+'</option>'; }).join('')+'</datalist></div></div>'+
    '<label style="font-size:.8rem;color:var(--ink-soft);display:block;margin-top:8px;">반이름</label>'+
    '<input type="text" id="nc-cls" placeholder="예) 고1 가 · 정리정독 중2 · 내신 화정고">'+
    '<p class="subnote">반이름이 \'가/나\'로 끝나면 학생 이동 시 리포트의 정규 가/나 칸에 연결돼요.</p>'+
    '<p class="merr" id="nc-err"></p>'+
    '<div class="mbtns"><button onclick="closeModal()">취소</button>'+
    '<button class="primary" onclick="submitAddClass()">만들기</button></div>'
  );
}
function submitAddClass(){
  var d = $('nc-day').value, st = $('nc-start').value, en = $('nc-end').value;
  var loc = $('nc-loc').value.trim(), teacher = $('nc-teacher').value.trim(), cls = $('nc-cls').value.trim();
  if (!cls){ $('nc-err').textContent = '반이름을 입력해 주세요.'; return; }
  // 표시 로직(minsEnd)과 같은 규칙: 끝이 시작보다 이르면 오후로 해석 — 저녁 8:30~10:00(밤) 허용
  var st0 = mins(st), en0 = mins(en);
  if (en0 <= st0) en0 += 12*60;
  if (en0 > 22*60){ $('nc-err').textContent = '끝 시간이 시작보다 빨라요. (수업은 밤 10시까지)'; return; }
  closeModal();
  post({ action:'timetableAddClass', book:book, day:d, start:st, end:en, loc:loc, teacher:teacher, cls:cls },
    '반을 만드는 중…', function(res){
      if (res && res.result === 'success'){ setStatus(cls + ' 반을 만들었어요. 이제 학생을 추가해 주세요.', 'ok'); load(true); }
      else setStatus('반 추가 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}

/* ── 결석자 영상보충 관리 ── */
var makeupList = [];
function classLabelOf(cid){
  var c = classes.find(function(x){ return x.id === cid; });
  return c ? (c.cls + ' (' + c.day + c.start + ' ' + c.teacher + 'T)') : cid;
}
function openMakeup(){
  openModal('<h3>결석자 관리</h3>'+
    '<p class="mdesc">반이동·무단 결석·당일 결석은 처리하면 바로 완료돼요.<br>영상·대면 보충은 일정을 적으면 보충 목록으로 넘어가고, 다녀가면 출석 버튼을 눌러 완료하세요.</p>'+
    '<div id="mk-list"><p class="subnote">불러오는 중…</p></div>'+
    '<div class="mbtns"><button onclick="closeModal()">닫기</button></div>', true);
  fetch(ENDPOINT + '?action=attendAbsentList&pw=' + encodeURIComponent(pw) + '&book=' + encodeURIComponent(book) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.result !== 'success'){ $('mk-list').innerHTML = '<p class="subnote">불러오지 못했어요.</p>'; return; }
      makeupList = d.list || [];
      renderMakeup();
    })
    .catch(function(){ $('mk-list').innerHTML = '<p class="subnote">서버 연결에 실패했어요.</p>'; });
}
function mkDayOf(dateStr){
  var p = String(dateStr).split('-');
  if (p.length !== 3) return '';
  return ['일','월','화','수','목','금','토'][new Date(+p[0], +p[1]-1, +p[2]).getDay()];
}
function mkIsVideo(m){ return !m.done && String(m.plan || '').indexOf('영상보충') === 0; }
function mkIsOffline(m){ var pl = String(m.plan || ''); return !m.done && (pl.indexOf('대면보충') === 0 || pl.indexOf('오프라인 보충') === 0); }
function mkSecOf(m){ return m.done ? 2 : ((mkIsVideo(m) || mkIsOffline(m)) ? 1 : 0); }
function renderMakeup(){
  var box = $('mk-list'); if (!box) return;
  if (!makeupList.length){ box.innerHTML = '<p class="subnote">결석 기록이 없어요.</p>'; return; }
  var sorted = makeupList.slice().sort(function(a, b){ return (mkSecOf(a) - mkSecOf(b)) || (a.date < b.date ? 1 : -1); });
  var html = '', sec = -1;
  var titles = ['미완료 — 처리 방법을 고르세요', '영상·대면 보충 — 다녀가면 출석을 눌러 완료', '완료'];
  sorted.forEach(function(m){
    var s = mkSecOf(m);
    if (s !== sec){ sec = s; html += '<p class="mk-sec">' + titles[s] + '</p>'; }
    var i = makeupList.indexOf(m);
    var planLine = m.plan
      ? '<div class="mk-plan">보충: <b>' + esc(m.plan) + '</b></div>'
      : '';
    var memoLine = m.mkMemo
      ? '<div class="mk-plan">메모: ' + esc(m.mkMemo) + '</div>'
      : '';
    var btnLine;
    var delBtn = '<button style="color:#B4574E;" onclick="deleteAbsence(' + i + ')">삭제</button>';
    if (m.done){
      btnLine = '<div class="mk-row">' +
        '<button onclick="openMkMemo(' + i + ')">메모</button>' +
        '<button onclick="saveMakeup(' + i + ', false)">미완료로</button>' + delBtn + '</div>';
    } else if (s === 1){
      var isOff = mkIsOffline(m);
      btnLine = '<div class="mk-row">' +
        '<button onclick="openMkMemo(' + i + ')">메모</button>' +
        '<button onclick="' + (isOff ? 'openMakeupOffline' : 'openMakeupVideo') + '(' + i + ')">일정 수정</button>' + delBtn +
        '<button class="done-btn" onclick="saveMakeup(' + i + ', true)">' + (isOff ? '보충 출석' : '영상보충 출석') + '</button></div>';
    } else {
      btnLine = '<div class="mk-row">' +
        '<button onclick="openMakeupMove(' + i + ')">이동</button>' +
        '<button onclick="openMakeupVideo(' + i + ')">영상보충</button>' +
        '<button onclick="openMakeupOffline(' + i + ')">대면보충</button>' +
        '<button onclick="noRemedy(' + i + ', \'무단 결석\')">무단 결석</button>' +
        '<button onclick="noRemedy(' + i + ', \'당일 결석\')">당일 결석</button>' +
        '<button onclick="openMkMemo(' + i + ')">메모</button>' + delBtn +
        '</div>' +
        (m.plan ? '<div class="mk-row" style="justify-content:flex-end;border-top:1px dotted var(--line);padding-top:6px;">' +
          '<button class="done-btn" onclick="saveMakeup(' + i + ', true)">처리 완료</button></div>' : '');
    }
    html += '<div class="mk-item' + (m.done ? ' done' : '') + '">' +
      '<div class="mk-top"><b>' + esc(plainName(m.student)) + '</b>' +
      '<small>' + esc(m.date) + ' (' + mkDayOf(m.date) + ') 결석 · ' + esc(classLabelOf(m.classId)) + (m.memo ? ' · ' + esc(m.memo) : '') + '</small></div>' +
      planLine + memoLine + btnLine +
      '</div>';
  });
  box.innerHTML = html;
}
/* 결석 기록 삭제 — 잘못 기록되거나 중복된 결석 건을 목록에서 지운다 (출석기록 행 삭제) */
function deleteAbsence(i){
  var m = makeupList[i]; if (!m) return;
  if (!confirm(plainName(m.student) + ' — ' + m.date + ' (' + mkDayOf(m.date) + ') 결석 기록을 지울까요?\n잘못 기록되거나 중복된 건만 지워주세요. 보충 일정·메모도 함께 사라져요.\n(같은 날 같은 반 중복 기록은 한 번에 한 건씩 지워져요)')) return;
  post({ action:'attendSet', book:book, date:m.date, classId:m.classId, student:m.student, status:'', memo:'' },
    '기록을 지우는 중…', function(res){
      if (res && res.result === 'success'){
        setStatus(plainName(m.student) + ' — 결석 기록을 지웠어요.', 'ok');
        openMakeup();   // 목록 새로고침 (중복이었다면 남은 건이 보여요)
      } else setStatus('삭제 실패: ' + ((res && res.message) || '오류'), 'err');
    });
}

/* 결석 건 메모 — 약속 변경·태도 등 */
function openMkMemo(i){
  var m = makeupList[i]; if (!m) return;
  openModal(
    '<h3>메모 — ' + esc(plainName(m.student)) + '</h3>'+
    '<p class="mdesc">' + esc(m.date) + ' (' + mkDayOf(m.date) + ') 결석 건 메모예요.<br>약속 시간 변경, 보충 태도 등을 적어두세요.</p>'+
    '<textarea id="mk-memo-in" placeholder="예) 8/18로 약속 변경 / 열심히 다녀감">' + esc(m.mkMemo || '') + '</textarea>'+
    '<div class="mbtns"><button onclick="openMakeup()">뒤로</button>'+
    '<button class="primary" onclick="saveMkMemo(' + i + ')">저장</button></div>', true
  );
}
function saveMkMemo(i){
  var m = makeupList[i]; if (!m) return;
  var v = $('mk-memo-in').value.trim();
  post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
         plan:m.plan || '', done:m.done ? '1' : '', mkMemo:v }, '메모 저장 중…', function(res){
    if (res && res.result === 'success'){
      m.mkMemo = v;
      setStatus(plainName(m.student) + ' — 메모를 저장했어요.', 'ok');
      openMakeup();

function saveMakeup(i, doneVal){
  var m = makeupList[i]; if (!m) return;
  var el = $('mk-plan-' + i);
  var plan = (el ? el.value : m.plan || '').trim();
  var done = (doneVal === null) ? m.done : doneVal;
  if (done && !plan){
    alert('완료 처리 전에 보충 방법(반이동·영상보충 등)을 먼저 기록해 주세요.');
    return;
  }
  post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
         plan:plan, done: done ? '1' : '', mkMemo: m.mkMemo || '' }, '저장하는 중…', function(res){
    if (res && res.result === 'success'){
      m.plan = plan; m.done = done;
      renderMakeup();
      setStatus(plainName(m.student) + ' — ' + (doneVal === null ? '보충 일정 저장'
        : (done ? (mkIsVideo({ plan:plan, done:false }) ? '영상보충 출석 — 완료 처리' : '완료 처리') : '미완료로 변경')) + ' 완료.', 'ok');
    } else setStatus('저장 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}

/* 오프라인 보충 기능창 — 날짜·요일·시간 메모 (영상보충과 동일한 흐름) */

    '<input type="text" id="mk-plan-' + i + '" placeholder="예) 8/17(월) 6:00" value="' + esc(/^(대면보충|오프라인 보충):/.test(m.plan) ? m.plan.replace(/^(대면보충|오프라인 보충):\s*/, '') : '') + '" />'+

/* 영상보충 기능창 — 날짜·요일·시간 메모 */
function openMakeupVideo(i){
  var m = makeupList[i]; if (!m) return;
  openModal(
    '<h3>영상보충 — ' + esc(plainName(m.student)) + '</h3>'+
    '<p class="mdesc">' + esc(m.date) + ' (' + mkDayOf(m.date) + ') ' + esc(classLabelOf(m.classId)) + ' 결석.<br>영상보충하러 오는 날짜·요일·시간을 적어주세요.</p>'+
    '<input type="text" id="mk-plan-' + i + '" placeholder="예) 8/17(월) 6:00" value="' + esc(m.plan.indexOf('영상보충') === 0 ? m.plan.replace(/^영상보충:\s*/, '') : '') + '" />'+
    '<p class="merr" id="mkv-err"></p>'+
    '<div class="mbtns"><button onclick="openMakeup()">뒤로</button>'+
    '<button class="primary" onclick="saveMakeupVideo(' + i + ')">저장</button></div>', true
  );
}
function saveMakeupVideo(i){
  var m = makeupList[i]; if (!m) return;
  var v = $('mk-plan-' + i).value.trim();
  if (!v){ $('mkv-err').textContent = '날짜·요일·시간을 적어주세요.'; return; }
  post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
         plan:'영상보충: ' + v, done:'', mkMemo: m.mkMemo || '' }, '저장하는 중…', function(res){
    if (res && res.result === 'success'){
      m.plan = '영상보충: ' + v;
      setStatus(plainName(m.student) + ' — 영상보충 목록으로 옮겼어요. 다녀가면 [영상보충 출석]을 눌러주세요.', 'ok');
      openMakeup();
    } else setStatus('저장 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}

/* 무단 결석·당일 통보 — 보충 없이 완료 처리 */
function noRemedy(i, type){
  var m = makeupList[i]; if (!m) return;
  if (!confirm(plainName(m.student) + ' (' + m.date + ' 결석)\n"' + type + '"로 기록하고 보충 없이 완료 처리할까요?')) return;
  var plan = type + ' (보충 없음)';
  post({ action:'attendMakeupSet', book:book, date:m.date, classId:m.classId, student:m.student,
         plan:plan, done:'1', mkMemo: m.mkMemo || '' }, '처리 중…', function(res){
    if (res && res.result === 'success'){
      m.plan = plan; m.done = true;
      renderMakeup();
      setStatus(plainName(m.student) + ' — ' + type + '로 완료 처리했어요.', 'ok');
    } else setStatus('처리 실패: ' + ((res && res.message) || '오류'), 'err');
  });
}

/* 결석 보충 — 다른 동일 시간표(같은 종류 반)로 1회 이동 */
/* 결석 날짜가 속한 수업 주차(수요일 시작, 월·화=직전보강) 기준으로 보충 갈 반(요일)의 적용 날짜.
   이미 지난 날짜면 한 주 뒤로. — 미래 결석(예: 다음주 일요일)의 보충이 이번 주로 기록되지 않게 한다. */
function mkApplyDate(absYmd, day){
  var off = { '수':0, '목':1, '금':2, '토':3, '일':4, '월':-2, '화':-1 }[day];
  if (off == null) return todayStr();
  var d = new Date(+absYmd.slice(0,4), +absYmd.slice(5,7)-1, +absYmd.slice(8,10));
  var dow = d.getDay();   // 0=일
  var wed = new Date(d);
  if (dow >= 3) wed.setDate(d.getDate() - (dow - 3));        // 수~토 → 그 주 수요일
  else if (dow === 0) wed.setDate(d.getDate() - 4);          // 일 → 지난 수요일
  else wed.setDate(d.getDate() + (3 - dow));                 // 월·화(직전보강) → 다가오는 수요일 주차
  var t = new Date(wed); t.setDate(wed.getDate() + off);
  var now = new Date(); now = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  if (t < now) t.setDate(t.getDate() + 7);
  return ymdOf(t);
}
function openMakeupMove(i){
  var m = makeupList[i]; if (!m) return;
  var fromC = classes.find(function(x){ return x.id === m.classId; });
  if (!fromC){ alert('결석했던 반을 시간표에서 찾을 수 없어요.'); return; }
  var g = classGroupKey(fromC.cls);
  var cands = classes.filter(function(x){ return x.id !== fromC.id && classGroupKey(x.cls) === g; })
    .sort(function(a, b){ return (DAY_IDX[a.day] - DAY_IDX[b.day]) || (mins(a.start) - mins(b.start)); });
  var dk = ['일','월','화','수','목','금','토'];
  function adLabelOf(ymd){
    var d = new Date(+ymd.slice(0,4), +ymd.slice(5,7)-1, +ymd.slice(8,10));
    return ymd.slice(5).replace('-', '/') + '(' + dk[d.getDay()] + ')';
  }
  openModal(
    '<h3>반 이동 보충 — ' + esc(plainName(m.student)) + '</h3>'+
    '<p class="mdesc">' + esc(m.date) + ' (' + mkDayOf(m.date) + ') ' + esc(fromC.cls) + ' 결석.<br>같은 종류(<b>' + esc(g) + '</b>) 반에서 1회 보충할 반을 고르세요. 표시된 날짜의 시간표에 보라색으로 나타나요.</p>'+
    (cands.length
      ? '<div class="pick-list" style="flex-direction:column;align-items:stretch;">'+
        cands.map(function(x){
          return '<button data-mk-to="' + esc(x.id) + '" style="text-align:left;border-radius:10px;padding:8px 12px;">'+
            '<b>' + esc(x.cls) + '</b> · ' + esc(x.day) + esc(x.start) + '~' + esc(x.end) +
            ' · ' + esc(x.teacher) + 'T (' + esc(x.loc) + ') · ' + x.students.length + '명'+
            ' · <b>' + esc(adLabelOf(mkApplyDate(m.date, x.day))) + ' 보충</b></button>';
        }).join('') + '</div>'
      : '<p class="subnote">같은 종류의 다른 반이 없어요. 영상보충 메모를 이용해 주세요.</p>')+
    '<div class="mbtns"><button onclick="openMakeup()">뒤로</button></div>', true
  );
  $('modal-box').querySelectorAll('button[data-mk-to]').forEach(function(b){
    b.addEventListener('click', function(){
      var t = classes.find(function(x){ return x.id === b.getAttribute('data-mk-to'); });
      if (!t) return;
      var ad = mkApplyDate(m.date, t.day);
      if (!confirm(plainName(m.student) + '\n' + fromC.cls + ' (' + m.date + ' 결석)\n→ ' + labelOf(t) + ' 에서 ' + adLabelOf(ad) + ' 1회 보충\n\n기록할까요?')) return;
      var reason = m.date.slice(5).replace('-', '/') + ' 결석 보충';
      post({ action:'timetableMove', book:book, student:m.student, fromId:fromC.id, toId:t.id,
             moveType:'once', reason:reason, date:ad }, '보충 이동 기록 중…', function(res){
        if (!(res && res.result === 'success')){
          setStatus('보충 이동 실패: ' + ((res && res.message) || '오류'), 'err');
          openMakeup(); return;
        }
        // 결석 완료 처리는 백엔드(mkAutoComplete_)가 이동 기록과 함께 자동으로 한다
        setStatus(plainName(m.student) + ' — ' + (res.makeupDone || ('반 이동 보충: ' + t.cls + ' ' + t.day + t.start)) + ' 기록·완료 처리했어요.', 'ok');
        load(true);        // 1회 이동을 오늘·주차별 시간표에 반영
        openMakeup();      // 목록 새로고침
      });
    });
  });
}

/* 이동 기록 */
function openLog(){
  openModal('<h3>이동 기록</h3><div class="log-list" id="log-list"><span class="subnote">불러오는 중…</span></div>'+
            '<div class="mbtns"><button onclick="closeModal()">닫기</button></div>');
  fetch(ENDPOINT + '?action=timetableLog&pw=' + encodeURIComponent(pw) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if (!d || d.result !== 'success'){ $('log-list').innerHTML = '<span class="subnote">불러오지 못했어요.</span>'; return; }
      if (!d.log.length){ $('log-list').innerHTML = '<span class="subnote">아직 기록이 없어요.</span>'; return; }
      $('log-list').innerHTML = d.log.map(function(g){
        var kcls = g.kind === '1회' ? ' once' : (g.kind === '빼기' ? ' minus' : '');
        var path = g.fromCls && g.toCls ? esc(g.fromCls)+' → '+esc(g.toCls)
                 : (g.toCls ? '→ '+esc(g.toCls) : esc(g.fromCls)+' 에서');
        return '<div class="log-item"><span class="lk'+kcls+'">'+esc(g.kind)+'</span>'+(g.book==='내신'?'<span class="lk" style="background:#8A6FA8;">내신</span>':'')+'<b>'+esc(g.student)+'</b> '+path+
               '<div class="lr">'+esc(g.date)+(g.reason ? ' · '+esc(g.reason) : '')+'</div></div>';
      }).join('');
    })
    .catch(function(){ $('log-list').innerHTML = '<span class="subnote">불러오지 못했어요.</span>'; });
}
