<div class="wrap">
  <header>
    <p class="eyebrow">SHUEGUK · 예비 고1</p>
    <h1>예비 고1 학교 분석</h1>
    <p class="lead">고등학교 1학년 국어 시험을 학교별로 정리했습니다. 내가 갈 학교를 미리 살펴보세요.</p>
    <div class="seg" id="seg">
      <button data-v="summary">전체 요약</button>
      <button data-v="school">학교별 분석</button>
      <button data-v="check">나의 점검표</button>
    </div>
  </header>
  <div id="view"></div>
</div>

<script>
var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
var QS = new URLSearchParams(location.search);
var KEY = (QS.get('key') || '').trim(), SID = (QS.get('id') || QS.get('student') || '').trim();
var ITEMS = null, LOAD_ERR = '', SORT = 'scope', QF = 'all';
var LV = ['중', '중상', '상', '최상'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function arr(x){ return Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]); }
function paras(x){ return arr(x).map(function(t){ return '<p class="para">' + esc(t) + '</p>'; }).join(''); }
function lvIdx(name){ return LV.indexOf(name); }

/* ── 데이터 ── */
function load(){
  if (!KEY && !SID){ LOAD_ERR = 'nokey'; render(); return; }
  var p = KEY ? { key: KEY } : { student: SID };
  fetch(SB_URL + '/rest/v1/rpc/pre1_list', {
    method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p: p })
  }).then(function(r){
    if (r.status === 404) throw { code: 'missing' };
    if (!r.ok) throw { code: 'net' };
    return r.json();
  }).then(function(d){
    if (!d || !d.ok){ LOAD_ERR = (d && d.error) || 'net'; ITEMS = []; }
    else ITEMS = (d.items || []).map(function(x){ var o = x.data || {}; o._key = x.key; o.school = o.school || x.school; o.exam = o.exam || x.exam; return o; });
    render();
  }).catch(function(e){ LOAD_ERR = (e && e.code) || 'net'; ITEMS = []; render(); });
}

/* 문항 표에서 센 값 — 그래프 값이 있으면 그것을 쓴다 */
function lvCounts(s){
  var c = [0, 0, 0, 0];
  if (s.levelDist && s.levelDist.length){ s.levelDist.forEach(function(x){ var i = lvIdx(x.name); if (i >= 0) c[i] = +x.n || 0; }); }
  else arr(s.questions).forEach(function(q){ var i = lvIdx(q.lv); if (i >= 0) c[i]++; });
  return c;
}
function qCount(s){ return arr(s.questions).length; }
function hardN(s){ var c = lvCounts(s); return c[2] + c[3]; }
function essayCount(s){ return arr(s.questions).filter(function(q){ return q.type && q.type !== '객관식'; }).length; }
/* 서술형 있음/없음 (2026-11-03 원장님 "서술형이 있다, 없다가 매우 확실하게") — 문항 표에 서술형(서답형)이 있거나
 * 시험 구성의 서답형 칸이 '없음'이 아니면 있음. 숫자를 못 셌으면 있음으로만 적는다. */
function essayInfo(s){
  var n = essayCount(s), t = String((s.composition && s.composition.essay) || '').trim();
  var has = n > 0 || (t !== '' && !/^없음/.test(t) && !/^0\s*문항/.test(t));
  var m = /(\d+)\s*문항/.exec(t);

}
function essayBadge(s, big){

               : '<span class="es no' + (big ? ' big' : '') + '">서술형 없음</span>';
}
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function lvBar(s){
  var c = lvCounts(s), t = c[0] + c[1] + c[2] + c[3] || 1;
  return '<div class="lvbar" title="' + LV.map(function(n, i){ return n + ' ' + c[i]; }).join(' · ') + '">' +
    c.map(function(n, i){ return n ? '<i class="l' + i + '" style="width:' + (n * 100 / t) + '%"></i>' : ''; }).join('') + '</div>';
}
function lvLegend(){
  var col = ['var(--lv0)', 'var(--lv1)', 'var(--lv2)', 'var(--lv3)'];
  return '<div class="legend">' + LV.map(function(n, i){ return '<span style="--c:' + col[i] + '">' + n + '</span>'; }).join('') + '</div>';
}
function areaText(s){ return arr(s.areaDist).map(function(a){ return a.name + ' ' + a.n; }).join(' · '); }

}

/* ── 시험 범위의 양·학교별 특징 (2026-11-03 원장님 "시험범위의 양이 한눈에 · 양이 많은 학교 · 학교별 특징") ──
 * 범위 = scopeItems(작품·지문·단원 하나가 한 항목, n이 있으면 그만큼 — '외 4편') 를 교과서·프린트·모의고사로 센다.
 * 외부(시험장에서 처음 보는 작품)는 공부할 범위가 아니라 따로 센다. scopeItems 가 없으면 범위표 줄을 ' · ' 로 나눠 어림한다.
 * 특징 칩은 문항 표의 출처(scope 글)·영역 그래프에서 센 값만 쓴다 — 지어낸 평가는 넣지 않는다. */
var KINDS = [['교과서', 'k-t'], ['프린트', 'k-p'], ['모의고사', 'k-m']];
function kindOfLabel(l){ l = String(l || ''); return /외부/.test(l) ? '외부' : /모의/.test(l) ? '모의고사' : /프린트/.test(l) ? '프린트' : /교과서/.test(l) ? '교과서' : ''; }
function scopeItems(s){
  if (arr(s.scopeItems).length) return s.scopeItems;
  var out = [];
  arr(s.scope && s.scope.rows).forEach(function(r){
    var k = kindOfLabel(r.label); if (!k) return;
    arr(r.lines).forEach(function(line){ String(line).split(' · ').forEach(function(x){ if (x.trim()) out.push({ kind: k, name: x.trim() }); }); });
  });
  return out;
}
function scopeCount(s){
  var c = { '교과서': 0, '프린트': 0, '모의고사': 0, '외부': 0 };
  scopeItems(s).forEach(function(i){ if (c[i.kind] != null) c[i.kind] += (+i.n || 1); });
  c.range = c['교과서'] + c['프린트'] + c['모의고사'];
  return c;
}
function qSrc(s, word){ return arr(s.questions).filter(function(q){ return String(q.scope || '').indexOf(word) >= 0; }).length; }
function areaN(s, re){ return arr(s.areaDist).filter(function(a){ return re.test(a.name); }).reduce(function(t, a){ return t + (+a.n || 0); }, 0); }
function features(s){
  var n = qCount(s) || 1, f = [];
  var pr = qSrc(s, '프린트'), mo = qSrc(s, '모의고사'), ex = qSrc(s, '외부');
  if (pr) f.push({ t: '프린트에서 ' + pr + '/' + n + '문항', on: pr * 2 >= n });
  if (mo) f.push({ t: '3월 모의고사 지문 ' + mo + '문항', on: true });
  if (ex) f.push({ t: '처음 보는 작품이 섞인 문항 ' + ex, on: ex * 3 >= n });
  var gr = areaN(s, /문법/); if (gr) f.push({ t: '문법 ' + gr + '문항', on: gr * 4 >= n });
  var sp = areaN(s, /화법|토론|작문/); if (sp) f.push({ t: '화법·작문 ' + sp + '문항', on: sp * 4 >= n });
  var vo = areaN(s, /어휘/); if (vo) f.push({ t: '어휘 ' + vo + '문항', on: false });
  var hp = pct(hardN(s), n); f.push({ t: '상·최상 ' + hp + '%', on: hp >= 75 });
  return f;
}
function featHtml(s){ return '<div class="feats">' + features(s).map(function(x){ return '<span class="ft' + (x.on ? ' on' : '') + '">' + esc(x.t) + '</span>'; }).join('') + '</div>'; }
function rangeBar(c, max){
  return '<div class="rbar">' + KINDS.map(function(k){ var v = c[k[0]]; return v ? '<i class="' + k[1] + '" style="width:' + (v * 100 / max) + '%" title="' + k[0] + ' ' + v + '"></i>' : ''; }).join('') + '</div>';
}
function extBar(v, max){ return '<div class="rbar">' + (v ? '<i class="k-e" style="width:' + (v * 100 / max) + '%"></i>' : '') + '</div>'; }
function kindLegend(withExt){
  return '<div class="legend">' + KINDS.map(function(k){ return '<span style="--c:var(--' + k[1] + ')">' + k[0] + '</span>'; }).join('') +
    (withExt ? '<span style="--c:var(--k-e)">처음 보는 작품(외부)</span>' : '') + '</div>';
}

function sorted(){
  var a = ITEMS.slice(), nm = function(x, y){ return x.school.localeCompare(y.school, 'ko'); };
  if (SORT === 'scope') a.sort(function(x, y){ return scopeCount(y).range - scopeCount(x).range || scopeCount(y)['외부'] - scopeCount(x)['외부'] || nm(x, y); });
  else if (SORT === 'ext') a.sort(function(x, y){ return scopeCount(y)['외부'] - scopeCount(x)['외부'] || nm(x, y); });
  else if (SORT === 'print') a.sort(function(x, y){ return pct(qSrc(y, '프린트'), qCount(y)) - pct(qSrc(x, '프린트'), qCount(x)) || nm(x, y); });
  else if (SORT === 'hard') a.sort(function(x, y){ return pct(hardN(y), qCount(y)) - pct(hardN(x), qCount(x)) || nm(x, y); });
  else a.sort(nm);
  return a;
}
function sortPills(){
  return '<div class="sort">' + [['scope', '범위 많은 순'], ['ext', '처음 보는 작품 많은 순'], ['print', '프린트 출제 많은 순'], ['hard', '상·최상 비율 높은 순'], ['name', '학교 이름순']]
    .map(function(o){ return '<button class="pill' + (SORT === o[0] ? ' on' : '') + '" data-sort="' + o[0] + '">' + o[1] + '</button>'; }).join('') + '</div>';
}

  var maxR = Math.max.apply(null, ITEMS.map(function(s){ return cs[s._key].range; }).concat([1]));

  var topR = ITEMS.filter(function(s){ return cs[s._key].range === maxR; }).map(function(s){ return s.short || s.school; });
  var topE = ITEMS.filter(function(s){ return cs[s._key]['외부'] === maxE; }).map(function(s){ return s.short || s.school; });
  var h = '<div class="card"><div class="sec-t"><span class="n">1</span>시험 범위의 양 · 학교별 특징<span class="sub">' + esc(Object.keys(exams).join(' · ')) + ' · ' + ITEMS.length + '개 학교</span></div>' +
    '<div class="tops"><div class="top"><span class="k">공부할 범위가 가장 많은 학교</span><span class="v">' + esc(topR.join(' · ')) + '</span><span class="u">' + maxR + '개</span></div>' +
    '<div class="top"><span class="k">처음 보는 작품이 가장 많은 학교</span><span class="v">' + esc(topE.join(' · ')) + '</span><span class="u">' + maxE + '편</span></div></div>' +
    sortPills() + essaySummary() +
    '<div class="rhead"><span>학교</span><span>공부할 범위 (작품·지문·단원)</span><span>처음 보는 작품</span></div>' +
    a.map(function(s){
      var c = cs[s._key];
      return '<div class="rrow" data-go="' + esc(s._key) + '"><div class="rn">' + esc(s.short || s.school) + (c.range === maxR ? '<span class="most">범위 최다</span>' : '') + '</div>' +
        '<div class="rc"><span class="big">' + c.range + '</span>' + rangeBar(c, maxR) +
          '<div class="rk">' + KINDS.map(function(k){ return k[0] + ' ' + c[k[0]]; }).join(' · ') + '</div></div>' +
        '<div class="rc"><span class="big e">' + c['외부'] + '</span>' + extBar(c['외부'], maxE) + '</div>' +

    }).join('') + kindLegend(true) +

  h += '<div class="card"><div class="sec-t"><span class="n">2</span>문항·난도 비교</div>' +
    '<table class="cmp"><thead><tr><th>학교</th><th>서술형</th><th>문항</th><th class="hide-m">주교재</th><th>상·최상</th><th>난도 분포</th><th></th></tr></thead><tbody>' +
    a.map(function(s){
      var es = essayCount(s), n = qCount(s), hn = hardN(s);
      return '<tr class="go" data-go="' + esc(s._key) + '"><td class="sc">' + esc(s.short || s.school) + '</td>' +

    }).join('') + '</tbody></table>' + lvLegend() + '</div>';
  h += '<div class="card"><div class="sec-t"><span class="n">3</span>학교별 요약<span class="sub">학교를 누르면 자세한 분석이 열립니다</span></div><div class="grid">' +
    a.map(function(s){
      var c = cs[s._key];
      return '<button class="sbox" data-go="' + esc(s._key) + '"><div class="nm">' + esc(s.school) + '</div>' +
        '<div class="ex">' + esc(s.exam) + ' · ' + esc(s.subject || '') + '</div>' +
        '<div style="margin:0 0 10px">' + essayBadge(s) + '</div>' +

  // 3 출제 분류 및 난도

      return '<div class="q"><div class="no">' + esc(q.no) + '</div><div><div class="tags"><span class="tg lv l' + li + '">' + esc(q.lv) + '</span>' +
        '<span class="tg">' + esc(q.area) + '</span>' + (q.type && q.type !== '객관식' ? '<span class="tg">' + esc(q.type) + '</span>' : '') +
        '<span class="sc2">' + esc(q.scope) + '</span></div><div class="tx">' + esc(q.text) + '</div></div></div>';
    }).join('') : '<p class="muted">해당하는 문항이 없습니다.</p>'));
  // 5 총평
  h += sec(5, '시험 총평', '', paras(s.review));
  // 6 영역별 경향
  h += sec(6, '영역별 출제 경향', '', arr(s.trends).map(function(t){ return '<div class="trend"><h4>' + esc(t.title) + '</h4>' + paras(t.body) + '</div>'; }).join(''));
  // 7 고난도
  if (arr(s.hard).length) h += sec(7, '고난도 문항 분석', s.hardTitle || '', arr(s.hard).map(function(x){
    var tg = [x.lv ? '<span class="tg' + (x.lv === '최상' ? ' l3' : '') + '">' + esc(x.lv) + '</span>' : '',
              x.area ? '<span class="tg">' + esc(x.area) + '</span>' : '',
              x.answer ? '<span class="tg">정답 ' + esc(x.answer) + '</span>' : '',
              x.pts ? '<span class="tg">' + esc(x.pts) + '</span>' : ''].join('');
    return '<div class="hard"><div class="top"><span class="bn">' + esc(x.no) + '번</span>' + tg + '</div>' +
      '<p class="ttl">' + esc(x.title) + '</p>' +
      (x.structure ? '<p class="kv"><b>문항 구조</b>' + esc(x.structure) + '</p>' : '') +
      (x.key ? '<p class="kv"><b>핵심 판단</b>' + esc(x.key) + '</p>' : '') +
      (x.trap ? '<p class="kv"><b>함정</b>' + esc(x.trap) + '</p>' : '') + '</div>';
  }).join(''));
  // 8 학습 포인트
  if (arr(s.points).length) h += sec(8, s.pointsTitle || '학습 포인트', '', arr(s.points).map(function(p, i){
    return '<div class="pt"><h4><span class="i">' + (i + 1) + '</span>' + esc(p.title) + '</h4>' + (p.body ? '<p class="body">' + esc(p.body) + '</p>' : '') +
      arr(p.steps).map(function(st){ return '<div class="step"><span class="sl' + (st.star ? ' star' : '') + '">' + (st.star ? '★ ' : '') + esc(st.label || '') + '</span><span>' + esc(st.text) + '</span></div>'; }).join('') + '</div>';
  }).join(''));
  arr(s.extra).forEach(function(x, i){ h += sec(9 + i, x.title, '', paras(x.body)); });
  var idx = a.indexOf(s), pv = a[idx - 1], nx = a[idx + 1];
  h += '<div class="nav2"><span>' + (pv ? '<button data-go="' + esc(pv._key) + '">‹ ' + esc(pv.short || pv.school) + '</button>' : '') + '</span>' +
    '<button data-sum="1">전체 요약으로</button><span>' + (nx ? '<button data-go="' + esc(nx._key) + '">' + esc(nx.short || nx.school) + ' ›</button>' : '') + '</span></div>';
  $('view').innerHTML = h;
}
function essaySummary(){
  var yes = ITEMS.filter(function(s){ return essayInfo(s).has; });
  var no = ITEMS.length - yes.length;
  return '<div class="essum"><span class="es ' + (yes.length ? 'yes' : 'no') + ' big">' +
    (yes.length ? '서술형 있는 학교 ' + yes.length + '곳' : ITEMS.length + '개 학교 모두 서술형 없음') + '</span><span>' +
    (yes.length ? '서술형 있음: ' + yes.map(function(s){ return esc(s.short || s.school); }).join(' · ') + (no ? ' / 서술형 없음 ' + no + '곳' : '')
                : '이번 시험은 ' + ITEMS.length + '개 학교 모두 서술형 없이 객관식만 나왔습니다.') + '</span></div>';
}
function sec(n, title, sub, body){
  return '<div class="card"><div class="sec-t"><span class="n">' + n + '</span>' + esc(title) + (sub ? '<span class="sub">' + esc(sub) + '</span>' : '') + '</div>' + body + '</div>';
}
function hbars(list){
  var mx = Math.max.apply(null, list.map(function(x){ return +x.n || 0; }).concat([1]));
  return list.map(function(x){ return '<div class="hb"><span>' + esc(x.name) + '</span><span class="tr"><i style="width:' + ((+x.n || 0) * 100 / mx) + '%"></i></span><span class="c">' + (+x.n || 0) + '</span></div>'; }).join('');
}

$('view').addEventListener('click', function(e){
  var t = e.target.closest('[data-go],[data-sort],[data-qf],[data-sum],[data-mk],[data-rst]'); if (!t) return;
  if (t.hasAttribute('data-go')){ QF = 'all'; go('school=' + encodeURIComponent(t.getAttribute('data-go'))); return; }
  if (t.hasAttribute('data-sort')){ SORT = t.getAttribute('data-sort'); render(); return; }
  if (t.hasAttribute('data-qf')){ QF = t.getAttribute('data-qf'); render(); return; }
  if (t.hasAttribute('data-sum')){ go('summary'); return; }
  if (t.hasAttribute('data-mk')){ var p = t.getAttribute('data-mk').split('|'); setMark(p[0], p[1]); return; }
  if (t.hasAttribute('data-rst')){ if (confirm('표시한 내용과 적은 글을 모두 지울까요?')){ CK = { m: {}, f: {} }; ckSave(); renderCheck(); } }
});

/* ── 나의 점검표 (원장님 '예비 고1 기본부터 살펴보기' — 이 기기에만 저장) ── */
var CL = [
  { t: '1층 · 기본 약속', s: '배우기 전에 지켜야 할 것들', g: [
    ['A', '시간 지키기', [[1, '수업 시작 시간에 늦지 않는다'], [2, '늦거나 빠져야 할 일이 생기면 미리 선생님께 알린다']]],
    ['B', '준비물과 안내 챙기기', [[3, '수업에 필요한 교재와 준비물을 챙겨 간다'], [4, '받은 프린트와 자료를 잃어버리지 않게 한곳에 모아 둔다'], [5, '선생님이 안내한 과제 범위와 일정을 그 자리에서 적어 둔다'], [6, '학교와 학원의 공지나 알림을 스스로 확인한다']]],

    ['D', '못 한 일 마무리하기', [[9, '다 못 한 과제는 먼저 말하고, 정한 날까지 마무리한다'], [10, '혼자 끝내기 어려우면 마감 전에 도움을 요청한다'], [11, '답을 베끼지 않고 직접 풀어서 과제를 끝낸다']]]
  ]},
  { t: '2층 · 배우는 자세', s: '기본 위에서 실제로 배우는 방법', g: [
    ['E', '수업 듣고 이해 확인하기', [[12, '수업 중 선생님이 강조한 내용을 표시하거나 적어 둔다'], [13, '이해가 안 되면 넘어가지 않고, 어디서 막혔는지 짚어서 묻는다'], [14, '설명을 들은 뒤 자기 말로 말하거나 직접 풀어 본다'], [15, '교과서와 프린트의 필기 내용을 빠른 시일 안에 복습한다']]],
    ['F', '틀린 것 해결하기', [[16, '틀린 문제에서 정답의 근거와 내 답이 틀린 이유를 말할 수 있다'], [17, '그 문제를 풀려면 어떤 개념이 필요했는지 찾아 적는다'], [18, '해설을 덮고 틀린 문제를 다시 풀어 맞힌다'], [19, '자주 틀리는 개념이나 헷갈리는 내용은 따로 정리해 둔다']]]
  ]},
  { t: '3층 · 시험 준비', s: '고등학교 첫 시험을 위한 연습', g: [
    ['G', '범위와 계획', [[20, '시험 범위를 정리하고, 중요도에 따라 계획을 세운다'], [21, '작품의 키워드, 단원의 핵심 내용을 정확히 암기한다']]],
    ['H', '실전 연습', [[22, '예상 문제와 실전 문제를 충분히 풀어 본다'], [23, '시간을 재면서 실전처럼 문제를 풀어 본다']]]
  ]},
  { t: '4층 · 마음가짐', s: '지금 내 마음이 어디쯤 있는지', g: [
    ['I', '생활 리듬', [[24, '잠드는 시간과 일어나는 시간이 대체로 일정하다'], [25, '하루 계획을 지키려고 노력한다'], [26, '공부할 때 휴대폰을 손이 닿지 않는 곳에 둔다']]],
    ['J', '나를 위한 공부', [[27, '자신 없는 단원도 피하지 않고 더 집중해서 공부한다'], [28, '결과에 너무 연연하지 않고, 과정에 집중하려고 한다'], [29, '누가 시켜서가 아니라, 나 자신을 위해 공부한다']]]
  ]}
];
var MARKS = [['o', '○', '대체로 지키고 있다'], ['t', '△', '가끔 놓친다'], ['x', '×', '자주 놓친다'], ['n', '–', '해당 상황이 없었다']];
var CK_LS = 'pre1_check_' + (KEY || SID || 'guest');
var CK = { m: {}, f: {} };
try { var _c = JSON.parse(localStorage.getItem(CK_LS) || 'null'); if (_c && _c.m) CK = { m: _c.m || {}, f: _c.f || {}, at: _c.at }; } catch(e){}
function ckSave(){ CK.at = Date.now(); try { localStorage.setItem(CK_LS, JSON.stringify(CK)); } catch(e){} }
function allItems(){ var a = []; CL.forEach(function(f){ f.g.forEach(function(g){ g[2].forEach(function(it){ a.push(it); }); }); }); return a; }
function setMark(no, m){
  if (CK.m[no] === m) delete CK.m[no]; else CK.m[no] = m;
  ckSave();
  var row = document.querySelector('.ci[data-no="' + no + '"]');
  if (row) Array.prototype.forEach.call(row.querySelectorAll('button'), function(b){ b.classList.toggle('on', b.getAttribute('data-mk') === no + '|' + CK.m[no]); });
  $('ckCount').innerHTML = countHtml();
  fillSelects();
}
function countHtml(){
  var c = { o: 0, t: 0, x: 0, n: 0 }, total = allItems().length, done = 0;
  for (var k in CK.m){ if (c[CK.m[k]] != null){ c[CK.m[k]]++; done++; } }
  return '<span><b>' + done + '</b>/ ' + total + '개 표시</span>' + MARKS.map(function(m){ return '<span>' + m[1] + ' <b>' + c[m[0]] + '</b></span>'; }).join('');
}
function optList(want){
  var items = allItems();
  var pick = items.filter(function(it){ return want.indexOf(CK.m[it[0]]) >= 0; });
  var rest = items.filter(function(it){ return want.indexOf(CK.m[it[0]]) < 0; });
  function o(it){ var m = CK.m[it[0]]; var sym = m ? MARKS.filter(function(x){ return x[0] === m; })[0][1] + ' ' : ''; return '<option value="' + it[0] + '">' + sym + it[0] + '. ' + esc(it[1]) + '</option>'; }
  return '<option value="">번호 고르기</option>' + (pick.length ? '<optgroup label="표시한 항목">' + pick.map(o).join('') + '</optgroup>' : '') + '<optgroup label="모든 항목">' + rest.map(o).join('') + '</optgroup>';
}
function fillSelects(){
  [['f1n', ['o']], ['f2n', ['t', 'x']], ['f3n', ['t']]].forEach(function(p){
    var el = $(p[0]); if (!el) return; var v = CK.f[p[0]] || ''; el.innerHTML = optList(p[1]); el.value = v;
  });
}
function fld(id, label, type){
  var v = esc(CK.f[id] || '');
  var inp = type === 'select' ? '<select id="' + id + '" data-f="' + id + '"></select>'
          : type === 'area' ? '<textarea id="' + id + '" data-f="' + id + '">' + v + '</textarea>'
          : '<input id="' + id + '" data-f="' + id + '" type="' + (type || 'text') + '" value="' + v + '" />';
  return '<div class="fld"><label for="' + id + '">' + esc(label) + '</label>' + inp + '</div>';
}
function renderCheck(){
  var h = '<div class="card"><div class="sec-t">예비 고1 · 고등학교에 가기 전, 기본부터 살펴보기</div>' +
    '<p class="para">어느 학교에 가든, 그 학교에서 공부할 습관은 내가 준비할 수 있습니다.</p>' +
    '<p class="para muted">이 표는 시험이 아닙니다. 점수도 등급도 없고, 누가 채점하지도 않습니다. 잘 보이려고 고르지 말고, 최근 2주 동안 실제로 어땠는지 떠올리며 솔직하게 표시해 주세요.</p>' +
    '<div class="legend" style="margin-top:4px">' + MARKS.map(function(m){ return '<span style="--c:transparent">' + m[1] + ' ' + m[2] + '</span>'; }).join('') + '</div>' +
    '<div class="marks" id="ckCount">' + countHtml() + '</div></div>';
  h += '<div class="card">' + CL.map(function(f){
    return '<div class="floor">' + esc(f.t) + '<span>' + esc(f.s) + '</span></div>' + f.g.map(function(g){
      return '<div class="grp">' + g[0] + ' · ' + esc(g[1]) + '</div>' + g[2].map(function(it){
        return '<div class="ci" data-no="' + it[0] + '"><span class="no">' + (it[0] < 10 ? '0' : '') + it[0] + '</span><span class="tx">' + esc(it[1]) + '</span><span class="mk">' +
          MARKS.map(function(m){ return '<button class="' + m[0] + (CK.m[it[0]] === m[0] ? ' on' : '') + '" data-mk="' + it[0] + '|' + m[0] + '" title="' + m[2] + '" aria-label="' + m[2] + '">' + m[1] + '</button>'; }).join('') + '</span></div>';
      }).join('');
    }).join('');
  }).join('') + '</div>';
  h += '<div class="card"><div class="sec-t">나를 돌아보고, 행동 하나 정하기</div>' +
    '<div class="rf"><h4><span class="i">1</span>내가 이미 잘하고 있는 것 하나</h4><p class="hint">○를 표시한 항목 중에서 하나를 골라 주세요.</p>' + fld('f1n', '번호', 'select') + fld('f1t', '어떻게 지키고 있나요', 'area') + '</div>' +
    '<div class="rf"><h4><span class="i">2</span>자꾸 놓치는 것 하나</h4><p class="hint">△나 ×를 표시한 항목 중 하나를 골라 주세요. "내가 게을러서"보다 "그때 무슨 일이 있었는지"를 떠올려 보세요.</p>' + fld('f2n', '번호', 'select') + fld('f2t', '주로 놓치는 상황', 'area') + '</div>' +
    '<div class="rf"><h4><span class="i">3</span>이번 주에 연습할 행동 하나</h4><p class="hint">×보다 △에서 골라 주세요. 가끔 놓치는 것을 줄이는 일이, 처음부터 바꾸는 일보다 쉽습니다.</p>' +
      fld('f3n', '연습할 행동 번호', 'select') + fld('f3w', '언제, 어디서') + fld('f3h', '어떻게 확인할까') + fld('f3e', '도움이 필요한 일') + '</div>' +
    '<div class="rf"><h4><span class="i">4</span>일주일 뒤, 다시 확인하기</h4><p class="hint">해 보니 어땠는지 적고, 그 항목만 다시 표시해 주세요.</p>' +
      fld('f4d', '날짜', 'date') + fld('f4t', '해 보니 어땠나요', 'area') + fld('f4m', '다시 표시 (○ △ ×)') + '</div>' +
    '<p class="saved">' + (CK.at ? '이 기기에 저장됨 · ' + new Date(CK.at).toLocaleString('ko-KR', { month: 'numeric', day: 'numeric', hour: 'numeric', minute: '2-digit' }) : '표시하고 적은 내용은 이 기기에만 저장돼요.') +
    ' · <button class="rst" data-rst="1">모두 지우기</button></p></div>';
  h += '<div class="card"><div class="sec-t">이수경 국어는 이렇게 함께하고 있어요</div><ul class="with">' +
    ['학교별 시험 범위와 학교 수업의 필기 내용을 세밀하게 반영해 맞춤형 수업을 진행합니다.',
     '부족한 부분은 개별 질문과 보충 설명으로 끝까지 함께합니다.',
     '시험 직전까지 실전 감각을 살릴 수 있도록 문제 풀이, 오답 정리를 반복합니다.',
     '흔들리지 않도록, 공부 방향과 컨디션도 함께 살펴보고 있어요.',
     '언제나 여러분을 믿고 응원합니다. 마지막까지 함께 걸어 갈게요.'].map(function(t, i){ return '<li><b>' + (i + 1) + '</b><span>' + esc(t) + '</span></li>'; }).join('') +
    '</ul><p class="closing">한 번에 모두 바꾸지 않아도 됩니다. 하나가 자리 잡으면, 다음 하나를 고르면 됩니다.<br>오늘부터 하나씩 익히는 습관이<br>고등학생이 될 나를 만들어 줄 거예요.</p></div>';
  $('view').innerHTML = h;
  fillSelects();
}
$('view').addEventListener('input', function(e){
  var id = e.target.getAttribute && e.target.getAttribute('data-f'); if (!id) return;
  CK.f[id] = e.target.value; ckSave();
});
$('view').addEventListener('change', function(e){
  var id = e.target.getAttribute && e.target.getAttribute('data-f'); if (!id) return;
  CK.f[id] = e.target.value; ckSave();
});

render();
load();
