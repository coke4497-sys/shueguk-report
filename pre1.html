<!--
  예비 고1 학교 분석 (2026-11-03 원장님, 061)

<style>
  :root{
    --bg:#E4EFEA; --surface:#FFFFFF; --ink:#2A332F; --ink-soft:#5C6A64; --accent:#3A6B5E;
    --line:#D7E3DD; --line-soft:#E5EDE8; --soft:#F3F7F5;
    --lav:#EDE4F4; --lav-ink:#5A4A6A;
    --lv0:#E3ECE7; --lv1:#BFD5CA; --lv2:#8FB3A3; --lv3:#4F7A6A;
    --sans:"Gowun Dodum","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
    --serif:"Gowun Batang",serif; --disp:"Do Hyeon",var(--sans);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px;line-height:1.75;-webkit-font-smoothing:antialiased;padding-bottom:48px;}
  .wrap{max-width:760px;margin:0 auto;padding:0 16px;}
  header{padding:34px 4px 18px;}
  .eyebrow{font-size:.74rem;letter-spacing:.22em;color:var(--accent);margin:0;}
  h1{font-family:var(--serif);font-weight:700;font-size:1.6rem;margin:6px 0 4px;line-height:1.35;word-break:keep-all;}
  .lead{font-family:var(--serif);color:var(--ink-soft);font-size:.95rem;margin:0;}
  .seg{display:flex;gap:4px;background:#fff;border-radius:999px;padding:4px;margin:18px 0 6px;}
  .seg button{flex:1;border:0;background:transparent;border-radius:999px;padding:9px 6px;font-family:var(--sans);font-size:.92rem;color:var(--ink-soft);cursor:pointer;}
  .seg button.on{background:var(--lav);color:var(--lav-ink);font-weight:700;}
  .card{background:var(--surface);border-radius:18px;padding:20px 20px;margin:14px 0;box-shadow:0 1px 3px rgba(40,60,50,.05);}
  .sec-t{font-family:var(--serif);font-weight:700;font-size:1.08rem;margin:0 0 12px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;}
  .sec-t .n{font-family:var(--disp);font-weight:400;color:var(--accent);font-size:1.15rem;}
  .sec-t .sub{font-family:var(--sans);font-weight:400;font-size:.8rem;color:var(--ink-soft);}
  .muted{color:var(--ink-soft);font-size:.86rem;}
  .msg{text-align:center;padding:60px 20px;font-family:var(--serif);color:var(--ink-soft);}
  .msg b{display:block;color:var(--ink);font-size:1.1rem;margin-bottom:8px;}
  p.para{margin:0 0 12px;font-size:.95rem;}
  p.para:last-child{margin-bottom:0;}

  /* 전체 요약 */
  .sort{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 10px;}
  .pill{border:0;background:var(--soft);color:var(--ink-soft);border-radius:999px;padding:5px 12px;font-family:var(--sans);font-size:.82rem;cursor:pointer;}
  .pill.on{background:var(--lav);color:var(--lav-ink);font-weight:700;}
  table.cmp{width:100%;border-collapse:collapse;font-size:.86rem;}
  table.cmp th{font-weight:400;color:var(--ink-soft);font-size:.76rem;text-align:left;padding:6px 6px;border-bottom:1px solid var(--line);}
  table.cmp td{padding:10px 6px;border-bottom:1px solid var(--line-soft);vertical-align:top;}
  table.cmp tr.go{cursor:pointer;}
  table.cmp tr.go:hover td{background:#F7FAF8;}
  table.cmp .sc{font-family:var(--disp);font-size:1.08rem;white-space:nowrap;}
  table.cmp .num{font-family:var(--disp);font-size:1.05rem;white-space:nowrap;}
  table.cmp .arrow{color:var(--accent);white-space:nowrap;}
  .lvbar{display:flex;height:12px;border-radius:999px;overflow:hidden;background:var(--lv0);min-width:90px;}
  .lvbar i{display:block;height:100%;}
  .lvbar i.l0{background:var(--lv0);} .lvbar i.l1{background:var(--lv1);} .lvbar i.l2{background:var(--lv2);} .lvbar i.l3{background:var(--lv3);}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-soft);margin:10px 0 0;}
  .legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px;background:var(--c);}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
  .sbox{background:var(--surface);border:0;border-radius:16px;padding:16px;text-align:left;cursor:pointer;font-family:var(--sans);color:var(--ink);box-shadow:0 1px 3px rgba(40,60,50,.05);}
  .sbox:hover{background:#FAFCFB;}
  .sbox .nm{font-family:var(--disp);font-size:1.35rem;line-height:1.2;}
  .sbox .ex{font-size:.78rem;color:var(--ink-soft);margin:2px 0 10px;}
  .sbox .row{display:flex;justify-content:space-between;gap:8px;font-size:.84rem;margin:3px 0;}
  .sbox .row b{font-weight:400;color:var(--ink-soft);}
  .sbox .areas{font-size:.8rem;color:var(--ink-soft);margin-top:8px;line-height:1.55;}
  .sbox .more{display:block;margin-top:10px;color:var(--accent);font-size:.84rem;}

  /* 서술형 있음/없음 — 한눈에 */
  .es{display:inline-block;border-radius:999px;padding:3px 11px;font-size:.8rem;font-weight:700;white-space:nowrap;}
  .es.no{background:#E7F1EC;color:#2F5D4F;}
  .es.yes{background:#C8463F;color:#fff;}
  .es.big{font-family:var(--disp);font-weight:400;font-size:1.02rem;padding:5px 14px;}
  .essum{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--soft);border-radius:14px;padding:10px 12px;margin:0 0 12px;font-size:.88rem;}
  .esband{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;}
  /* 시험 범위의 양 */
  :root{--k-t:#8FB3A3;--k-p:#B9A5CC;--k-m:#E3C97E;--k-e:#EAB6C2;}
  .tops{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px;}
  .top{background:var(--soft);border-radius:14px;padding:12px 14px;display:flex;flex-direction:column;}
  .top .k{font-size:.78rem;color:var(--ink-soft);}
  .top .v{font-family:var(--disp);font-size:1.5rem;line-height:1.25;}
  .top .u{font-size:.84rem;color:var(--accent);}
  .rhead{display:grid;grid-template-columns:96px 1.3fr 1fr;gap:12px;font-size:.76rem;color:var(--ink-soft);padding:6px 4px;border-bottom:1px solid var(--line);}
  .rrow{display:grid;grid-template-columns:96px 1.3fr 1fr;gap:6px 12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--line-soft);cursor:pointer;}
  .rrow:hover{background:#F7FAF8;}
  .rn{font-family:var(--disp);font-size:1.15rem;line-height:1.2;}
  .most{display:block;font-family:var(--sans);font-size:.7rem;color:#fff;background:var(--lav-ink);border-radius:999px;padding:1px 8px;width:fit-content;margin-top:3px;}
  .rc{display:grid;grid-template-columns:34px 1fr;gap:6px 8px;align-items:center;}
  .rc .big{font-family:var(--disp);font-size:1.45rem;line-height:1;text-align:right;}
  .rc .big.e{color:#A4475C;}
  .rbar{display:flex;height:16px;border-radius:6px;background:var(--soft);overflow:hidden;}
  .rbar i{display:block;height:100%;}
  .rbar i.k-t{background:var(--k-t);} .rbar i.k-p{background:var(--k-p);} .rbar i.k-m{background:var(--k-m);} .rbar i.k-e{background:var(--k-e);}
  .rk{grid-column:2;font-size:.74rem;color:var(--ink-soft);}
  .rf{grid-column:2 / 4;display:flex;flex-wrap:wrap;gap:5px;align-items:center;}
  .feats{display:flex;flex-wrap:wrap;gap:5px;}
  .sbox .feats{margin-top:10px;}
  .ft{font-size:.76rem;border-radius:999px;padding:2px 9px;background:var(--soft);color:var(--ink-soft);}
  .ft.on{background:var(--lav);color:var(--lav-ink);font-weight:700;}
  .sgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:0 0 12px;}
  .sk{background:var(--soft);border-radius:14px;padding:10px 12px;}
  .sk .sh{display:flex;align-items:center;gap:6px;font-size:.84rem;color:var(--ink-soft);margin-bottom:6px;}
  .sk .sh b{margin-left:auto;font-family:var(--disp);font-weight:400;font-size:1.2rem;color:var(--ink);}
  .sk .dot{display:inline-block;width:10px;height:10px;border-radius:3px;}
  .sit{display:inline-block;background:#fff;border-radius:8px;padding:2px 8px;margin:0 4px 4px 0;font-size:.82rem;}
  details.orig{margin-top:12px;}
  details.orig summary{cursor:pointer;font-size:.84rem;color:var(--accent);margin-bottom:6px;}
  .rbar i.k-in{background:var(--k-t);}
  .xe{color:#A4475C;font-weight:700;}
  .rc.pc{grid-template-columns:62px 1fr;}
  .rc.pc .big{white-space:nowrap;}
  .rc.pc .big small{font-family:var(--sans);font-size:.62rem;color:var(--ink-soft);margin-left:1px;}
  .rc.pc .rk{font-size:.78rem;}
  .tscroll{overflow-x:auto;}
  /* 시험지 지문 분량 */
  .ppr{background:var(--soft);border-radius:14px;padding:12px 14px;margin:0 0 12px;}
  .pph{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;font-size:.84rem;margin-bottom:8px;}
  .pph b{font-family:var(--serif);font-size:.95rem;}
  .pp{display:grid;grid-template-columns:minmax(0,1.4fr) 1fr 64px;gap:8px;align-items:center;font-size:.84rem;margin:5px 0;}
  .pp .pt2{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .pp .pt2 small{color:var(--ink-soft);}
  .pp .dot{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;}
  .pp .rbar{height:10px;background:#fff;}
  .pp .pc2{font-family:var(--disp);text-align:right;}
  .xtag{font-size:.68rem;background:#A4475C;color:#fff;border-radius:999px;padding:0 6px;font-weight:400;}
  /* 대표 유형 미리보기 */
  .smp{display:grid;gap:12px;}
  .sq{border:1px solid var(--line);border-radius:16px;padding:16px 18px;background:#FFFEFB;}
  .sqh{display:flex;flex-wrap:wrap;align-items:center;gap:6px 8px;margin-bottom:8px;}
  .sty{font-size:.8rem;font-weight:700;border-radius:999px;padding:3px 11px;background:var(--lav);color:var(--lav-ink);}
  .sty.multi{background:#C8463F;color:#fff;}
  .sno{font-family:var(--disp);font-size:1.15rem;}
  .sctx{font-size:.78rem;color:var(--ink-soft);}
  .sst{font-family:var(--serif);font-weight:700;font-size:1rem;line-height:1.65;margin:0 0 10px;}
  .sbg{border:1px solid #CFD9D4;border-radius:10px;padding:18px 14px 12px;margin:14px 0 10px;position:relative;font-size:.88rem;line-height:1.7;background:#fff;}
  .sbl{position:absolute;top:-11px;left:50%;transform:translateX(-50%);background:#FFFEFB;padding:0 8px;font-size:.84rem;color:var(--ink-soft);}
  .sop{list-style:none;margin:0;padding:0;}
  .sop li{font-size:.92rem;line-height:1.6;padding:6px 10px;border-radius:10px;margin:2px 0;}
  .sq.show .sop li.ans{background:#E3F0E8;color:#1F4A3A;font-weight:700;}
  .sq.show .sop li.ans::after{content:"정답";font-size:.7rem;background:var(--accent);color:#fff;border-radius:999px;padding:0 7px;margin-left:8px;font-weight:400;}
  .sbtn{margin-top:8px;border:0;background:var(--lav);color:var(--lav-ink);border-radius:999px;padding:6px 14px;font-family:var(--sans);font-size:.84rem;cursor:pointer;}
  .sans{display:none;margin-left:8px;font-family:var(--disp);color:var(--accent);}
  .sq.show .sans{display:inline;}
  /* 학교 상세 */
  .spills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 8px;scrollbar-width:none;}
  .spills::-webkit-scrollbar{display:none;}
  .spills .pill{white-space:nowrap;background:#fff;font-size:.88rem;padding:7px 14px;}
  .spills .pill.on{background:var(--lav);}
  .shead .nm{font-family:var(--disp);font-size:2rem;line-height:1.15;}
  .shead .ex{font-family:var(--serif);color:var(--ink-soft);font-size:.95rem;margin-top:4px;}
  .tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px;}
  .tile{background:var(--soft);border-radius:14px;padding:10px 12px;}
  .tile .k{font-size:.74rem;color:var(--ink-soft);}
  .tile .v{font-family:var(--disp);font-size:1.12rem;line-height:1.3;word-break:keep-all;}
  .scope-main{font-size:.9rem;margin:0 0 10px;}
  .scope-main b{font-weight:400;color:var(--ink-soft);margin-right:6px;}
  .srow{display:grid;grid-template-columns:120px 1fr;gap:10px;padding:9px 0;border-top:1px solid var(--line-soft);font-size:.9rem;}
  .srow:first-of-type{border-top:0;}
  .srow .lb{color:var(--accent);font-size:.84rem;}
  .bars{display:grid;grid-template-columns:1fr 1fr;gap:18px;}
  .bars h4{margin:0 0 8px;font-weight:400;font-size:.82rem;color:var(--ink-soft);}
  .hb{display:grid;grid-template-columns:76px 1fr 30px;gap:8px;align-items:center;font-size:.86rem;margin:5px 0;}
  .hb .tr{height:12px;border-radius:999px;background:var(--soft);overflow:hidden;}
  .hb .tr i{display:block;height:100%;background:var(--lv2);border-radius:999px;}
  .hb .c{font-family:var(--disp);text-align:right;}
  .notes{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .chip{background:var(--soft);border-radius:999px;padding:4px 11px;font-size:.8rem;color:var(--ink);}
  .qf{display:flex;gap:6px;flex-wrap:wrap;margin:0 0 8px;}
  .q{display:grid;grid-template-columns:34px 1fr;gap:10px;padding:11px 0;border-top:1px solid var(--line-soft);}
  .q:first-child{border-top:0;}
  .q .no{width:30px;height:30px;border-radius:50%;background:var(--soft);display:flex;align-items:center;justify-content:center;font-family:var(--disp);font-size:.98rem;}
  .q .tags{display:flex;gap:5px;flex-wrap:wrap;align-items:center;margin-bottom:2px;}
  .q .tg{font-size:.72rem;border-radius:999px;padding:1px 8px;background:var(--soft);color:var(--ink-soft);}
  .q .tg.lv{background:var(--lv0);color:#2F4C40;}
  .q .tg.lv.l2{background:var(--lv1);} .q .tg.lv.l3{background:var(--lv3);color:#fff;}
  .q .sc2{font-size:.78rem;color:var(--ink-soft);}
  .q .tx{font-size:.92rem;line-height:1.6;}
  .trend{margin:0 0 16px;}
  .trend:last-child{margin-bottom:0;}
  .trend h4{margin:0 0 6px;font-family:var(--serif);font-size:.98rem;}
  .hard{background:var(--soft);border-radius:14px;padding:14px 16px;margin:10px 0;}
  .hard .top{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px;}
  .hard .bn{font-family:var(--disp);font-size:1.4rem;line-height:1;}
  .hard .tg{font-size:.74rem;border-radius:999px;padding:2px 9px;background:#fff;color:var(--ink-soft);}
  .hard .tg.l3{background:var(--lv3);color:#fff;}
  .hard .ttl{font-family:var(--serif);font-weight:700;font-size:.95rem;margin:0 0 8px;}
  .hard .kv{margin:6px 0 0;font-size:.9rem;}
  .hard .kv b{display:inline-block;font-weight:400;font-size:.74rem;background:#fff;border-radius:999px;padding:1px 9px;margin-right:6px;color:var(--accent);}
  .pt{margin:0 0 18px;}
  .pt:last-child{margin-bottom:0;}
  .pt h4{margin:0 0 4px;font-family:var(--serif);font-size:1rem;display:flex;gap:8px;align-items:baseline;}
  .pt h4 .i{font-family:var(--disp);font-weight:400;color:var(--accent);font-size:1.1rem;}
  .pt .body{font-size:.92rem;margin:0 0 8px;}
  .step{display:grid;grid-template-columns:auto 1fr;gap:8px;font-size:.88rem;margin:5px 0;line-height:1.6;}
  .step .sl{font-family:var(--disp);font-size:.8rem;background:var(--soft);border-radius:999px;padding:1px 9px;white-space:nowrap;height:fit-content;}
  .step .sl.star{background:var(--lav);color:var(--lav-ink);}
  .nav2{display:flex;justify-content:space-between;gap:10px;margin:18px 0 0;}
  .nav2 button{border:0;background:#fff;border-radius:999px;padding:9px 16px;font-family:var(--sans);font-size:.88rem;color:var(--accent);cursor:pointer;}

  /* ── 디자인 개선안(2026-11-03 원장님 design_handoff_pre1_report — 나의 점검표·전체 요약. 학교별 분석은 종전 그대로) ── */
  :root{--bg:#E4EFEA;--k-t:#8FB3A0;--k-p:#B9A8D0;--k-m:#E4C97A;--k-e:#E8B4BC;}
  body{color:#33443C;}
  .wrap{max-width:780px;padding:0 18px;}
  header{padding:24px 4px 0;}
  .eyebrow{font-size:12px;letter-spacing:3px;color:#4B6157;}
  h1{font-size:30px;color:#2B3A33;margin:8px 0;}
  .lead{font-family:var(--sans);font-size:15px;line-height:1.6;color:#54655C;}
  .seg{position:sticky;top:8px;z-index:5;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;padding:5px;margin:18px 0 0;box-shadow:0 4px 16px rgba(58,77,69,.10);}
  .seg button{padding:11px 6px;font-size:15px;color:#54655C;}
  .seg button.on{background:#ECE4F3;color:#4A3F63;}
  .card{border-radius:24px;padding:24px 22px;margin:18px 0;box-shadow:none;}
  .sec-t{font-size:20px;color:#2B3A33;gap:4px 10px;margin:0 0 14px;}
  .sec-t .n{color:#7F9E8E;font-size:20px;}
  .sec-t .sub{flex-basis:100%;font-size:13px;color:#8A978F;}
  html #me-back-row{max-width:780px;padding:24px 18px 0;}
  html #me-back{background:#fff;border-radius:999px;padding:8px 14px;font-size:14px;font-weight:400;color:#2B3A33;}
  /* 나의 점검표 */
  .ckp{font-size:16px;line-height:1.7;color:#2B3A33;margin:0 0 12px;}
  .ckp.s{font-size:14px;line-height:1.75;color:#54655C;}
  .cklg{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:6px;margin-top:4px;}
  .cklg div{display:flex;align-items:center;gap:8px;background:#FAFBF9;border-radius:12px;padding:8px 10px;}
  .cklg .sy{width:28px;height:28px;flex:none;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:15px;}
  .cklg .tx{font-size:13px;color:#2B3A33;line-height:1.4;}
  .cklg b{margin-left:auto;font-family:var(--disp);font-weight:400;font-size:16px;color:#54655C;}
  .sy.o{background:#DCEBE3;color:#2F5C47;} .sy.t{background:#F6E9C4;color:#7A5D14;} .sy.x{background:#F6DDE1;color:#A8434F;} .sy.n{background:#EEF1EE;color:#54655C;}
  .ckprog{position:sticky;top:72px;z-index:4;display:flex;align-items:center;gap:12px;background:#ECE4F3;color:#4A3F63;border-radius:999px;padding:10px 18px;margin:18px 0;box-shadow:0 4px 14px rgba(74,63,99,.12);}
  .ckprog .lb{font-size:14px;white-space:nowrap;}
  .ckprog .lb b{font-family:var(--disp);font-weight:400;font-size:18px;}

<script>
var SB_URL = 'https://bangdbhqpphqqdwcledg.supabase.co';
var SB_KEY = 'sb_publishable_dE9d1KIbpgYaQkaS2MSrlg_-7SiRJuT';
var QS = new URLSearchParams(location.search);
var KEY = (QS.get('key') || '').trim(), SID = (QS.get('id') || QS.get('student') || '').trim();
var ITEMS = null, LOAD_ERR = '', SORT = 'scope', QF = 'all';
var LV = ['중', '중상', '상', '최상'];

function $(id){ return document.getElementById(id); }
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function arr(x){ return Array.isArray(x) ? x : (x == null || x === '' ? [] : [x]); }
function paras(x){ return arr(x).map(function(t){ return '<p class="para">' + esc(t) + '</p>'; }).join(''); }
function lvIdx(name){ return LV.indexOf(name); }

/* ── 데이터 ── */
function load(){
  if (!KEY && !SID){ LOAD_ERR = 'nokey'; render(); return; }
  var p = KEY ? { key: KEY } : { student: SID };
  fetch(SB_URL + '/rest/v1/rpc/pre1_list', {
    method: 'POST', headers: { apikey: SB_KEY, 'Content-Type': 'application/json' },
    body: JSON.stringify({ p: p })
  }).then(function(r){
    if (r.status === 404) throw { code: 'missing' };
    if (!r.ok) throw { code: 'net' };
    return r.json();
  }).then(function(d){
    if (!d || !d.ok){ LOAD_ERR = (d && d.error) || 'net'; ITEMS = []; }
    else ITEMS = (d.items || []).map(function(x){ var o = x.data || {}; o._key = x.key; o.school = o.school || x.school; o.exam = o.exam || x.exam; return o; });
    render();
  }).catch(function(e){ LOAD_ERR = (e && e.code) || 'net'; ITEMS = []; render(); });
}

/* 문항 표에서 센 값 — 그래프 값이 있으면 그것을 쓴다 */
function lvCounts(s){
  var c = [0, 0, 0, 0];
  if (s.levelDist && s.levelDist.length){ s.levelDist.forEach(function(x){ var i = lvIdx(x.name); if (i >= 0) c[i] = +x.n || 0; }); }
  else arr(s.questions).forEach(function(q){ var i = lvIdx(q.lv); if (i >= 0) c[i]++; });
  return c;
}
function qCount(s){ return arr(s.questions).length; }
function hardN(s){ var c = lvCounts(s); return c[2] + c[3]; }
function essayCount(s){ return arr(s.questions).filter(function(q){ return q.type && q.type !== '객관식'; }).length; }
/* 서술형 있음/없음 (2026-11-03 원장님 "서술형이 있다, 없다가 매우 확실하게") — 문항 표에 서술형(서답형)이 있거나
 * 시험 구성의 서답형 칸이 '없음'이 아니면 있음. 숫자를 못 셌으면 있음으로만 적는다. */
function essayInfo(s){
  var n = essayCount(s), t = String((s.composition && s.composition.essay) || '').trim();
  var has = n > 0 || (t !== '' && !/^없음/.test(t) && !/^0\s*문항/.test(t));
  var m = /(\d+)\s*문항/.exec(t);
  return { has: has, n: n || (m ? +m[1] : 0) };
}
function essayBadge(s, big){
  var e = essayInfo(s);
  return e.has ? '<span class="es yes' + (big ? ' big' : '') + '">서술형 있음' + (e.n ? ' · ' + e.n + '문항' : '') + '</span>'
               : '<span class="es no' + (big ? ' big' : '') + '">서술형 없음</span>';
}
function pct(a, b){ return b ? Math.round(a * 100 / b) : 0; }
function lvBar(s){
  var c = lvCounts(s), t = c[0] + c[1] + c[2] + c[3] || 1;
  return '<div class="lvbar" title="' + LV.map(function(n, i){ return n + ' ' + c[i]; }).join(' · ') + '">' +
    c.map(function(n, i){ return n ? '<i class="l' + i + '" style="width:' + (n * 100 / t) + '%"></i>' : ''; }).join('') + '</div>';
}
function lvLegend(){
  var col = ['var(--lv0)', 'var(--lv1)', 'var(--lv2)', 'var(--lv3)'];
  return '<div class="legend">' + LV.map(function(n, i){ return '<span style="--c:' + col[i] + '">' + n + '</span>'; }).join('') + '</div>';
}
function areaText(s){ return arr(s.areaDist).map(function(a){ return a.name + ' ' + a.n; }).join(' · '); }

/* ── 화면 ── */
function route(){
  var h = location.hash.replace(/^#/, '');
  if (h.indexOf('school=') === 0) return { v: 'school', key: decodeURIComponent(h.slice(7)) };
  if (h === 'school' || h === 'summary') return { v: h };
  return { v: 'check' };   // 2026-11-03 원장님 "나의 점검표가 맨 앞으로" — 처음 열면 점검표
}
function go(hash){ if (location.hash !== '#' + hash) location.hash = hash; else render(); }
window.addEventListener('hashchange', function(){ render(); window.scrollTo(0, 0); });
$('seg').addEventListener('click', function(e){
  var b = e.target.closest('button'); if (!b) return;
  var v = b.getAttribute('data-v');
  if (v === 'school'){ var r = route(); go(r.key ? 'school=' + encodeURIComponent(r.key) : 'school'); }
  else go(v);
});

function render(){
  var r = route();
  Array.prototype.forEach.call($('seg').children, function(b){ b.classList.toggle('on', b.getAttribute('data-v') === r.v); });
  if (r.v === 'check'){ renderCheck(); return; }
  if (ITEMS === null && !LOAD_ERR){ $('view').innerHTML = '<div class="msg">불러오는 중입니다…</div>'; return; }
  if (LOAD_ERR || !ITEMS.length){ $('view').innerHTML = msgHtml(); return; }
  if (r.v === 'school') renderSchool(r.key); else renderSummary();
}
function msgHtml(){
  if (LOAD_ERR === 'nokey') return '<div class="msg"><b>학생 페이지에서 열어 주세요</b>학생 페이지의 [덕양구 8개 주요학교 고1 국어 미리보기] 카드를 누르면 바로 열립니다.</div>';
  if (LOAD_ERR === 'no_student') return '<div class="msg"><b>학생 정보를 찾지 못했습니다</b>학생 페이지 주소가 맞는지 확인해 주세요.</div>';
  if (LOAD_ERR === 'missing') return '<div class="msg"><b>준비 중입니다</b>곧 학교별 분석을 열어 드릴게요.</div>';
  if (LOAD_ERR) return '<div class="msg"><b>불러오지 못했습니다</b>인터넷 연결을 확인한 뒤 새로고침해 주세요.</div>';
  return '<div class="msg"><b>아직 올라온 분석이 없습니다</b>분석이 준비되면 여기에 보여요.</div>';
}

/* ── 시험 범위의 양·학교별 특징 (2026-11-03 원장님 "시험범위의 양이 한눈에 · 양이 많은 학교 · 학교별 특징") ──
 * 범위 = scopeItems(작품·지문·단원 하나가 한 항목, n이 있으면 그만큼 — '외 4편') 를 교과서·프린트·모의고사로 센다.
 * 외부(시험장에서 처음 보는 작품)는 공부할 범위가 아니라 따로 센다. scopeItems 가 없으면 범위표 줄을 ' · ' 로 나눠 어림한다.
 * 특징 칩은 문항 표의 출처(scope 글)·영역 그래프에서 센 값만 쓴다 — 지어낸 평가는 넣지 않는다. */
var KINDS = [['교과서', 'k-t'], ['프린트', 'k-p'], ['모의고사', 'k-m']];
function kindOfLabel(l){ l = String(l || ''); return /외부/.test(l) ? '외부' : /모의/.test(l) ? '모의고사' : /프린트/.test(l) ? '프린트' : /교과서/.test(l) ? '교과서' : ''; }
function scopeItems(s){
  if (arr(s.scopeItems).length) return s.scopeItems;
  var out = [];
  arr(s.scope && s.scope.rows).forEach(function(r){
    var k = kindOfLabel(r.label); if (!k) return;
    arr(r.lines).forEach(function(line){ String(line).split(' · ').forEach(function(x){ if (x.trim()) out.push({ kind: k, name: x.trim() }); }); });
  });
  return out;
}
function scopeCount(s){
  var c = { '교과서': 0, '프린트': 0, '모의고사': 0, '외부': 0 };
  scopeItems(s).forEach(function(i){ if (c[i.kind] != null) c[i.kind] += (+i.n || 1); });
  c.range = c['교과서'] + c['프린트'] + c['모의고사'];
  return c;
}
/* 시험지 지문 분량 (2026-11-03 원장님 "비교표에 외부지문 분량 표시 명시화") — paper.passages(시험지 원본에서
 * 지문마다 공백 뺀 글자 수, 종류는 scopeItems 기준)로 센다. paper 가 없으면 null. */
function paperOf(s){
  var ps = arr(s.paper && s.paper.passages); if (!ps.length) return null;
  var o = { total: 0, ext: 0, extN: 0, inr: 0, n: ps.length, pages: (s.paper && s.paper.pages) || 0 };
  ps.forEach(function(p){ var c = +p.chars || 0; o.total += c; if (p.kind === '외부'){ o.ext += c; o.extN++; } else o.inr += c; });
  o.extPct = pct(o.ext, o.total);

      return '<div class="grp">' + g[0] + ' · ' + esc(g[1]) + '</div>' + g[2].map(function(it){
        return '<div class="ci" data-no="' + it[0] + '"><span class="no">' + (it[0] < 10 ? '0' : '') + it[0] + '</span><div class="bd"><span class="tx">' + esc(it[1]) + '</span><span class="mk">' +
          MARKS.map(function(m){ return '<button class="' + m[0] + (CK.m[it[0]] === m[0] ? ' on' : '') + '" data-mk="' + it[0] + '|' + m[0] + '" title="' + m[2] + '" aria-label="' + m[2] + '">' + m[1] + '</button>'; }).join('') + '</span></div></div>';
      }).join('');
    }).join('') + '</div>';
  }).join('');
  h += '<div class="card"><div class="sec-t">나를 돌아보고, 행동 하나 정하기</div>' +
    step(1, '내가 이미 잘하고 있는 것 하나', '○를 표시한 항목 중에서 하나를 골라 주세요.', fld('f1n', '번호', 'select') + fld('f1t', '어떻게 지키고 있나요', 'area')) +
    step(2, '자꾸 놓치는 것 하나', '△나 ×를 표시한 항목 중 하나를 골라 주세요. "내가 게을러서"보다 "그때 무슨 일이 있었는지"를 떠올려 보세요.', fld('f2n', '번호', 'select') + fld('f2t', '주로 놓치는 상황', 'area')) +
    step(3, '이번 주에 연습할 행동 하나', '×보다 △에서 골라 주세요. 가끔 놓치는 것을 줄이는 일이, 처음부터 바꾸는 일보다 쉽습니다.',
      fld('f3n', '연습할 행동 번호', 'select') + '<div class="f2">' + fld('f3w', '언제, 어디서') + fld('f3h', '어떻게 확인할까') + '</div>' + fld('f3e', '도움이 필요한 일')) +
    step(4, '일주일 뒤, 다시 확인하기', '해 보니 어땠는지 적고, 그 항목만 다시 표시해 주세요.',
      '<div class="f2">' + fld('f4d', '날짜', 'date') + reHtml() + '</div>' + fld('f4t', '해 보니 어땠나요', 'area')) +
    '<div class="savedrow" id="ckSaved">' + savedHtml() + '</div></div>';
  h += '<div class="card"><div class="sec-t" style="font-size:19px">이수경 국어는 이렇게 함께하고 있어요</div><ul class="with">' +
    ['학교별 시험 범위와 학교 수업의 필기 내용을 세밀하게 반영해 맞춤형 수업을 진행합니다.',
     '부족한 부분은 개별 질문과 보충 설명으로 끝까지 함께합니다.',
     '시험 직전까지 실전 감각을 살릴 수 있도록 문제 풀이, 오답 정리를 반복합니다.',
     '흔들리지 않도록, 공부 방향과 컨디션도 함께 살펴보고 있어요.',
     '언제나 여러분을 믿고 응원합니다. 마지막까지 함께 걸어 갈게요.'].map(function(t, i){ return '<li><b>' + (i + 1) + '</b><span>' + esc(t) + '</span></li>'; }).join('') +
    '</ul><p class="closing">한 번에 모두 바꾸지 않아도 됩니다. 하나가 자리 잡으면, 다음 하나를 고르면 됩니다.<br>오늘부터 하나씩 익히는 습관이<br>고등학생이 될 나를 만들어 줄 거예요.</p></div>';
  $('view').innerHTML = h;
  fillSelects();
}
$('view').addEventListener('input', function(e){
  var id = e.target.getAttribute && e.target.getAttribute('data-f'); if (!id) return;
  CK.f[id] = e.target.value; ckSave(); savedRow();
});
$('view').addEventListener('change', function(e){
  var id = e.target.getAttribute && e.target.getAttribute('data-f'); if (!id) return;
  CK.f[id] = e.target.value; ckSave(); savedRow();
});

render();
load();
</script>
