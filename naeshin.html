<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>슈국 내신대비 피드백</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Gowun+Dodum&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#C6D5D2; --surface:#FFFFFF;
    --ink:#2A332F; --ink-soft:#65726B;
    --accent:#4C6E66; --btn:#628C83; --icon-bg:#EBF0ED;
    --line:#D7E3DD; --line-soft:#E5EDE8;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:'Gowun Dodum',sans-serif; background:var(--bg); color:var(--ink); min-height:100vh; padding:18px 14px 60px;}
  .wrap{max-width:860px; margin:0 auto;}
  .back{display:inline-flex; align-items:center; gap:6px; color:var(--accent); text-decoration:none; font-size:13.5px; margin-bottom:10px;}
  h1{font-family:'Gowun Batang',serif; font-size:21px; text-align:center; color:var(--accent); margin-bottom:4px;}
  .sub{text-align:center; font-size:13px; color:var(--ink-soft); margin-bottom:6px;}
  .tip{text-align:center; font-size:12px; color:var(--ink-soft); background:var(--icon-bg);
    border:1px solid var(--line-soft); border-radius:10px; padding:7px 12px; margin:0 auto 16px; max-width:560px; line-height:1.55;}
  .tip b{color:var(--accent);}
  .card{background:var(--surface); border-radius:16px; padding:16px 16px 18px; box-shadow:0 2px 10px rgba(42,51,47,.06); margin-bottom:14px;}
  label{display:block; font-size:12.5px; color:var(--ink-soft); margin:10px 0 4px;}
  select, textarea, input{width:100%; font:inherit; font-size:14px; padding:9px 11px; border:1.5px solid var(--line); border-radius:10px; background:#FBFCFB; color:var(--ink);}
  select:focus, textarea:focus, input:focus{outline:none; border-color:var(--btn); background:#fff;}
  textarea{resize:vertical; min-height:56px; line-height:1.55;}
  .filters{display:flex; gap:8px; flex-wrap:wrap;}
  .filters > div{flex:1; min-width:130px;}
  .ptabs{display:flex; gap:7px; margin-bottom:4px;}
  .ptabs button{flex:1; font:inherit; font-size:14px; font-weight:700; font-family:'Gowun Batang',serif; padding:10px; border:1.5px solid var(--line); border-radius:10px; background:#fff; color:var(--ink-soft); cursor:pointer;}
  .ptabs button.on{background:var(--accent); border-color:var(--accent); color:#fff;}
  .wtabs{display:flex; gap:5px; margin:14px 0 10px; flex-wrap:wrap;}
  .wtabs button{font:inherit; font-size:13px; padding:7px 14px; border:1.5px solid var(--line); border-radius:18px; background:#fff; color:var(--ink-soft); cursor:pointer;}
  .wtabs button.on{background:var(--btn); border-color:var(--btn); color:#fff; font-weight:700;}
  .wtabs button.has{border-color:var(--accent); color:var(--accent); font-weight:700;}
  .wtabs button.on.has{color:#fff;}
  .stu{border-top:1px dashed var(--line); padding:10px 0 2px; margin-top:10px;}
  .stu-row{display:flex; gap:10px; align-items:flex-start; padding:7px 0; border-bottom:1px solid var(--line-soft);}
  .stu-id{flex:0 0 96px; display:flex; flex-direction:column; align-items:flex-start; gap:6px; padding-top:6px;}
  .stu-id b{font-size:14px;}
  .stu-no{display:inline-block; min-width:20px; text-align:center; font-size:11.5px; font-weight:700;
    color:var(--accent); background:var(--icon-bg); border-radius:6px; padding:2px 0; margin-right:2px;}
  .stu-row textarea{min-height:38px; font-size:13.5px;}
  .savebar{display:flex; gap:8px; justify-content:flex-end; margin-top:8px;}
  button.act{font:inherit; font-size:13.5px; padding:9px 16px; border:1.5px solid var(--accent); border-radius:10px; background:var(--accent); color:#fff; cursor:pointer;}
  button.ghost{background:#fff; color:var(--accent);}
  .status{position:fixed; left:50%; bottom:18px; transform:translateX(-50%); background:var(--ink); color:#fff; font-size:13px; padding:9px 16px; border-radius:20px; opacity:0; transition:opacity .25s; pointer-events:none; max-width:90%;}
  .status.show{opacity:.93;}
  .cls-head{display:flex; justify-content:space-between; align-items:center; gap:8px; flex-wrap:wrap;}
  .cls-head h2{font-family:'Gowun Batang',serif; font-size:16.5px; color:var(--accent);}
  .cls-head small{color:var(--ink-soft); font-size:12.5px;}
  .empty{text-align:center; color:var(--ink-soft); font-size:13.5px; padding:26px 0;}
  .dot{font-size:11.5px; color:var(--ink-soft); margin-left:6px;}
  .stu-row .rpt-btn{font:inherit; font-size:11px; font-weight:700; letter-spacing:.05em; padding:4px 10px;
    border:1.5px solid var(--line); border-radius:8px; background:#fff; color:var(--accent); cursor:pointer; white-space:nowrap;}
  .stu-row .rpt-btn:hover{background:var(--accent); border-color:var(--accent); color:#fff;}
  /* 이번 주 진도 단원 칩 */
  .unit-list{display:flex; flex-wrap:wrap; gap:6px; margin:7px 0 2px; align-items:center;}
  .unit-list .unit{display:inline-flex; align-items:center; gap:6px; font-size:12.5px; padding:5px 8px 5px 12px;
    background:var(--icon-bg); border:1.5px solid var(--accent); border-radius:16px; color:var(--ink);}
  .unit-list .unit i{font-style:normal; font-size:11px; font-weight:700; color:var(--accent);}
  .unit-list .unit button{font:inherit; font-size:14px; line-height:1; padding:0 2px; border:none; background:none;
    color:var(--ink-soft); cursor:pointer;}
  .unit-list .unit button:hover{color:#DB4C39;}
  /* 학생별 과제 확인 칩 */
  .hw-chips{display:flex; flex-wrap:wrap; gap:5px;}
  .hw-chips .hwc{font:inherit; font-size:11.5px; padding:4px 10px; border:1.5px solid var(--line); border-radius:14px;
    background:#fff; color:var(--ink-soft); cursor:pointer;}
  .hw-chips .hwc.on{background:var(--btn); border-color:var(--btn); color:#fff; font-weight:700;}

  /* ── 학습 보고서 (캡쳐용 한 장) ── */
  .rpt-wrap{position:fixed; inset:0; background:rgba(42,51,47,.45); overflow-y:auto; z-index:50; display:none; padding:16px 10px 40px;}
  .rpt-bar{max-width:640px; margin:0 auto 10px; display:flex; justify-content:space-between; align-items:center; gap:10px;}
  .rpt-bar small{color:#fff; font-size:12.5px;}
  .rpt-bar button{font:inherit; font-size:13px; padding:8px 16px; border:none; border-radius:10px; background:#fff; color:var(--ink); cursor:pointer;}
  .rpt{max-width:640px; margin:0 auto; background:#fff; border-radius:14px; padding:30px 30px 24px; color:var(--ink);}
  .rpt .brand{font-family:'Gowun Batang',serif; font-size:13px; color:var(--accent); letter-spacing:.06em; text-align:center;}
  .rpt h2{font-family:'Gowun Batang',serif; font-size:21px; text-align:center; margin:6px 0 2px;}
  .rpt .who{text-align:center; font-size:14px; color:var(--ink-soft); margin-bottom:16px;}
  .rpt .who b{color:var(--ink); font-size:16px;}
  .rpt .box{border:1.5px solid var(--line); border-radius:12px; padding:12px 14px; margin-bottom:12px;}
  .rpt .box .bt{font-family:'Gowun Batang',serif; font-size:13px; color:var(--accent); font-weight:700; margin-bottom:5px;}
  .rpt .box .bc{font-size:13.5px; line-height:1.65; white-space:pre-wrap;}
  .rpt .wk{border:1.5px solid var(--line-soft); border-radius:12px; padding:11px 14px; margin-bottom:9px;}
  .rpt .wk .wt{font-family:'Gowun Batang',serif; font-size:13.5px; font-weight:700; color:var(--accent); margin-bottom:6px;}
  .rpt .wk .row{display:flex; gap:8px; font-size:13px; line-height:1.6; margin-bottom:3px;}
  .rpt .wk .row span:first-child{flex:0 0 52px; color:var(--ink-soft);}
  .rpt .wk .row span:last-child{white-space:pre-wrap; flex:1;}
  .rpt .wk .note{background:var(--icon-bg); border-radius:9px; padding:8px 11px; margin-top:6px; font-size:13px; line-height:1.6; white-space:pre-wrap;}
  .rpt .wk .note b{font-size:12px; color:var(--accent); display:block; margin-bottom:2px;}
  .rpt .foot{text-align:center; font-family:'Gowun Batang',serif; font-size:12px; color:var(--ink-soft); margin-top:16px; padding-top:12px; border-top:1.5px solid var(--line-soft);}
</style>
</head>
<body>
<div class="wrap">
  <a class="back" href="https://coke4497-sys.github.io/shueguk-hub/study.html">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5M11 18l-6-6 6-6"/></svg>
    학습 관리로 가기
  </a>
  <h1>내신대비 피드백</h1>
  <p class="sub">Shueguk · 내신반 주차별 진도·과제·학생 피드백 (교사·조교용)</p>
  <p class="tip">화면이 예전 그대로거나 방금 바꾼 내용이 안 보이면 <b>Ctrl+Shift+R</b> 로 새로고침해 주세요.</p>

  <div class="card">
    <label>시험 기간</label>
    <div class="ptabs" id="ptabs"></div>
    <div class="filters">
      <div><label>학년</label><select id="f-grade" onchange="onGradeChange()"></select></div>
      <div><label>담당 강사</label><select id="f-teacher" onchange="onTeacherChange()"></select></div>
      <div style="flex:2;"><label id="cls-label">담당반</label><select id="f-class" onchange="openClass()"></select></div>
    </div>
    <div style="margin-top:4px;">
      <label>학생 검색 <span class="dot">이름으로 반을 바로 찾아 이동</span></label>
      <input id="f-stu" placeholder="학생 이름 입력" autocomplete="off" oninput="stuSearch()">
      <div id="stu-results" style="display:flex;flex-wrap:wrap;gap:6px;margin-top:6px;"></div>
    </div>
  </div>

  <div id="panel"></div>
</div>

<!-- 학습 보고서 (캡쳐용) -->
<div class="rpt-wrap" id="rpt-wrap" onclick="if(event.target===this)closeRpt()">
  <div class="rpt-bar">
    <small>아래 카드를 화면 캡쳐해서 전달하세요</small>
    <button type="button" onclick="closeRpt()">닫기</button>
  </div>
  <div class="rpt" id="rpt-card"></div>
</div>

<div class="status" id="status"></div>

<script>
var ENDPOINT = "https://script.google.com/macros/s/AKfycbzhCncBwn-JlqXARC3wfrWUCuNHzlNK2df0bdhx-w78Xr8mzYUcIYZOJdRi9N4bHtsb/exec";
var PW = "sh";
var PERIODS = ['26-2-중간','26-2-기말'];   // 연말에 27년 기간 추가
var WEEKS = [];            // 슈국 캘린더의 '내신' 주차(수요일 yyyy-MM-dd) — 오름차순
var WEEKS_READY = false;

var classes = [];          // 내신 시간표 반 목록
var period = PERIODS[0];
var curClass = null;
var rec = { scope:'', weeks:{}, notes:{} };   // 현재 반·기간의 기록
var week = '';
var saveTimers = {};

function $(id){ return document.getElementById(id); }
/* 브라우저 캐시 — 이전 데이터를 즉시 띄우고 뒤에서 최신으로 갱신 (시간표·숙제검사와 같은 방식) */
function cacheGet(k){ try{ var v=JSON.parse(localStorage.getItem('ns:'+k)||'null'); return v&&v.d; }catch(e){ return null; } }
function cacheSet(k,d){ try{ localStorage.setItem('ns:'+k, JSON.stringify({t:Date.now(),d:d})); }catch(e){} }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
function plain(nm){ return String(nm||'').replace(/\(.*\)$/,''); }
function gradeOf(cls){ var m=String(cls||'').match(/^(중[1-3]|고[1-3])/); return m?m[1]:'기타'; }
/* 시험범위 공유 키 — "고1 화정A(천재수)" → 공유:고1|화정 (같은 학교·학년 병렬 반이 시험범위를 공유).
 * 학교 구분이 없는 반(정리정독·파이널 등)은 반 단위 그대로. */
function scopeKeyOf(cls, id){
  var m=String(cls||'').match(/^([중고][1-3])\s+([가-힣]+)/);
  return m ? '공유:'+m[1]+'|'+m[2] : id;
}

/* ── 주차 = 슈국 캘린더의 내신 기간 (수요일 시작, 수~일 수업) ── */
function md(ymd){ var p=String(ymd).split('-'); return (+p[1])+'/'+(+p[2]); }
function plusDays(ymd, n){
  var p=String(ymd).split('-'); var d=new Date(+p[0], +p[1]-1, +p[2]+n);
  return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
}
function wkLabel(w){
  var i=WEEKS.indexOf(w);
  if(i<0) return /^\d+$/.test(String(w)) ? String(w)+'주차(이전 기록)' : String(w);
  return (i+1)+'주 · '+md(w)+'~'+md(plusDays(w,4));
}
function wkShort(w){
  var i=WEEKS.indexOf(w);
  if(i<0) return /^\d+$/.test(String(w)) ? String(w)+'주' : String(w);
  return md(w);
}
/* 저장된 기록에 캘린더에 없는 주차(옛 1~6주차 등)가 있으면 목록 뒤에 붙여 잃어버리지 않게 */
function weekOptions(){
  var extra={};
  [rec.weeks, rec.notes, rec.hwdone].forEach(function(o){
    Object.keys(o||{}).forEach(function(k){ if(WEEKS.indexOf(k)<0) extra[k]=1; });
  });
  return WEEKS.concat(Object.keys(extra).sort());
}
function loadCalendarWeeks(){
  var cached = cacheGet('weeks');
  if(cached && cached.length){ WEEKS = cached; WEEKS_READY = true; }
  return fetch(ENDPOINT + '?action=ttPeriodList&pw=' + encodeURIComponent(PW) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.result!=='success') return;
      WEEKS = (d.periods||[]).filter(function(p){ return String(p.book||'').trim()==='내신'; })
                .map(function(p){ return String(p.week||'').trim(); })
                .filter(function(x){ return /^\d{4}-\d{2}-\d{2}$/.test(x); })
                .sort();
      WEEKS_READY = true;
      cacheSet('weeks', WEEKS);
    }).catch(function(){});
}
function setStatus(m){ var el=$('status'); el.textContent=m; el.classList.add('show'); clearTimeout(el._t); el._t=setTimeout(function(){ el.classList.remove('show'); },1800); }
function post(body, cb){
  body.pw = PW;
  fetch(ENDPOINT, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(body) })
    .then(function(r){ return r.json(); }).then(cb)
    .catch(function(){ cb(null); });
}

/* ── 기간 탭 ── */
function renderPeriodTabs(){
  $('ptabs').innerHTML = PERIODS.map(function(p){
    return '<button type="button" class="'+(p===period?'on':'')+'" onclick="pickPeriod(\''+p+'\')">'+p+'</button>';
  }).join('');
}
function pickPeriod(p){ period=p; renderPeriodTabs(); if(curClass) openClass(); }

/* ── 반 목록 (내신 시간표) ── */
/* 확인 수업은 피드백 대상이 아님 — 진도 수업만 (사용자 확정, 2026-08-15) */
function progOnly(list){ return (list||[]).filter(function(c){ return !/확인/.test(String(c.cls||'')); }); }
function loadClasses(){
  var cached = progOnly(cacheGet('classes'));
  if(cached && cached.length){ classes = cached; fillFilters(); applyUrlPick(); setStatus('최신 명단 확인 중…'); }
  else setStatus('내신반 목록을 불러오는 중…');
  fetch(ENDPOINT + '?action=timetableList&pw=' + encodeURIComponent(PW) + '&book=' + encodeURIComponent('내신') + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.result!=='success'){ if(!cached) setStatus('내신 시간표를 불러오지 못했어요.'); else setStatus(''); return; }
      classes = progOnly(d.classes);
      cacheSet('classes', classes);
      // 선택 유지한 채 목록만 갱신
      var g=$('f-grade').value, t=$('f-teacher').value, c=$('f-class').value;
      fillFilters();
      $('f-grade').value=g; fillTeacherSel(); $('f-teacher').value=t; fillClassSel(); $('f-class').value=c;
      if(!cached) applyUrlPick();
      if(curClass){ curClass = classes.find(function(x){ return x.id===curClass.id; }) || curClass; }
      setStatus('');
    }).catch(function(){ if(!cached) setStatus('서버 연결에 실패했어요.'); else setStatus(''); });
}
function fillFilters(){
  var grades={};
  classes.forEach(function(c){ grades[gradeOf(c.cls)]=1; });
  var gOrder=['중1','중2','중3','고1','고2','고3','기타'];
  var curG=$('f-grade').value;
  $('f-grade').innerHTML = '<option value="">학년 전체</option>' +
    gOrder.filter(function(g){ return grades[g]; }).map(function(g){ return '<option>'+g+'</option>'; }).join('');
  if(curG) $('f-grade').value=curG;
  fillTeacherSel();
  fillClassSel();
}
/* 담당 강사 목록은 선택한 학년의 내신반을 실제로 맡은 강사만 */
function fillTeacherSel(){
  var g=$('f-grade').value, teachers={};
  classes.forEach(function(c){ if(!g || gradeOf(c.cls)===g) teachers[c.teacher]=1; });
  var cur=$('f-teacher').value;
  $('f-teacher').innerHTML = '<option value="">담당 전체</option>' +
    Object.keys(teachers).sort(function(a,b){ return a.localeCompare(b,'ko'); }).map(function(t){ return '<option>'+esc(t)+'</option>'; }).join('');
  if(teachers[cur]) $('f-teacher').value=cur;
}
function onGradeChange(){ fillTeacherSel(); fillClassSel(); updateUrl(); }
/* 강사를 고르면 그 강사의 담당반으로 바로 이동 — 주소에도 저장돼 강사별 즐겨찾기 가능 */
function onTeacherChange(){
  fillClassSel();
  updateUrl();
  var t=$('f-teacher').value;
  $('cls-label').textContent = t ? t+'T의 담당반' : '담당반';
  if(t){
    var list=classes.filter(function(c){ return (! $('f-grade').value || gradeOf(c.cls)===$('f-grade').value) && c.teacher===t; });
    if(list.length===1){ $('f-class').value=list[0].id; openClass(); }   // 담당반이 하나면 바로 열기
    else $('f-class').focus();
  }
}
function updateUrl(){
  var q=new URLSearchParams();
  if($('f-grade').value) q.set('grade',$('f-grade').value);
  if($('f-teacher').value) q.set('teacher',$('f-teacher').value);
  history.replaceState(null,'', location.pathname+(q.toString()?'?'+q.toString():''));
}
var URL_APPLIED=false;
function applyUrlPick(){
  if(URL_APPLIED) return;
  var q=new URLSearchParams(location.search);
  var g=q.get('grade')||'', t=q.get('teacher')||'';
  if(!g && !t) { URL_APPLIED=true; return; }
  URL_APPLIED=true;
  if(g) $('f-grade').value=g;
  fillTeacherSel();
  if(t) $('f-teacher').value=t;
  onTeacherChange();
}

/* ── 학생 검색 — 이름으로 반을 찾아 바로 이동 ── */
var FOCUS_STU='';
function stuSearch(){
  var q=$('f-stu').value.trim(), box=$('stu-results');
  if(!q){ box.innerHTML=''; return; }
  var hits=[];
  classes.forEach(function(c){
    (c.students||[]).forEach(function(raw){
      var p=plain(raw);
      if(p.indexOf(q)>=0) hits.push({nm:p, c:c});
    });
  });
  box.innerHTML = hits.length
    ? hits.slice(0,12).map(function(h){
        return '<button type="button" class="rpt-btn" style="font-size:12.5px;letter-spacing:0;" '+
          'onclick="goStu(\''+esc(h.c.id)+'\',\''+esc(h.nm)+'\')">'+esc(h.nm)+' · '+esc(h.c.cls)+' ('+esc(h.c.teacher)+'T)</button>';
      }).join('') + (hits.length>12 ? '<span class="dot">외 '+(hits.length-12)+'건 — 이름을 더 입력해 주세요</span>' : '')
    : '<span class="dot">진도 내신반 명단에 없는 이름이에요</span>';
}
function goStu(cid, nm){
  var c=classes.find(function(x){ return x.id===cid; }); if(!c) return;
  $('f-grade').value=gradeOf(c.cls); fillTeacherSel();
  $('f-teacher').value=c.teacher; fillClassSel();
  $('cls-label').textContent=c.teacher+'T의 담당반';
  $('f-class').value=cid;
  FOCUS_STU=nm;
  $('f-stu').value=''; $('stu-results').innerHTML='';
  updateUrl();
  openClass();
}
function fillClassSel(){
  var g=$('f-grade').value, t=$('f-teacher').value;
  var list = classes.filter(function(c){
    return (!g || gradeOf(c.cls)===g) && (!t || c.teacher===t);
  });
  $('f-class').innerHTML = '<option value="">반을 선택하세요 ('+list.length+'개)</option>' +
    list.map(function(c){
      return '<option value="'+esc(c.id)+'">'+esc(c.cls)+' · '+esc(c.day)+esc(c.start)+' · '+esc(c.teacher)+'T ('+c.students.length+'명)</option>';
    }).join('');
}

/* ── 반 열기 ── */
function openClass(){
  var id=$('f-class').value;
  curClass = classes.find(function(c){ return c.id===id; }) || null;
  if(!curClass){ $('panel').innerHTML=''; return; }
  var ck = 'rec:' + period + ':' + curClass.id;
  var cached = cacheGet(ck);
  var painted = false;
  if(cached){ rec = cached; rec.cleared=rec.cleared||{}; rec.hwdone=rec.hwdone||{}; week = ''; renderPanel(); painted = true; setStatus('최신 기록 확인 중…'); }
  else $('panel').innerHTML = '<div class="card"><p class="empty">기록을 불러오는 중…</p></div>';
  fetch(ENDPOINT + '?action=naeshinGet&pw=' + encodeURIComponent(PW) +
        '&period=' + encodeURIComponent(period) + '&classId=' + encodeURIComponent(curClass.id) +
        '&scopeKey=' + encodeURIComponent(scopeKeyOf(curClass.cls, curClass.id)) + '&t=' + Date.now())
    .then(function(r){ return r.json(); })
    .then(function(d){
      if(!d || d.result!=='success'){
        if(!painted) $('panel').innerHTML='<div class="card"><p class="empty">기록을 불러오지 못했어요.</p></div>';
        else setStatus('');
        return;
      }
      var fresh = { scope:d.scope||'', scopeParts:d.scopeParts||null, weeks:d.weeks||{}, notes:d.notes||{}, cleared:d.cleared||{}, hwdone:d.hwdone||{} };
      cacheSet(ck, fresh);
      // 이미 입력 중이면 화면을 다시 그리지 않는다 (쓰던 내용 보호) — 저장 시점에 최신으로 합쳐짐
      var typing = document.activeElement && $('panel').contains(document.activeElement) &&
                   /^(TEXTAREA|INPUT)$/.test(document.activeElement.tagName);
      if(!painted || (!typing && JSON.stringify(fresh)!==JSON.stringify(rec))){
        rec = fresh; if(!painted) week = '';
        renderPanel();
      } else {
        rec = typing ? rec : fresh;
      }
      setStatus('');
    }).catch(function(){ if(!painted) $('panel').innerHTML='<div class="card"><p class="empty">서버 연결에 실패했어요.</p></div>'; else setStatus(''); });
}

function renderPanel(){
  var c=curClass; if(!c) return;
  var sp = rec.scopeParts || (rec.scope ? { inRange: rec.scope } : {});   // 옛 단일 기록은 '교과서 내 범위'에
  var html =
    '<div class="card">'+
      '<div class="cls-head">'+
        '<h2>'+esc(c.cls)+' <small>'+esc(c.day)+esc(c.start)+'~'+esc(c.end)+' · '+esc(c.teacher)+'T · '+esc(c.loc)+' · '+period+'</small></h2>'+
        '<button type="button" class="act ghost" onclick="goReport()" title="시험범위가 시험 등록 화면에 자동으로 채워져요">지필 리포트 제작</button>'+
      '</div>'+
      '<label style="margin-bottom:0;">시험범위 <span class="dot">지필고사 리포트 제작 시 자동으로 가져다 써요'+
      (scopeKeyOf(c.cls,c.id)!==c.id ? ' · 같은 학교·학년의 다른 반과 자동 공유됩니다' : '')+'</span></label>'+
      '<label>1. 교과서</label>'+
      '<input id="ns-book" placeholder="예) 창비 공통국어2" value="'+esc(sp.book||'')+'">'+
      '<label>2. 교과서 내 범위 <span class="dot">한 줄에 한 항목 — 줄마다 클리어 버튼이 됩니다</span></label>'+
      '<textarea id="ns-in" rows="4" placeholder="예) 현대시: 나는 오늘&#10;화법: 대화의 원리&#10;독서: 인간과 동물의 공존&#10;문법: 국어사">'+esc(sp.inRange||'')+'</textarea>'+
      '<label>3. 교과서 외 범위 <span class="dot">한 줄에 한 항목</span></label>'+
      '<textarea id="ns-out" placeholder="예) 2503 고1 독서(사회) 형사법과 민사법&#10;학습지 프린트">'+esc(sp.outRange||'')+'</textarea>'+
      '<div class="savebar" style="align-items:center;">'+
        '<span class="dot" style="margin:0 auto 0 0;">저장하면 아래 주차별 <b>시험범위 클리어</b> 목록에 바로 반영됩니다</span>'+
        '<button type="button" class="act" onclick="saveScope()">시험범위 저장</button></div>'+
    '</div>'+
    '<div class="card">'+
      '<div class="wtabs" id="wtabs"></div>'+
      '<div id="wbody"></div>'+
    '</div>';
  $('panel').innerHTML = html;
  renderWeek();
}
function renderWeek(){
  var wopts = weekOptions();
  if(!wopts.length){
    $('wtabs').innerHTML = '<p class="empty" style="padding:8px 0;">슈국 캘린더에 <b>내신 기간</b>으로 지정된 주가 없어요.<br>시간표 → 슈국 캘린더 → 기간설정에서 내신 주차를 먼저 지정해 주세요.</p>';
    $('wbody').innerHTML=''; return;
  }
  if(wopts.indexOf(week)<0) week = wopts[0];
  $('wtabs').innerHTML =
    '<label style="margin:0 0 4px;">주차 <span class="dot">슈국 캘린더의 내신 기간</span></label>'+
    '<select id="wk-sel" onchange="week=this.value;renderWeek()">'+
      wopts.map(function(w){
        var has = (rec.weeks[w] && (rec.weeks[w].prog||rec.weeks[w].hw)) || Object.keys(rec.notes[w]||{}).length;
        return '<option value="'+esc(w)+'"'+(w===week?' selected':'')+'>'+esc(wkLabel(w))+(has?' ●':'')+'</option>';
      }).join('')+
    '</select>';
  var wk = rec.weeks[week] || { prog:'', hw:'' };
  var notes = rec.notes[week] || {};
  var stus = (curClass.students||[]).map(plain);
  var items = scopeItems();
  var hwItems = lines(wk.hw);
  var hwd = rec.hwdone[week] || {};
  $('wbody').innerHTML =
    '<label>'+esc(wkLabel(week))+' 진도 <span class="dot">시험범위에서 이번 주에 나간 단원을 고르세요 — 고른 단원은 범위에서 지워집니다</span></label>'+
    (items.length
      ? '<select id="ns-unit" onchange="addUnit(this)">'+
          '<option value="">＋ 단원 선택</option>'+
          items.map(function(it){
            var c=rec.cleared[it];
            var inWeek = c && String(c.s)<=String(week) && String(week)<=String(c.d);
            if(inWeek) return '';                                  // 이번 주에 이미 고른 건 아래 칩에
            var tag = c ? ' — '+(c.s===c.d?wkShort(c.s):wkShort(c.s)+'~'+wkShort(c.d))+' 완료' : '';
            return '<option value="'+esc(it)+'">'+esc(it)+esc(tag)+'</option>';
          }).join('')+
        '</select>'+
        '<div class="unit-list">'+unitsOfWeek(week).map(function(it){
          var c=rec.cleared[it];
          var tag=(c && c.s!==c.d) ? '<i>'+esc(wkShort(c.s)+'~'+wkShort(c.d))+'</i>' : '';
          return '<span class="unit">'+esc(it)+tag+'<button type="button" onclick="removeUnit(\''+esc(it).replace(/'/g,"\\'")+'\')" title="이 주 진도에서 빼기">×</button></span>';
        }).join('') + (unitsOfWeek(week).length ? '' : '<span class="dot">아직 고른 단원이 없어요</span>') + '</div>'
      : '<p class="dot" style="margin:0 0 8px;">먼저 위에서 시험범위를 저장하면 단원 목록이 나옵니다.</p>')+
    '<label>메모 <span class="dot">수업 중 특이사항 등 자유롭게</span></label>'+
    '<textarea id="ns-prog" placeholder="예) 진도 조금 밀림 · 다음 주 실전 2회부터">'+esc(wk.prog)+'</textarea>'+
    '<label>'+esc(wkLabel(week))+' 과제 <span class="dot">한 줄에 한 과제 — 줄마다 학생별 확인 버튼이 됩니다</span></label>'+
    '<textarea id="ns-hw" rows="3" placeholder="예) 아홉 1장 필사&#10;어휘 3개&#10;프린트 전부 필사">'+esc(wk.hw)+'</textarea>'+
    '<div class="savebar"><button type="button" class="act" onclick="saveWeek()">메모·과제 저장</button></div>'+
    '<div class="stu">'+
      '<label>학생별 과제 수행 / 질문 사항 <span class="dot">과제 버튼 = 해온 것 체크 · 메모는 칸을 벗어나면 자동 저장</span></label>'+
      '<p style="font-size:12px;color:var(--ink-soft);margin:0 0 6px;line-height:1.6;"><b style="color:var(--accent);">REPORT</b> — 시험 기간이 시작된 이후 학생의 피드백 내용을 종합하여 기록합니다. 상담시 참고할 수 있습니다.</p>'+
      stus.map(function(nm,i){
        var done = hwd[nm] || [];
        return '<div class="stu-row" data-row-nm="'+esc(nm)+'">'+
          '<div class="stu-id"><b><span class="stu-no">'+(i+1)+'</span> '+esc(nm)+'</b>'+
          '<button type="button" class="rpt-btn" onclick="openRpt(\''+esc(nm)+'\')" title="이 학생의 내신 대비 학습 보고서 (캡쳐용)">REPORT</button></div>'+
          '<div style="flex:1;display:flex;flex-direction:column;gap:5px;">'+
          (hwItems.length
            ? '<div class="hw-chips">'+hwItems.map(function(it){
                var on = done.indexOf(it)>=0;
                return '<button type="button" class="hwc'+(on?' on':'')+'" data-nm="'+esc(nm)+'" data-it="'+esc(it)+'" onclick="toggleHw(this)">'+(on?'✓ ':'')+esc(it)+'</button>';
              }).join('')+'</div>'
            : '')+
          '<textarea data-nm="'+esc(nm)+'" onblur="saveNote(this)" placeholder="예) 나는 오늘: 8, 문법 덜 풀고 안가져옴, 오마이갓,,,, 숙제 깜빡했다고 함, 똑똑이임">'+esc(notes[nm]||'')+'</textarea>'+
          '</div></div>';
      }).join('')+
    '</div>';
  // 학생 검색으로 들어온 경우 — 그 학생 줄로 스크롤 + 잠깐 강조
  if(FOCUS_STU){
    var rows=document.querySelectorAll('#wbody .stu-row');
    for(var ri=0; ri<rows.length; ri++){
      if(rows[ri].getAttribute('data-row-nm')===FOCUS_STU){
        rows[ri].style.background='var(--icon-bg)'; rows[ri].style.borderRadius='10px';
        rows[ri].scrollIntoView({block:'center', behavior:'smooth'});
        (function(el){ setTimeout(function(){ el.style.background=''; }, 2600); })(rows[ri]);
        break;
      }
    }
    FOCUS_STU='';
  }
}

/* ── 줄 단위 항목 (엔터로 구분) ── */
function lines(s){ return String(s||'').split('\n').map(function(t){ return t.trim(); }).filter(Boolean); }
function scopeItems(){
  var sp=rec.scopeParts||{}, out=[];
  ['inRange','extra','outRange'].forEach(function(k){ lines(sp[k]).forEach(function(x){ out.push(x); }); });
  return out;
}
/* 이번 주에 나간 단원 — 시험범위 항목 중 기간(s~d)이 이 주를 포함하는 것 */
function unitsOfWeek(w){
  return scopeItems().filter(function(it){
    var c=rec.cleared[it];
    return c && String(c.s)<=String(w) && String(w)<=String(c.d);
  });
}
function saveUnits(){
  var has=Object.keys(rec.cleared).length;
  post({ action:'naeshinSet', period:period, classId:curClass.id, kind:'클리어',
         text1: has?JSON.stringify(rec.cleared):'' }, function(res){
    if(res && res.result==='success') setStatus('진도 저장');
    else setStatus('진도 저장 실패 — 다시 시도해 주세요');
  });
}
/* 드롭다운에서 단원 선택 — 처음이면 이 주 진도로, 지난 주에 하다 만 것이면 기간을 이 주까지 확장 */
function addUnit(sel){
  var it=sel.value; sel.value='';
  if(!it) return;
  var c=rec.cleared[it];
  if(!c) rec.cleared[it]={ s:week, d:week };
  else if(String(week)>String(c.d)) c.d=week;      // yyyy-MM-dd라 문자열 비교로 순서가 맞는다
  else if(String(week)<String(c.s)) c.s=week;
  renderWeek(); saveUnits();
}
/* 칩의 × — 이 주에서만 빼기 (여러 주에 걸친 단원은 기간을 줄이고, 한 주짜리면 삭제) */
function removeUnit(it){
  var c=rec.cleared[it]; if(!c) return;
  if(String(c.s)===String(c.d)){ delete rec.cleared[it]; }
  else {
    var ws=weekOptions();
    if(String(week)===String(c.s)){ var i=ws.indexOf(week); if(i>=0 && ws[i+1]) c.s=ws[i+1]; else delete rec.cleared[it]; }
    else if(String(week)===String(c.d)){ var j=ws.indexOf(week); if(j>0 && ws[j-1]) c.d=ws[j-1]; else delete rec.cleared[it]; }
    else delete rec.cleared[it];   // 중간 주를 빼는 경우는 통째로 해제
  }
  renderWeek(); saveUnits();
}
/* 학생별 과제 확인 토글 */
function toggleHw(btn){
  var nm=btn.getAttribute('data-nm'), it=btn.getAttribute('data-it');
  var m=(rec.hwdone[week]=rec.hwdone[week]||{});
  var arr=m[nm]=m[nm]||[];
  var i=arr.indexOf(it);
  if(i>=0) arr.splice(i,1); else arr.push(it);
  renderWeek();
  saveStudent(nm);
}
/* 학생 행 저장 — 메모(F열)와 과제 확인(G열)을 항상 함께 */
function saveStudent(nm){
  var w=week;
  var memo=((rec.notes[w]||{})[nm]||'').trim();
  var arr=((rec.hwdone[w]||{})[nm]||[]);
  post({ action:'naeshinSet', period:period, classId:curClass.id, kind:'학생', week:String(w), student:nm,
         text1: memo, text2: arr.length?JSON.stringify(arr):'' }, function(res){
    if(res && res.result==='success') setStatus(nm+' 저장');
    else setStatus(nm+' 저장 실패 — 다시 시도해 주세요');
  });
}

/* ── 저장 ── */
function scopeLabelPairs(sp){
  return [['교과서',sp.book],['교과서 내 범위',sp.inRange],['교과서 외 범위',sp.outRange],['추가 자료',sp.extra]]
    .filter(function(x){ return x[1]; });   // '추가 자료'는 옛 기록이 있을 때만 표시
}
function saveScope(){
  var prev=rec.scopeParts||{};
  var sp={ book:$('ns-book').value.trim(), inRange:$('ns-in').value.trim(),
           extra:String(prev.extra||'').trim(),   // 칸은 없앴지만 옛 기록은 그대로 보존
           outRange:$('ns-out').value.trim() };
  var readable=scopeLabelPairs(sp).map(function(x){ return x[0]+': '+x[1]; }).join('\n');
  var empty=!readable;
  post({ action:'naeshinSet', period:period, classId:curClass.id, kind:'범위',
         scopeKey: scopeKeyOf(curClass.cls, curClass.id),
         text1: empty?'':JSON.stringify(sp), text2: readable }, function(res){
    if(res && res.result==='success'){
      rec.scopeParts=empty?null:sp; rec.scope=readable;
      renderWeek();   // 주차 화면의 '시험범위 클리어' 버튼을 새 범위로 즉시 갱신
      setStatus('시험범위 저장 완료 — 주차별 클리어 목록에 반영했어요');
    }
    else setStatus('저장 실패 — 다시 시도해 주세요');
  });
}
function saveWeek(){
  var p=$('ns-prog').value.trim(), h=$('ns-hw').value.trim();
  post({ action:'naeshinSet', period:period, classId:curClass.id, kind:'주차', week:String(week), text1:p, text2:h }, function(res){
    if(res && res.result==='success'){ rec.weeks[week]={prog:p,hw:h}; setStatus(week+'주차 진도·과제 저장 완료'); renderWeek(); }
    else setStatus('저장 실패 — 다시 시도해 주세요');
  });
}
function saveNote(el){
  var nm=el.getAttribute('data-nm'), v=el.value.trim();
  var before=(rec.notes[week]||{})[nm]||'';
  if(v===before) return;
  (rec.notes[week]=rec.notes[week]||{})[nm]=v;
  saveStudent(nm);
}

/* ── 학생별 학습 보고서 (캡쳐용 한 장) ── */
function openRpt(nm){
  var c=curClass; if(!c) return;
  var today=new Date();
  var dstr=today.getFullYear()+'년 '+(today.getMonth()+1)+'월 '+today.getDate()+'일';
  var wkHtml='';
  weekOptions().forEach(function(w){
    var wk=rec.weeks[w]||{prog:'',hw:''};
    var note=(rec.notes[w]||{})[nm]||'';
    var done=((rec.hwdone[w]||{})[nm])||[];
    if(!wk.prog && !wk.hw && !note && !unitsOfWeek(w).length) return;   // 기록 없는 주차는 생략
    var hwLines=lines(wk.hw);
    var hwHtml = hwLines.length
      ? hwLines.map(function(ln){
          var ok=done.indexOf(ln)>=0;
          return ok ? '<span style="color:var(--accent);font-weight:700;">✓</span> '+esc(ln)
                    : '<span style="color:#B08A3E;font-weight:700;">·</span> '+esc(ln)+' <span style="font-size:11px;color:#B08A3E;">미확인</span>';
        }).join('<br>')
      : esc(wk.hw);
    var units=unitsOfWeek(w);
    wkHtml += '<div class="wk"><div class="wt">'+esc(wkLabel(w))+'</div>'+
      (units.length ? '<div class="row"><span>수업 진도</span><span>'+units.map(esc).join(', ')+'</span></div>' : '')+
      (wk.hw   ? '<div class="row"><span>과제</span><span>'+hwHtml+'</span></div>' : '')+
      (wk.prog ? '<div class="row"><span>메모</span><span>'+esc(wk.prog)+'</span></div>' : '')+
      (note    ? '<div class="note"><b>'+esc(nm)+' 학생 기록</b>'+esc(note)+'</div>' : '')+
      '</div>';
  });
  if(!wkHtml) wkHtml='<div class="wk"><div class="row"><span></span><span>아직 주차별 기록이 없습니다.</span></div></div>';
  $('rpt-card').innerHTML =
    '<p class="brand">이수경국어 · SHUEGUK</p>'+
    '<h2>내신 대비 학습 보고서</h2>'+
    '<p class="who"><b>'+esc(nm)+'</b> · '+esc(c.cls)+' · '+esc(c.teacher)+'T<br>'+esc(period)+' 대비</p>'+
    (rec.scopeParts
      ? '<div class="box"><div class="bt">시험범위 <span style="font-weight:400;color:var(--ink-soft);font-size:11.5px;">— 취소선은 수업에서 나간 범위</span></div>'+
        scopeLabelPairs(rec.scopeParts).map(function(x){
          var body = (x[0]==='교과서')
            ? esc(x[1])
            : lines(x[1]).map(function(ln){
                var c=rec.cleared[ln];
                return c ? '<s style="color:var(--ink-soft);">'+esc(ln)+'</s> <b style="font-size:11px;color:var(--accent);">'+esc(c.s===c.d?wkShort(c.s):wkShort(c.s)+'~'+wkShort(c.d))+'</b>' : esc(ln);
              }).join('<br>');
          return '<div class="bc" style="margin-bottom:5px;"><b style="color:var(--accent);font-size:12.5px;">'+x[0]+'</b><br>'+body+'</div>';
        }).join('')+'</div>'
      : (rec.scope ? '<div class="box"><div class="bt">시험범위</div><div class="bc">'+esc(rec.scope)+'</div></div>' : ''))+
    wkHtml+
    '<p class="foot">'+dstr+' · 이수경국어</p>';
  $('rpt-wrap').style.display='block';
  window.scrollTo(0,0);
}
function closeRpt(){ $('rpt-wrap').style.display='none'; }

/* ── 지필 리포트 제작으로 (시험범위 연동) ── */
function goReport(){
  var url='m.html?nsPeriod='+encodeURIComponent(period)+'&nsClass='+encodeURIComponent(curClass.id)+
          '&nsName='+encodeURIComponent(curClass.cls);
  window.open(url,'_blank');
}

renderPeriodTabs();
loadCalendarWeeks().then(function(){ if(curClass) renderWeek(); });
loadClasses();
</script>
